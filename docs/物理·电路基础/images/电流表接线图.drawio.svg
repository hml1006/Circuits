<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电流表接线图</text>
  
  <!-- 电路主图 -->
  <rect x="100" y="60" width="400" height="200" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  
  <!-- 电源 -->
  <rect x="130" y="130" width="40" height="60" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="130" x2="140" y2="120" stroke="#333" stroke-width="3"/>
  <line x1="160" y1="130" x2="160" y2="115" stroke="#333" stroke-width="3"/>
  <text x="150" y="175" text-anchor="middle" font-size="11" fill="#555">电源</text>
  
  <!-- 正极和负极标注 -->
  <text x="140" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">+</text>
  <text x="160" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#3498db">−</text>
  
  <!-- 从电源正极到开关 -->
  <line x1="140" y1="120" x2="140" y2="80" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="80" x2="220" y2="80" stroke="#333" stroke-width="2"/>
  
  <!-- 开关 -->
  <line x1="220" y1="80" x2="250" y2="80" stroke="#333" stroke-width="2"/>
  <circle cx="250" cy="80" r="4" fill="#333"/>
  <line x1="250" y1="80" x2="270" y2="65" stroke="#333" stroke-width="2"/>
  <circle cx="270" cy="65" r="4" fill="#333"/>
  <line x1="270" y1="65" x2="300" y2="65" stroke="#333" stroke-width="2"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#555">S</text>
  
  <!-- 开关到电流表 -->
  <line x1="300" y1="65" x2="340" y2="65" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="65" x2="340" y2="120" stroke="#333" stroke-width="2"/>
  
  <!-- 电流表 -->
  <circle cx="340" cy="140" r="30" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="340" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">A</text>
  
  <!-- 电流表接线柱 -->
  <rect x="325" y="105" width="30" height="15" rx="2" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="340" y="117" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">+</text>
  <rect x="325" y="160" width="30" height="15" rx="2" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="340" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">−</text>
  
  <!-- 电流方向箭头 -->
  <path d="M 300 75 L 300 85" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="290" y="80" font-size="10" fill="#e74c3c">I</text>
  
  <!-- 电流表到灯泡 -->
  <line x1="340" y1="170" x2="340" y2="220" stroke="#333" stroke-width="2"/>
  
  <!-- 灯泡 -->
  <circle cx="340" cy="240" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="327" y1="227" x2="353" y2="253" stroke="#333" stroke-width="2"/>
  <line x1="353" y1="227" x2="327" y2="253" stroke="#333" stroke-width="2"/>
  <text x="340" y="275" text-anchor="middle" font-size="11" fill="#555">灯泡</text>
  
  <!-- 灯泡到电源负极 -->
  <line x1="340" y1="258" x2="340" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="260" x2="160" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="260" x2="160" y2="190" stroke="#333" stroke-width="2"/>
  
  <!-- 使用规则说明 -->
  <rect x="50" y="290" width="500" height="95" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="300" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#3498db">电流表使用规则</text>
  
  <text x="70" y="338" font-size="12" fill="#555">① 串联：电流表必须串联在被测电路中</text>
  <text x="70" y="358" font-size="12" fill="#555">② 正进负出：电流从"+"接线柱流入，"−"接线柱流出</text>
  <text x="70" y="378" font-size="12" fill="#e74c3c">⚠ 禁止短路：绝对不允许将电流表直接接在电源两端</text>
  
  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>
