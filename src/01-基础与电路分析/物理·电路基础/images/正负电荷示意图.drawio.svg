<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="300" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">正负电荷示意图</text>
  
  <!-- 正电荷示例 -->
  <g transform="translate(150, 130)">
    <rect x="-80" y="-40" width="160" height="110" rx="8" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
    <text x="0" y="-18" text-anchor="middle" font-size="15" font-weight="bold" fill="#e74c3c">正电荷</text>
    
    <!-- 玻璃棒 -->
    <rect x="-70" y="5" width="90" height="14" fill="#87ceeb" stroke="#4682b4" stroke-width="1.5"/>
    <text x="-25" y="38" text-anchor="middle" font-size="12" fill="#555">玻璃棒</text>
    
    <!-- 丝绸 -->
    <path d="M 30 5 Q 40 12 50 5 Q 60 -2 70 5" fill="none" stroke="#9370db" stroke-width="2"/>
    <path d="M 30 13 Q 40 20 50 13 Q 60 6 70 13" fill="none" stroke="#9370db" stroke-width="2"/>
    <text x="50" y="38" text-anchor="middle" font-size="12" fill="#555">丝绸</text>
    
    <!-- 正电荷符号 -->
    <text x="0" y="62" text-anchor="middle" font-size="26" font-weight="bold" fill="#e74c3c">+</text>
  </g>
  
  <!-- 负电荷示例 -->
  <g transform="translate(450, 130)">
    <rect x="-80" y="-40" width="160" height="110" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
    <text x="0" y="-18" text-anchor="middle" font-size="15" font-weight="bold" fill="#3498db">负电荷</text>
    
    <!-- 橡胶棒 -->
    <rect x="-70" y="5" width="90" height="14" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="-25" y="38" text-anchor="middle" font-size="12" fill="#555">橡胶棒</text>
    
    <!-- 毛皮 -->
    <path d="M 30 5 Q 40 12 50 5 Q 60 -2 70 5" fill="#d2691e" stroke="#8b4513" stroke-width="2"/>
    <path d="M 30 13 Q 40 20 50 13 Q 60 6 70 13" fill="#d2691e" stroke="#8b4513" stroke-width="2"/>
    <text x="50" y="38" text-anchor="middle" font-size="12" fill="#555">毛皮</text>
    
    <!-- 负电荷符号 -->
    <text x="0" y="62" text-anchor="middle" font-size="26" font-weight="bold" fill="#3498db">−</text>
  </g>
  
  <!-- 说明框 -->
  <rect x="40" y="265" width="520" height="115" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
  <text x="300" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">电荷的基本性质</text>
  
  <text x="60" y="315" font-size="13" fill="#555">• 正电荷：用丝绸摩擦过的玻璃棒所带的电荷</text>
  <text x="60" y="338" font-size="13" fill="#555">• 负电荷：用毛皮摩擦过的橡胶棒所带的电荷</text>
  <text x="60" y="361" font-size="13" fill="#555">• 电荷量单位：库仑（C），e = 1.602 × 10⁻¹⁹ C</text>
</svg>
