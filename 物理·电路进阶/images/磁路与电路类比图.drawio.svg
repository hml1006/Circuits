<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">磁路与电路类比图</text>
    
    <!-- 左侧：电路 -->
    <text x="140" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">电路</text>
    
    <rect x="30" y="75" width="220" height="220" rx="10" ry="10" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    
    <!-- 回路 -->
    <rect x="60" y="100" width="160" height="170" rx="5" ry="5" fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- 电源 E -->
    <line x1="140" y1="230" x2="140" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="130" y1="200" x2="150" y2="200" stroke="#333" stroke-width="2"/>
    <text x="140" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">E</text>
    
    <!-- 电阻 R -->
    <rect x="90" y="110" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="110" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">R</text>
    
    <line x1="60" y1="125" x2="90" y2="125" stroke="#333" stroke-width="2"/>
    <line x1="130" y1="125" x2="200" y2="125" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="125" x2="200" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="125" x2="60" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="230" x2="140" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="230" x2="200" y2="230" stroke="#333" stroke-width="2"/>
    
    <!-- 电流 I -->
    <polygon points="100,120 115,125 100,130" fill="#333"/>
    <text x="115" y="118" text-anchor="start" font-size="10" fill="#333" font-style="italic">I</text>
    
    <!-- 类比箭头 -->
    <text x="280" y="185" text-anchor="middle" font-size="22" fill="#999">⇄</text>
    <text x="280" y="205" text-anchor="middle" font-size="11" fill="#999">类比</text>
    
    <!-- 右侧：磁路 -->
    <text x="460" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">磁路</text>
    
    <rect x="350" y="75" width="220" height="220" rx="10" ry="10" fill="#fff9c4" stroke="#e6b800" stroke-width="2"/>
    
    <!-- 铁芯回路 -->
    <rect x="380" y="100" width="160" height="170" rx="5" ry="5" fill="none" stroke="#999" stroke-width="2"/>
    
    <!-- 铁芯 -->
    <rect x="380" y="100" width="30" height="170" rx="4" ry="4" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <rect x="510" y="100" width="30" height="170" rx="4" ry="4" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <rect x="380" y="100" width="160" height="30" rx="4" ry="4" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <rect x="380" y="240" width="160" height="30" rx="4" ry="4" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    
    <!-- 线圈 -->
    <path d="M 410,120 Q 415,135 410,150 Q 415,165 410,180 Q 415,195 410,210 Q 415,225 410,240" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="420" y="185" text-anchor="start" font-size="10" fill="#d32f2f">N 匝</text>
    
    <!-- 磁通 Φ -->
    <line x1="450" y1="140" x2="490" y2="140" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="450" y1="160" x2="490" y2="160" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="450" y1="250" x2="490" y2="250" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="450" y1="270" x2="490" y2="270" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5,3"/>
    
    <text x="470" y="200" text-anchor="middle" font-size="10" fill="#4dabf7" font-style="italic">Φ</text>
    
    <!-- 类比表格 -->
    <text x="300" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">电路 ↔ 磁路</text>
    <text x="140" y="355" text-anchor="middle" font-size="11" fill="#333">电动势 E ↔ 磁动势 F = NI</text>
    <text x="140" y="375" text-anchor="middle" font-size="11" fill="#333">电流 I ↔ 磁通 Φ</text>
    <text x="460" y="355" text-anchor="middle" font-size="11" fill="#333">电阻 R ↔ 磁阻 Rm = l/(μS)</text>
    <text x="460" y="375" text-anchor="middle" font-size="11" fill="#333">欧姆定律 U=IR ↔ 磁路欧姆定律 F=Φ·Rm</text>
  </g>
</svg>