<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电能表示意图</text>
    
    <!-- 电能表主体 -->
    <rect x="100" y="55" width="400" height="220" rx="12" ry="12" fill="#f5f5f5" stroke="#333" stroke-width="2.5"/>
    <rect x="105" y="60" width="390" height="210" rx="10" ry="10" fill="#fff" stroke="#ddd" stroke-width="1"/>
    
    <!-- 电能表表盘 -->
    <rect x="130" y="75" width="340" height="60" rx="5" ry="5" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
    
    <!-- 数字读数 -->
    <rect x="140" y="82" width="42" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="161" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">0</text>
    
    <rect x="186" y="82" width="42" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="207" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">0</text>
    
    <rect x="232" y="82" width="42" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="253" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">2</text>
    
    <rect x="278" y="82" width="42" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="299" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">8</text>
    
    <rect x="324" y="82" width="42" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="345" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">4</text>
    
    <!-- 小数点 -->
    <circle cx="323" cy="100" r="2" fill="#333"/>
    
    <!-- 小数位 -->
    <rect x="370" y="82" width="30" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="385" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">6</text>
    
    <rect x="404" y="82" width="30" height="30" rx="2" ry="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="419" y="103" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">5</text>
    
    <text x="440" y="100" font-size="12" fill="#555">kW·h</text>
    
    <!-- 转盘 -->
    <circle cx="185" cy="150" r="25" fill="none" stroke="#333" stroke-width="1.5"/>
    <rect x="168" y="142" width="34" height="2" fill="#333"/>
    <rect x="183" y="127" width="2" height="20" fill="#333"/>
    <rect x="183" y="153" width="2" height="20" fill="#333"/>
    <text x="185" y="195" text-anchor="middle" font-size="10" fill="#555">铝盘</text>
    
    <!-- 参数说明 -->
    <rect x="240" y="135" width="230" height="75" rx="5" ry="5" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
    <text x="245" y="152" font-size="10" fill="#555">220 V   10(20) A   50 Hz</text>
    <text x="245" y="168" font-size="10" fill="#555">3000 r/(kW·h)</text>
    <text x="245" y="184" font-size="10" fill="#555">额定电压 220V</text>
    <text x="245" y="200" font-size="10" fill="#555">标定电流 10A，最大电流 20A</text>
    
    <!-- 接线端子 -->
    <rect x="130" y="220" width="30" height="40" rx="3" ry="3" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
    <text x="145" y="245" text-anchor="middle" font-size="9" fill="#333">1</text>
    <rect x="170" y="220" width="30" height="40" rx="3" ry="3" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
    <text x="185" y="245" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="210" y="220" width="30" height="40" rx="3" ry="3" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
    <text x="225" y="245" text-anchor="middle" font-size="9" fill="#333">3</text>
    <rect x="250" y="220" width="30" height="40" rx="3" ry="3" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
    <text x="265" y="245" text-anchor="middle" font-size="9" fill="#333">4</text>
    
    <text x="360" y="240" font-size="10" fill="#666">接线端子</text>
    <text x="360" y="255" font-size="9" fill="#888">1进火线  2出火线</text>
    <text x="360" y="268" font-size="9" fill="#888">3进零线  4出零线</text>
    
    <!-- 说明 -->
    <rect x="30" y="290" width="540" height="95" rx="8" ry="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
    <text x="300" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a085">电能表（电度表）</text>
    
    <text x="50" y="340" font-size="12" fill="#555">① 测量用电器消耗电能多少的仪表</text>
    <text x="50" y="360" font-size="12" fill="#555">② 读数：前后两次读数之差 = 消耗的电能（kW·h）</text>
    <text x="50" y="380" font-size="12" fill="#555">③ 1 kW·h = 3.6 × 10⁶ J（1度电）</text>
  </g>
</svg>