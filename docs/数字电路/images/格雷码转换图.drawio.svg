<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">二进制与格雷码转换</text>
    <!-- 二进制转格雷码 -->
    <text x="300" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">二进制 → 格雷码</text>
    <text x="300" y="85" text-anchor="middle" font-size="13" fill="#555">Gₙ = Bₙ, Gᵢ = Bᵢ ⊕ Bᵢ₊₁</text>
    <!-- 异或门逻辑 -->
    <rect x="130" y="100" width="60" height="40" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="160" y="125" text-anchor="middle" font-size="14" fill="#000">=1</text>
    <line x1="110" y1="110" x2="130" y2="110" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="130" x2="130" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="120" x2="220" y2="120" stroke="#000" stroke-width="1.5"/>
    <text x="100" y="107" text-anchor="end" font-size="12" fill="#000">Bᵢ</text>
    <text x="100" y="127" text-anchor="end" font-size="12" fill="#000">Bᵢ₊₁</text>
    <text x="225" y="124" text-anchor="start" font-size="12" fill="#000">Gᵢ</text>
    <!-- 示例 -->
    <rect x="80" y="160" width="440" height="100" rx="8" fill="#f0f8ff" stroke="#000" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="300" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">示例：二进制 1011 → 格雷码</text>
    <text x="120" y="205" text-anchor="start" font-size="13" fill="#000">二进制: B₃B₂B₁B₀ = 1 0 1 1</text>
    <text x="120" y="225" text-anchor="start" font-size="13" fill="#000">G₃ = B₃ = 1</text>
    <text x="120" y="245" text-anchor="start" font-size="13" fill="#000">G₂ = B₂⊕B₃ = 0⊕1 = 1</text>
    <text x="320" y="225" text-anchor="start" font-size="13" fill="#000">G₁ = B₁⊕B₂ = 1⊕0 = 1</text>
    <text x="320" y="245" text-anchor="start" font-size="13" fill="#000">G₀ = B₀⊕B₁ = 1⊕1 = 0</text>
    <text x="300" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#d00">格雷码: 1110</text>
    <!-- 格雷码转二进制 -->
    <text x="300" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">格雷码 → 二进制</text>
    <text x="300" y="325" text-anchor="middle" font-size="13" fill="#555">Bₙ = Gₙ, Bᵢ = Gᵢ ⊕ Bᵢ₊₁</text>
    <!-- 异或门逻辑 -->
    <rect x="130" y="340" width="60" height="40" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="160" y="365" text-anchor="middle" font-size="14" fill="#000">=1</text>
    <line x1="110" y1="350" x2="130" y2="350" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="370" x2="130" y2="370" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="360" x2="220" y2="360" stroke="#000" stroke-width="1.5"/>
    <text x="100" y="347" text-anchor="end" font-size="12" fill="#000">Gᵢ</text>
    <text x="100" y="367" text-anchor="end" font-size="12" fill="#000">Bᵢ₊₁</text>
    <text x="225" y="364" text-anchor="start" font-size="12" fill="#000">Bᵢ</text>
  </g>
</svg>