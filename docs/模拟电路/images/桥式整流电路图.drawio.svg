<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">桥式整流电路</text>

    <!-- 交流输入 -->
    <text x="50" y="120" font-size="12" fill="#666">~</text>
    <text x="40" y="135" font-size="11" fill="#666">AC</text>
    <text x="40" y="150" font-size="11" fill="#666">输入</text>
    <line x1="70" y1="120" x2="120" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="180" x2="120" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 桥式整流4个二极管 -->
    <!-- D1 左上 -->
    <polygon points="180,100 210,120 180,140" fill="none" stroke="#cc3333" stroke-width="2"/>
    <line x1="210" y1="100" x2="210" y2="140" stroke="#cc3333" stroke-width="2"/>
    <text x="195" y="95" text-anchor="middle" font-size="10" fill="#cc3333">D1</text>

    <!-- D2 右上 -->
    <polygon points="280,100 250,120 280,140" fill="none" stroke="#cc3333" stroke-width="2"/>
    <line x1="250" y1="100" x2="250" y2="140" stroke="#cc3333" stroke-width="2"/>
    <text x="265" y="95" text-anchor="middle" font-size="10" fill="#cc3333">D2</text>

    <!-- D3 左下 -->
    <polygon points="180,160 210,180 180,200" fill="none" stroke="#cc3333" stroke-width="2"/>
    <line x1="210" y1="160" x2="210" y2="200" stroke="#cc3333" stroke-width="2"/>
    <text x="195" y="205" text-anchor="middle" font-size="10" fill="#cc3333">D3</text>

    <!-- D4 右下 -->
    <polygon points="280,160 250,180 280,200" fill="none" stroke="#cc3333" stroke-width="2"/>
    <line x1="250" y1="160" x2="250" y2="200" stroke="#cc3333" stroke-width="2"/>
    <text x="265" y="205" text-anchor="middle" font-size="10" fill="#cc3333">D4</text>

    <!-- 桥式连接线 -->
    <line x1="120" y1="120" x2="180" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="180" x2="180" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="120" x2="250" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="180" x2="250" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="140" x2="250" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="140" x2="210" y2="160" stroke="#333" stroke-width="2"/>

    <!-- 输出正极 -->
    <line x1="250" y1="100" x2="250" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="60" x2="380" y2="60" stroke="#333" stroke-width="2"/>

    <!-- 输出负极 -->
    <line x1="210" y1="200" x2="210" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="300" x2="380" y2="300" stroke="#333" stroke-width="2"/>

    <!-- 负载电阻 -->
    <rect x="380" y="100" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="380" y="140" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="376" y="100" width="24" height="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="388" y="145" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="388" y="157" text-anchor="middle" font-size="9" fill="#666">L</text>

    <line x1="380" y1="60" x2="380" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="180" x2="380" y2="300" stroke="#333" stroke-width="2"/>

    <!-- 输出标注 -->
    <line x1="396" y1="60" x2="460" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="396" y1="300" x2="460" y2="300" stroke="#333" stroke-width="2"/>
    <text x="470" y="65" font-size="12" fill="#333">+ V</text>
    <text x="470" y="305" font-size="12" fill="#333">−</text>
    <text x="470" y="180" font-size="11" fill="#666">输出</text>

    <!-- 波形示意 -->
    <text x="460" y="240" font-size="10" fill="#666">输出波形：</text>
    <path d="M 460 260 Q 470 230 480 260 Q 490 230 500 260 Q 510 230 520 260 Q 530 230 540 260" fill="none" stroke="#3366cc" stroke-width="1.5"/>
  </g>
</svg>