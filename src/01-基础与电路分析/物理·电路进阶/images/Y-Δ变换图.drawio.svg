<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Y-Δ 等效变换</text>
    
    <!-- 左侧：Y形（星形） -->
    <text x="150" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Y 形（星形）</text>
    
    <!-- 中心点 -->
    <circle cx="150" cy="200" r="6" fill="#333" stroke="#333" stroke-width="2"/>
    
    <!-- 三个分支 -->
    <line x1="150" y1="200" x2="50" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="150" y1="200" x2="150" y2="100" stroke="#333" stroke-width="2.5"/>
    <line x1="150" y1="200" x2="250" y2="280" stroke="#333" stroke-width="2.5"/>
    
    <!-- 端点 -->
    <circle cx="50" cy="280" r="5" fill="#333"/>
    <circle cx="150" cy="100" r="5" fill="#333"/>
    <circle cx="250" cy="280" r="5" fill="#333"/>
    
    <!-- 电阻 -->
    <rect x="120" y="110" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(0,140,125)"/>
    <text x="140" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">a</tspan></text>
    
    <rect x="65" y="245" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(-55,85,260)"/>
    <text x="85" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">b</tspan></text>
    
    <rect x="195" y="245" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(55,215,260)"/>
    <text x="215" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">c</tspan></text>
    
    <!-- 端点标注 -->
    <text x="40" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">a</text>
    <text x="150" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">b</text>
    <text x="260" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">c</text>
    
    <!-- 箭头 -->
    <text x="300" y="200" text-anchor="middle" font-size="24" fill="#999">⇄</text>
    
    <!-- 右侧：Δ形（三角形） -->
    <text x="450" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Δ 形（三角形）</text>
    
    <!-- 三角形 -->
    <line x1="350" y1="280" x2="450" y2="100" stroke="#333" stroke-width="2.5"/>
    <line x1="450" y1="100" x2="550" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="350" y1="280" x2="550" y2="280" stroke="#333" stroke-width="2.5"/>
    
    <!-- 端点 -->
    <circle cx="350" cy="280" r="5" fill="#333"/>
    <circle cx="450" cy="100" r="5" fill="#333"/>
    <circle cx="550" cy="280" r="5" fill="#333"/>
    
    <!-- 电阻 -->
    <rect x="380" y="150" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(-60,400,165)"/>
    <text x="400" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">ab</tspan></text>
    
    <rect x="470" y="150" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5" transform="rotate(60,490,165)"/>
    <text x="490" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">bc</tspan></text>
    
    <rect x="410" y="265" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="430" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">ca</tspan></text>
    
    <!-- 端点标注 -->
    <text x="340" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">a</text>
    <text x="450" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">b</text>
    <text x="560" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">c</text>
    
    <!-- 公式 -->
    <text x="300" y="360" text-anchor="middle" font-size="13" fill="#333">Δ → Y: Ra = Rab × Rac / (Rab + Rbc + Rca)</text>
    <text x="300" y="380" text-anchor="middle" font-size="13" fill="#333">Y → Δ: Rab = Ra + Rb + Ra × Rb / Rc</text>
  </g>
</svg>