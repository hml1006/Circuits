<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">基本逻辑门符号</text>
    <!-- 与门 (AND) - 第1行第1列 -->
    <rect x="30" y="45" width="50" height="40" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
    <path d="M80 45 Q105 65 80 85" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="10" y1="55" x2="30" y2="55" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="75" x2="30" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="105" y1="65" x2="125" y2="65" stroke="#000" stroke-width="1.5"/>
    <text x="55" y="100" text-anchor="middle" font-size="12" fill="#000">&amp; 与门</text>
    <!-- 或门 (OR) - 第1行第2列 -->
    <path d="M170 55 L170 75 L190 65 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M170 45 Q195 65 170 85" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M170 45 Q160 65 170 85" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="55" x2="170" y2="55" stroke="#000" stroke-width="1.5"/>
    <line x1="150" y1="75" x2="170" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="195" y1="65" x2="215" y2="65" stroke="#000" stroke-width="1.5"/>
    <text x="182" y="100" text-anchor="middle" font-size="12" fill="#000">≥1 或门</text>
    <!-- 非门 (NOT) - 第1行第3列 -->
    <polygon points="310,55 340,65 310,75" fill="#fff" stroke="#000" stroke-width="2"/>
    <circle cx="343" cy="65" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="290" y1="65" x2="310" y2="65" stroke="#000" stroke-width="1.5"/>
    <line x1="347" y1="65" x2="365" y2="65" stroke="#000" stroke-width="1.5"/>
    <text x="327" y="100" text-anchor="middle" font-size="12" fill="#000">1 非门</text>
    <!-- 与非门 (NAND) - 第2行第1列 -->
    <rect x="30" y="125" width="50" height="40" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
    <path d="M80 125 Q105 145 80 165" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="108" cy="145" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="135" x2="30" y2="135" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="155" x2="30" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="112" y1="145" x2="130" y2="145" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="180" text-anchor="middle" font-size="12" fill="#000">&amp; 与非门</text>
    <!-- 或非门 (NOR) - 第2行第2列 -->
    <path d="M170 135 L170 155 L190 145 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M170 125 Q195 145 170 165" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M170 125 Q160 145 170 165" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="198" cy="145" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="150" y1="135" x2="170" y2="135" stroke="#000" stroke-width="1.5"/>
    <line x1="150" y1="155" x2="170" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="202" y1="145" x2="220" y2="145" stroke="#000" stroke-width="1.5"/>
    <text x="185" y="180" text-anchor="middle" font-size="12" fill="#000">≥1 或非门</text>
    <!-- 异或门 (XOR) - 第2行第3列 -->
    <path d="M290 135 L290 155 L310 145 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M290 125 Q315 145 290 165" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M290 125 Q280 145 290 165" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M275 125 Q270 135 275 145 Q270 155 275 165" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="270" y1="135" x2="275" y2="135" stroke="#000" stroke-width="1.5"/>
    <line x1="270" y1="155" x2="275" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="145" x2="330" y2="145" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="180" text-anchor="middle" font-size="12" fill="#000">=1 异或门</text>
    <!-- 同或门 (XNOR) - 第3行第1列 -->
    <path d="M30 215 L30 235 L50 225 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M30 205 Q55 225 30 245" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M30 205 Q20 225 30 245" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M15 205 Q10 215 15 225 Q10 235 15 245" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="58" cy="225" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="215" x2="15" y2="215" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="235" x2="15" y2="235" stroke="#000" stroke-width="1.5"/>
    <line x1="62" y1="225" x2="80" y2="225" stroke="#000" stroke-width="1.5"/>
    <text x="45" y="260" text-anchor="middle" font-size="12" fill="#000">=1 同或门</text>
    <!-- 三态门 - 第3行第2列 -->
    <rect x="130" y="205" width="50" height="40" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
    <polygon points="180,215 195,225 180,235" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="215" x2="130" y2="215" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="235" x2="130" y2="235" stroke="#000" stroke-width="1.5"/>
    <line x1="195" y1="225" x2="215" y2="225" stroke="#000" stroke-width="1.5"/>
    <line x1="155" y1="245" x2="155" y2="260" stroke="#000" stroke-width="1.5"/>
    <text x="145" y="260" text-anchor="middle" font-size="11" fill="#000">EN</text>
    <text x="162" y="260" text-anchor="middle" font-size="12" fill="#000">三态门</text>
    <!-- 缓冲器 - 第3行第3列 -->
    <polygon points="280,215 310,225 280,235" fill="#fff" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="225" x2="280" y2="225" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="225" x2="330" y2="225" stroke="#000" stroke-width="1.5"/>
    <text x="295" y="260" text-anchor="middle" font-size="12" fill="#000">1 缓冲器</text>
    <!-- 说明 -->
    <text x="300" y="300" text-anchor="middle" font-size="13" fill="#555">逻辑门符号（IEC 标准）</text>
    <text x="300" y="320" text-anchor="middle" font-size="12" fill="#555">左侧输入，右侧输出，上端为电源/控制</text>
    <line x1="100" y1="340" x2="500" y2="340" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#888">&amp;=与门  ≥1=或门  1=非门/缓冲  =1=异或门</text>
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#888">○ 小圆圈表示取反（如与非门、或非门、同或门）</text>
  </g>
</svg>