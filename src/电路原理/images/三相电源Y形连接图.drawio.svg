<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">三相电源Y形连接图</text>
    <!-- 中性点N -->
    <circle cx="300" cy="300" r="5" fill="#000"/>
    <text x="305" y="315" font-size="14" fill="#333">N</text>
    <!-- A相 -->
    <line x1="300" y1="300" x2="200" y2="150" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="200" cy="130" r="18" fill="none" stroke="#d32f2f" stroke-width="2"/>
    <line x1="200" y1="112" x2="200" y2="118" stroke="#d32f2f" stroke-width="2"/>
    <line x1="188" y1="130" x2="212" y2="130" stroke="#d32f2f" stroke-width="2"/>
    <line x1="200" y1="142" x2="200" y2="148" stroke="#d32f2f" stroke-width="2"/>
    <text x="180" y="125" font-size="10" fill="#333">+</text>
    <text x="215" y="125" font-size="10" fill="#333">-</text>
    <text x="175" y="110" font-size="13" fill="#d32f2f">u_A</text>
    <line x1="200" y1="148" x2="200" y2="150" stroke="#d32f2f" stroke-width="2"/>
    <!-- A相出线 -->
    <line x1="200" y1="112" x2="200" y2="70" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="210" y="65" font-size="14" fill="#d32f2f" font-weight="bold">A</text>
    <!-- B相 -->
    <line x1="300" y1="300" x2="100" y2="280" stroke="#1976d2" stroke-width="2"/>
    <circle cx="80" cy="280" r="18" fill="none" stroke="#1976d2" stroke-width="2"/>
    <line x1="80" y1="262" x2="80" y2="268" stroke="#1976d2" stroke-width="2"/>
    <line x1="68" y1="280" x2="92" y2="280" stroke="#1976d2" stroke-width="2"/>
    <line x1="80" y1="292" x2="80" y2="298" stroke="#1976d2" stroke-width="2"/>
    <text x="60" y="275" font-size="10" fill="#333">+</text>
    <text x="95" y="275" font-size="10" fill="#333">-</text>
    <text x="55" y="260" font-size="13" fill="#1976d2">u_B</text>
    <line x1="80" y1="298" x2="95" y2="295" stroke="#1976d2" stroke-width="2"/>
    <!-- B相出线 -->
    <line x1="62" y1="262" x2="40" y2="240" stroke="#1976d2" stroke-width="2.5"/>
    <text x="30" y="235" font-size="14" fill="#1976d2" font-weight="bold">B</text>
    <!-- C相 -->
    <line x1="300" y1="300" x2="400" y2="280" stroke="#e65100" stroke-width="2"/>
    <circle cx="420" cy="280" r="18" fill="none" stroke="#e65100" stroke-width="2"/>
    <line x1="420" y1="262" x2="420" y2="268" stroke="#e65100" stroke-width="2"/>
    <line x1="408" y1="280" x2="432" y2="280" stroke="#e65100" stroke-width="2"/>
    <line x1="420" y1="292" x2="420" y2="298" stroke="#e65100" stroke-width="2"/>
    <text x="400" y="275" font-size="10" fill="#333">+</text>
    <text x="435" y="275" font-size="10" fill="#333">-</text>
    <text x="435" y="260" font-size="13" fill="#e65100">u_C</text>
    <line x1="420" y1="298" x2="405" y2="295" stroke="#e65100" stroke-width="2"/>
    <!-- C相出线 -->
    <line x1="438" y1="262" x2="460" y2="240" stroke="#e65100" stroke-width="2.5"/>
    <text x="465" y="235" font-size="14" fill="#e65100" font-weight="bold">C</text>
    <!-- 中性线 -->
    <line x1="300" y1="305" x2="300" y2="370" stroke="#000" stroke-width="2"/>
    <text x="310" y="375" font-size="14" fill="#333">N'</text>
    <!-- 公式 -->
    <text x="300" y="395" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">U_L = √3·U_P, 线电压超前相电压30°</text>
  </g>
</svg>