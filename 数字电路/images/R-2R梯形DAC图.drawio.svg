<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">R-2R 梯形网络 DAC</text>
    <!-- 运放 -->
    <rect x="420" y="145" width="80" height="60" rx="4" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="460" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">运放</text>
    <text x="460" y="185" text-anchor="middle" font-size="10" fill="#555">OP-AMP</text>
    <circle cx="420" cy="155" r="3" fill="#000"/>
    <circle cx="420" cy="195" r="3" fill="#000"/>
    <line x1="420" y1="155" x2="400" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="195" x2="400" y2="195" stroke="#000" stroke-width="1.5"/>
    <!-- 反馈电阻 Rf -->
    <rect x="460" y="120" width="30" height="22" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="475" y="135" text-anchor="middle" font-size="8" fill="#000">Rf</text>
    <line x1="460" y1="120" x2="420" y2="120" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="120" x2="420" y2="145" stroke="#000" stroke-width="1.5"/>
    <line x1="490" y1="131" x2="530" y2="131" stroke="#000" stroke-width="1.5"/>
    <text x="540" y="135" text-anchor="start" font-size="11" fill="#000">VREF</text>
    <!-- 梯形网络 -->
    <!-- R-2R 网络位置 -->
    <rect x="60" y="100" width="330" height="150" rx="4" fill="#fafafa" stroke="#aaa" stroke-width="1" stroke-dasharray="3"/>
    <text x="225" y="120" text-anchor="middle" font-size="11" fill="#555">R-2R 梯形网络</text>
    <!-- 电阻 R -->
    <rect x="80" y="160" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="100" y="173" text-anchor="middle" font-size="8" fill="#000">R</text>
    <rect x="160" y="160" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="180" y="173" text-anchor="middle" font-size="8" fill="#000">R</text>
    <rect x="240" y="160" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="260" y="173" text-anchor="middle" font-size="8" fill="#000">R</text>
    <rect x="320" y="160" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="340" y="173" text-anchor="middle" font-size="8" fill="#000">R</text>
    <line x1="120" y1="169" x2="160" y2="169" stroke="#000" stroke-width="1.5"/>
    <line x1="200" y1="169" x2="240" y2="169" stroke="#000" stroke-width="1.5"/>
    <line x1="280" y1="169" x2="320" y2="169" stroke="#000" stroke-width="1.5"/>
    <line x1="360" y1="169" x2="400" y2="169" stroke="#000" stroke-width="1.5"/>
    <!-- 电阻 2R -->
    <rect x="80" y="195" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="100" y="208" text-anchor="middle" font-size="8" fill="#000">2R</text>
    <rect x="160" y="195" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="180" y="208" text-anchor="middle" font-size="8" fill="#000">2R</text>
    <rect x="240" y="195" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="260" y="208" text-anchor="middle" font-size="8" fill="#000">2R</text>
    <rect x="320" y="195" width="40" height="18" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="340" y="208" text-anchor="middle" font-size="8" fill="#000">2R</text>
    <line x1="100" y1="178" x2="100" y2="195" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="178" x2="180" y2="195" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="178" x2="260" y2="195" stroke="#000" stroke-width="1.5"/>
    <line x1="340" y1="178" x2="340" y2="195" stroke="#000" stroke-width="1.5"/>
    <!-- 2R 接地 -->
    <line x1="100" y1="213" x2="100" y2="235" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="213" x2="180" y2="235" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="213" x2="260" y2="235" stroke="#000" stroke-width="1.5"/>
    <line x1="340" y1="213" x2="340" y2="235" stroke="#000" stroke-width="1.5"/>
    <!-- 开关 -->
    <line x1="80" y1="150" x2="80" y2="140" stroke="#000" stroke-width="1.5"/>
    <line x1="80" y1="140" x2="60" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="50" y="144" text-anchor="end" font-size="11" fill="#000">D₃</text>
    <line x1="160" y1="150" x2="160" y2="140" stroke="#000" stroke-width="1.5"/>
    <line x1="160" y1="140" x2="140" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="130" y="144" text-anchor="end" font-size="11" fill="#000">D₂</text>
    <line x1="240" y1="150" x2="240" y2="140" stroke="#000" stroke-width="1.5"/>
    <line x1="240" y1="140" x2="220" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="210" y="144" text-anchor="end" font-size="11" fill="#000">D₁</text>
    <line x1="320" y1="150" x2="320" y2="140" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="140" x2="300" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="290" y="144" text-anchor="end" font-size="11" fill="#000">D₀</text>
    <!-- 输出 -->
    <line x1="500" y1="175" x2="560" y2="175" stroke="#000" stroke-width="2"/>
    <text x="570" y="179" text-anchor="start" font-size="13" font-weight="bold" fill="#000">VOUT</text>
    <!-- 说明 -->
    <rect x="30" y="260" width="540" height="125" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">R-2R 梯形 DAC 工作原理</text>
    <text x="50" y="305" text-anchor="start" font-size="12" fill="#000">• 只用两种阻值（R 和 2R），精度高、易于集成</text>
    <text x="50" y="325" text-anchor="start" font-size="12" fill="#000">• 各支路电流按二进制权重分配</text>
    <text x="50" y="345" text-anchor="start" font-size="12" fill="#000">• 输出电压：VOUT = -VREF × (D₃/2 + D₂/4 + D₁/8 + D₀/16)</text>
    <text x="50" y="365" text-anchor="start" font-size="12" fill="#000">• 运放将电流求和转换为电压输出</text>
    <text x="50" y="385" text-anchor="start" font-size="12" fill="#000">• 当 Rf = R 时，VOUT = -VREF × Σ(Dᵢ/2ⁿ⁻ⁱ)</text>
  </g>
</svg>