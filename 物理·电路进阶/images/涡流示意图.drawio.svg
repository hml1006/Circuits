<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">涡流示意图</text>
    
    <!-- 金属块 -->
    <rect x="180" y="120" width="240" height="160" rx="15" ry="15" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="300" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">金属块</text>
    
    <!-- 交变磁场 B 标注 -->
    <text x="300" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">交变磁场</text>
    <text x="300" y="115" text-anchor="middle" font-size="12" fill="#d32f2f">B(t)</text>
    
    <!-- 涡流（环形电流） -->
    <path d="M 240,180 Q 220,200 240,220 Q 260,240 280,220 Q 260,200 240,180" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <polygon points="245,205 240,215 250,210" fill="#ff9800"/>
    
    <path d="M 300,160 Q 270,180 300,200 Q 330,220 360,200 Q 340,175 300,160" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <polygon points="310,185 305,195 315,190" fill="#ff9800"/>
    
    <path d="M 340,200 Q 330,220 350,240 Q 370,250 380,230 Q 370,210 340,200" fill="none" stroke="#ff9800" stroke-width="2.5"/>
    <polygon points="350,225 348,235 358,228" fill="#ff9800"/>
    
    <path d="M 260,240 Q 280,260 300,240 Q 280,230 260,240" fill="none" stroke="#ff9800" stroke-width="2"/>
    <polygon points="270,245 268,252 276,248" fill="#ff9800"/>
    
    <!-- 涡流标注 -->
    <text x="300" y="300" text-anchor="middle" font-size="12" fill="#ff9800">涡流（涡旋状感应电流）</text>
    
    <!-- 交变磁场方向（垂直纸面） -->
    <circle cx="300" cy="200" r="3" fill="none" stroke="#d32f2f" stroke-width="2"/>
    <text x="310" y="205" font-size="10" fill="#d32f2f">⊗ B</text>
    
    <circle cx="300" cy="200" r="8" fill="none" stroke="#d32f2f" stroke-width="1.5"/>
    <text x="300" y="205" text-anchor="middle" font-size="8" fill="#d32f2f">×</text>
    
    <!-- 应用说明 -->
    <text x="150" y="360" text-anchor="middle" font-size="12" fill="#666">有害：涡流损耗（变压器铁芯发热）</text>
    <text x="450" y="360" text-anchor="middle" font-size="12" fill="#666">有益：电磁炉、感应加热、涡流制动</text>
    <text x="300" y="380" text-anchor="middle" font-size="11" fill="#999">抑制方法：硅钢片叠压（片间绝缘）</text>
  </g>
</svg>