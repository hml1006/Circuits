<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">伏安法测电阻电路图</text>
    <text x="300" y="50" text-anchor="middle" font-size="13" fill="#666">R = U / I</text>
    
    <!-- 电路图 -->
    <!-- 电源 -->
    <rect x="30" y="210" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="45" y1="210" x2="45" y2="195" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="210" x2="65" y2="195" stroke="#333" stroke-width="2"/>
    <text x="55" y="225" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="55" y="240" text-anchor="middle" font-size="10" fill="#333">−</text>
    <text x="55" y="265" text-anchor="middle" font-size="11" fill="#555">电源</text>
    
    <!-- 导线：电源正极 → 上 -->
    <line x1="55" y1="195" x2="55" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="55" y1="100" x2="140" y2="100" stroke="#333" stroke-width="2"/>
    
    <!-- 开关 S -->
    <line x1="140" y1="100" x2="170" y2="100" stroke="#333" stroke-width="2"/>
    <circle cx="170" cy="100" r="3" fill="#333"/>
    <line x1="170" y1="100" x2="190" y2="85" stroke="#333" stroke-width="2"/>
    <circle cx="190" cy="85" r="3" fill="#333"/>
    <line x1="190" y1="85" x2="220" y2="85" stroke="#333" stroke-width="2"/>
    <text x="180" y="75" text-anchor="middle" font-size="11" fill="#555">S</text>
    
    <!-- 滑动变阻器 -->
    <rect x="220" y="75" width="20" height="6" fill="#333"/>
    <rect x="250" y="75" width="20" height="6" fill="#333"/>
    <rect x="280" y="75" width="20" height="6" fill="#333"/>
    <rect x="310" y="75" width="20" height="6" fill="#333"/>
    <rect x="340" y="75" width="20" height="6" fill="#333"/>
    <line x1="230" y1="75" x2="230" y2="95" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="75" x2="350" y2="95" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="95" x2="350" y2="95" stroke="#333" stroke-width="2"/>
    <path d="M 290 75 L 290 95" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M 290 95 L 275 90" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M 290 95 L 305 90" fill="none" stroke="#333" stroke-width="2"/>
    <text x="285" y="65" text-anchor="middle" font-size="10" fill="#555">滑动变阻器</text>
    
    <!-- 电流表（串联） -->
    <line x1="350" y1="85" x2="390" y2="85" stroke="#333" stroke-width="2"/>
    <rect x="390" y="70" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="420" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">A</text>
    <line x1="430" y1="85" x2="445" y2="85" stroke="#333" stroke-width="2"/>
    <text x="410" y="60" text-anchor="middle" font-size="10" fill="#555">测 I</text>
    
    <!-- 待测电阻 Rx -->
    <line x1="445" y1="85" x2="485" y2="85" stroke="#333" stroke-width="2"/>
    <rect x="485" y="70" width="50" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="510" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Rₓ</text>
    <text x="510" y="120" text-anchor="middle" font-size="10" fill="#555">待测电阻</text>
    
    <!-- 导线：Rx → 电源负极 -->
    <line x1="535" y1="85" x2="560" y2="85" stroke="#333" stroke-width="2"/>
    <line x1="560" y1="85" x2="560" y2="210" stroke="#333" stroke-width="2"/>
    <line x1="560" y1="210" x2="80" y2="210" stroke="#333" stroke-width="2"/>
    
    <!-- 电压表（并联在Rx两端） -->
    <line x1="500" y1="70" x2="500" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="500" y1="170" x2="440" y2="170" stroke="#333" stroke-width="2"/>
    <rect x="400" y="155" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="420" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">V</text>
    <line x1="440" y1="170" x2="520" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="170" x2="520" y2="100" stroke="#333" stroke-width="2"/>
    <text x="420" y="150" text-anchor="middle" font-size="10" fill="#555">测 U</text>
    
    <!-- 说明 -->
    <rect x="30" y="290" width="540" height="90" rx="8" ry="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="300" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">伏安法测电阻原理</text>
    
    <text x="50" y="340" font-size="12" fill="#555">① 用电压表测出 Rₓ 两端的电压 U</text>
    <text x="50" y="360" font-size="12" fill="#555">② 用电流表测出通过 Rₓ 的电流 I</text>
    <text x="50" y="380" font-size="12" fill="#555">③ 根据 R = U / I 计算电阻值，多次测量取平均值</text>
  </g>
</svg>