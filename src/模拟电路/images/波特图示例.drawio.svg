<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">波特图示例</text>

    <!-- 幅频波特图 -->
    <text x="60" y="55" font-size="12" fill="#666">幅频 |Av|(dB)</text>
    <line x1="60" y1="70" x2="540" y2="70" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="110" x2="540" y2="110" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="70" x2="60" y2="150" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- 幅频曲线（渐近线） -->
    <line x1="60" y1="70" x2="200" y2="70" stroke="#3366cc" stroke-width="2.5"/>
    <line x1="200" y1="70" x2="400" y2="110" stroke="#3366cc" stroke-width="2.5"/>
    <line x1="400" y1="110" x2="540" y2="130" stroke="#3366cc" stroke-width="2.5"/>
    <!-- 标注 -->
    <text x="60" y="65" text-anchor="end" font-size="9" fill="#666">A</text>
    <text x="66" y="65" text-anchor="end" font-size="9" fill="#666">m</text>
    <text x="200" y="60" text-anchor="middle" font-size="9" fill="#cc3333">f</text>
    <text x="208" y="60" text-anchor="middle" font-size="9" fill="#cc3333">p1</text>
    <text x="400" y="100" text-anchor="middle" font-size="9" fill="#cc3333">f</text>
    <text x="408" y="100" text-anchor="middle" font-size="9" fill="#cc3333">p2</text>
    <text x="450" y="140" font-size="9" fill="#666">-20dB/dec</text>
    <text x="490" y="120" font-size="9" fill="#666">-40dB/dec</text>

    <!-- 相频波特图 -->
    <text x="60" y="195" font-size="12" fill="#666">相频 φ(°)</text>
    <line x1="60" y1="210" x2="540" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="250" x2="540" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="290" x2="540" y2="290" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="210" x2="60" y2="290" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="55" y="215" text-anchor="end" font-size="9" fill="#666">0°</text>
    <text x="55" y="255" text-anchor="end" font-size="9" fill="#666">-90°</text>
    <text x="55" y="295" text-anchor="end" font-size="9" fill="#666">-180°</text>
    <!-- 相频曲线 -->
    <path d="M 60 210 Q 80 210 100 215 Q 150 225 200 240 Q 250 252 300 260 Q 350 268 400 275 Q 450 282 500 288 Q 520 290 540 290" fill="none" stroke="#cc3333" stroke-width="2"/>
    <!-- 标注 -->
    <text x="200" y="235" text-anchor="middle" font-size="9" fill="#cc3333">f</text>
    <text x="208" y="235" text-anchor="middle" font-size="9" fill="#cc3333">p1</text>
    <text x="400" y="280" text-anchor="middle" font-size="9" fill="#cc3333">f</text>
    <text x="408" y="280" text-anchor="middle" font-size="9" fill="#cc3333">p2</text>

    <!-- 相位裕度标注 -->
    <line x1="340" y1="210" x2="340" y2="262" stroke="#cc3333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="340" y="205" text-anchor="middle" font-size="9" fill="#cc3333">f</text>
    <text x="348" y="205" text-anchor="middle" font-size="9" fill="#cc3333">0dB</text>
    <text x="345" y="240" font-size="9" fill="#cc3333">φ</text>
    <text x="350" y="240" font-size="9" fill="#cc3333">m</text>

    <!-- 图例 -->
    <line x1="430" y1="330" x2="460" y2="330" stroke="#3366cc" stroke-width="2.5"/>
    <text x="465" y="334" font-size="10" fill="#666">幅频</text>
    <line x1="430" y1="350" x2="460" y2="350" stroke="#cc3333" stroke-width="2"/>
    <text x="465" y="354" font-size="10" fill="#666">相频</text>
  </g>
</svg>