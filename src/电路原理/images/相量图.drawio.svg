<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">相量图</text>
    <!-- 坐标轴 -->
    <line x1="300" y1="350" x2="300" y2="50" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="200" x2="500" y2="200" stroke="#000" stroke-width="2"/>
    <polygon points="300,50 295,60 305,60" fill="#000"/>
    <polygon points="500,200 490,195 490,205" fill="#000"/>
    <text x="310" y="55" font-size="14" fill="#333">虚轴</text>
    <text x="500" y="195" font-size="14" fill="#333">实轴</text>
    <text x="290" y="215" font-size="12" fill="#333">O</text>
    <!-- 相量U -->
    <line x1="300" y1="200" x2="420" y2="120" stroke="#d32f2f" stroke-width="3"/>
    <polygon points="420,120 412,118 414,128" fill="#d32f2f"/>
    <text x="425" y="115" font-size="15" fill="#d32f2f" font-weight="bold">U</text>
    <!-- 角度弧 -->
    <path d="M 310 190 A 40 40 0 0 1 340 165" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="335" y="175" font-size="13" fill="#333">φ</text>
    <!-- 投影线 -->
    <line x1="420" y1="120" x2="420" y2="200" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="300" y1="120" x2="420" y2="120" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="425" y="215" font-size="12" fill="#666">U cosφ</text>
    <text x="310" y="115" font-size="12" fill="#666">U sinφ</text>
    <!-- 相量I -->
    <line x1="300" y1="200" x2="380" y2="260" stroke="#1976d2" stroke-width="3"/>
    <polygon points="380,260 375,252 385,254" fill="#1976d2"/>
    <text x="385" y="270" font-size="15" fill="#1976d2" font-weight="bold">I</text>
    <path d="M 310 200 A 50 50 0 0 0 340 225" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="345" y="225" font-size="13" fill="#333">θ</text>
    <!-- 相位差 -->
    <path d="M 330 180 A 60 60 0 0 0 335 215" fill="none" stroke="#e65100" stroke-width="1.5"/>
    <text x="350" y="200" font-size="12" fill="#e65100" font-weight="bold">φ-θ</text>
    <!-- 说明 -->
    <text x="300" y="330" text-anchor="middle" font-size="13" fill="#666">u(t) = U_m cos(ωt + φ), i(t) = I_m cos(ωt + θ)</text>
    <text x="300" y="355" text-anchor="middle" font-size="13" fill="#666">相量 Ů = U∠φ, İ = I∠θ</text>
    <text x="300" y="380" text-anchor="middle" font-size="13" fill="#666">阻抗角 = φ - θ = arctan(X/R)</text>
  </g>
</svg>