<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">共源放大电路</text>

    <!-- VDD -->
    <line x1="200" y1="60" x2="480" y2="60" stroke="#333" stroke-width="2"/>
    <text x="490" y="65" font-size="14" font-weight="bold" fill="#cc3333">+V</text>
    <text x="505" y="65" font-size="11" fill="#cc3333">DD</text>

    <!-- RD -->
    <rect x="280" y="80" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="280" y="60" width="16" height="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="276" y="60" width="24" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="288" y="95" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="288" y="107" text-anchor="middle" font-size="9" fill="#666">D</text>
    <line x1="288" y1="60" x2="280" y2="60" stroke="#333" stroke-width="2"/>

    <!-- RG1 -->
    <rect x="180" y="80" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="180" y="60" width="16" height="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="176" y="60" width="24" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="188" y="95" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="188" y="107" text-anchor="middle" font-size="9" fill="#666">G1</text>
    <line x1="200" y1="60" x2="188" y2="60" stroke="#333" stroke-width="2"/>

    <!-- RG2 -->
    <rect x="180" y="160" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="180" y="120" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="176" y="120" width="24" height="80" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="188" y="165" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="188" y="177" text-anchor="middle" font-size="9" fill="#666">G2</text>

    <!-- 连接线 -->
    <line x1="200" y1="120" x2="200" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="140" x2="280" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="120" x2="280" y2="140" stroke="#333" stroke-width="2"/>

    <!-- 栅极电阻RG -->
    <rect x="200" y="200" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="208" y="220" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="208" y="230" text-anchor="middle" font-size="7" fill="#666">G</text>
    <line x1="200" y1="140" x2="200" y2="200" stroke="#333" stroke-width="2"/>

    <!-- MOSFET -->
    <line x1="280" y1="140" x2="280" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="200" x2="280" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="200" x2="250" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="240" x2="310" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="240" x2="290" y2="230" stroke="#333" stroke-width="2"/>
    <polygon points="280,240 290,230 290,250" fill="#333"/>
    <text x="295" y="145" font-size="12" font-weight="bold" fill="#333">M</text>
    <text x="313" y="245" font-size="11" fill="#666">S</text>
    <text x="248" y="198" text-anchor="end" font-size="11" fill="#666">G</text>
    <text x="313" y="205" font-size="11" fill="#666">D</text>

    <!-- RS -->
    <rect x="280" y="260" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="280" y="240" width="16" height="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="276" y="240" width="24" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="288" y="275" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="288" y="287" text-anchor="middle" font-size="9" fill="#666">S</text>

    <!-- CS -->
    <line x1="300" y1="270" x2="330" y2="270" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="258" x2="350" y2="258" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="282" x2="350" y2="282" stroke="#333" stroke-width="2"/>
    <text x="340" y="253" text-anchor="middle" font-size="9" fill="#333">C</text>
    <text x="346" y="253" text-anchor="middle" font-size="7" fill="#666">S</text>
    <line x1="350" y1="270" x2="370" y2="270" stroke="#333" stroke-width="2"/>

    <!-- 接地 -->
    <line x1="288" y1="300" x2="288" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="230" x2="200" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="320" x2="288" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="270" x2="370" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="240" y1="320" x2="240" y2="330" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="330" x2="250" y2="330" stroke="#333" stroke-width="2"/>
    <line x1="235" y1="335" x2="245" y2="335" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="280" y1="80" x2="370" y2="80" stroke="#333" stroke-width="2"/>
    <rect x="370" y="65" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="378" y="85" text-anchor="middle" font-size="10" fill="#333">C</text>
    <line x1="386" y1="80" x2="420" y2="80" stroke="#333" stroke-width="2"/>
    <text x="430" y="85" font-size="12" fill="#333">v</text>
    <text x="440" y="85" font-size="11" fill="#666">o</text>

    <!-- 输入 -->
    <text x="140" y="235" font-size="12" fill="#333">v</text>
    <text x="150" y="235" font-size="11" fill="#666">i</text>
    <line x1="160" y1="230" x2="200" y2="230" stroke="#333" stroke-width="2"/>
    <rect x="160" y="215" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="168" y="235" text-anchor="middle" font-size="10" fill="#333">C</text>
  </g>
</svg>