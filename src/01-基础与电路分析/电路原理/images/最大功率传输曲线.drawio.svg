<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">最大功率传输曲线</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="350" x2="560" y2="350" stroke="#000" stroke-width="2" marker-end="url(#arrowX)"/>
    <line x1="80" y1="350" x2="80" y2="50" stroke="#000" stroke-width="2" marker-end="url(#arrowY)"/>
    <defs>
      <marker id="arrowX" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#000"/>
      </marker>
      <marker id="arrowY" markerWidth="8" markerHeight="6" refX="3" refY="0" orient="auto">
        <polygon points="0 6, 3 0, 6 6" fill="#000"/>
      </marker>
    </defs>
    <!-- 标注 -->
    <text x="300" y="375" text-anchor="middle" font-size="14" fill="#333">R_L / R_eq</text>
    <text x="50" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90, 50, 200)">P_L</text>
    <!-- 刻度 -->
    <line x1="80" y1="350" x2="80" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="80" y="370" text-anchor="middle" font-size="11" fill="#333">0</text>
    <line x1="240" y1="350" x2="240" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="240" y="370" text-anchor="middle" font-size="11" fill="#333">1</text>
    <line x1="400" y1="350" x2="400" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="400" y="370" text-anchor="middle" font-size="11" fill="#333">2</text>
    <line x1="520" y1="350" x2="520" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="520" y="370" text-anchor="middle" font-size="11" fill="#333">3</text>
    <!-- 曲线 P_L = (u_oc^2 * R_L) / (R_eq + R_L)^2 -->
    <!-- 归一化曲线: P_L/P_max = 4x/(1+x)^2 where x = R_L/R_eq -->
    <path d="M 80 350 Q 120 350 160 340 Q 200 310 240 175 Q 250 130 260 100 Q 270 78 280 68 Q 290 62 300 60 Q 310 62 320 68 Q 330 78 340 100 Q 350 130 360 175 Q 400 310 440 340 Q 480 350 550 350" fill="none" stroke="#d32f2f" stroke-width="3"/>
    <!-- 最大值点 -->
    <circle cx="300" cy="60" r="5" fill="#d32f2f" stroke="#d32f2f" stroke-width="2"/>
    <!-- 虚线 -->
    <line x1="240" y1="350" x2="240" y2="60" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
    <line x1="80" y1="60" x2="300" y2="60" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="160" y="55" font-size="13" fill="#d32f2f">P_max</text>
    <text x="245" y="345" font-size="13" fill="#d32f2f">R_L = R_eq</text>
    <!-- 公式 -->
    <text x="300" y="395" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">P_max = u_oc²/(4R_eq)  当 R_L = R_eq 时</text>
  </g>
</svg>