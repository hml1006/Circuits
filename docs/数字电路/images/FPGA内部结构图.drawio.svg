<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">FPGA 内部结构</text>
    <!-- 可编程 I/O -->
    <rect x="10" y="60" width="50" height="280" rx="4" fill="#fdebd0" stroke="#000" stroke-width="1.5"/>
    <text x="35" y="200" text-anchor="middle" font-size="9" font-weight="bold" fill="#000" transform="rotate(-90,35,200)">IOB</text>
    <rect x="540" y="60" width="50" height="280" rx="4" fill="#fdebd0" stroke="#000" stroke-width="1.5"/>
