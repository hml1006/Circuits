<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">自动增益控制（AGC）环路框图</text>

    <!-- 输入 -->
    <text x="20" y="130" font-size="13" fill="#333">v</text>
    <text x="20" y="140" font-size="10" fill="#333">i</text>
    <line x1="40" y1="130" x2="70" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- VGA -->
    <rect x="70" y="95" width="110" height="70" fill="#e8e8ff" stroke="#3333cc" stroke-width="2" rx="5"/>
    <text x="125" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#3333cc">VGA</text>
    <text x="125" y="140" text-anchor="middle" font-size="10" fill="#3333cc">可变增益</text>
    <text x="125" y="153" text-anchor="middle" font-size="10" fill="#3333cc">放大器</text>

    <line x1="180" y1="130" x2="220" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 峰值检测器 -->
    <rect x="220" y="95" width="100" height="70" fill="#e8ffe8" stroke="#2a7a2a" stroke-width="2" rx="5"/>
    <text x="270" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a7a2a">峰值</text>
    <text x="270" y="140" text-anchor="middle" font-size="10" fill="#2a7a2a">检测器</text>

    <line x1="320" y1="130" x2="360" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 比较器 -->
    <rect x="360" y="95" width="100" height="70" fill="#ffe8cc" stroke="#cc6600" stroke-width="2" rx="5"/>
    <text x="410" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc6600">比较器</text>
    <text x="410" y="140" text-anchor="middle" font-size="10" fill="#cc6600">+ 环路滤波器</text>

    <line x1="460" y1="130" x2="500" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 输出 -->
    <text x="510" y="135" font-size="13" fill="#333">v</text>
    <text x="510" y="145" font-size="10" fill="#333">o</text>

    <!-- 参考电压 Vref -->
    <line x1="410" y1="165" x2="410" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="410" y1="190" x2="450" y2="190" stroke="#333" stroke-width="2"/>
    <text x="460" y="195" font-size="11" fill="#666">V</text>
    <text x="468" y="195" font-size="9" fill="#666">ref</text>

    <!-- 反馈路径 -->
    <line x1="125" y1="165" x2="125" y2="260" stroke="#333" stroke-width="2"/>
    <line x1="125" y1="260" x2="410" y2="260" stroke="#333" stroke-width="2"/>
    <line x1="410" y1="260" x2="410" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 反馈标注 -->
    <text x="270" y="255" text-anchor="middle" font-size="10" fill="#666">负反馈控制环路</text>

    <!-- 控制电压 -->
    <line x1="410" y1="260" x2="410" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="410" y1="280" x2="125" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="125" y1="280" x2="125" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="270" y="278" text-anchor="middle" font-size="10" fill="#666">V</text>
    <text x="278" y="278" text-anchor="middle" font-size="8" fill="#666">c</text>
    <text x="285" y="278" text-anchor="middle" font-size="10" fill="#666">（控制电压）</text>

    <!-- 工作原理说明 -->
    <text x="300" y="320" text-anchor="middle" font-size="11" fill="#666">工作原理：</text>
    <text x="300" y="338" text-anchor="middle" font-size="10" fill="#666">1. 输入信号 v</text>
    <text x="340" y="338" text-anchor="middle" font-size="10" fill="#666">i</text>
    <text x="348" y="338" text-anchor="middle" font-size="10" fill="#666"> 经 VGA 放大后输出 v</text>
    <text x="400" y="338" text-anchor="middle" font-size="10" fill="#666">o</text>
    <text x="300" y="356" text-anchor="middle" font-size="10" fill="#666">2. 峰值检测器提取输出幅度，与 V</text>
    <text x="390" y="356" text-anchor="middle" font-size="10" fill="#666">ref</text>
    <text x="400" y="356" text-anchor="middle" font-size="10" fill="#666"> 比较</text>
    <text x="300" y="374" text-anchor="middle" font-size="10" fill="#666">3. 误差信号经环路滤波器产生 V</text>
    <text x="390" y="374" text-anchor="middle" font-size="10" fill="#666">c</text>
    <text x="398" y="374" text-anchor="middle" font-size="10" fill="#666">，调节 VGA 增益使输出稳定</text>
  </g>
</svg>