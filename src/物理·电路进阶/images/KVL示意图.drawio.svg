<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">基尔霍夫电压定律（KVL）示意图</text>
    
    <!-- 回路 -->
    <rect x="100" y="80" width="400" height="240" rx="10" ry="10" fill="none" stroke="#333" stroke-width="2.5"/>
    
    <!-- 绕行方向（虚线箭头） -->
    <path d="M 100,80 L 100,320 L 500,320 L 500,80 Z" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
    <polygon points="100,75 100,85 85,80" fill="#ff9800"/>
    <text x="70" y="200" text-anchor="middle" font-size="12" fill="#ff9800" transform="rotate(-90,70,200)">绕行方向</text>
    
    <!-- 电源 E -->
    <line x1="300" y1="290" x2="300" y2="250" stroke="#333" stroke-width="2.5"/>
    <line x1="280" y1="250" x2="320" y2="250" stroke="#333" stroke-width="2.5"/>
    <line x1="290" y1="290" x2="310" y2="290" stroke="#333" stroke-width="2.5"/>
    <text x="300" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">E</text>
    
    <!-- 电阻 R1 -->
    <rect x="140" y="100" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="165" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R₁</text>
    
    <!-- 电阻 R2 -->
    <rect x="410" y="100" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="435" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R₂</text>
    
    <!-- 电阻 R3 -->
    <rect x="410" y="260" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="435" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R₃</text>
    
    <!-- 导线连接 -->
    <line x1="100" y1="120" x2="140" y2="120" stroke="#333" stroke-width="2.5"/>
    <line x1="190" y1="120" x2="410" y2="120" stroke="#333" stroke-width="2.5"/>
    <line x1="460" y1="120" x2="500" y2="120" stroke="#333" stroke-width="2.5"/>
    <line x1="500" y1="120" x2="500" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="460" y1="280" x2="500" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="190" y1="280" x2="410" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="100" y1="280" x2="190" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="100" y1="120" x2="100" y2="280" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电压标注 -->
    <text x="165" y="90" text-anchor="middle" font-size="11" fill="#666" font-style="italic">U₁ = IR₁</text>
    <text x="435" y="90" text-anchor="middle" font-size="11" fill="#666" font-style="italic">U₂ = IR₂</text>
    <text x="435" y="310" text-anchor="middle" font-size="11" fill="#666" font-style="italic">U₃ = IR₃</text>
    
    <!-- 电流方向 -->
    <polygon points="270,115 285,120 270,125" fill="#333"/>
    <text x="285" y="115" text-anchor="start" font-size="12" fill="#333" font-style="italic">I</text>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ΣU = 0 即 E − IR₁ − IR₂ − IR₃ = 0</text>
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#666">E = IR₁ + IR₂ + IR₃</text>
  </g>
</svg>