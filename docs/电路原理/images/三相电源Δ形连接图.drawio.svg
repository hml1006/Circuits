<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">三相电源Δ形连接图</text>
    <!-- A相（顶部） -->
    <circle cx="300" cy="100" r="20" fill="none" stroke="#d32f2f" stroke-width="2"/>
    <line x1="300" y1="80" x2="300" y2="86" stroke="#d32f2f" stroke-width="2"/>
    <line x1="285" y1="100" x2="315" y2="100" stroke="#d32f2f" stroke-width="2"/>
    <line x1="300" y1="114" x2="300" y2="120" stroke="#d32f2f" stroke-width="2"/>
    <text x="280" y="95" font-size="10" fill="#333">+</text>
    <text x="315" y="95" font-size="10" fill="#333">-</text>
    <text x="270" y="75" font-size="13" fill="#d32f2f">u_A</text>
    <!-- B相（左下） -->
    <circle cx="140" cy="280" r="20" fill="none" stroke="#1976d2" stroke-width="2"/>
    <line x1="140" y1="260" x2="140" y2="266" stroke="#1976d2" stroke-width="2"/>
    <line x1="125" y1="280" x2="155" y2="280" stroke="#1976d2" stroke-width="2"/>
    <line x1="140" y1="294" x2="140" y2="300" stroke="#1976d2" stroke-width="2"/>
    <text x="120" y="275" font-size="10" fill="#333">+</text>
    <text x="155" y="275" font-size="10" fill="#333">-</text>
    <text x="110" y="255" font-size="13" fill="#1976d2">u_B</text>
    <!-- C相（右下） -->
    <circle cx="460" cy="280" r="20" fill="none" stroke="#e65100" stroke-width="2"/>
    <line x1="460" y1="260" x2="460" y2="266" stroke="#e65100" stroke-width="2"/>
    <line x1="445" y1="280" x2="475" y2="280" stroke="#e65100" stroke-width="2"/>
    <line x1="460" y1="294" x2="460" y2="300" stroke="#e65100" stroke-width="2"/>
    <text x="440" y="275" font-size="10" fill="#333">+</text>
    <text x="475" y="275" font-size="10" fill="#333">-</text>
    <text x="470" y="255" font-size="13" fill="#e65100">u_C</text>
    <!-- 三角形连接线 -->
    <!-- A到B -->
    <line x1="300" y1="120" x2="300" y2="160" stroke="#d32f2f" stroke-width="2"/>
    <line x1="300" y1="160" x2="140" y2="260" stroke="#d32f2f" stroke-width="2"/>
    <!-- B到C -->
    <line x1="140" y1="300" x2="140" y2="320" stroke="#1976d2" stroke-width="2"/>
    <line x1="140" y1="320" x2="460" y2="320" stroke="#1976d2" stroke-width="2"/>
    <line x1="460" y1="320" x2="460" y2="300" stroke="#e65100" stroke-width="2"/>
    <!-- C到A -->
    <line x1="460" y1="260" x2="460" y2="220" stroke="#e65100" stroke-width="2"/>
    <line x1="460" y1="220" x2="300" y2="120" stroke="#e65100" stroke-width="2"/>
    <!-- 出线 -->
    <line x1="300" y1="60" x2="300" y2="30" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="310" y="25" font-size="14" fill="#d32f2f" font-weight="bold">A</text>
    <line x1="120" y1="280" x2="80" y2="280" stroke="#1976d2" stroke-width="2.5"/>
    <text x="65" y="285" font-size="14" fill="#1976d2" font-weight="bold">B</text>
    <line x1="480" y1="280" x2="520" y2="280" stroke="#e65100" stroke-width="2.5"/>
    <text x="525" y="285" font-size="14" fill="#e65100" font-weight="bold">C</text>
    <!-- 公式 -->
    <text x="300" y="370" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Δ形连接: U_L = U_P</text>
    <text x="300" y="395" text-anchor="middle" font-size="13" fill="#666">Y形: U_L = √3·U_P, 线电压超前相电压30°</text>
  </g>
</svg>