<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" viewBox="0 0 780 640">
  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 13px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 11px; fill: #444; }
      .wire { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .dash { stroke: #8a8a8a; stroke-width: 1.2; fill: none; stroke-dasharray: 6 5; }
      .cell { fill: #eef2f7; stroke: #1f4e79; stroke-width: 1.5; }
      .sel { fill: #f7d7c4; stroke: #b35c1e; stroke-width: 1.5; }
      .dev { fill: #dce6f1; stroke: #333; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="640" fill="#ffffff"/>

  <!-- 位线与灵敏放大器 -->
  <text class="lbl" x="286" y="42">BL</text>
  <line class="wire" x1="300" y1="52" x2="300" y2="120"/>
  <rect class="dev" x="345" y="46" width="105" height="52" rx="3"/>
  <text class="small" x="397" y="68" text-anchor="middle">Sense Amp</text>
  <text class="small" x="397" y="84" text-anchor="middle">页锁存</text>
  <line class="wire" x1="300" y1="72" x2="345" y2="72"/>

  <!-- SSL -->
  <rect class="dev" x="270" y="120" width="60" height="36"/>
  <text class="lbl" x="300" y="143" text-anchor="middle">SSL</text>
  <line class="wire" x1="270" y1="138" x2="150" y2="138"/>
  <text class="small" x="120" y="143">SSL</text>

  <!-- 存储单元 -->
  <rect class="cell" x="270" y="190" width="60" height="44"/>
  <text class="lbl" x="300" y="217" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="212" x2="150" y2="212"/>
  <text class="small" x="112" y="217">WL0</text>

  <rect class="sel" x="270" y="260" width="60" height="44"/>
  <text class="lbl" x="300" y="287" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="282" x2="150" y2="282"/>
  <text class="small" x="112" y="287">WL1</text>

  <rect class="cell" x="270" y="330" width="60" height="44"/>
  <text class="lbl" x="300" y="357" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="352" x2="150" y2="352"/>
  <text class="small" x="112" y="357">WL2</text>

  <rect class="cell" x="270" y="400" width="60" height="44"/>
  <text class="lbl" x="300" y="427" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="422" x2="150" y2="422"/>
  <text class="small" x="112" y="427">WL3</text>

  <!-- GSL -->
  <rect class="dev" x="270" y="470" width="60" height="36"/>
  <text class="lbl" x="300" y="493" text-anchor="middle">GSL</text>
  <line class="wire" x1="270" y1="488" x2="150" y2="488"/>
  <text class="small" x="120" y="493">GSL</text>

  <!-- 串内垂直连接 -->
  <line class="wire" x1="300" y1="156" x2="300" y2="190"/>
  <line class="wire" x1="300" y1="234" x2="300" y2="260"/>
  <line class="wire" x1="300" y1="304" x2="300" y2="330"/>
  <line class="wire" x1="300" y1="374" x2="300" y2="400"/>
  <line class="wire" x1="300" y1="444" x2="300" y2="470"/>
  <line class="wire" x1="300" y1="506" x2="300" y2="545"/>

  <!-- 源线 -->
  <line class="wire" x1="250" y1="545" x2="560" y2="545"/>
  <text class="lbl" x="570" y="550">SL</text>

  <!-- 第二条串：示意同 Block 内共享 WL -->
  <line class="wire" x1="500" y1="90" x2="500" y2="120"/>
  <text class="small" x="490" y="82">BL</text>
  <line class="wire" x1="500" y1="120" x2="500" y2="545"/>
  <rect class="dev" x="470" y="120" width="60" height="36"/>
  <rect class="cell" x="470" y="190" width="60" height="44"/>
  <rect class="cell" x="470" y="260" width="60" height="44"/>
  <rect class="cell" x="470" y="330" width="60" height="44"/>
  <rect class="cell" x="470" y="400" width="60" height="44"/>
  <rect class="dev" x="470" y="470" width="60" height="36"/>
  <text class="small" x="500" y="143" text-anchor="middle">SSL</text>
  <text class="small" x="500" y="217" text-anchor="middle">FG cell</text>
  <text class="small" x="500" y="287" text-anchor="middle">FG cell</text>
  <text class="small" x="500" y="357" text-anchor="middle">FG cell</text>
  <text class="small" x="500" y="427" text-anchor="middle">FG cell</text>
  <text class="small" x="500" y="493" text-anchor="middle">GSL</text>

  <!-- 共享 WL 的虚线提示 -->
  <line class="dash" x1="330" y1="212" x2="470" y2="212"/>
  <line class="dash" x1="330" y1="282" x2="470" y2="282"/>
  <line class="dash" x1="330" y1="352" x2="470" y2="352"/>
  <line class="dash" x1="330" y1="422" x2="470" y2="422"/>
  <text class="small" x="400" y="590" text-anchor="middle">同一 Block 内的多条 NAND 串共享同一组 WL</text>

  <!-- Block 范围 -->
  <rect class="dash" x="240" y="170" width="320" height="350"/>
  <text class="small" x="400" y="625" text-anchor="middle">Block（擦除单位）</text>

  <!-- Page 注释 -->
  <line class="dash" x1="342" y1="252" x2="342" y2="312"/>
  <text class="small" x="350" y="248">Page：同一条 WL 上的单元</text>

  <!-- 电流方向 -->
  <line x1="330" y1="515" x2="330" y2="535" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#blueArrow)"/>
  <text class="small" x="338" y="532">读取电流</text>
</svg>
