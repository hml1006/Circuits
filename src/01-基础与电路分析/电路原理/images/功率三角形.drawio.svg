<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">功率三角形</text>
    <!-- 功率三角形 -->
    <polygon points="100,320 100,80 380,320" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="300" x2="120" y2="300" stroke="#000" stroke-width="1.5"/>
    <line x1="100" y1="300" x2="100" y2="280" stroke="#000" stroke-width="1.5"/>
    <text x="220" y="210" text-anchor="middle" font-size="16" fill="#d32f2f" font-weight="bold">S</text>
    <text x="60" y="200" text-anchor="middle" font-size="16" fill="#1976d2" font-weight="bold" transform="rotate(-90, 60, 200)">Q</text>
    <text x="240" y="345" text-anchor="middle" font-size="16" fill="#e65100" font-weight="bold">P</text>
    <path d="M 110 310 A 30 30 0 0 1 140 285" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="150" y="295" font-size="14" fill="#333">θ</text>
    <!-- 公式 -->
    <text x="300" y="120" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">复功率 S̃ = P + jQ = UI∠θ</text>
    <text x="300" y="150" text-anchor="middle" font-size="14" fill="#333">P = UI·cosθ (有功功率, W)</text>
    <text x="300" y="175" text-anchor="middle" font-size="14" fill="#333">Q = UI·sinθ (无功功率, var)</text>
    <text x="300" y="200" text-anchor="middle" font-size="14" fill="#333">S = UI = √(P² + Q²) (视在功率, VA)</text>
    <text x="300" y="230" text-anchor="middle" font-size="14" fill="#333">λ = cosθ = P/S (功率因数)</text>
    <!-- 补偿说明 -->
    <text x="300" y="275" text-anchor="middle" font-size="13" fill="#666">功率因数补偿: 并联电容C提高cosθ</text>
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#666">C = P/(ωU²)·(tanθ₁ - tanθ₂)</text>
  </g>
</svg>