<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">传输线端接方式对比</text>
    
    <!-- 1. Series Termination -->
    <text x="150" y="55" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">① 串联端接</text>
    
    <line x1="50" y1="80" x2="250" y2="80" stroke="#000" stroke-width="2"/>
    <rect x="100" y="70" width="30" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="115" y="84" text-anchor="middle" font-size="11" fill="#000">Rₛ</text>
    <rect x="250" y="65" width="40" height="30" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="270" y="84" text-anchor="middle" font-size="10" fill="#080">负载</text>
    <text x="150" y="105" text-anchor="middle" font-size="10" fill="#666">Rₛ+R_drv = Z₀</text>
    <text x="150" y="118" text-anchor="middle" font-size="10" fill="#666">低功耗，点对点</text>
    
    <!-- 2. Parallel Termination -->
    <text x="450" y="55" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">② 并联端接</text>
    
    <line x1="350" y1="80" x2="530" y2="80" stroke="#000" stroke-width="2"/>
    <rect x="530" y="65" width="40" height="30" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="550" y="84" text-anchor="middle" font-size="10" fill="#080">负载</text>
    <line x1="530" y1="80" x2="530" y2="110" stroke="#000" stroke-width="2"/>
    <rect x="515" y="110" width="30" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="530" y="124" text-anchor="middle" font-size="11" fill="#000">Rₚ</text>
    <line x1="530" y1="130" x2="530" y2="150" stroke="#000" stroke-width="2"/>
    <line x1="515" y1="150" x2="545" y2="150" stroke="#000" stroke-width="2"/>
    <text x="450" y="118" text-anchor="middle" font-size="10" fill="#666">Rₚ = Z₀</text>
    <text x="450" y="130" text-anchor="middle" font-size="10" fill="#666">功耗大，匹配好</text>
    
    <!-- 3. Thevenin Termination -->
    <text x="150" y="175" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">③ 戴维南端接</text>
    
    <line x1="50" y1="200" x2="230" y2="200" stroke="#000" stroke-width="2"/>
    <rect x="230" y="185" width="40" height="30" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="250" y="204" text-anchor="middle" font-size="10" fill="#080">负载</text>
    <line x1="230" y1="200" x2="230" y2="230" stroke="#000" stroke-width="2"/>
    <rect x="215" y="230" width="30" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="244" text-anchor="middle" font-size="11" fill="#000">R₁</text>
    <line x1="230" y1="250" x2="230" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="215" y1="260" x2="245" y2="260" stroke="#000" stroke-width="2"/>
    
    <line x1="230" y1="200" x2="230" y2="170" stroke="#000" stroke-width="2"/>
    <rect x="215" y="150" width="30" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="164" text-anchor="middle" font-size="11" fill="#000">R₂</text>
    <line x1="230" y1="150" x2="230" y2="140" stroke="#000" stroke-width="2"/>
    <text x="260" y="143" font-size="10" fill="#666">Vcc</text>
    
    <text x="150" y="230" text-anchor="middle" font-size="10" fill="#666">R₁∥R₂ = Z₀</text>
    <text x="150" y="245" text-anchor="middle" font-size="10" fill="#666">中等功耗，偏置</text>
    
    <!-- 4. AC Termination -->
    <text x="450" y="175" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">④ AC 端接</text>
    
    <line x1="350" y1="200" x2="530" y2="200" stroke="#000" stroke-width="2"/>
    <rect x="530" y="185" width="40" height="30" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="550" y="204" text-anchor="middle" font-size="10" fill="#080">负载</text>
    <line x1="530" y1="200" x2="530" y2="230" stroke="#000" stroke-width="2"/>
    <rect x="515" y="230" width="30" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="530" y="244" text-anchor="middle" font-size="11" fill="#000">R</text>
    <line x1="530" y1="250" x2="530" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="510" y1="260" x2="550" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="530" y1="260" x2="530" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="520" y1="280" x2="540" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="520" y1="290" x2="540" y2="290" stroke="#000" stroke-width="2"/>
    <text x="555" y="288" font-size="10" fill="#000">C</text>
    
    <text x="450" y="230" text-anchor="middle" font-size="10" fill="#666">R=Z₀, C ≫ t_pulse/R</text>
    <text x="450" y="245" text-anchor="middle" font-size="10" fill="#666">无直流功耗</text>
    
    <!-- Comparison table -->
    <text x="300" y="320" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">端接方案对比</text>
    
    <line x1="50" y1="330" x2="550" y2="330" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="350" x2="550" y2="350" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="370" x2="550" y2="370" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="390" x2="550" y2="390" stroke="#000" stroke-width="1"/>
    
    <text x="80" y="343" font-size="10" fill="#000" font-weight="bold">端接方式</text>
    <text x="180" y="343" font-size="10" fill="#000" font-weight="bold">功耗</text>
    <text x="260" y="343" font-size="10" fill="#000" font-weight="bold">元件数</text>
    <text x="340" y="343" font-size="10" fill="#000" font-weight="bold">信号质量</text>
    <text x="450" y="343" font-size="10" fill="#000" font-weight="bold">适用场景</text>
    
    <text x="80" y="363" font-size="10" fill="#000">串联</text>
    <text x="180" y="363" font-size="10" fill="#000">低</text>
    <text x="260" y="363" font-size="10" fill="#000">1</text>
    <text x="340" y="363" font-size="10" fill="#000">良好</text>
    <text x="450" y="363" font-size="10" fill="#000">点对点</text>
    
    <text x="80" y="383" font-size="10" fill="#000">并联</text>
    <text x="180" y="383" font-size="10" fill="#000">高</text>
    <text x="260" y="383" font-size="10" fill="#000">1</text>
    <text x="340" y="383" font-size="10" fill="#000">优秀</text>
    <text x="450" y="383" font-size="10" fill="#000">短距高速</text>
  </g>
</svg>