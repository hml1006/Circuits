<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">矢量网络分析仪（VNA）测量框图</text>
    
    <!-- RF Signal Source -->
    <rect x="30" y="60" width="100" height="50" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="5"/>
    <text x="80" y="85" text-anchor="middle" font-size="12" fill="#c00" font-weight="bold">RF信号源</text>
    <text x="80" y="100" text-anchor="middle" font-size="10" fill="#c00">可调频率</text>
    
    <!-- Arrow from source to splitter -->  
    <line x1="130" y1="85" x2="170" y2="85" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    
    <!-- Power Splitter -->
    <rect x="170" y="60" width="60" height="50" fill="#fff0d0" stroke="#c80" stroke-width="2" rx="5"/>
    <text x="200" y="88" text-anchor="middle" font-size="11" fill="#c80" font-weight="bold">功分器</text>
    
    <!-- Arrow to DUT (port 1) -->
    <line x1="230" y1="85" x2="290" y2="85" stroke="#000" stroke-width="2"/>
    
    <!-- Directional Coupler 1 -->
    <rect x="290" y="55" width="60" height="60" fill="#d0e0ff" stroke="#00c" stroke-width="2" rx="5"/>
    <text x="320" y="80" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">定向</text>
    <text x="320" y="95" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">耦合器1</text>
    
    <!-- Arrow from coupler 1 to DUT -->
    <line x1="350" y1="85" x2="400" y2="85" stroke="#000" stroke-width="2"/>
    
    <!-- DUT -->
    <rect x="400" y="55" width="80" height="60" fill="#e0ffe0" stroke="#080" stroke-width="2" rx="5"/>
    <text x="440" y="80" text-anchor="middle" font-size="12" fill="#080" font-weight="bold">DUT</text>
    <text x="440" y="97" text-anchor="middle" font-size="10" fill="#080">被测件</text>
    
    <!-- Arrow from DUT to coupler 2 -->
    <line x1="480" y1="85" x2="510" y2="85" stroke="#000" stroke-width="2"/>
    
    <!-- Directional Coupler 2 -->
    <rect x="510" y="55" width="60" height="60" fill="#d0e0ff" stroke="#00c" stroke-width="2" rx="5"/>
    <text x="540" y="80" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">定向</text>
    <text x="540" y="95" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">耦合器2</text>
    
    <!-- Arrow to matched load from port 2 -->
    <line x1="570" y1="85" x2="590" y2="85" stroke="#000" stroke-width="2"/>
    <text x="585" y="80" font-size="10" fill="#888">Z₀</text>
    
    <!-- Coupler 1 -> Receiver 1 (incident) -->
    <line x1="300" y1="115" x2="300" y2="160" stroke="#00c" stroke-width="1.5"/>
    <line x1="300" y1="160" x2="150" y2="160" stroke="#00c" stroke-width="1.5"/>
    <polygon points="150,160 158,156 158,164" fill="#00c"/>
    <text x="225" y="155" text-anchor="middle" font-size="10" fill="#00c">入射波</text>
    
    <!-- Coupler 1 -> Receiver 2 (reflected) -->
    <line x1="340" y1="115" x2="340" y2="180" stroke="#c00" stroke-width="1.5"/>
    <line x1="340" y1="180" x2="220" y2="180" stroke="#c00" stroke-width="1.5"/>
    <polygon points="220,180 228,176 228,184" fill="#c00"/>
    <text x="280" y="175" text-anchor="middle" font-size="10" fill="#c00">反射波</text>
    
    <!-- Coupler 2 -> Receiver 3 (transmitted) -->
    <line x1="520" y1="115" x2="520" y2="190" stroke="#080" stroke-width="1.5"/>
    <line x1="520" y1="190" x2="380" y2="190" stroke="#080" stroke-width="1.5"/>
    <polygon points="380,190 388,186 388,194" fill="#080"/>
    <text x="450" y="185" text-anchor="middle" font-size="10" fill="#080">传输波</text>
    
    <!-- Receiver block -->
    <rect x="60" y="145" width="80" height="60" fill="#f0d0ff" stroke="#808" stroke-width="2" rx="5"/>
    <text x="100" y="170" text-anchor="middle" font-size="11" fill="#808" font-weight="bold">接收机</text>
    <text x="100" y="190" text-anchor="middle" font-size="10" fill="#808">幅度/相位</text>
    
    <!-- Processor / Display -->
    <rect x="250" y="220" width="100" height="50" fill="#d0ffd0" stroke="#080" stroke-width="2" rx="5"/>
    <text x="300" y="245" text-anchor="middle" font-size="12" fill="#080" font-weight="bold">处理器</text>
    <text x="300" y="260" text-anchor="middle" font-size="10" fill="#080">显示 / 计算</text>
    
    <!-- Arrows from receivers to processor -->
    <line x1="100" y1="205" x2="100" y2="245" stroke="#000" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="100" y1="245" x2="250" y2="245" stroke="#000" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="250,245 242,241 242,249" fill="#000"/>
    
    <text x="300" y="310" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">校准方法</text>
    <text x="300" y="330" text-anchor="middle" font-size="11" fill="#666">SOLT 校准（短路-开路-负载-直通）</text>
    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">TRL 校准（直通-反射-传输线）</text>
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">电子校准（E-Cal）</text>
    
    <defs>
      <marker id="arrowBlack" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000"/>
      </marker>
    </defs>
  </g>
</svg>