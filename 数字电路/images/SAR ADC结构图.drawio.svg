<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">逐次逼近型 ADC（SAR ADC）结构</text>

    <!-- Vin 输入 -->
    <text x="50" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">V_in</text>
    <line x1="65" y1="125" x2="110" y2="125" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 比较器 -->
    <g transform="translate(120,85)">
      <polygon points="0,40 50,0 50,80" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
      <text x="15" y="45" text-anchor="middle" font-size="12" fill="#1565C0">+</text>
      <text x="40" y="25" text-anchor="middle" font-size="12" fill="#1565C0">-</text>
      <text x="55" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">比较器</text>
    </g>

    <!-- V_DAC 输入到比较器负端 -->
    <path d="M 170 165 L 170 200 L 80 200 L 80 165" fill="none" stroke="#E65100" stroke-width="1.5"/>
    <line x1="80" y1="160" x2="80" y2="145" stroke="#E65100" stroke-width="1.5"/>
    <text x="55" y="195" text-anchor="middle" font-size="11" fill="#E65100">V_DAC</text>

    <!-- 比较器输出 → SAR -->
    <line x1="170" y1="125" x2="230" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- SAR 控制逻辑 -->
    <rect x="235" y="95" width="120" height="60" rx="6" ry="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="295" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">SAR 控制逻辑</text>
    <text x="295" y="138" text-anchor="middle" font-size="11" fill="#2E7D32">N 位逐次逼近</text>

    <!-- 时钟输入到 SAR -->
    <line x1="295" y1="155" x2="295" y2="190" stroke="#999" stroke-width="1.5"/>
    <text x="305" y="185" font-size="11" fill="#999">CLK</text>

    <!-- SAR → DAC -->
    <line x1="235" y1="125" x2="200" y2="125" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="125" x2="200" y2="200" stroke="#333" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="230" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- DAC -->
    <rect x="235" y="175" width="120" height="50" rx="6" ry="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="295" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">N 位 DAC</text>
    <text x="295" y="215" text-anchor="middle" font-size="11" fill="#E65100">R-2R 梯形网络</text>

    <!-- SAR → 数字输出 -->
    <line x1="355" y1="125" x2="420" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 数字输出寄存器 -->
    <rect x="425" y="100" width="100" height="50" rx="6" ry="6" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
    <text x="475" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A1B9A">输出寄存器</text>

    <!-- 数字输出 -->
    <line x1="525" y1="125" x2="560" y2="125" stroke="#6A1B9A" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="565" y="130" font-size="14" font-weight="bold" fill="#6A1B9A">D_out</text>
    <text x="565" y="145" font-size="11" fill="#6A1B9A">N bit</text>

    <!-- 工作原理说明 -->
    <rect x="80" y="260" width="440" height="120" rx="8" ry="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
    <text x="300" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">二分法逐次逼近过程（N=4 示例）</text>

    <!-- 逐次逼近过程表 -->
    <text x="120" y="305" font-size="11" fill="#333">Bit 3 (MSB)：DAC = 1000 = 8/16 V_ref</text>
    <text x="120" y="322" font-size="11" fill="#333">Bit 2：      DAC = 1100 = 12/16 V_ref</text>
    <text x="120" y="339" font-size="11" fill="#333">Bit 1：      DAC = 1010 = 10/16 V_ref</text>
    <text x="120" y="356" font-size="11" fill="#333">Bit 0 (LSB)：DAC = 1011 = 11/16 V_ref</text>

    <text x="380" y="305" font-size="11" fill="#666">（假设 V_in ≈ 11/16 V_ref）</text>
    <text x="380" y="322" font-size="11" fill="#666">转换时间 T = n × T_clk</text>
    <text x="380" y="339" font-size="11" font-weight="bold" fill="#1565C0">→ 数字输出 1011</text>
  </g>
</svg>