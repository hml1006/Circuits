<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">正弦交流电波形图</text>
    
    <!-- 坐标轴 -->
    <line x1="50" y1="200" x2="580" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="50" y1="200" x2="50" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 轴标签 -->
    <text x="580" y="220" text-anchor="end" font-size="14" fill="#333" font-style="italic">ωt</text>
    <text x="35" y="40" text-anchor="middle" font-size="14" fill="#333">e/u/i</text>
    
    <!-- 正弦波 -->
    <path d="M 50,200 Q 70,200 80,200 Q 95,100 110,50 Q 130,10 140,50 Q 155,100 170,200 Q 185,300 200,350 Q 215,390 230,350 Q 245,300 260,200 Q 275,100 290,50 Q 305,10 320,50 Q 335,100 350,200 Q 365,300 380,350 Q 395,390 410,350 Q 425,300 440,200 Q 455,100 470,50 Q 485,10 500,50 Q 515,100 530,200 Q 540,200 560,200" fill="none" stroke="#d32f2f" stroke-width="3"/>
    
    <!-- 最大值标注 -->
    <line x1="50" y1="50" x2="110" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="45" y="55" text-anchor="end" font-size="12" fill="#d32f2f">E<tspan font-size="9" dy="3">m</tspan></tspan>
    
    <line x1="50" y1="350" x2="200" y2="350" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="45" y="355" text-anchor="end" font-size="12" fill="#d32f2f">−E<tspan font-size="9" dy="3">m</tspan></tspan>
    
    <!-- 周期标注 -->
    <line x1="110" y1="40" x2="110" y2="360" stroke="#1976d2" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="350" y1="40" x2="350" y2="360" stroke="#1976d2" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="110" y1="230" x2="350" y2="230" stroke="#1976d2" stroke-width="1.5"/>
    <polygon points="110,225 110,235 100,230" fill="#1976d2"/>
    <polygon points="350,225 350,235 360,230" fill="#1976d2"/>
    <text x="230" y="245" text-anchor="middle" font-size="13" fill="#1976d2">T = 2π/ω</text>
    
    <!-- 角度标注 -->
    <text x="170" y="185" text-anchor="middle" font-size="11" fill="#666">π/2</text>
    <text x="260" y="185" text-anchor="middle" font-size="11" fill="#666">π</text>
    <text x="350" y="185" text-anchor="middle" font-size="11" fill="#666">3π/2</text>
    <text x="440" y="185" text-anchor="middle" font-size="11" fill="#666">2π</text>
    
    <!-- 原点 -->
    <text x="50" y="185" text-anchor="end" font-size="11" fill="#666">0</text>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">e = E<tspan font-size="10" dy="3">m</tspan><tspan dy="-3"> sin ωt, u = U<tspan font-size="10" dy="3">m</tspan><tspan dy="-3"> sin ωt, i = I<tspan font-size="10" dy="3">m</tspan><tspan dy="-3"> sin ωt</tspan></tspan></tspan></tspan></tspan></text>
    <text x="300" y="365" text-anchor="middle" font-size="12" fill="#666">有效值 E = E<tspan font-size="9" dy="3">m</tspan><tspan dy="-3">/√2</tspan></tspan></text>
  </g>
</svg>