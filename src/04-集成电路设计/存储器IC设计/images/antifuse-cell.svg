<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <defs>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .metal { fill: #c9d6e5; stroke: #333; stroke-width: 1.2; }
      .oxide { fill: #f6e3a1; stroke: #8a6d1a; stroke-width: 1.1; }
      .fil { stroke: #c0392b; stroke-width: 3; fill: none; }
      .wire { stroke: #333; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>

  <text class="title" x="380" y="30" text-anchor="middle">反熔丝（anti-fuse）单元</text>

  <!-- 编程前 -->
  <text class="lbl" x="210" y="66" text-anchor="middle">编程前：高阻</text>
  <rect class="metal" x="100" y="85" width="220" height="36"/>
  <text class="lbl" x="210" y="108" text-anchor="middle">金属</text>
  <rect class="oxide" x="100" y="121" width="220" height="56"/>
  <text class="lbl" x="210" y="154" text-anchor="middle">绝缘层（未击穿）</text>
  <rect class="metal" x="100" y="177" width="220" height="36"/>
  <text class="lbl" x="210" y="200" text-anchor="middle">金属</text>

  <text class="small" x="60" y="88">+</text>
  <text class="small" x="60" y="210">−</text>
  <text class="small" x="70" y="250">编程电压 Vpp &gt; 10 V</text>
  <text class="small" x="210" y="295" text-anchor="middle">氧化层完整，单元几乎不导电，读为 0</text>

  <!-- 编程后 -->
  <text class="lbl" x="550" y="66" text-anchor="middle">编程后：低阻</text>
  <rect class="metal" x="440" y="85" width="220" height="36"/>
  <text class="lbl" x="550" y="108" text-anchor="middle">金属</text>
  <rect class="oxide" x="440" y="121" width="220" height="56"/>
  <text class="small" x="670" y="154">击穿通道</text>
  <line class="wire" x1="662" y1="154" x2="640" y2="154"/>
  <rect class="metal" x="440" y="177" width="220" height="36"/>
  <text class="lbl" x="550" y="200" text-anchor="middle">金属</text>

  <path class="fil" d="M520,121 L535,136 L515,150 L540,162 L520,177"/>
  <circle cx="520" cy="121" r="3" fill="#c0392b"/>
  <circle cx="520" cy="177" r="3" fill="#c0392b"/>

  <text class="small" x="420" y="250">击穿后形成导电通路</text>
  <text class="small" x="550" y="295" text-anchor="middle">电阻显著降低，读为 1；一次性、不可恢复</text>

  <text class="small" x="380" y="338" text-anchor="middle">反熔丝初始为高阻，编程时用高压击穿薄氧化层；eFuse 则相反，初始低阻、编程后熔断变高阻</text>
</svg>
