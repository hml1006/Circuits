<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">眼图示例</text>
    
    <!-- Eye diagram -->
    <!-- Grid -->
    <line x1="80" y1="80" x2="80" y2="320" stroke="#ddd" stroke-width="1"/>
    <line x1="80" y1="320" x2="520" y2="320" stroke="#ddd" stroke-width="1"/>
    <line x1="80" y1="200" x2="520" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="300" y1="80" x2="300" y2="320" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Eye opening (the "eye" shape) -->
    <!-- Upper eye contour -->
    <path d="M 80 200 
             C 100 200, 120 100, 150 90 
             C 180 80, 200 80, 220 90 
             C 240 100, 260 120, 280 140 
             C 290 150, 295 155, 300 160 
             C 305 155, 310 150, 320 140 
             C 340 120, 360 100, 380 90 
             C 400 80, 420 80, 450 90 
             C 480 100, 500 200, 520 200" fill="none" stroke="#080" stroke-width="2"/>
    
    <!-- Lower eye contour -->
    <path d="M 80 200 
             C 100 200, 120 300, 150 310 
             C 180 320, 200 320, 220 310 
             C 240 300, 260 280, 280 260 
             C 290 250, 295 245, 300 240 
             C 305 245, 310 250, 320 260 
             C 340 280, 360 300, 380 310 
             C 400 320, 420 320, 450 310 
             C 480 300, 500 200, 520 200" fill="none" stroke="#080" stroke-width="2"/>
    
    <!-- Overlay traces (multiple bit periods) -->
    <path d="M 80 200 C 90 200, 100 120, 130 100 C 160 85, 190 85, 220 100 C 240 110, 260 130, 280 150 C 290 160, 300 170, 300 170" fill="none" stroke="#0c0" stroke-width="1" opacity="0.3"/>
    <path d="M 80 200 C 90 200, 100 280, 130 300 C 160 315, 190 315, 220 300 C 240 290, 260 270, 280 250 C 290 240, 300 230, 300 230" fill="none" stroke="#0c0" stroke-width="1" opacity="0.3"/>
    <path d="M 300 170 C 310 160, 320 150, 340 130 C 360 110, 380 100, 410 95 C 430 90, 450 95, 480 105 C 500 115, 510 200, 520 200" fill="none" stroke="#0c0" stroke-width="1" opacity="0.3"/>
    <path d="M 300 230 C 310 240, 320 250, 340 270 C 360 290, 380 300, 410 305 C 430 310, 450 305, 480 295 C 500 285, 510 200, 520 200" fill="none" stroke="#0c0" stroke-width="1" opacity="0.3"/>
    
    <!-- Jitter -->
    <path d="M 80 200 C 95 200, 105 120, 135 100 C 165 85, 195 85, 225 100 C 245 110, 265 130, 285 150" fill="none" stroke="#c80" stroke-width="1" opacity="0.4"/>
    <path d="M 80 200 C 95 200, 105 280, 135 300 C 165 315, 195 315, 225 300 C 245 290, 265 270, 285 250" fill="none" stroke="#c80" stroke-width="1" opacity="0.4"/>
    
    <!-- Eye height annotation -->
    <line x1="280" y1="90" x2="280" y2="310" stroke="#c00" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="280,90 276,98 284,98" fill="#c00"/>
    <polygon points="280,310 276,302 284,302" fill="#c00"/>
    <text x="270" y="205" font-size="11" fill="#c00" text-anchor="end" font-weight="bold">眼高</text>
    
    <!-- Eye width annotation -->
    <line x1="130" y1="320" x2="470" y2="320" stroke="#c00" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="130,320 138,316 138,324" fill="#c00"/>
    <polygon points="470,320 462,316 462,324" fill="#c00"/>
    <text x="300" y="335" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">眼宽</text>
    
    <!-- Key parameters table -->
    <text x="300" y="370" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">眼图关键参数</text>
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">眼高：噪声容限 | 眼宽：时序容限 | 交叉点：抖动 | 上升/下降时间：带宽</text>
  </g>
</svg>