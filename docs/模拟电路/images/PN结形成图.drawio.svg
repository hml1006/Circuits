<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">PN结形成示意图</text>

    <!-- P区 -->
    <rect x="30" y="60" width="220" height="280" fill="#ffcccc" stroke="#cc3333" stroke-width="2" rx="5"/>
    <text x="140" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#cc3333">P 区</text>
    <text x="140" y="110" text-anchor="middle" font-size="12" fill="#cc3333">（空穴多子）</text>
    <!-- P区空穴（+） -->
    <circle cx="70" cy="140" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="70" y="144" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="130" cy="160" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="130" y="164" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="90" cy="190" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="90" y="194" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="160" cy="140" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="160" y="144" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="150" cy="210" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="150" y="214" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="80" cy="260" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="80" y="264" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="180" cy="180" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="180" y="184" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <circle cx="120" cy="300" r="10" fill="#ff8888" stroke="#cc3333" stroke-width="1.5"/>
    <text x="120" y="304" text-anchor="middle" font-size="10" fill="#fff">+</text>

    <!-- N区 -->
    <rect x="350" y="60" width="220" height="280" fill="#ccddff" stroke="#3366cc" stroke-width="2" rx="5"/>
    <text x="460" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#3366cc">N 区</text>
    <text x="460" y="110" text-anchor="middle" font-size="12" fill="#3366cc">（电子多子）</text>
    <!-- N区电子（-） -->
    <circle cx="380" cy="140" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="380" y="144" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="440" cy="160" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="440" y="164" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="400" cy="190" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="400" y="194" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="470" cy="140" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="470" y="144" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="460" cy="210" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="460" y="214" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="390" cy="260" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="390" y="264" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="490" cy="180" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="490" y="184" text-anchor="middle" font-size="10" fill="#fff">−</text>
    <circle cx="430" cy="300" r="10" fill="#6688dd" stroke="#3366cc" stroke-width="1.5"/>
    <text x="430" y="304" text-anchor="middle" font-size="10" fill="#fff">−</text>

    <!-- 耗尽层（空间电荷区） -->
    <rect x="250" y="60" width="100" height="280" fill="#eeeebb" stroke="#999933" stroke-width="2" rx="3" stroke-dasharray="6,3"/>
    <text x="300" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#999933">耗尽层</text>
    <!-- 耗尽层内离子 -->
    <circle cx="265" cy="130" r="7" fill="#ff8888" stroke="#cc3333" stroke-width="1"/>
    <text x="265" y="134" text-anchor="middle" font-size="8" fill="#fff">+</text>
    <circle cx="335" cy="130" r="7" fill="#6688dd" stroke="#3366cc" stroke-width="1"/>
    <text x="335" y="134" text-anchor="middle" font-size="8" fill="#fff">−</text>
    <circle cx="275" cy="180" r="7" fill="#ff8888" stroke="#cc3333" stroke-width="1"/>
    <text x="275" y="184" text-anchor="middle" font-size="8" fill="#fff">+</text>
    <circle cx="325" cy="180" r="7" fill="#6688dd" stroke="#3366cc" stroke-width="1"/>
    <text x="325" y="184" text-anchor="middle" font-size="8" fill="#fff">−</text>
    <circle cx="270" cy="240" r="7" fill="#ff8888" stroke="#cc3333" stroke-width="1"/>
    <text x="270" y="244" text-anchor="middle" font-size="8" fill="#fff">+</text>
    <circle cx="330" cy="240" r="7" fill="#6688dd" stroke="#3366cc" stroke-width="1"/>
    <text x="330" y="244" text-anchor="middle" font-size="8" fill="#fff">−</text>
    <circle cx="280" cy="300" r="7" fill="#ff8888" stroke="#cc3333" stroke-width="1"/>
    <text x="280" y="304" text-anchor="middle" font-size="8" fill="#fff">+</text>
    <circle cx="320" cy="300" r="7" fill="#6688dd" stroke="#3366cc" stroke-width="1"/>
    <text x="320" y="304" text-anchor="middle" font-size="8" fill="#fff">−</text>

    <!-- 内建电场箭头 -->
    <line x1="280" y1="370" x2="320" y2="370" stroke="#cc3333" stroke-width="2" marker-end="url(#arrowRed)"/>
    <defs>
      <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#cc3333"/>
      </marker>
    </defs>
    <text x="300" y="365" text-anchor="middle" font-size="11" fill="#cc3333">内建电场 E</text>

    <!-- 标注 -->
    <text x="300" y="200" text-anchor="middle" font-size="10" fill="#666">空间电荷区</text>
    <text x="300" y="212" text-anchor="middle" font-size="10" fill="#666">（不可移动离子）</text>
  </g>
</svg>