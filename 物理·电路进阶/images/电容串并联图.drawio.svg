<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">电容器的串并联</text>
    
    <!-- 左侧：串联 -->
    <text x="150" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">串联</text>
    
    <line x1="150" y1="80" x2="150" y2="110" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C1 -->
    <line x1="130" y1="110" x2="170" y2="110" stroke="#333" stroke-width="2.5"/>
    <line x1="130" y1="150" x2="170" y2="150" stroke="#333" stroke-width="2.5"/>
    <line x1="150" y1="110" x2="150" y2="150" stroke="#333" stroke-width="2.5"/>
    <text x="150" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">C₁</text>
    
    <line x1="150" y1="150" x2="150" y2="180" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C2 -->
    <line x1="130" y1="180" x2="170" y2="180" stroke="#333" stroke-width="2.5"/>
    <line x1="130" y1="220" x2="170" y2="220" stroke="#333" stroke-width="2.5"/>
    <line x1="150" y1="180" x2="150" y2="220" stroke="#333" stroke-width="2.5"/>
    <text x="150" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">C₂</text>
    
    <line x1="150" y1="220" x2="150" y2="250" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C3 -->
    <line x1="130" y1="250" x2="170" y2="250" stroke="#333" stroke-width="2.5"/>
    <line x1="130" y1="290" x2="170" y2="290" stroke="#333" stroke-width="2.5"/>
    <line x1="150" y1="250" x2="150" y2="290" stroke="#333" stroke-width="2.5"/>
    <text x="150" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">C₃</text>
    
    <line x1="150" y1="290" x2="150" y2="320" stroke="#333" stroke-width="2.5"/>
    
    <!-- 串联公式 -->
    <text x="150" y="350" text-anchor="middle" font-size="13" fill="#333">1/C<tspan font-size="9" dy="3">总</tspan><tspan dy="-3"> = 1/C₁ + 1/C₂ + 1/C₃</tspan></tspan></text>
    
    <!-- 右侧：并联 -->
    <text x="450" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">并联</text>
    
    <!-- 顶部导线 -->
    <line x1="350" y1="100" x2="550" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C1 -->
    <line x1="370" y1="100" x2="370" y2="130" stroke="#333" stroke-width="2.5"/>
    <line x1="360" y1="130" x2="380" y2="130" stroke="#333" stroke-width="2.5"/>
    <line x1="360" y1="170" x2="380" y2="170" stroke="#333" stroke-width="2.5"/>
    <line x1="370" y1="130" x2="370" y2="170" stroke="#333" stroke-width="2.5"/>
    <text x="370" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">C₁</text>
    <line x1="370" y1="170" x2="370" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C2 -->
    <line x1="430" y1="100" x2="430" y2="130" stroke="#333" stroke-width="2.5"/>
    <line x1="420" y1="130" x2="440" y2="130" stroke="#333" stroke-width="2.5"/>
    <line x1="420" y1="170" x2="440" y2="170" stroke="#333" stroke-width="2.5"/>
    <line x1="430" y1="130" x2="430" y2="170" stroke="#333" stroke-width="2.5"/>
    <text x="430" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">C₂</text>
    <line x1="430" y1="170" x2="430" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C3 -->
    <line x1="490" y1="100" x2="490" y2="130" stroke="#333" stroke-width="2.5"/>
    <line x1="480" y1="130" x2="500" y2="130" stroke="#333" stroke-width="2.5"/>
    <line x1="480" y1="170" x2="500" y2="170" stroke="#333" stroke-width="2.5"/>
    <line x1="490" y1="130" x2="490" y2="170" stroke="#333" stroke-width="2.5"/>
    <text x="490" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">C₃</text>
    <line x1="490" y1="170" x2="490" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 底部导线 -->
    <line x1="350" y1="200" x2="550" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 并联公式 -->
    <text x="450" y="350" text-anchor="middle" font-size="13" fill="#333">C<tspan font-size="9" dy="3">总</tspan><tspan dy="-3"> = C₁ + C₂ + C₃</tspan></tspan></text>
  </g>
</svg>