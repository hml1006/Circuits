<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">卡诺图示例（三变量）</text>
    <!-- 三变量卡诺图 -->
    <text x="300" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">Y = f(A, B, C)</text>
    <!-- 行标签 -->
    <text x="75" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">A\BC</text>
    <text x="145" y="85" text-anchor="middle" font-size="12" fill="#000">00</text>
    <text x="215" y="85" text-anchor="middle" font-size="12" fill="#000">01</text>
    <text x="285" y="85" text-anchor="middle" font-size="12" fill="#000">11</text>
    <text x="355" y="85" text-anchor="middle" font-size="12" fill="#000">10</text>
    <text x="60" y="120" text-anchor="end" font-size="12" fill="#000">0</text>
    <text x="60" y="160" text-anchor="end" font-size="12" fill="#000">1</text>
    <!-- 三变量卡诺图网格 -->
    <rect x="80" y="95" width="300" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="125" x2="380" y2="125" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="95" x2="120" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="95" x2="190" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="95" x2="260" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="330" y1="95" x2="330" y2="175" stroke="#000" stroke-width="1.5"/>
    <!-- 单元格值 (m0~m7) -->
    <text x="100" y="118" text-anchor="middle" font-size="12" fill="#000">m₀</text>
    <text x="155" y="118" text-anchor="middle" font-size="12" fill="#000">m₁</text>
    <text x="225" y="118" text-anchor="middle" font-size="12" fill="#000">m₃</text>
    <text x="295" y="118" text-anchor="middle" font-size="12" fill="#000">m₂</text>
    <text x="100" y="158" text-anchor="middle" font-size="12" fill="#000">m₄</text>
    <text x="155" y="158" text-anchor="middle" font-size="12" fill="#000">m₅</text>
    <text x="225" y="158" text-anchor="middle" font-size="12" fill="#000">m₇</text>
    <text x="295" y="158" text-anchor="middle" font-size="12" fill="#000">m₆</text>
    <!-- 填入值示例 -->
    <text x="100" y="138" text-anchor="middle" font-size="14" fill="#00a">0</text>
    <text x="155" y="138" text-anchor="middle" font-size="14" fill="#00a">1</text>
    <text x="225" y="138" text-anchor="middle" font-size="14" fill="#00a">1</text>
    <text x="295" y="138" text-anchor="middle" font-size="14" fill="#00a">0</text>
    <text x="100" y="168" text-anchor="middle" font-size="14" fill="#00a">1</text>
    <text x="155" y="168" text-anchor="middle" font-size="14" fill="#00a">0</text>
    <text x="225" y="168" text-anchor="middle" font-size="14" fill="#00a">1</text>
    <text x="295" y="168" text-anchor="middle" font-size="14" fill="#00a">0</text>
    <!-- 圈选示例 -->
    <ellipse cx="190" cy="130" rx="35" ry="18" fill="none" stroke="#d00" stroke-width="2" stroke-dasharray="4"/>
    <ellipse cx="210" cy="155" rx="55" ry="18" fill="none" stroke="#0a0" stroke-width="2" stroke-dasharray="4"/>
    <!-- 化简结果 -->
    <rect x="80" y="195" width="300" height="55" rx="6" fill="#f0fff0" stroke="#0a0" stroke-width="1.5"/>
    <text x="230" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">化简结果</text>
    <text x="230" y="240" text-anchor="middle" font-size="14" fill="#000">Y = A·C + B·C</text>
    <!-- 四变量卡诺图 -->
    <text x="300" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">四变量卡诺图</text>
    <text x="300" y="298" text-anchor="middle" font-size="12" fill="#555">Y = f(A, B, C, D)</text>
    <!-- 行标签 -->
    <text x="75" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">AB\CD</text>
    <text x="135" y="318" text-anchor="middle" font-size="11" fill="#000">00</text>
    <text x="190" y="318" text-anchor="middle" font-size="11" fill="#000">01</text>
    <text x="245" y="318" text-anchor="middle" font-size="11" fill="#000">11</text>
    <text x="300" y="318" text-anchor="middle" font-size="11" fill="#000">10</text>
    <text x="55" y="340" text-anchor="end" font-size="11" fill="#000">00</text>
    <text x="55" y="360" text-anchor="end" font-size="11" fill="#000">01</text>
    <text x="55" y="380" text-anchor="end" font-size="11" fill="#000">11</text>
    <text x="55" y="400" text-anchor="end" font-size="11" fill="#000">10</text>
    <!-- 四变量卡诺图网格 -->
    <rect x="70" y="325" width="280" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="325" x2="110" y2="405" stroke="#000" stroke-width="1"/>
    <line x1="165" y1="325" x2="165" y2="405" stroke="#000" stroke-width="1"/>
    <line x1="220" y1="325" x2="220" y2="405" stroke="#000" stroke-width="1"/>
    <line x1="275" y1="325" x2="275" y2="405" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="345" x2="350" y2="345" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="365" x2="350" y2="365" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="385" x2="350" y2="385" stroke="#000" stroke-width="1"/>
    <!-- 填入值 -->
    <text x="90" y="340" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <text x="137" y="340" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="192" y="340" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="247" y="340" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <text x="90" y="360" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="137" y="360" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <text x="192" y="360" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <text x="247" y="360" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="90" y="380" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="137" y="380" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="192" y="380" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <text x="247" y="380" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="90" y="400" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <text x="137" y="400" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="192" y="400" text-anchor="middle" font-size="11" fill="#00a">0</text>
    <text x="247" y="400" text-anchor="middle" font-size="11" fill="#00a">1</text>
    <!-- 说明 -->
    <text x="440" y="340" text-anchor="start" font-size="12" fill="#555">相邻特性：</text>
    <text x="440" y="358" text-anchor="start" font-size="11" fill="#555">• 上下相邻</text>
    <text x="440" y="375" text-anchor="start" font-size="11" fill="#555">• 左右相邻</text>
    <text x="440" y="392" text-anchor="start" font-size="11" fill="#555">• 循环相邻</text>
    <text x="440" y="410" text-anchor="start" font-size="11" fill="#555">• 仅一位不同</text>
  </g>
</svg>