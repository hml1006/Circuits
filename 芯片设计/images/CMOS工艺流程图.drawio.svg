<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CMOS工艺流程图</text>
    <!-- Row 1: 4 steps -->
    <rect x="15" y="50" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="75" y="75" text-anchor="middle" font-size="12" fill="#333">硅晶圆制备</text>
    <text x="75" y="90" text-anchor="middle" font-size="10" fill="#666">Wafer Preparation</text>
    <line x1="135" y1="75" x2="165" y2="75" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="170" y="50" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="230" y="75" text-anchor="middle" font-size="12" fill="#333">氧化工艺</text>
    <text x="230" y="90" text-anchor="middle" font-size="10" fill="#666">Oxidation</text>
    <line x1="290" y1="75" x2="320" y2="75" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="325" y="50" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="385" y="75" text-anchor="middle" font-size="12" fill="#333">光刻工艺</text>
    <text x="385" y="90" text-anchor="middle" font-size="10" fill="#666">Lithography</text>
    <line x1="445" y1="75" x2="475" y2="75" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="50" width="110" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="535" y="75" text-anchor="middle" font-size="12" fill="#333">刻蚀工艺</text>
    <text x="535" y="90" text-anchor="middle" font-size="10" fill="#666">Etching</text>
    <!-- Vertical arrow down -->
    <line x1="535" y1="100" x2="535" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Row 2: 3 steps -->
    <rect x="15" y="135" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="75" y="160" text-anchor="middle" font-size="12" fill="#333">掺杂工艺</text>
    <text x="75" y="175" text-anchor="middle" font-size="10" fill="#666">Doping</text>
    <line x1="135" y1="160" x2="165" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="170" y="135" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="230" y="160" text-anchor="middle" font-size="12" fill="#333">薄膜沉积</text>
    <text x="230" y="175" text-anchor="middle" font-size="10" fill="#666">Thin Film Dep.</text>
    <line x1="290" y1="160" x2="320" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="325" y="135" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="385" y="160" text-anchor="middle" font-size="12" fill="#333">CMP平坦化</text>
    <text x="385" y="175" text-anchor="middle" font-size="10" fill="#666">CMP</text>
    <line x1="445" y1="160" x2="475" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="135" width="110" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="535" y="160" text-anchor="middle" font-size="12" fill="#333">金属化</text>
    <text x="535" y="175" text-anchor="middle" font-size="10" fill="#666">Metallization</text>
    <!-- Vertical arrow down -->
    <line x1="535" y1="185" x2="535" y2="215" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Row 3 -->
    <rect x="170" y="220" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="230" y="245" text-anchor="middle" font-size="12" fill="#333">晶圆测试</text>
    <text x="230" y="260" text-anchor="middle" font-size="10" fill="#666">Wafer Test</text>
    <line x1="290" y1="245" x2="320" y2="245" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="325" y="220" width="120" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="385" y="245" text-anchor="middle" font-size="12" fill="#333">封装</text>
    <text x="385" y="260" text-anchor="middle" font-size="10" fill="#666">Packaging</text>
    <line x1="445" y1="245" x2="475" y2="245" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="220" width="110" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
    <text x="535" y="245" text-anchor="middle" font-size="12" fill="#333">终测</text>
    <text x="535" y="260" text-anchor="middle" font-size="10" fill="#666">Final Test</text>
    <!-- Key process parameters -->
    <rect x="15" y="310" width="570" height="80" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="300" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">关键工艺参数</text>
    <text x="30" y="350" font-size="11" fill="#555">氧化: 800-1200°C | 光刻: 193nm ArF / 13.5nm EUV | 刻蚀选择比 &gt; 20:1</text>
    <text x="30" y="370" font-size="11" fill="#555">掺杂: 离子注入 1-200keV | CMP: Preston方程 RR = Kp·P·V</text>
  </g>
</svg>