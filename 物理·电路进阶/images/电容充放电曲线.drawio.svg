<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">RC 电路充放电曲线</text>
    
    <!-- 坐标轴 -->
    <line x1="80" y1="330" x2="560" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80" y1="330" x2="80" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 轴标签 -->
    <text x="560" y="350" text-anchor="end" font-size="14" fill="#333" font-style="italic">t</text>
    <text x="60" y="40" text-anchor="middle" font-size="14" fill="#333">u/i</text>
    
    <!-- 充电曲线 u_C(t) = E(1 - e^(-t/RC)) -->
    <path d="M 80,320 Q 120,320 160,280 Q 200,220 240,140 Q 260,100 280,70 Q 290,55 300,48 Q 320,38 340,35 Q 380,33 420,32 Q 500,32 540,32" fill="none" stroke="#d32f2f" stroke-width="3"/>
    
    <!-- 充电曲线标注 -->
    <text x="280" y="55" text-anchor="middle" font-size="12" fill="#d32f2f">充电 u<tspan font-size="9" dy="3">C</tspan><tspan dy="-3">(t)</tspan></tspan></text>
    
    <!-- 放电曲线 u_C(t) = U_0 e^(-t/RC) -->
    <path d="M 80,32 Q 120,32 160,35 Q 200,42 240,60 Q 260,75 280,100 Q 300,130 320,160 Q 360,220 400,270 Q 440,300 480,315 Q 520,325 540,328" fill="none" stroke="#1976d2" stroke-width="3"/>
    
    <!-- 放电曲线标注 -->
    <text x="340" y="150" text-anchor="middle" font-size="12" fill="#1976d2">放电 u<tspan font-size="9" dy="3">C</tspan><tspan dy="-3">(t)</tspan></tspan></text>
    
    <!-- 电流曲线 i(t) = (E/R)e^(-t/RC) -->
    <path d="M 80,30 Q 120,30 160,40 Q 200,65 240,110 Q 260,130 280,155 Q 300,175 320,200 Q 360,240 400,270 Q 440,295 480,310 Q 520,322 540,328" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,3"/>
    
    <!-- 电流曲线标注 -->
    <text x="380" y="240" text-anchor="middle" font-size="12" fill="#2e7d32">i(t)</text>
    
    <!-- 时间常数 τ 标注 -->
    <line x1="80" y1="330" x2="200" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- τ = RC 点 -->
    <circle cx="200" cy="220" r="4" fill="#d32f2f"/>
    <line x1="200" y1="220" x2="200" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="200" y="345" text-anchor="middle" font-size="12" fill="#666">τ = RC</text>
    
    <!-- 0.632E 标注 -->
    <line x1="80" y1="140" x2="195" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="145" text-anchor="end" font-size="11" fill="#666">0.632E</text>
    
    <!-- E 标注 -->
    <line x1="80" y1="32" x2="75" y2="32" stroke="#999" stroke-width="1"/>
    <text x="75" y="37" text-anchor="end" font-size="11" fill="#666">E</text>
    
    <!-- 图例 -->
    <rect x="420" y="50" width="120" height="80" rx="5" ry="5" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
    <line x1="425" y1="65" x2="445" y2="65" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="450" y="69" font-size="10" fill="#333">充电u<tspan font-size="8" dy="3">C</tspan></tspan>
    <line x1="425" y1="80" x2="445" y2="80" stroke="#1976d2" stroke-width="2.5"/>
    <text x="450" y="84" font-size="10" fill="#333">放电u<tspan font-size="8" dy="3">C</tspan></tspan>
    <line x1="425" y1="95" x2="445" y2="95" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="450" y="99" font-size="10" fill="#333">电流i</text>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="13" fill="#333">充电: u<tspan font-size="9" dy="3">C</tspan><tspan dy="-3">(t)=E(1−e<tspan font-size="9" dy="-3">-t/RC</tspan><tspan dy="3">)</tspan></tspan></tspan></text>
    <text x="300" y="370" text-anchor="middle" font-size="13" fill="#333">放电: u<tspan font-size="9" dy="3">C</tspan><tspan dy="-3">(t)=U<tspan font-size="9" dy="3">0</tspan><tspan dy="-3">e<tspan font-size="9" dy="-3">-t/RC</tspan></tspan></tspan></tspan></tspan></text>
  </g>
</svg>