<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">反射与振铃波形图</text>
    
    <!-- Top: Ideal signal -->
    <text x="60" y="55" font-size="12" fill="#000" font-weight="bold">理想信号（无反射）</text>
    
    <line x1="50" y1="80" x2="550" y2="80" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="55" x2="50" y2="105" stroke="#000" stroke-width="1"/>
    
    <line x1="50" y1="80" x2="100" y2="80" stroke="#00c" stroke-width="2.5"/>
    <line x1="100" y1="80" x2="100" y2="40" stroke="#00c" stroke-width="2.5"/>
    <line x1="100" y1="40" x2="550" y2="40" stroke="#00c" stroke-width="2.5"/>
    
    <text x="300" y="110" text-anchor="middle" font-size="11" fill="#00c">干净、陡峭的上升沿，无过冲</text>
    
    <!-- Middle: Signal with reflection -->
    <text x="60" y="140" font-size="12" fill="#000" font-weight="bold">反射信号（过冲/振铃）</text>
    
    <line x1="50" y1="165" x2="550" y2="165" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="140" x2="50" y2="190" stroke="#000" stroke-width="1"/>
    
    <!-- Rising edge with overshoot -->
    <line x1="50" y1="165" x2="100" y2="165" stroke="#c00" stroke-width="2.5"/>
    <line x1="100" y1="165" x2="100" y2="40" stroke="#c00" stroke-width="2.5"/>
    <!-- Overshoot -->
    <path d="M 100 40 C 110 25, 120 25, 130 40 C 140 50, 145 45, 155 55 C 165 60, 170 55, 180 65 C 190 68, 195 63, 205 70 C 215 73, 220 68, 230 73 C 240 75, 250 70, 300 70 C 350 70, 400 70, 550 70" fill="none" stroke="#c00" stroke-width="2.5"/>
    
    <!-- Ringing damping -->
    <path d="M 100 40 C 110 20, 120 30, 130 45 C 140 55, 150 50, 160 60 C 170 65, 180 60, 190 67 C 200 70, 210 67, 220 70 C 230 72, 240 70, 250 70" fill="none" stroke="#c00" stroke-width="2.5"/>
    
    <!-- Undershoot -->
    <path d="M 0 0 C 0 0, 0 0, 0 0" fill="none" stroke="#c00" stroke-width="2.5"/>
    
    <text x="300" y="195" text-anchor="middle" font-size="11" fill="#c00">过冲 → 振铃（阻尼振荡）→ 稳定值</text>
    
    <!-- Bottom: Transmission line reflection diagram -->
    <text x="60" y="230" font-size="12" fill="#000" font-weight="bold">反射原理</text>
    
    <!-- Source -->
    <rect x="50" y="250" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="3"/>
    <text x="80" y="275" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">源端</text>
    
    <!-- Transmission line -->
    <line x1="110" y1="270" x2="480" y2="270" stroke="#000" stroke-width="2.5"/>
    
    <!-- Load -->
    <rect x="480" y="250" width="60" height="40" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="510" y="275" text-anchor="middle" font-size="11" fill="#080" font-weight="bold">负载</text>
    
    <!-- Impedance mismatch labels -->
    <text x="200" y="260" font-size="11" fill="#000">Z₀</text>
    <text x="440" y="260" font-size="11" fill="#000">Z₀ ≠ Z_L</text>
    
    <!-- Reflection coefficient -->
    <text x="300" y="320" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">反射系数</text>
    <text x="300" y="340" text-anchor="middle" font-size="12" fill="#000">Γ = (Z₂ - Z₁) / (Z₂ + Z₁)</text>
    
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">常见反射源：阻抗不匹配 | 走线宽度变化 | 过孔 | 连接器 | 分支（Stub）</text>
    
    <!-- Ringing annotation -->
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">振铃频率 f_ring = 1/(2 · t_pd · l)</text>
  </g>
</svg>