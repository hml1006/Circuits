<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">电容三点式LC振荡器（Colpitts）</text>

    <!-- 晶体管 Q -->
    <line x1="300" y1="80" x2="300" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="120" x2="300" y2="160" stroke="#333" stroke-width="2"/>
    <polygon points="300,160 310,150 310,170" fill="#333"/>
    <line x1="300" y1="120" x2="250" y2="100" stroke="#333" stroke-width="2"/>
    <text x="315" y="125" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="315" y="140" font-size="10" fill="#666">(NPN)</text>

    <!-- 基极偏置 R1 -->
    <line x1="250" y1="100" x2="220" y2="100" stroke="#333" stroke-width="2"/>
    <rect x="180" y="80" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="190" y="105" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="198" y="105" text-anchor="middle" font-size="9" fill="#666">1</text>
    <line x1="180" y1="100" x2="140" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="100" x2="140" y2="60" stroke="#333" stroke-width="2"/>
    <text x="140" y="55" text-anchor="middle" font-size="11" fill="#666">+V</text>
    <text x="148" y="55" text-anchor="middle" font-size="9" fill="#666">CC</text>

    <!-- 基极偏置 R2 -->
    <line x1="250" y1="100" x2="250" y2="160" stroke="#333" stroke-width="2"/>
    <rect x="230" y="160" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="240" y="185" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="248" y="185" text-anchor="middle" font-size="9" fill="#666">2</text>
    <line x1="230" y1="180" x2="200" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="180" x2="200" y2="360" stroke="#333" stroke-width="2"/>

    <!-- 发射极电阻 Re -->
    <line x1="300" y1="160" x2="300" y2="200" stroke="#333" stroke-width="2"/>
    <rect x="290" y="200" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="300" y="225" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="308" y="225" text-anchor="middle" font-size="9" fill="#666">e</text>
    <line x1="290" y1="220" x2="260" y2="220" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="220" x2="260" y2="360" stroke="#333" stroke-width="2"/>

    <!-- 发射极旁路电容 Ce -->
    <line x1="300" y1="240" x2="300" y2="260" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="260" x2="310" y2="260" stroke="#333" stroke-width="3"/>
    <line x1="290" y1="280" x2="310" y2="280" stroke="#333" stroke-width="3"/>
    <line x1="300" y1="280" x2="300" y2="300" stroke="#333" stroke-width="2"/>
    <text x="320" y="275" font-size="11" fill="#333">C</text>
    <text x="328" y="275" font-size="9" fill="#666">e</text>

    <!-- 集电极负载 Rc / 扼流圈 -->
    <line x1="300" y1="80" x2="300" y2="50" stroke="#333" stroke-width="2"/>
    <rect x="290" y="50" width="20" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="300" y="70" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="308" y="70" text-anchor="middle" font-size="9" fill="#666">c</text>

    <!-- LC谐振回路 -->
    <line x1="300" y1="50" x2="380" y2="50" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="50" x2="380" y2="100" stroke="#333" stroke-width="2"/>

    <!-- L -->
    <path d="M 380 100 Q 395 110 380 120 Q 365 130 380 140 Q 395 150 380 160" fill="none" stroke="#333" stroke-width="2"/>
    <text x="395" y="155" font-size="11" fill="#333">L</text>

    <!-- C1 -->
    <line x1="380" y1="160" x2="380" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="180" x2="390" y2="180" stroke="#333" stroke-width="3"/>
    <line x1="370" y1="200" x2="390" y2="200" stroke="#333" stroke-width="3"/>
    <text x="400" y="195" font-size="11" fill="#333">C</text>
    <text x="408" y="195" font-size="9" fill="#666">1</text>
    <line x1="380" y1="200" x2="380" y2="260" stroke="#333" stroke-width="2"/>

    <!-- C2 -->
    <line x1="380" y1="260" x2="380" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="280" x2="390" y2="280" stroke="#333" stroke-width="3"/>
    <line x1="370" y1="300" x2="390" y2="300" stroke="#333" stroke-width="3"/>
    <text x="400" y="295" font-size="11" fill="#333">C</text>
    <text x="408" y="295" font-size="9" fill="#666">2</text>
    <line x1="380" y1="300" x2="380" y2="360" stroke="#333" stroke-width="2"/>

    <!-- 地线 -->
    <line x1="200" y1="360" x2="380" y2="360" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="360" x2="200" y2="365" stroke="#333" stroke-width="2"/>
    <line x1="240" y1="360" x2="240" y2="365" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="360" x2="260" y2="365" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="360" x2="380" y2="365" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="365" x2="380" y2="365" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="380" y1="50" x2="440" y2="50" stroke="#333" stroke-width="2"/>
    <text x="450" y="55" font-size="13" fill="#333">v</text>
    <text x="450" y="65" font-size="10" fill="#333">o</text>

    <!-- 耦合电容 Cc -->
    <line x1="380" y1="50" x2="380" y2="40" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="40" x2="390" y2="40" stroke="#333" stroke-width="3"/>
    <line x1="370" y1="30" x2="390" y2="30" stroke="#333" stroke-width="3"/>
    <line x1="380" y1="30" x2="380" y2="20" stroke="#333" stroke-width="2"/>
    <text x="400" y="38" font-size="11" fill="#333">C</text>
    <text x="408" y="38" font-size="9" fill="#666">c</text>

    <!-- 公式 -->
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#666">f</text>
    <text x="310" y="390" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="320" y="390" text-anchor="middle" font-size="12" fill="#666"> = 1/(2π√(L·C1·C2/(C1+C2)))</text>
  </g>
</svg>