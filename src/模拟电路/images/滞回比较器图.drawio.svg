<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">滞回比较器（施密特触发器）</text>

    <!-- 运放 -->
    <polygon points="260,100 260,260 380,180" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <text x="310" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>

    <!-- - 输入端 -->
    <line x1="260" y1="130" x2="200" y2="130" stroke="#333" stroke-width="2"/>
    <text x="245" y="135" text-anchor="end" font-size="12" fill="#333">−</text>
    <!-- + 输入端 -->
    <line x1="260" y1="230" x2="200" y2="230" stroke="#333" stroke-width="2"/>
    <text x="245" y="235" text-anchor="end" font-size="12" fill="#333">+</text>
    <!-- 输出 -->
    <line x1="380" y1="180" x2="440" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arO)"/>
    <text x="450" y="185" font-size="12" fill="#333">v</text>
    <text x="460" y="185" font-size="11" fill="#666">o</text>

    <!-- 输入信号 -->
    <text x="80" y="175" font-size="12" fill="#333">v</text>
    <text x="90" y="175" font-size="11" fill="#666">i</text>
    <line x1="100" y1="180" x2="200" y2="180" stroke="#333" stroke-width="2"/>

    <!-- R1 -->
    <rect x="200" y="80" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="208" y="100" text-anchor="middle" font-size="10" fill="#333">R</text>
    <text x="208" y="110" text-anchor="middle" font-size="8" fill="#666">1</text>
    <line x1="200" y1="130" x2="200" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="216" y1="80" x2="380" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="80" x2="380" y2="170" stroke="#333" stroke-width="2"/>

    <!-- Rf 正反馈 -->
    <rect x="200" y="250" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="208" y="270" text-anchor="middle" font-size="10" fill="#333">R</text>
    <text x="208" y="280" text-anchor="middle" font-size="8" fill="#666">f</text>
    <line x1="200" y1="230" x2="200" y2="250" stroke="#333" stroke-width="2"/>
    <line x1="216" y1="265" x2="380" y2="265" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="265" x2="380" y2="200" stroke="#333" stroke-width="2"/>

    <!-- 接地 -->
    <line x1="200" y1="230" x2="160" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="230" x2="160" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="300" x2="200" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="300" x2="160" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="310" x2="170" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="155" y1="315" x2="165" y2="315" stroke="#333" stroke-width="2"/>

    <defs>
      <marker id="arO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
    </defs>

    <!-- 传输特性 -->
    <text x="80" y="360" font-size="10" fill="#666">传输特性：</text>
    <line x1="140" y1="350" x2="220" y2="350" stroke="#333" stroke-width="1.5"/>
    <line x1="180" y1="350" x2="180" y2="340" stroke="#333" stroke-width="1.5"/>
    <line x1="220" y1="350" x2="220" y2="340" stroke="#333" stroke-width="1.5"/>
    <text x="180" y="338" text-anchor="middle" font-size="8" fill="#666">V</text>
    <text x="186" y="338" text-anchor="middle" font-size="8" fill="#666">TH</text>
    <text x="220" y="338" text-anchor="middle" font-size="8" fill="#666">V</text>
    <text x="226" y="338" text-anchor="middle" font-size="8" fill="#666">TL</text>
    <path d="M 140 350 L 180 350 L 180 340 L 220 340 L 220 350 L 260 350" fill="none" stroke="#cc3333" stroke-width="2"/>
    <text x="270" y="355" font-size="9" fill="#666">v</text>
    <text x="276" y="355" font-size="9" fill="#666">i</text>
    <text x="140" y="365" text-anchor="middle" font-size="8" fill="#666">V</text>
    <text x="146" y="365" text-anchor="middle" font-size="8" fill="#666">OL</text>
    <text x="260" y="365" text-anchor="middle" font-size="8" fill="#666">V</text>
    <text x="266" y="365" text-anchor="middle" font-size="8" fill="#666">OH</text>
  </g>
</svg>