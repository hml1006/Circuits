<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">OCL 互补对称功率放大电路</text>

    <!-- +VCC -->
    <line x1="280" y1="60" x2="280" y2="80" stroke="#333" stroke-width="2"/>
    <text x="270" y="55" text-anchor="end" font-size="14" font-weight="bold" fill="#cc3333">+V</text>
    <text x="285" y="55" text-anchor="start" font-size="11" fill="#cc3333">CC</text>

    <!-- NPN Q1 -->
    <line x1="280" y1="80" x2="280" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="120" x2="280" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="120" x2="250" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="160" x2="310" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="160" x2="290" y2="150" stroke="#333" stroke-width="2"/>
    <polygon points="280,160 290,150 290,170" fill="#333"/>
    <text x="295" y="125" font-size="12" font-weight="bold" fill="#333">Q1</text>
    <text x="295" y="165" font-size="10" fill="#666">(NPN)</text>

    <!-- PNP Q2 -->
    <line x1="280" y1="160" x2="280" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="200" x2="280" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="200" x2="250" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="240" x2="310" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="240" x2="290" y2="250" stroke="#333" stroke-width="2"/>
    <polygon points="280,240 290,230 290,250" fill="#333"/>
    <text x="295" y="205" font-size="12" font-weight="bold" fill="#333">Q2</text>
    <text x="295" y="245" font-size="10" fill="#666">(PNP)</text>

    <!-- -VCC -->
    <line x1="280" y1="240" x2="280" y2="300" stroke="#333" stroke-width="2"/>
    <text x="270" y="305" text-anchor="end" font-size="14" font-weight="bold" fill="#3366cc">−V</text>
    <text x="285" y="305" text-anchor="start" font-size="11" fill="#3366cc">CC</text>

    <!-- 输入 -->
    <line x1="250" y1="120" x2="200" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="200" x2="200" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="120" x2="200" y2="200" stroke="#333" stroke-width="2"/>
    <text x="140" y="150" font-size="12" fill="#333">v</text>
    <text x="150" y="150" font-size="11" fill="#666">i</text>
    <line x1="120" y1="160" x2="160" y2="160" stroke="#333" stroke-width="2"/>
    <rect x="160" y="145" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="168" y="165" text-anchor="middle" font-size="10" fill="#333">C</text>
    <line x1="176" y1="160" x2="200" y2="160" stroke="#333" stroke-width="2"/>

    <!-- 负载 -->
    <line x1="310" y1="160" x2="350" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="240" x2="350" y2="240" stroke="#333" stroke-width="2"/>
    <rect x="350" y="145" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="358" y="165" text-anchor="middle" font-size="10" fill="#333">R</text>
    <text x="358" y="175" text-anchor="middle" font-size="8" fill="#666">L</text>
    <line x1="366" y1="160" x2="400" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="175" x2="350" y2="240" stroke="#333" stroke-width="2"/>

    <!-- 标注 -->
    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">P</text>
    <text x="308" y="350" text-anchor="middle" font-size="11" fill="#666">om</text>
    <text x="325" y="350" text-anchor="middle" font-size="11" fill="#666"> = V</text>
    <text x="340" y="350" text-anchor="middle" font-size="11" fill="#666">CC</text>
    <text x="355" y="350" text-anchor="middle" font-size="11" fill="#666">² / (2R</text>
    <text x="378" y="350" text-anchor="middle" font-size="11" fill="#666">L</text>
    <text x="385" y="350" text-anchor="middle" font-size="11" fill="#666">)</text>

    <!-- 交越失真标注 -->
    <text x="80" y="340" font-size="9" fill="#cc3333">交越失真：</text>
    <text x="80" y="352" font-size="9" fill="#cc3333">需加AB类偏置</text>
  </g>
</svg>