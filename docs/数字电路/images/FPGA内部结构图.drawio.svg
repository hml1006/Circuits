    <line x1="275" y1="230" x2="295" y2="230" stroke="#aaa" stroke-width="0.5" stroke-dasharray="2"/>
    <!-- 说明 -->
    <rect x="30" y="370" width="540" height="25" rx="3" fill="#f0f8ff" stroke="#000" stroke-width="1"/>
    <text x="300" y="387" text-anchor="middle" font-size="10" fill="#555">CLB = 可配置逻辑块 | LUT = 查找表 | FF = 触发器 | BRAM = 块 RAM | DSP = 数字信号处理 | CMT = 时钟管理</text>
