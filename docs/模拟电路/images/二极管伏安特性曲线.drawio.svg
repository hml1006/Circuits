<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">二极管伏安特性曲线</text>
    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowV)"/>
    <text x="565" y="355" font-size="14" fill="#333" font-style="italic">V</text>
    <line x1="300" y1="350" x2="300" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrowI)"/>
    <text x="310" y="30" font-size="14" fill="#333" font-style="italic">I</text>
    <defs>
      <marker id="arrowV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#333"/>
      </marker>
      <marker id="arrowI" markerWidth="8" markerHeight="6" refX="3" refY="0" orient="auto">
        <polygon points="0 6, 3 0, 6 6" fill="#333"/>
      </marker>
    </defs>
    <text x="55" y="355" font-size="11" fill="#666">O</text>
    <!-- 正向特性 -->
    <path d="M 300 350 Q 310 350 320 345 Q 335 330 345 300 Q 355 250 365 180 Q 375 100 385 40" fill="none" stroke="#3366cc" stroke-width="2.5"/>
    <!-- 反向特性 -->
    <line x1="60" y1="348" x2="290" y2="348" stroke="#3366cc" stroke-width="2.5"/>
    <line x1="60" y1="348" x2="40" y2="290" stroke="#3366cc" stroke-width="2.5" stroke-dasharray="4,3"/>
    <!-- 标注 -->
    <text x="50" y="280" font-size="10" fill="#3366cc">击穿</text>
    <!-- 死区电压标注 -->
    <line x1="300" y1="355" x2="300" y2="370" stroke="#999" stroke-width="1"/>
    <line x1="330" y1="355" x2="330" y2="370" stroke="#999" stroke-width="1"/>
    <text x="315" y="382" text-anchor="middle" font-size="10" fill="#666">Vth(死区)</text>
    <!-- 导通压降标注 -->
    <line x1="300" y1="355" x2="300" y2="375" stroke="#999" stroke-width="1"/>
    <line x1="350" y1="355" x2="350" y2="375" stroke="#999" stroke-width="1"/>
    <text x="325" y="390" text-anchor="middle" font-size="10" fill="#666">VON≈0.7V</text>
    <!-- 温度影响 -->
    <path d="M 300 350 Q 310 350 320 345 Q 335 330 345 300 Q 352 260 362 190" fill="none" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="365" y="220" font-size="10" fill="#cc3333">T↑</text>
    <!-- 区域标注 -->
    <text x="410" y="320" font-size="12" fill="#3366cc">正向导通区</text>
    <text x="130" y="360" font-size="12" fill="#3366cc">反向截止区</text>
    <!-- 二极管符号在右下 -->
    <text x="480" y="100" font-size="12" fill="#666">二极管符号：</text>
    <polygon points="480,115 510,130 480,145" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="510" y1="115" x2="510" y2="145" stroke="#333" stroke-width="2"/>
    <line x1="470" y1="130" x2="480" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="510" y1="130" x2="530" y2="130" stroke="#333" stroke-width="2"/>
    <text x="455" y="128" text-anchor="end" font-size="10" fill="#666">A</text>
    <text x="535" y="128" text-anchor="start" font-size="10" fill="#666">K</text>
  </g>
</svg>