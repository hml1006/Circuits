<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">电容滤波波形图</text>

    <!-- 输入波形（未滤波） -->
    <text x="60" y="60" font-size="13" fill="#666">输入波形（整流后）</text>
    <line x1="60" y1="100" x2="540" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="150" x2="60" y2="70" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M 60 150 Q 95 70 130 150 Q 165 70 200 150 Q 235 70 270 150 Q 305 70 340 150 Q 375 70 410 150 Q 445 70 480 150 Q 515 70 540 100" fill="none" stroke="#cc3333" stroke-width="2"/>
    <text x="550" y="105" font-size="11" fill="#666">t</text>

    <!-- 输出波形（滤波后） -->
    <text x="60" y="210" font-size="13" fill="#666">输出波形（电容滤波后）</text>
    <line x1="60" y1="250" x2="540" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="300" x2="60" y2="220" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- 充放电波形 -->
    <path d="M 60 280 Q 80 240 120 245 Q 160 248 200 242 Q 240 245 280 240 Q 320 243 360 238 Q 400 242 440 237 Q 480 240 520 235 Q 540 240 540 250" fill="none" stroke="#3366cc" stroke-width="2.5"/>
    <text x="550" y="255" font-size="11" fill="#666">t</text>

    <!-- 标注充放电 -->
    <text x="110" y="235" font-size="10" fill="#3366cc">充电</text>
    <text x="170" y="260" font-size="10" fill="#cc3333">放电</text>
    <text x="230" y="235" font-size="10" fill="#3366cc">充电</text>
    <text x="290" y="260" font-size="10" fill="#cc3333">放电</text>
    <text x="350" y="235" font-size="10" fill="#3366cc">充电</text>

    <!-- 纹波标注 -->
    <line x1="120" y1="245" x2="120" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="200" y1="242" x2="200" y2="280" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="160" y="295" text-anchor="middle" font-size="10" fill="#666">纹波 ΔV</text>
    <line x1="120" y1="290" x2="200" y2="290" stroke="#666" stroke-width="1" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
    <defs>
      <marker id="arrowR" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
        <polygon points="0 0, 6 2, 0 4" fill="#666"/>
      </marker>
      <marker id="arrowL" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
        <polygon points="6 0, 0 2, 6 4" fill="#666"/>
      </marker>
    </defs>

    <!-- 电路示意 -->
    <text x="60" y="340" font-size="12" fill="#666">电路：</text>
    <text x="60" y="358" font-size="11" fill="#666">整流输出</text>
    <line x1="130" y1="345" x2="180" y2="345" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="330" x2="180" y2="360" stroke="#333" stroke-width="2"/>
    <!-- 电容符号 -->
    <line x1="180" y1="330" x2="200" y2="330" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="360" x2="200" y2="360" stroke="#333" stroke-width="2"/>
    <text x="190" y="325" text-anchor="middle" font-size="10" fill="#333">C</text>
    <line x1="200" y1="345" x2="250" y2="345" stroke="#333" stroke-width="2"/>
    <!-- 负载 -->
    <rect x="250" y="330" width="20" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="260" y="350" text-anchor="middle" font-size="10" fill="#333">R</text>
    <text x="260" y="360" text-anchor="middle" font-size="8" fill="#666">L</text>
    <line x1="270" y1="345" x2="310" y2="345" stroke="#333" stroke-width="2"/>
    <text x="320" y="350" font-size="11" fill="#666">→ 输出</text>
  </g>
</svg>