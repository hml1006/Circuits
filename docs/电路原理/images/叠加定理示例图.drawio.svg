<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">叠加定理示例图</text>
    <!-- 原电路 -->
    <text x="300" y="60" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">原电路</text>
    <!-- 电压源 -->
    <circle cx="80" cy="120" r="18" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="102" x2="80" y2="108" stroke="#000" stroke-width="2"/>
    <line x1="68" y1="120" x2="92" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="132" x2="80" y2="138" stroke="#000" stroke-width="2"/>
    <text x="60" y="115" font-size="10" fill="#333">+</text>
    <text x="95" y="115" font-size="10" fill="#333">-</text>
    <text x="45" y="100" font-size="12" fill="#d32f2f">U₁</text>
    <line x1="98" y1="120" x2="130" y2="120" stroke="#000" stroke-width="2"/>
    <!-- 电阻R1 -->
    <rect x="130" y="110" width="25" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="155" y1="120" x2="210" y2="120" stroke="#000" stroke-width="2"/>
    <text x="140" y="105" font-size="12" fill="#333">R₁</text>
    <!-- 电阻R2 -->
    <rect x="210" y="110" width="25" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="235" y1="120" x2="290" y2="120" stroke="#000" stroke-width="2"/>
    <text x="220" y="105" font-size="12" fill="#333">R₂</text>
    <!-- 电流源 -->
    <line x1="290" y1="120" x2="310" y2="120" stroke="#000" stroke-width="2"/>
    <circle cx="330" cy="120" r="18" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="330" y1="108" x2="330" y2="120" stroke="#000" stroke-width="2"/>
    <polygon points="330,120 326,128 334,128" fill="#000"/>
    <line x1="330" y1="138" x2="330" y2="145" stroke="#000" stroke-width="2"/>
    <text x="350" y="115" font-size="12" fill="#d32f2f">I₁</text>
    <line x1="348" y1="120" x2="370" y2="120" stroke="#000" stroke-width="2"/>
    <!-- 底部 -->
    <line x1="80" y1="180" x2="370" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="138" x2="80" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="370" y1="120" x2="370" y2="180" stroke="#000" stroke-width="2"/>

    <!-- 分电路1 -->
    <text x="300" y="225" text-anchor="middle" font-size="15" fill="#1976d2" font-weight="bold">= 分电路1（U₁单独作用，电流源开路）</text>
    <circle cx="80" cy="270" r="18" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="252" x2="80" y2="258" stroke="#000" stroke-width="2"/>
    <line x1="68" y1="270" x2="92" y2="270" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="282" x2="80" y2="288" stroke="#000" stroke-width="2"/>
    <text x="60" y="265" font-size="10" fill="#333">+</text>
    <text x="95" y="265" font-size="10" fill="#333">-</text>
    <text x="45" y="250" font-size="12" fill="#d32f2f">U₁</text>
    <line x1="98" y1="270" x2="130" y2="270" stroke="#000" stroke-width="2"/>
    <rect x="130" y="260" width="25" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="155" y1="270" x2="210" y2="270" stroke="#000" stroke-width="2"/>
    <text x="140" y="255" font-size="12" fill="#333">R₁</text>
    <rect x="210" y="260" width="25" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="235" y1="270" x2="370" y2="270" stroke="#000" stroke-width="2"/>
    <text x="220" y="255" font-size="12" fill="#333">R₂</text>
    <line x1="80" y1="330" x2="370" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="288" x2="80" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="370" y1="270" x2="370" y2="330" stroke="#000" stroke-width="2"/>
    <text x="300" y="355" text-anchor="middle" font-size="13" fill="#1976d2">i₁' = U₁/(R₁+R₂)</text>

    <!-- 分电路2 -->
    <text x="300" y="395" text-anchor="middle" font-size="15" fill="#e65100" font-weight="bold">+ 分电路2（I₁单独作用，电压源短路）</text>
    <!-- 由于空间限制，这里只画公式 -->
  </g>
</svg>