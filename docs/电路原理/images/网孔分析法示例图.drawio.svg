<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">网孔分析法示例图</text>
    <!-- 电路：两个网孔的电路 -->
    <!-- 顶部左侧：电压源 -->
    <circle cx="100" cy="100" r="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="80" x2="100" y2="85" stroke="#000" stroke-width="2"/>
    <line x1="90" y1="100" x2="110" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="115" x2="100" y2="120" stroke="#000" stroke-width="2"/>
    <text x="80" y="95" font-size="12" fill="#333">+</text>
    <text x="115" y="95" font-size="12" fill="#333">-</text>
    <text x="60" y="75" font-size="14" fill="#d32f2f">U₁</text>
    <!-- 顶部水平线 -->
    <line x1="120" y1="100" x2="250" y2="100" stroke="#000" stroke-width="2"/>
    <!-- 顶部电阻R1 -->
    <rect x="250" y="90" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="280" y1="100" x2="350" y2="100" stroke="#000" stroke-width="2"/>
    <text x="265" y="80" font-size="14" fill="#333">R₁</text>
    <!-- 顶部右侧电阻R2 -->
    <rect x="350" y="90" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="100" x2="500" y2="100" stroke="#000" stroke-width="2"/>
    <text x="365" y="80" font-size="14" fill="#333">R₂</text>
    <!-- 右侧竖线 -->
    <line x1="500" y1="100" x2="500" y2="300" stroke="#000" stroke-width="2"/>
    <!-- 底部水平线 -->
    <line x1="100" y1="300" x2="500" y2="300" stroke="#000" stroke-width="2"/>
    <!-- 左侧竖线 -->
    <line x1="100" y1="120" x2="100" y2="300" stroke="#000" stroke-width="2"/>
    <!-- 中间竖线电阻R3 -->
    <line x1="300" y1="100" x2="300" y2="130" stroke="#000" stroke-width="2"/>
    <rect x="285" y="130" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="300" y1="170" x2="300" y2="230" stroke="#000" stroke-width="2"/>
    <rect x="285" y="230" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="300" y1="270" x2="300" y2="300" stroke="#000" stroke-width="2"/>
    <text x="315" y="200" font-size="14" fill="#333">R₃</text>
    <!-- 底部电阻R4 -->
    <rect x="180" y="290" width="30" height="20" fill="none" stroke="#000" stroke-width="2" transform="rotate(0, 195, 300)"/>
    <text x="130" y="290" font-size="14" fill="#333">R₄</text>
    <line x1="100" y1="300" x2="180" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="210" y1="300" x2="285" y2="300" stroke="#000" stroke-width="2"/>
    <!-- 底部右侧电阻R5 -->
    <rect x="380" y="290" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <text x="395" y="285" font-size="14" fill="#333">R₅</text>
    <line x1="330" y1="300" x2="380" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="300" x2="500" y2="300" stroke="#000" stroke-width="2"/>
    <!-- 网孔电流箭头 -->
    <!-- 网孔1（左） -->
    <path d="M 150 120 Q 100 120 100 180 Q 100 280 150 280" fill="none" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="150,120 146,130 156,128" fill="#1976d2"/>
    <text x="80" y="210" font-size="14" fill="#1976d2">i₁</text>
    <!-- 网孔2（右） -->
    <path d="M 450 120 Q 500 120 500 180 Q 500 280 450 280" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="450,120 454,130 444,128" fill="#e65100"/>
    <text x="510" y="210" font-size="14" fill="#e65100">i₂</text>
    <!-- 网孔方程 -->
    <text x="300" y="360" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">网孔方程: (R₁+R₃+R₄)i₁ - R₃i₂ = U₁</text>
    <text x="300" y="380" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">-R₃i₁ + (R₂+R₃+R₅)i₂ = 0</text>
  </g>
</svg>