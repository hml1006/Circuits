<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">四种反馈组态</text>

    <!-- 电压串联 -->
    <text x="30" y="65" font-size="12" font-weight="bold" fill="#333">(a) 电压串联负反馈</text>
    <rect x="30" y="75" width="100" height="50" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2" rx="3"/>
    <text x="80" y="100" text-anchor="middle" font-size="10" fill="#4a90d9">A</text>
    <rect x="30" y="135" width="100" height="40" fill="#ffe0b0" stroke="#e8913a" stroke-width="2" rx="3"/>
    <text x="80" y="158" text-anchor="middle" font-size="10" fill="#e8913a">F</text>
    <line x1="130" y1="100" x2="160" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arSm)"/>
    <text x="165" y="105" font-size="10" fill="#666">V</text>
    <text x="172" y="105" font-size="10" fill="#666">o</text>
    <line x1="80" y1="125" x2="80" y2="135" stroke="#e8913a" stroke-width="1.5" marker-end="url(#arSmO)"/>
    <line x1="30" y1="155" x2="10" y2="155" stroke="#e8913a" stroke-width="1.5"/>
    <line x1="10" y1="155" x2="10" y2="85" stroke="#e8913a" stroke-width="1.5" marker-end="url(#arSmO)"/>
    <text x="5" y="120" text-anchor="end" font-size="8" fill="#e8913a">V</text>
    <text x="12" y="120" text-anchor="end" font-size="8" fill="#e8913a">f</text>

    <!-- 电压并联 -->
    <text x="320" y="65" font-size="12" font-weight="bold" fill="#333">(b) 电压并联负反馈</text>
    <rect x="320" y="75" width="100" height="50" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2" rx="3"/>
    <text x="370" y="100" text-anchor="middle" font-size="10" fill="#4a90d9">A</text>
    <rect x="320" y="135" width="100" height="40" fill="#ffe0b0" stroke="#e8913a" stroke-width="2" rx="3"/>
    <text x="370" y="158" text-anchor="middle" font-size="10" fill="#e8913a">F</text>
    <line x1="420" y1="100" x2="450" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arSm)"/>
    <text x="455" y="105" font-size="10" fill="#666">V</text>
    <text x="462" y="105" font-size="10" fill="#666">o</text>
    <line x1="370" y1="125" x2="370" y2="135" stroke="#e8913a" stroke-width="1.5" marker-end="url(#arSmO)"/>
    <line x1="320" y1="155" x2="300" y2="155" stroke="#e8913a" stroke-width="1.5"/>
    <line x1="300" y1="155" x2="300" y2="85" stroke="#e8913a" stroke-width="1.5"/>
    <text x="295" y="120" text-anchor="end" font-size="8" fill="#e8913a">I</text>
    <text x="302" y="120" text-anchor="end" font-size="8" fill="#e8913a">f</text>

    <!-- 电流串联 -->
    <text x="30" y="215" font-size="12" font-weight="bold" fill="#333">(c) 电流串联负反馈</text>
    <rect x="30" y="225" width="100" height="50" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2" rx="3"/>
    <text x="80" y="250" text-anchor="middle" font-size="10" fill="#4a90d9">A</text>
    <rect x="30" y="285" width="100" height="40" fill="#ffe0b0" stroke="#e8913a" stroke-width="2" rx="3"/>
    <text x="80" y="308" text-anchor="middle" font-size="10" fill="#e8913a">F</text>
    <line x1="130" y1="250" x2="160" y2="250" stroke="#333" stroke-width="1.5"/>
    <text x="165" y="255" font-size="10" fill="#666">I</text>
    <text x="172" y="255" font-size="10" fill="#666">o</text>
    <line x1="80" y1="275" x2="80" y2="285" stroke="#e8913a" stroke-width="1.5" marker-end="url(#arSmO)"/>
    <line x1="30" y1="305" x2="10" y2="305" stroke="#e8913a" stroke-width="1.5"/>
    <line x1="10" y1="305" x2="10" y2="235" stroke="#e8913a" stroke-width="1.5" marker-end="url(#arSmO)"/>
    <text x="5" y="270" text-anchor="end" font-size="8" fill="#e8913a">V</text>
    <text x="12" y="270" text-anchor="end" font-size="8" fill="#e8913a">f</text>

    <!-- 电流并联 -->
    <text x="320" y="215" font-size="12" font-weight="bold" fill="#333">(d) 电流并联负反馈</text>
    <rect x="320" y="225" width="100" height="50" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2" rx="3"/>
    <text x="370" y="250" text-anchor="middle" font-size="10" fill="#4a90d9">A</text>
    <rect x="320" y="285" width="100" height="40" fill="#ffe0b0" stroke="#e8913a" stroke-width="2" rx="3"/>
    <text x="370" y="308" text-anchor="middle" font-size="10" fill="#e8913a">F</text>
    <line x1="420" y1="250" x2="450" y2="250" stroke="#333" stroke-width="1.5"/>
    <text x="455" y="255" font-size="10" fill="#666">I</text>
    <text x="462" y="255" font-size="10" fill="#666">o</text>
    <line x1="370" y1="275" x2="370" y2="285" stroke="#e8913a" stroke-width="1.5" marker-end="url(#arSmO)"/>
    <line x1="320" y1="305" x2="300" y2="305" stroke="#e8913a" stroke-width="1.5"/>
    <line x1="300" y1="305" x2="300" y2="235" stroke="#e8913a" stroke-width="1.5"/>
    <text x="295" y="270" text-anchor="end" font-size="8" fill="#e8913a">I</text>
    <text x="302" y="270" text-anchor="end" font-size="8" fill="#e8913a">f</text>

    <defs>
      <marker id="arSm" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0 0, 6 2, 0 4" fill="#333"/></marker>
      <marker id="arSmO" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0 0, 6 2, 0 4" fill="#e8913a"/></marker>
    </defs>
  </g>
</svg>