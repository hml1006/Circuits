<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">阻容耦合多级放大电路</text>

    <!-- VCC -->
    <line x1="100" y1="60" x2="560" y2="60" stroke="#333" stroke-width="2"/>
    <text x="570" y="65" font-size="14" font-weight="bold" fill="#cc3333">+V</text>
    <text x="585" y="65" font-size="11" fill="#cc3333">CC</text>

    <!-- 第一级 -->
    <!-- RB1 -->
    <rect x="80" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="87" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="87" y="113" text-anchor="middle" font-size="7" fill="#666">B1</text>
    <line x1="100" y1="60" x2="87" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="87" y1="60" x2="87" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="87" y1="115" x2="87" y2="130" stroke="#333" stroke-width="2"/>

    <!-- RC1 -->
    <rect x="160" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="167" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="167" y="113" text-anchor="middle" font-size="7" fill="#666">C1</text>
    <line x1="160" y1="60" x2="167" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="60" x2="167" y2="80" stroke="#333" stroke-width="2"/>

    <!-- Q1 -->
    <line x1="167" y1="115" x2="167" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="130" x2="167" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="130" x2="145" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="170" x2="190" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="170" x2="175" y2="162" stroke="#333" stroke-width="2"/>
    <polygon points="167,170 175,162 175,178" fill="#333"/>
    <text x="178" y="135" font-size="10" font-weight="bold" fill="#333">Q1</text>

    <!-- 耦合电容 -->
    <line x1="167" y1="80" x2="240" y2="80" stroke="#333" stroke-width="2"/>
    <rect x="210" y="65" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="217" y="85" text-anchor="middle" font-size="9" fill="#333">C</text>
    <line x1="224" y1="80" x2="240" y2="80" stroke="#333" stroke-width="2"/>

    <!-- 第二级 -->
    <!-- RB2 -->
    <rect x="270" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="277" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="277" y="113" text-anchor="middle" font-size="7" fill="#666">B2</text>
    <line x1="270" y1="60" x2="277" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="277" y1="60" x2="277" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="277" y1="115" x2="277" y2="130" stroke="#333" stroke-width="2"/>

    <!-- RC2 -->
    <rect x="350" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="357" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="357" y="113" text-anchor="middle" font-size="7" fill="#666">C2</text>
    <line x1="350" y1="60" x2="357" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="60" x2="357" y2="80" stroke="#333" stroke-width="2"/>

    <!-- Q2 -->
    <line x1="357" y1="115" x2="357" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="130" x2="357" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="130" x2="335" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="170" x2="380" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="170" x2="365" y2="162" stroke="#333" stroke-width="2"/>
    <polygon points="357,170 365,162 365,178" fill="#333"/>
    <text x="368" y="135" font-size="10" font-weight="bold" fill="#333">Q2</text>

    <!-- 级间耦合 -->
    <line x1="240" y1="80" x2="270" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="240" y1="130" x2="277" y2="130" stroke="#333" stroke-width="2"/>

    <!-- 接地 -->
    <line x1="87" y1="200" x2="87" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="170" x2="167" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="277" y1="200" x2="277" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="170" x2="357" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="87" y1="280" x2="357" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="280" x2="200" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="290" x2="210" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="195" y1="295" x2="205" y2="295" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="357" y1="80" x2="430" y2="80" stroke="#333" stroke-width="2"/>
    <rect x="430" y="65" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="437" y="85" text-anchor="middle" font-size="10" fill="#333">C</text>
    <line x1="444" y1="80" x2="480" y2="80" stroke="#333" stroke-width="2"/>
    <text x="490" y="85" font-size="12" fill="#333">v</text>
    <text x="500" y="85" font-size="11" fill="#666">o</text>

    <!-- 输入 -->
    <text x="50" y="175" font-size="12" fill="#333">v</text>
    <text x="60" y="175" font-size="11" fill="#666">i</text>
    <line x1="70" y1="170" x2="87" y2="170" stroke="#333" stroke-width="2"/>
    <rect x="70" y="155" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="77" y="175" text-anchor="middle" font-size="10" fill="#333">C</text>
  </g>
</svg>