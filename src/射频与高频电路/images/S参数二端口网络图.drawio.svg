<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">S 参数二端口网络</text>
    
    <!-- Port 1 label -->
    <text x="35" y="100" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">端口 1</text>
    
    <!-- Port 1 transmission line -->
    <line x1="50" y1="120" x2="120" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="280" x2="120" y2="280" stroke="#000" stroke-width="2"/>
    
    <!-- DUT / Network box -->
    <rect x="120" y="80" width="360" height="240" fill="#e8f4ff" stroke="#000" stroke-width="2" rx="5"/>
    <text x="300" y="195" text-anchor="middle" font-size="18" fill="#000" font-weight="bold">二端口网络</text>
    <text x="300" y="215" text-anchor="middle" font-size="14" fill="#666">[S] 参数矩阵</text>
    
    <!-- Port 2 transmission line -->
    <line x1="480" y1="120" x2="550" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="480" y1="280" x2="550" y2="280" stroke="#000" stroke-width="2"/>
    
    <!-- Port 2 label -->
    <text x="565" y="100" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">端口 2</text>
    
    <!-- Incident wave a1 -->
    <line x1="55" y1="160" x2="115" y2="160" stroke="#00c" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="85" y="153" text-anchor="middle" font-size="12" fill="#00c">a₁</text>
    
    <!-- Reflected wave b1 -->
    <line x1="115" y1="240" x2="55" y2="240" stroke="#c00" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="85" y="255" text-anchor="middle" font-size="12" fill="#c00">b₁</text>
    
    <!-- Incident wave a2 -->
    <line x1="545" y1="240" x2="485" y2="240" stroke="#00c" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="515" y="255" text-anchor="middle" font-size="12" fill="#00c">a₂</text>
    
    <!-- Reflected wave b2 -->
    <line x1="485" y1="160" x2="545" y2="160" stroke="#c00" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="515" y="153" text-anchor="middle" font-size="12" fill="#c00">b₂</text>
    
    <defs>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00c"/>
      </marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c00"/>
      </marker>
    </defs>
    
    <!-- S-parameter matrix -->
    <text x="300" y="270" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">矩阵方程</text>
    <text x="300" y="295" text-anchor="middle" font-size="14" fill="#000">[b₁ ] = [S₁₁  S₁₂] [a₁]</text>
    <text x="300" y="315" text-anchor="middle" font-size="14" fill="#000">[b₂ ]   [S₂₁  S₂₂] [a₂]</text>
    
    <!-- S-parameter definitions table -->
    <text x="300" y="355" text-anchor="middle" font-size="11" fill="#666">S₁₁: 输入反射系数 | S₂₁: 正向传输 | S₁₂: 反向传输 | S₂₂: 输出反射系数</text>
    
    <!-- Measurement condition -->
    <text x="300" y="375" text-anchor="middle" font-size="11" fill="#888">测量条件：a₂=0（端口2接匹配负载Z₀）</text>
  </g>
</svg>