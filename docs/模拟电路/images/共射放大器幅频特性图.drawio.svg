<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">共射放大器幅频特性</text>

    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arV)"/>
    <text x="565" y="345" font-size="13" fill="#333" font-style="italic">f (Hz)</text>
    <text x="565" y="355" font-size="10" fill="#666">(对数)</text>
    <line x1="60" y1="350" x2="60" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arI)"/>
    <text x="30" y="40" font-size="13" fill="#333">|Av|</text>
    <text x="25" y="55" font-size="10" fill="#666">(dB)</text>
    <defs>
      <marker id="arV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
      <marker id="arI" markerWidth="8" markerHeight="6" refX="3" refY="0" orient="auto"><polygon points="0 6, 3 0, 6 6" fill="#333"/></marker>
    </defs>

    <!-- 幅频曲线 -->
    <!-- 低频区 -->
    <path d="M 60 280 Q 70 275 80 265 Q 90 250 100 230 Q 110 200 120 170" fill="none" stroke="#3366cc" stroke-width="2.5"/>
    <!-- 中频区 -->
    <line x1="120" y1="170" x2="380" y2="170" stroke="#3366cc" stroke-width="2.5"/>
    <!-- 高频区 -->
    <path d="M 380 170 Q 400 175 420 190 Q 440 210 460 240 Q 480 270 500 300 Q 520 325 540 340" fill="none" stroke="#3366cc" stroke-width="2.5"/>

    <!-- 中频增益标注 -->
    <line x1="60" y1="170" x2="120" y2="170" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="70" y="165" font-size="10" fill="#666">A</text>
    <text x="78" y="165" font-size="10" fill="#666">vm</text>

    <!-- -3dB标注 -->
    <line x1="60" y1="210" x2="120" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="70" y="205" font-size="10" fill="#666">A</text>
    <text x="78" y="205" font-size="10" fill="#666">vm</text>
    <text x="90" y="205" font-size="9" fill="#666">-3dB</text>

    <!-- fL -->
    <line x1="120" y1="350" x2="120" y2="210" stroke="#cc3333" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="120" y="365" text-anchor="middle" font-size="10" fill="#cc3333">f</text>
    <text x="128" y="365" text-anchor="middle" font-size="10" fill="#cc3333">L</text>

    <!-- fH -->
    <line x1="380" y1="350" x2="380" y2="210" stroke="#cc3333" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="380" y="365" text-anchor="middle" font-size="10" fill="#cc3333">f</text>
    <text x="388" y="365" text-anchor="middle" font-size="10" fill="#cc3333">H</text>

    <!-- 区域标注 -->
    <text x="80" y="120" font-size="11" fill="#cc3333">低频区</text>
    <text x="240" y="155" font-size="11" fill="#3366cc">中频区</text>
    <text x="480" y="250" font-size="11" fill="#cc3333">高频区</text>

    <!-- 下降斜率标注 -->
    <text x="490" y="310" font-size="9" fill="#666">-20dB/十倍频</text>
    <text x="80" y="260" font-size="9" fill="#666">+20dB/十倍频</text>

    <!-- 带宽标注 -->
    <line x1="120" y1="380" x2="380" y2="380" stroke="#666" stroke-width="1.5" marker-end="url(#arR)" marker-start="url(#arL)"/>
    <defs>
      <marker id="arR" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><polygon points="0 0, 6 2, 0 4" fill="#666"/></marker>
      <marker id="arL" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto"><polygon points="6 0, 0 2, 6 4" fill="#666"/></marker>
    </defs>
    <text x="250" y="375" text-anchor="middle" font-size="10" fill="#666">带宽 BW</text>
  </g>
</svg>