<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">谐振曲线</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="350" x2="560" y2="350" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="350" x2="80" y2="50" stroke="#000" stroke-width="2"/>
    <polygon points="560,350 552,345 552,355" fill="#000"/>
    <polygon points="80,50 75,58 85,58" fill="#000"/>
    <text x="300" y="378" text-anchor="middle" font-size="14" fill="#333">ω</text>
    <text x="50" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90, 50, 200)">|Z| / I</text>
    <!-- 刻度 -->
    <line x1="80" y1="350" x2="80" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="80" y="370" text-anchor="middle" font-size="11" fill="#333">0</text>
    <line x1="300" y1="350" x2="300" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#333">ω₀</text>
    <!-- 阻抗曲线 -->
    <path d="M 80 340 Q 100 340 120 335 Q 160 320 200 300 Q 240 270 280 230 Q 300 200 310 180 Q 315 170 320 165 Q 340 145 370 140 Q 420 135 480 140 Q 530 150 560 160" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="420" y="125" font-size="12" fill="#d32f2f">|Z|</text>
    <!-- 电流曲线 -->
    <path d="M 80 180 Q 100 180 120 175 Q 160 160 200 140 Q 240 110 280 80 Q 300 55 310 55 Q 320 55 330 65 Q 360 90 400 120 Q 440 145 480 160 Q 520 170 550 175" fill="none" stroke="#1976d2" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="420" y="160" font-size="12" fill="#1976d2">I</text>
    <!-- 谐振点 -->
    <circle cx="300" cy="55" r="5" fill="#d32f2f"/>
    <line x1="300" y1="55" x2="300" y2="350" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="305" y="50" font-size="12" fill="#d32f2f">谐振点</text>
    <!-- 通频带标注 -->
    <line x1="240" y1="55" x2="240" y2="80" stroke="#e65100" stroke-width="1.5"/>
    <line x1="360" y1="55" x2="360" y2="80" stroke="#e65100" stroke-width="1.5"/>
    <text x="300" y="95" text-anchor="middle" font-size="12" fill="#e65100">BW = ω₀/Q</text>
    <!-- 公式 -->
    <text x="300" y="395" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">串联谐振: ω₀ = 1/√(LC), Q = ω₀L/R = 1/(ω₀RC)</text>
  </g>
</svg>