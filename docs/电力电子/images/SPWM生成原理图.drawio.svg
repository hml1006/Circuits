<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">SPWM 生成原理框图</text>
    
    <!-- Sine wave generator -->
    <rect x="30" y="60" width="120" height="50" fill="#d0e0ff" stroke="#00c" stroke-width="2" rx="5"/>
    <text x="90" y="85" text-anchor="middle" font-size="12" fill="#00c" font-weight="bold">正弦波发生器</text>
    <text x="90" y="100" text-anchor="middle" font-size="10" fill="#00c">调制波 v_m(t)</text>
    
    <!-- Triangle wave generator -->
    <rect x="30" y="160" width="120" height="50" fill="#ffd0d0" stroke="#c00" stroke-width="2" rx="5"/>
    <text x="90" y="185" text-anchor="middle" font-size="12" fill="#c00" font-weight="bold">三角波发生器</text>
    <text x="90" y="200" text-anchor="middle" font-size="10" fill="#c00">载波 v_c(t)</text>
    
    <!-- Comparator -->
    <rect x="230" y="100" width="100" height="70" fill="#e0ffe0" stroke="#080" stroke-width="2" rx="5"/>
    <text x="280" y="125" text-anchor="middle" font-size="13" fill="#080" font-weight="bold">比较器</text>
    <text x="280" y="145" text-anchor="middle" font-size="10" fill="#080">v_m(t) &gt; v_c(t)</text>
    <text x="280" y="158" text-anchor="middle" font-size="10" fill="#080">→ 高电平</text>
    
    <!-- Arrows to comparator -->
    <line x1="150" y1="85" x2="230" y2="120" stroke="#00c" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="150" y1="185" x2="230" y2="150" stroke="#c00" stroke-width="2" marker-end="url(#arrowRed)"/>
    
    <!-- Dead time insertion -->
    <rect x="400" y="105" width="80" height="50" fill="#fff0d0" stroke="#c80" stroke-width="2" rx="5"/>
    <text x="440" y="128" text-anchor="middle" font-size="12" fill="#c80" font-weight="bold">死区时间</text>
    <text x="440" y="145" text-anchor="middle" font-size="10" fill="#c80">插入</text>
    
    <!-- Arrow to dead time -->
    <line x1="330" y1="135" x2="400" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    
    <!-- Gate driver -->
    <rect x="400" y="190" width="80" height="50" fill="#f0d0ff" stroke="#808" stroke-width="2" rx="5"/>
    <text x="440" y="213" text-anchor="middle" font-size="12" fill="#808" font-weight="bold">门极驱动</text>
    <text x="440" y="230" text-anchor="middle" font-size="10" fill="#808">放大/隔离</text>
    
    <!-- Arrow to gate driver -->
    <line x1="440" y1="155" x2="440" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    
    <!-- Inverter power stage -->
    <rect x="400" y="280" width="80" height="50" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="5"/>
    <text x="440" y="303" text-anchor="middle" font-size="12" fill="#c00" font-weight="bold">逆变器</text>
    <text x="440" y="318" text-anchor="middle" font-size="10" fill="#c00">功率级</text>
    
    <!-- Arrow to inverter -->
    <line x1="440" y1="240" x2="440" y2="280" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    
    <!-- Output filter -->
    <rect x="530" y="280" width="60" height="50" fill="#d0ffd0" stroke="#080" stroke-width="2" rx="5"/>
    <text x="560" y="303" text-anchor="middle" font-size="11" fill="#080" font-weight="bold">LC</text>
    <text x="560" y="318" text-anchor="middle" font-size="10" fill="#080">滤波</text>
    
    <!-- Arrow to filter -->
    <line x1="480" y1="305" x2="530" y2="305" stroke="#000" stroke-width="2" marker-end="url(#arrowBlack)"/>
    
    <defs>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00c"/>
      </marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c00"/>
      </marker>
      <marker id="arrowBlack" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000"/>
      </marker>
    </defs>
    
    <!-- Output label -->
    <line x1="590" y1="305" x2="610" y2="305" stroke="#000" stroke-width="2"/>
    <text x="615" y="309" font-size="12" fill="#000" font-weight="bold">正弦波输出</text>
    
    <!-- Waveform sketch below -->
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">调制波 vs 载波 → 比较 → 死区插入 → 驱动 → 功率级 → LC滤波 → 正弦波输出</text>
  </g>
</svg>