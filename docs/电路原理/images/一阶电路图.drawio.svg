<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">一阶电路图（RC电路）</text>
    <!-- 开关 -->
    <line x1="60" y1="100" x2="100" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="100" x2="130" y2="140" stroke="#000" stroke-width="2"/>
    <circle cx="100" cy="100" r="3" fill="#000"/>
    <text x="80" y="95" font-size="12" fill="#333">t=0</text>
    <!-- 电压源 -->
    <circle cx="130" cy="180" r="22" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="158" x2="130" y2="165" stroke="#000" stroke-width="2"/>
    <line x1="115" y1="180" x2="145" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="195" x2="130" y2="202" stroke="#000" stroke-width="2"/>
    <text x="110" y="175" font-size="10" fill="#333">+</text>
    <text x="145" y="175" font-size="10" fill="#333">-</text>
    <text x="100" y="155" font-size="14" fill="#d32f2f">U_s</text>
    <!-- 竖线 -->
    <line x1="130" y1="202" x2="130" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="260" x2="130" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="100" x2="60" y2="260" stroke="#000" stroke-width="2"/>
    <!-- 电阻R -->
    <line x1="130" y1="100" x2="130" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="120" x2="230" y2="120" stroke="#000" stroke-width="2"/>
    <rect x="230" y="110" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="120" x2="330" y2="120" stroke="#000" stroke-width="2"/>
    <text x="245" y="105" font-size="14" fill="#333">R</text>
    <!-- 电容C -->
    <line x1="330" y1="120" x2="330" y2="150" stroke="#000" stroke-width="2"/>
    <line x1="330" y1="150" x2="380" y2="150" stroke="#000" stroke-width="2"/>
    <line x1="330" y1="180" x2="380" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="150" x2="380" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="180" x2="380" y2="260" stroke="#000" stroke-width="2"/>
    <text x="355" y="145" font-size="14" fill="#333">C</text>
    <text x="355" y="195" font-size="12" fill="#666">u_C</text>
    <!-- 右侧竖线 -->
    <line x1="380" y1="260" x2="130" y2="260" stroke="#000" stroke-width="2"/>
    <!-- 电流方向 -->
    <polygon points="200,120 208,114 208,126" fill="#d32f2f"/>
    <text x="180" y="110" font-size="13" fill="#d32f2f">i</text>
    <!-- 电压极性 -->
    <text x="355" y="140" font-size="12" fill="#1976d2">+</text>
    <text x="355" y="195" font-size="12" fill="#1976d2">-</text>
    <!-- 三要素公式 -->
    <text x="300" y="310" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">三要素法</text>
    <text x="300" y="335" text-anchor="middle" font-size="14" fill="#333">f(t) = f(∞) + [f(0⁺) - f(∞)] · e^(-t/τ)</text>
    <text x="300" y="360" text-anchor="middle" font-size="13" fill="#666">RC电路 τ = RC | RL电路 τ = L/R</text>
    <text x="300" y="380" text-anchor="middle" font-size="13" fill="#666">f(0⁺): 初始值, f(∞): 稳态值, τ: 时间常数</text>
  </g>
</svg>