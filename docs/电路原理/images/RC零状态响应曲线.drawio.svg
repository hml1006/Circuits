<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">RC零状态响应曲线</text>
    <!-- 坐标轴 -->
    <line x1="80" y1="350" x2="560" y2="350" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="350" x2="80" y2="50" stroke="#000" stroke-width="2"/>
    <polygon points="560,350 552,345 552,355" fill="#000"/>
    <polygon points="80,50 75,58 85,58" fill="#000"/>
    <text x="300" y="378" text-anchor="middle" font-size="14" fill="#333">t</text>
    <text x="50" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90, 50, 200)">u_C(t)</text>
    <line x1="80" y1="350" x2="80" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="80" y="370" text-anchor="middle" font-size="11" fill="#333">0</text>
    <line x1="240" y1="350" x2="240" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="240" y="370" text-anchor="middle" font-size="11" fill="#333">τ</text>
    <line x1="400" y1="350" x2="400" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="400" y="370" text-anchor="middle" font-size="11" fill="#333">2τ</text>
    <line x1="80" y1="100" x2="75" y2="100" stroke="#000" stroke-width="1.5"/>
    <text x="65" y="104" font-size="11" fill="#333">U_s</text>
    <line x1="560" y1="100" x2="555" y2="100" stroke="#000" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- 曲线 u_C(t) = U_s(1 - e^(-t/τ)) -->
    <path d="M 80 350 Q 120 350 160 340 Q 200 320 240 280 Q 280 230 320 185 Q 360 145 400 120 Q 440 108 480 102 Q 520 100 550 100" fill="none" stroke="#d32f2f" stroke-width="3"/>
    <circle cx="240" cy="280" r="4" fill="#d32f2f"/>
    <circle cx="400" cy="120" r="4" fill="#d32f2f"/>
    <text x="220" y="270" font-size="12" fill="#d32f2f">0.632U_s</text>
    <text x="380" y="110" font-size="12" fill="#d32f2f">0.865U_s</text>
    <!-- 渐近线 -->
    <line x1="80" y1="100" x2="560" y2="100" stroke="#666" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="490" y="95" font-size="12" fill="#666">渐近线 U_s</text>
    <!-- 公式 -->
    <text x="300" y="395" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u_C(t) = U_s · (1 - e^(-t/τ)), τ = RC</text>
  </g>
</svg>