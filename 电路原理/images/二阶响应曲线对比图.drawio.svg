<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">二阶响应曲线对比图</text>
    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="350" x2="60" y2="50" stroke="#000" stroke-width="2"/>
    <polygon points="560,350 552,345 552,355" fill="#000"/>
    <polygon points="60,50 55,58 65,58" fill="#000"/>
    <text x="300" y="378" text-anchor="middle" font-size="14" fill="#333">t</text>
    <text x="40" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90, 40, 200)">u_C(t)</text>
    <line x1="60" y1="350" x2="60" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="60" y="370" text-anchor="middle" font-size="11" fill="#333">0</text>
    <line x1="60" y1="100" x2="55" y2="100" stroke="#000" stroke-width="1.5"/>
    <text x="50" y="104" font-size="11" fill="#333">U₀</text>
    <!-- 过阻尼曲线（非振荡） -->
    <path d="M 60 100 Q 100 100 140 110 Q 200 130 260 150 Q 320 170 380 195 Q 440 220 500 245 Q 540 260 560 270" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="140" y="100" font-size="12" fill="#d32f2f">过阻尼</text>
    <!-- 临界阻尼曲线 -->
    <path d="M 60 100 Q 100 100 140 108 Q 200 125 260 145 Q 320 170 380 200 Q 440 235 500 268 Q 540 285 560 295" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <text x="140" y="125" font-size="12" fill="#1976d2">临界阻尼</text>
    <!-- 欠阻尼曲线（衰减振荡） -->
    <path d="M 60 100 Q 80 100 100 90 Q 120 70 140 55 Q 160 45 180 50 Q 200 60 220 80 Q 240 100 260 110 Q 280 118 300 115 Q 320 110 340 100 Q 360 88 380 82 Q 400 78 420 82 Q 440 88 460 95 Q 480 102 500 105 Q 520 108 540 108 Q 560 108 560 108" fill="none" stroke="#e65100" stroke-width="2.5"/>
    <text x="140" y="150" font-size="12" fill="#e65100">欠阻尼</text>
    <!-- 包络线 -->
    <path d="M 60 100 Q 120 82 180 50 Q 260 25 340 30 Q 420 40 500 60 Q 540 70 560 80" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
    <path d="M 60 100 Q 120 120 180 140 Q 260 170 340 170 Q 420 155 500 135 Q 540 125 560 120" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="460" y="55" font-size="11" fill="#666">包络线 e^(-αt)</text>
    <!-- 图例 -->
    <text x="300" y="395" text-anchor="middle" font-size="12" fill="#666">过阻尼: α &gt; ω₀, 临界阻尼: α = ω₀, 欠阻尼: α &lt; ω₀</text>
  </g>
</svg>