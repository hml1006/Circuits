<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="stripe" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#ddd" stroke-width="1"/>
    </pattern>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CMOS剖面结构图</text>
    <!-- P-substrate (bottom) -->
    <rect x="50" y="300" width="500" height="70" fill="#e8d5b7" stroke="#333" stroke-width="2"/>
    <text x="300" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">P型衬底 (P-Substrate)</text>
    <!-- N-well -->
    <rect x="340" y="230" width="170" height="70" fill="#f5d5a0" stroke="#333" stroke-width="2"/>
    <text x="425" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">N阱</text>
    <!-- STI (Shallow Trench Isolation) -->
    <rect x="50" y="220" width="60" height="80" fill="#a0a0a0" stroke="#333" stroke-width="1.5"/>
    <text x="80" y="260" text-anchor="middle" font-size="10" fill="#fff">STI</text>
    <rect x="290" y="220" width="50" height="80" fill="#a0a0a0" stroke="#333" stroke-width="1.5"/>
    <text x="315" y="260" text-anchor="middle" font-size="10" fill="#fff">STI</text>
    <rect x="510" y="220" width="40" height="80" fill="#a0a0a0" stroke="#333" stroke-width="1.5"/>
    <text x="530" y="260" text-anchor="middle" font-size="10" fill="#fff">STI</text>
    <!-- NMOS Source/Drain (N+) -->
    <rect x="115" y="240" width="55" height="60" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="142" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc0000">N+</text>
    <text x="142" y="285" text-anchor="middle" font-size="9" fill="#cc0000">源极</text>
    <rect x="230" y="240" width="55" height="60" fill="#ff9999" stroke="#cc0000" stroke-width="1.5"/>
    <text x="257" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc0000">N+</text>
    <text x="257" y="285" text-anchor="middle" font-size="9" fill="#cc0000">漏极</text>
    <!-- PMOS Source/Drain (P+) -->
    <rect x="345" y="250" width="55" height="50" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="372" y="275" text-anchor="middle" font-size="10" font-weight="bold" fill="#0066cc">P+</text>
    <text x="372" y="290" text-anchor="middle" font-size="9" fill="#0066cc">源极</text>
    <rect x="455" y="250" width="55" height="50" fill="#99ccff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="482" y="275" text-anchor="middle" font-size="10" font-weight="bold" fill="#0066cc">P+</text>
    <text x="482" y="290" text-anchor="middle" font-size="9" fill="#0066cc">漏极</text>
    <!-- Gate Oxide -->
    <rect x="150" y="215" width="130" height="8" fill="#666" stroke="#333" stroke-width="1"/>
    <text x="215" y="210" text-anchor="middle" font-size="9" fill="#333">栅氧 SiO₂</text>
    <rect x="380" y="225" width="130" height="8" fill="#666" stroke="#333" stroke-width="1"/>
    <text x="445" y="220" text-anchor="middle" font-size="9" fill="#333">栅氧 SiO₂</text>
    <!-- Poly Gate -->
    <rect x="155" y="195" width="120" height="22" fill="#cc6666" stroke="#993333" stroke-width="1.5"/>
    <text x="215" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">多晶硅栅</text>
    <rect x="385" y="205" width="120" height="22" fill="#cc6666" stroke="#993333" stroke-width="1.5"/>
    <text x="445" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">多晶硅栅</text>
    <!-- Spacer -->
    <rect x="145" y="195" width="10" height="28" fill="#aaa" stroke="#666" stroke-width="1"/>
    <rect x="275" y="195" width="10" height="28" fill="#aaa" stroke="#666" stroke-width="1"/>
    <rect x="375" y="205" width="10" height="28" fill="#aaa" stroke="#666" stroke-width="1"/>
    <rect x="505" y="205" width="10" height="28" fill="#aaa" stroke="#666" stroke-width="1"/>
    <!-- ILD (Inter-layer Dielectric) -->
    <rect x="50" y="170" width="500" height="28" fill="#d4e6b5" stroke="#7da33b" stroke-width="1"/>
    <text x="300" y="188" text-anchor="middle" font-size="11" fill="#333">层间介质 (ILD)</text>
    <!-- Metal 1 contacts -->
    <rect x="130" y="155" width="30" height="18" fill="#ffcc66" stroke="#cc9900" stroke-width="1"/>
    <rect x="240" y="155" width="30" height="18" fill="#ffcc66" stroke="#cc9900" stroke-width="1"/>
    <rect x="360" y="155" width="30" height="18" fill="#ffcc66" stroke="#cc9900" stroke-width="1"/>
    <rect x="470" y="155" width="30" height="18" fill="#ffcc66" stroke="#cc9900" stroke-width="1"/>
    <text x="145" y="167" text-anchor="middle" font-size="8" fill="#333">M1</text>
    <text x="255" y="167" text-anchor="middle" font-size="8" fill="#333">M1</text>
    <text x="375" y="167" text-anchor="middle" font-size="8" fill="#333">M1</text>
    <text x="485" y="167" text-anchor="middle" font-size="8" fill="#333">M1</text>
    <!-- Labels -->
    <text x="142" y="150" text-anchor="middle" font-size="9" fill="#333">VSS</text>
    <text x="257" y="150" text-anchor="middle" font-size="9" fill="#333">OUT</text>
    <text x="372" y="150" text-anchor="middle" font-size="9" fill="#333">VDD</text>
    <text x="485" y="150" text-anchor="middle" font-size="9" fill="#333">OUT</text>
    <!-- NMOS / PMOS labels -->
    <text x="215" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">NMOS晶体管</text>
    <text x="445" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">PMOS晶体管</text>
    <!-- Legend -->
    <rect x="50" y="355" width="12" height="12" fill="#e8d5b7" stroke="#333" stroke-width="1"/>
    <text x="68" y="365" font-size="10" fill="#333">P-Sub</text>
    <rect x="130" y="355" width="12" height="12" fill="#f5d5a0" stroke="#333" stroke-width="1"/>
    <text x="148" y="365" font-size="10" fill="#333">N-Well</text>
    <rect x="220" y="355" width="12" height="12" fill="#ff9999" stroke="#cc0000" stroke-width="1"/>
    <text x="238" y="365" font-size="10" fill="#333">N+</text>
    <rect x="285" y="355" width="12" height="12" fill="#99ccff" stroke="#0066cc" stroke-width="1"/>
    <text x="303" y="365" font-size="10" fill="#333">P+</text>
    <rect x="350" y="355" width="12" height="12" fill="#cc6666" stroke="#993333" stroke-width="1"/>
    <text x="368" y="365" font-size="10" fill="#333">Poly</text>
    <rect x="420" y="355" width="12" height="12" fill="#a0a0a0" stroke="#333" stroke-width="1"/>
    <text x="438" y="365" font-size="10" fill="#333">STI</text>
  </g>
</svg>