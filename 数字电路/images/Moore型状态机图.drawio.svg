<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Moore 型状态机结构</text>
    <text x="300" y="45" text-anchor="middle" font-size="12" fill="#666">输出仅取决于当前状态：Y = G(S_current)</text>

    <!-- 输入 X -->
    <text x="50" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">X</text>
    <line x1="65" y1="165" x2="115" y2="165" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- 次态逻辑（组合逻辑） -->
    <rect x="120" y="130" width="130" height="70" rx="6" ry="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="185" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">次态逻辑</text>
    <text x="185" y="178" text-anchor="middle" font-size="11" fill="#1565C0">S_next = F(S, X)</text>

    <!-- 箭头 次态逻辑 → 状态寄存器 -->
    <line x1="250" y1="165" x2="290" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 状态寄存器（触发器组） -->
    <rect x="295" y="120" width="110" height="90" rx="6" ry="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="350" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">状态寄存器</text>
    <text x="350" y="168" text-anchor="middle" font-size="11" fill="#2E7D32">（D 触发器）</text>
    <text x="350" y="186" text-anchor="middle" font-size="11" fill="#2E7D32">CLK ↑</text>

    <!-- 时钟 -->
    <line x1="350" y1="210" x2="350" y2="245" stroke="#999" stroke-width="1.5"/>
    <text x="360" y="240" font-size="12" fill="#999">CLK</text>

    <!-- 箭头 状态寄存器 → 输出逻辑 -->
    <line x1="405" y1="165" x2="445" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 输出逻辑（组合逻辑） -->
    <rect x="450" y="130" width="110" height="70" rx="6" ry="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="505" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">输出逻辑</text>
    <text x="505" y="178" text-anchor="middle" font-size="11" fill="#E65100">Y = G(S)</text>

    <!-- 输出 Y -->
    <line x1="560" y1="165" x2="590" y2="165" stroke="#E65100" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="585" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">Y</text>

    <!-- 反馈回路（状态 → 次态逻辑） -->
    <path d="M 350 115 L 350 100 L 185 100 L 185 125" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
    <text x="270" y="95" text-anchor="middle" font-size="11" fill="#666">当前状态反馈</text>

    <!-- 状态转换图示例 -->
    <rect x="110" y="280" width="380" height="110" rx="8" ry="8" fill="#FAFAFA" stroke="#ddd" stroke-width="1"/>
    <text x="300" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">示例：3 状态 Moore 机状态图</text>

    <!-- State S0 -->
    <circle cx="200" cy="350" r="25" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="200" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">S0</text>
    <text x="200" y="360" text-anchor="middle" font-size="10" fill="#1565C0">/Y0</text>

    <!-- State S1 -->
    <circle cx="300" cy="350" r="25" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="300" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">S1</text>
    <text x="300" y="360" text-anchor="middle" font-size="10" fill="#2E7D32">/Y1</text>

    <!-- State S2 -->
    <circle cx="400" cy="350" r="25" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="400" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">S2</text>
    <text x="400" y="360" text-anchor="middle" font-size="10" fill="#E65100">/Y2</text>

    <!-- Transitions -->
    <path d="M 225 350 Q 250 335 275 350" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="250" y="340" text-anchor="middle" font-size="9" fill="#333">X=0</text>

    <path d="M 325 350 Q 350 335 375 350" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="350" y="340" text-anchor="middle" font-size="9" fill="#333">X=1</text>

    <path d="M 425 350 Q 450 380 400 375" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="435" y="370" text-anchor="middle" font-size="9" fill="#333">X=0</text>

    <path d="M 175 375 Q 150 380 175 365" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="155" y="375" text-anchor="middle" font-size="9" fill="#333">X=1</text>
  </g>
</svg>