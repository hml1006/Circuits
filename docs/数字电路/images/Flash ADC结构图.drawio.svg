<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Flash ADC 结构图</text>
    <!-- 参考电压 -->
    <text x="50" y="52" text-anchor="end" font-size="12" fill="#000">VREF</text>
    <line x1="60" y1="48" x2="160" y2="48" stroke="#000" stroke-width="1.5"/>
    <!-- 电阻分压链 -->
    <rect x="160" y="55" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="66" text-anchor="middle" font-size="7" fill="#000">R</text>
    <rect x="160" y="80" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="91" text-anchor="middle" font-size="7" fill="#000">R</text>
    <rect x="160" y="105" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="116" text-anchor="middle" font-size="7" fill="#000">R</text>
    <rect x="160" y="130" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="141" text-anchor="middle" font-size="7" fill="#000">R</text>
    <rect x="160" y="155" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="166" text-anchor="middle" font-size="7" fill="#000">R</text>
    <rect x="160" y="180" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="191" text-anchor="middle" font-size="7" fill="#000">R</text>
    <rect x="160" y="205" width="20" height="15" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="170" y="216" text-anchor="middle" font-size="7" fill="#000">R</text>
    <!-- 参考电压线 -->
    <line x1="160" y1="55" x2="160" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="55" x2="180" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="48" x2="180" y2="55" stroke="#000" stroke-width="1.5"/>
    <line x1="160" y1="220" x2="160" y2="240" stroke="#000" stroke-width="1.5"/>
    <text x="160" y="255" text-anchor="middle" font-size="10" fill="#000">GND</text>
    <!-- 比较器 -->
    <rect x="200" y="45" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="61" text-anchor="middle" font-size="9" fill="#000">CMP7</text>
    <rect x="200" y="70" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="86" text-anchor="middle" font-size="9" fill="#000">CMP6</text>
    <rect x="200" y="95" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="111" text-anchor="middle" font-size="9" fill="#000">CMP5</text>
    <rect x="200" y="120" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="136" text-anchor="middle" font-size="9" fill="#000">CMP4</text>
    <rect x="200" y="145" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="161" text-anchor="middle" font-size="9" fill="#000">CMP3</text>
    <rect x="200" y="170" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="186" text-anchor="middle" font-size="9" fill="#000">CMP2</text>
    <rect x="200" y="195" width="60" height="25" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="230" y="211" text-anchor="middle" font-size="9" fill="#000">CMP1</text>
    <!-- 比较器正输入 -->
    <line x1="180" y1="57" x2="200" y2="57" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="82" x2="200" y2="82" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="107" x2="200" y2="107" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="132" x2="200" y2="132" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="157" x2="200" y2="157" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="182" x2="200" y2="182" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="207" x2="200" y2="207" stroke="#000" stroke-width="1.5"/>
    <!-- 模拟输入 -->
    <line x1="120" y1="130" x2="120" y2="140" stroke="#000" stroke-width="1.5"/>
    <line x1="120" y1="140" x2="200" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="110" y="134" text-anchor="end" font-size="12" font-weight="bold" fill="#000">VIN</text>
    <circle cx="203" cy="140" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <!-- 比较器输出 -->
    <line x1="260" y1="57" x2="290" y2="57" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="82" x2="290" y2="82" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="107" x2="290" y2="107" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="132" x2="290" y2="132" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="157" x2="290" y2="157" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="182" x2="290" y2="182" stroke="#000" stroke-width="1.5"/>
    <line x1="260" y1="207" x2="290" y2="207" stroke="#000" stroke-width="1.5"/>
    <!-- 编码器 -->
    <rect x="290" y="50" width="100" height="200" rx="5" fill="#d4e6f1" stroke="#000" stroke-width="2"/>
    <text x="340" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">编码器</text>
    <text x="340" y="150" text-anchor="middle" font-size="11" fill="#555">(Encoder)</text>
    <text x="340" y="170" text-anchor="middle" font-size="10" fill="#555">优先编码</text>
    <!-- 输出 -->
    <line x1="390" y1="80" x2="430" y2="80" stroke="#000" stroke-width="1.5"/>
    <line x1="390" y1="110" x2="430" y2="110" stroke="#000" stroke-width="1.5"/>
    <line x1="390" y1="140" x2="430" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="440" y="84" text-anchor="start" font-size="11" fill="#000">D₂ (MSB)</text>
    <text x="440" y="114" text-anchor="start" font-size="11" fill="#000">D₁</text>
    <text x="440" y="144" text-anchor="start" font-size="11" fill="#000">D₀ (LSB)</text>
    <!-- 说明 -->
    <rect x="30" y="280" width="540" height="105" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">Flash ADC 特点</text>
    <text x="50" y="325" text-anchor="start" font-size="12" fill="#000">• 速度最快（一个时钟周期完成转换）</text>
    <text x="50" y="345" text-anchor="start" font-size="12" fill="#000">• 3位 ADC 需要 7 个比较器（2ⁿ-1 个）</text>
    <text x="50" y="365" text-anchor="start" font-size="12" fill="#000">• 分辨率每增加 1 位，比较器数量翻倍</text>
    <text x="50" y="385" text-anchor="start" font-size="12" fill="#000">• 功耗高、面积大，分辨率通常不超过 8 位</text>
  </g>
</svg>