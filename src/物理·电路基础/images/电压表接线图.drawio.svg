<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620">
  <style>
    .wire { stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: square; stroke-linejoin: miter; }
    .thick { stroke: #000000; fill: none; stroke-linecap: square; }
    .dot { fill: #000000; }
    .text { font-family: Arial, sans-serif; font-weight: bold; fill: #000000; text-anchor: middle; }
    .label { font-family: Arial, sans-serif; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- ================================================================ -->
  <!-- Main circuit wires — rectangular loop                           -->
  <!-- ================================================================ -->
  <!-- Top wire: switch right → bulb left -->
  <line x1="240" y1="200" x2="410" y2="200" class="wire"/>
  <!-- Right wire: bulb right → bottom of loop -->
  <line x1="490" y1="200" x2="490" y2="500" class="wire"/>
  <!-- Bottom wire: right → power right -->
  <line x1="240" y1="500" x2="490" y2="500" class="wire"/>
  <!-- Left wire: power left → switch left -->
  <line x1="160" y1="200" x2="160" y2="500" class="wire"/>

  <!-- ================================================================ -->
  <!-- Voltmeter parallel branches — go UP from bulb, above the loop    -->
  <!-- ================================================================ -->
  <!-- Left branch: bulb left → voltmeter left -->
  <line x1="410" y1="70" x2="410" y2="200" class="wire"/>
  <!-- Right branch: bulb right → voltmeter right -->
  <line x1="490" y1="70" x2="490" y2="200" class="wire"/>

  <!-- ================================================================ -->
  <!-- Connection dots — every T-junction                               -->
  <!-- ================================================================ -->
  <circle cx="240" cy="200" r="3.5" class="dot"/>
  <circle cx="410" cy="200" r="3.5" class="dot"/>
  <circle cx="490" cy="200" r="3.5" class="dot"/>
  <circle cx="490" cy="500" r="3.5" class="dot"/>
  <circle cx="240" cy="500" r="3.5" class="dot"/>
  <circle cx="160" cy="200" r="3.5" class="dot"/>
  <circle cx="160" cy="500" r="3.5" class="dot"/>
  <circle cx="410" cy="70" r="3.5" class="dot"/>
  <circle cx="490" cy="70" r="3.5" class="dot"/>

  <!-- ================================================================ -->
  <!-- Switch (grid center: 200, 200)                                   -->
  <!-- ================================================================ -->
  <g id="switch">
    <line x1="160" y1="200" x2="180" y2="200" class="wire"/>
    <line x1="220" y1="200" x2="240" y2="200" class="wire"/>
    <circle cx="180" cy="200" r="3" class="dot"/>
    <circle cx="220" cy="200" r="3" class="dot"/>
    <line x1="180" y1="200" x2="215" y2="190" class="wire"/>
  </g>

  <!-- ================================================================ -->
  <!-- Bulb (grid center: 450, 200)                                     -->
  <!-- ================================================================ -->
  <g id="bulb">
    <line x1="410" y1="200" x2="430" y2="200" class="wire"/>
    <line x1="470" y1="200" x2="490" y2="200" class="wire"/>
    <circle cx="450" cy="200" r="20" class="wire"/>
    <line x1="436" y1="186" x2="464" y2="214" class="wire"/>
    <line x1="464" y1="186" x2="436" y2="214" class="wire"/>
  </g>

  <!-- ================================================================ -->
  <!-- Voltmeter (grid center: 450, 70) — ABOVE the bulb, parallel      -->
  <!-- ================================================================ -->
  <g id="voltmeter">
    <line x1="410" y1="70" x2="430" y2="70" class="wire"/>
    <line x1="470" y1="70" x2="490" y2="70" class="wire"/>
    <circle cx="450" cy="70" r="20" class="wire"/>
    <text x="450" y="76" class="text" font-size="22">V</text>
    <!-- Polarity: left side higher potential (before bulb), right side lower (after bulb) -->
    <text x="428" y="50" class="label" font-size="14" fill="#C0392B">+</text>
    <text x="472" y="50" class="label" font-size="14" fill="#2980B9">−</text>
  </g>

  <!-- ================================================================ -->
  <!-- Power Source / Battery (grid center: 200, 500)                   -->
  <!-- ================================================================ -->
  <g id="power">
    <line x1="160" y1="500" x2="196" y2="500" class="wire"/>
    <line x1="204" y1="500" x2="240" y2="500" class="wire"/>
    <line x1="196" y1="480" x2="196" y2="520" class="thick" stroke-width="2.5"/>
    <line x1="204" y1="486" x2="204" y2="514" class="thick" stroke-width="4"/>
    <text x="196" y="474" class="label" font-size="14" fill="#C0392B">+</text>
    <text x="204" y="474" class="label" font-size="14" fill="#2980B9">−</text>
  </g>
</svg>