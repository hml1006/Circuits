<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">建立时间与保持时间时序图</text>
    <!-- Clock signal -->
    <text x="30" y="70" font-size="13" font-weight="bold" fill="#1e88e5">时钟 (CLK)</text>
    <line x1="120" y1="70" x2="580" y2="70" stroke="#333" stroke-width="1"/>
    <!-- Clock rising edges -->
    <line x1="150" y1="60" x2="150" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="60" x2="300" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="60" x2="450" y2="80" stroke="#333" stroke-width="2"/>
    <!-- Clock label -->
    <text x="150" y="55" text-anchor="middle" font-size="10" fill="#333">T=0</text>
    <text x="300" y="55" text-anchor="middle" font-size="10" fill="#333">T=Tclk</text>
    <text x="450" y="55" text-anchor="middle" font-size="10" fill="#333">T=2Tclk</text>
    <!-- Data signal -->
    <text x="30" y="120" font-size="13" font-weight="bold" fill="#e65100">数据 (DATA)</text>
    <line x1="120" y1="120" x2="170" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="120" x2="170" y2="115" stroke="#333" stroke-width="1"/>
    <line x1="170" y1="115" x2="260" y2="115" stroke="#e65100" stroke-width="2.5"/>
    <line x1="260" y1="115" x2="260" y2="120" stroke="#333" stroke-width="1"/>
    <line x1="260" y1="120" x2="400" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="400" y1="120" x2="400" y2="115" stroke="#333" stroke-width="1"/>
    <line x1="400" y1="115" x2="500" y2="115" stroke="#e65100" stroke-width="2.5"/>
    <line x1="500" y1="115" x2="500" y2="120" stroke="#333" stroke-width="1"/>
    <line x1="500" y1="120" x2="580" y2="120" stroke="#333" stroke-width="2"/>
    <text x="215" y="110" text-anchor="middle" font-size="10" fill="#e65100">数据有效</text>
    <text x="450" y="110" text-anchor="middle" font-size="10" fill="#e65100">数据有效</text>
    <!-- Setup time region -->
    <rect x="250" y="135" width="50" height="30" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" fill-opacity="0.5"/>
    <text x="275" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">Tsu</text>
    <line x1="250" y1="145" x2="250" y2="165" stroke="#c62828" stroke-width="1"/>
    <line x1="300" y1="145" x2="300" y2="165" stroke="#c62828" stroke-width="1"/>
    <text x="275" y="178" text-anchor="middle" font-size="9" fill="#c62828">建立时间</text>
    <!-- Hold time region -->
    <rect x="300" y="135" width="30" height="30" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" fill-opacity="0.5"/>
    <text x="315" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Th</text>
    <line x1="300" y1="145" x2="300" y2="165" stroke="#e65100" stroke-width="1"/>
    <line x1="330" y1="145" x2="330" y2="165" stroke="#e65100" stroke-width="1"/>
    <text x="315" y="178" text-anchor="middle" font-size="9" fill="#e65100">保持时间</text>
    <!-- Second cycle setup/hold -->
    <rect x="400" y="135" width="50" height="30" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" fill-opacity="0.5"/>
    <text x="425" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">Tsu</text>
    <rect x="450" y="135" width="30" height="30" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" fill-opacity="0.5"/>
    <text x="465" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Th</text>
    <!-- Timing path diagram -->
    <text x="300" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">建立时间检查公式</text>
    <rect x="30" y="220" width="540" height="40" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="300" y="240" text-anchor="middle" font-size="12" fill="#1e88e5">Tlaunch + Tcq + Tlogic + Tsetup ≤ Tcapture + Tclk</text>
    <text x="300" y="255" text-anchor="middle" font-size="10" fill="#666">Setup Slack = (Tcapture + Tclk) - (Tlaunch + Tcq + Tlogic + Tsetup)</text>
    <rect x="30" y="270" width="540" height="40" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="300" y="290" text-anchor="middle" font-size="12" fill="#e65100">Tlaunch + Tcq + Tlogic ≥ Tcapture + Thold</text>
    <text x="300" y="305" text-anchor="middle" font-size="10" fill="#666">Hold Slack = (Tlaunch + Tcq + Tlogic) - (Tcapture + Thold)</text>
    <!-- Summary -->
    <rect x="30" y="325" width="540" height="65" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="300" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">关键要点</text>
    <text x="50" y="365" font-size="11" fill="#555">建立时间违反: 降低时钟频率或减少组合逻辑级数</text>
    <text x="50" y="382" font-size="11" fill="#555">保持时间违反: 插入缓冲器增加延迟 (不能通过降低频率修复)</text>
  </g>
</svg>