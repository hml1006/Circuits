<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">存储器基本结构</text>
    <!-- 地址译码器 -->
    <rect x="30" y="60" width="100" height="180" rx="5" fill="#d4e6f1" stroke="#000" stroke-width="2"/>
    <text x="80" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">地址</text>
    <text x="80" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">译码器</text>
    <text x="80" y="170" text-anchor="middle" font-size="11" fill="#555">行译码</text>
    <!-- 地址输入 -->
    <line x1="10" y1="80" x2="30" y2="80" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="100" x2="30" y2="100" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="120" x2="30" y2="120" stroke="#000" stroke-width="1.5"/>
    <text x="5" y="84" text-anchor="end" font-size="11" fill="#000">A₀</text>
    <text x="5" y="104" text-anchor="end" font-size="11" fill="#000">A₁</text>
    <text x="5" y="124" text-anchor="end" font-size="11" fill="#000">A₂</text>
    <!-- 存储阵列 -->
    <rect x="150" y="60" width="300" height="180" rx="5" fill="#fff5ee" stroke="#000" stroke-width="2"/>
    <text x="300" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">存储阵列</text>
    <text x="300" y="155" text-anchor="middle" font-size="12" fill="#555">(Storage Array)</text>
    <text x="300" y="180" text-anchor="middle" font-size="11" fill="#555">M × N 存储单元矩阵</text>
    <!-- 字线连接 -->
    <line x1="130" y1="80" x2="150" y2="80" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="120" x2="150" y2="120" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="160" x2="150" y2="160" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="200" x2="150" y2="200" stroke="#000" stroke-width="1.5"/>
    <!-- 存储阵列中的小格子 -->
    <rect x="180" y="80" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="230" y="80" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="280" y="80" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="80" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="380" y="80" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="130" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="230" y="130" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="280" y="130" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="130" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="380" y="130" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="180" y="180" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="230" y="180" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="280" y="180" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="330" y="180" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <rect x="380" y="180" width="30" height="30" fill="#fff" stroke="#aaa" stroke-width="1"/>
    <!-- 读写控制电路 -->
    <rect x="470" y="60" width="100" height="80" rx="5" fill="#d5f5e3" stroke="#000" stroke-width="2"/>
    <text x="520" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">读写控制</text>
    <text x="520" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">电路</text>
    <!-- 数据缓冲器 -->
    <rect x="470" y="160" width="100" height="80" rx="5" fill="#fdebd0" stroke="#000" stroke-width="2"/>
    <text x="520" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">数据</text>
    <text x="520" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">缓冲器</text>
    <!-- 连接线 -->
    <line x1="450" y1="90" x2="470" y2="90" stroke="#000" stroke-width="1.5"/>
    <line x1="450" y1="200" x2="470" y2="200" stroke="#000" stroke-width="1.5"/>
    <!-- 控制信号 -->
    <line x1="470" y1="80" x2="440" y2="80" stroke="#000" stroke-width="1.5"/>
    <line x1="440" y1="80" x2="440" y2="50" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="50" x2="460" y2="50" stroke="#000" stroke-width="1.5"/>
    <text x="410" y="54" text-anchor="end" font-size="11" fill="#000">R/W</text>
    <line x1="470" y1="100" x2="440" y2="100" stroke="#000" stroke-width="1.5"/>
    <line x1="440" y1="100" x2="440" y2="42" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="42" x2="460" y2="42" stroke="#000" stroke-width="1.5"/>
    <text x="410" y="46" text-anchor="end" font-size="11" fill="#000">CS</text>
    <!-- 数据输入输出 -->
    <line x1="520" y1="240" x2="520" y2="270" stroke="#000" stroke-width="1.5"/>
    <line x1="500" y1="270" x2="540" y2="270" stroke="#000" stroke-width="1.5"/>
    <text x="490" y="284" text-anchor="end" font-size="11" fill="#000">D₀</text>
    <text x="545" y="284" text-anchor="start" font-size="11" fill="#000">D₁</text>
    <text x="490" y="298" text-anchor="end" font-size="11" fill="#000">...</text>
    <text x="545" y="298" text-anchor="start" font-size="11" fill="#000">Dₙ</text>
    <!-- 说明 -->
    <rect x="30" y="310" width="540" height="75" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">存储器结构组成</text>
    <text x="50" y="352" text-anchor="start" font-size="12" fill="#000">① 地址译码器：将地址信号转换为字线选择信号</text>
    <text x="50" y="372" text-anchor="start" font-size="12" fill="#000">② 存储阵列：由存储单元组成的矩阵</text>
    <text x="50" y="392" text-anchor="start" font-size="12" fill="#000">③ 读写控制电路 + 数据缓冲器：控制数据的读写操作</text>
  </g>
</svg>