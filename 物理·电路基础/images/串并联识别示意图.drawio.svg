<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">串并联识别示意图</text>
    
    <!-- 左侧：串联 -->
    <rect x="20" y="55" width="280" height="155" rx="8" ry="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="160" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67e22">串联电路</text>
    
    <line x1="40" y1="110" x2="80" y2="110" stroke="#333" stroke-width="2"/>
    <circle cx="110" cy="110" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="97" y1="97" x2="123" y2="123" stroke="#333" stroke-width="2"/>
    <line x1="123" y1="97" x2="97" y2="123" stroke="#333" stroke-width="2"/>
    <text x="110" y="145" text-anchor="middle" font-size="11" fill="#555">L₁</text>
    
    <line x1="128" y1="110" x2="150" y2="110" stroke="#333" stroke-width="2"/>
    
    <circle cx="180" cy="110" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="97" x2="193" y2="123" stroke="#333" stroke-width="2"/>
    <line x1="193" y1="97" x2="167" y2="123" stroke="#333" stroke-width="2"/>
    <text x="180" y="145" text-anchor="middle" font-size="11" fill="#555">L₂</text>
    
    <line x1="198" y1="110" x2="220" y2="110" stroke="#333" stroke-width="2"/>
    
    <circle cx="250" cy="110" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="237" y1="97" x2="263" y2="123" stroke="#333" stroke-width="2"/>
    <line x1="263" y1="97" x2="237" y2="123" stroke="#333" stroke-width="2"/>
    <text x="250" y="145" text-anchor="middle" font-size="11" fill="#555">L₃</text>
    
    <line x1="268" y1="110" x2="290" y2="110" stroke="#333" stroke-width="2"/>
    
    <text x="160" y="175" text-anchor="middle" font-size="11" fill="#666">一条路径，首尾相连</text>
    <text x="160" y="195" text-anchor="middle" font-size="11" fill="#e67e22">一个坏了，全部不工作</text>
    
    <!-- 右侧：并联 -->
    <rect x="300" y="55" width="280" height="155" rx="8" ry="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="440" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">并联电路</text>
    
    <line x1="320" y1="100" x2="345" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="100" x2="320" y2="135" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="135" x2="345" y2="135" stroke="#333" stroke-width="2"/>
    
    <circle cx="375" cy="100" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="362" y1="87" x2="388" y2="113" stroke="#333" stroke-width="2"/>
    <line x1="388" y1="87" x2="362" y2="113" stroke="#333" stroke-width="2"/>
    <text x="375" y="135" text-anchor="middle" font-size="11" fill="#555">L₁</text>
    
    <circle cx="375" cy="135" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="362" y1="122" x2="388" y2="148" stroke="#333" stroke-width="2"/>
    <line x1="388" y1="122" x2="362" y2="148" stroke="#333" stroke-width="2"/>
    <text x="375" y="170" text-anchor="middle" font-size="11" fill="#555">L₂</text>
    
    <line x1="393" y1="100" x2="430" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="393" y1="135" x2="430" y2="135" stroke="#333" stroke-width="2"/>
    <line x1="430" y1="100" x2="430" y2="135" stroke="#333" stroke-width="2"/>
    
    <circle cx="460" cy="100" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="447" y1="87" x2="473" y2="113" stroke="#333" stroke-width="2"/>
    <line x1="473" y1="87" x2="447" y2="113" stroke="#333" stroke-width="2"/>
    <text x="460" y="135" text-anchor="middle" font-size="11" fill="#555">L₃</text>
    
    <line x1="478" y1="100" x2="510" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="478" y1="135" x2="510" y2="135" stroke="#333" stroke-width="2"/>
    <line x1="510" y1="100" x2="510" y2="135" stroke="#333" stroke-width="2"/>
    <line x1="510" y1="117" x2="540" y2="117" stroke="#333" stroke-width="2"/>
    
    <text x="440" y="195" text-anchor="middle" font-size="11" fill="#666">多条路径，并列连接</text>
    <text x="440" y="215" text-anchor="middle" font-size="11" fill="#27ae60">一个坏了，其他仍工作</text>
    
    <!-- 识别方法 -->
    <rect x="20" y="230" width="560" height="155" rx="8" ry="8" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="300" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">串并联电路识别方法</text>
    
    <text x="40" y="280" font-size="13" font-weight="bold" fill="#e67e22">方法一：电流路径法</text>
    <text x="40" y="300" font-size="12" fill="#555">从电源正极出发，沿电流方向追踪到负极</text>
    <text x="40" y="318" font-size="12" fill="#555">一条路径→串联；多条路径（有分支）→并联</text>
    
    <text x="40" y="340" font-size="13" font-weight="bold" fill="#27ae60">方法二：元件拆除法</text>
    <text x="40" y="360" font-size="12" fill="#555">拆除一个用电器，其他都不工作→串联</text>
    <text x="40" y="378" font-size="12" fill="#555">拆除一个用电器，其他仍能工作→并联</text>
  </g>
</svg>