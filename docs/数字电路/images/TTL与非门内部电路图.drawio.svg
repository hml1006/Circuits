<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">TTL 与非门内部电路</text>
    <!-- Vcc 电源 -->
    <text x="520" y="50" text-anchor="middle" font-size="13" fill="#000">Vcc (+5V)</text>
    <line x1="520" y1="55" x2="520" y2="70" stroke="#000" stroke-width="1.5"/>
    <circle cx="520" cy="72" r="3" fill="#000"/>
    <!-- R1 - 5kΩ -->
    <rect x="505" y="75" width="30" height="50" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="520" y="108" text-anchor="middle" font-size="10" fill="#000">R1</text>
    <text x="520" y="120" text-anchor="middle" font-size="9" fill="#000">5kΩ</text>
    <line x1="520" y1="72" x2="520" y2="75" stroke="#000" stroke-width="1.5"/>
    <!-- T1 - 多发射极三极管 -->
    <line x1="520" y1="125" x2="520" y2="140" stroke="#000" stroke-width="1.5"/>
    <circle cx="520" cy="145" r="3" fill="#000"/>
    <text x="440" y="145" text-anchor="end" font-size="12" fill="#000">T1</text>
    <!-- T1 基极 -->
    <line x1="520" y1="145" x2="420" y2="145" stroke="#000" stroke-width="1.5"/>
    <!-- T1 发射极 - 输入A -->
    <line x1="520" y1="145" x2="520" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="520" y1="155" x2="420" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="145" x2="420" y2="155" stroke="#000" stroke-width="1.5"/>
    <circle cx="420" cy="150" r="2" fill="#000"/>
    <line x1="420" y1="150" x2="380" y2="150" stroke="#000" stroke-width="1.5"/>
    <text x="370" y="154" text-anchor="end" font-size="12" fill="#000">A</text>
    <!-- T1 发射极 - 输入B -->
    <line x1="520" y1="155" x2="520" y2="165" stroke="#000" stroke-width="1.5"/>
    <line x1="520" y1="165" x2="420" y2="165" stroke="#000" stroke-width="1.5"/>
    <circle cx="420" cy="165" r="2" fill="#000"/>
    <line x1="420" y1="165" x2="380" y2="165" stroke="#000" stroke-width="1.5"/>
    <text x="370" y="169" text-anchor="end" font-size="12" fill="#000">B</text>
    <!-- T1 集电极 -->
    <line x1="520" y1="145" x2="520" y2="185" stroke="#000" stroke-width="1.5"/>
    <!-- R2 - 1.6kΩ -->
    <line x1="520" y1="185" x2="520" y2="195" stroke="#000" stroke-width="1.5"/>
    <rect x="505" y="195" width="30" height="40" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="520" y="222" text-anchor="middle" font-size="10" fill="#000">R2</text>
    <text x="520" y="232" text-anchor="middle" font-size="9" fill="#000">1.6kΩ</text>
    <line x1="520" y1="235" x2="520" y2="250" stroke="#000" stroke-width="1.5"/>
    <circle cx="520" cy="252" r="3" fill="#000"/>
    <!-- T2 - 分相器 -->
    <line x1="520" y1="255" x2="520" y2="270" stroke="#000" stroke-width="1.5"/>
    <text x="440" y="272" text-anchor="end" font-size="12" fill="#000">T2</text>
    <!-- T2 基极 -->
    <line x1="520" y1="270" x2="520" y2="270" stroke="#000" stroke-width="1.5"/>
    <!-- T2 发射极 -->
    <line x1="520" y1="270" x2="520" y2="290" stroke="#000" stroke-width="1.5"/>
    <!-- R3 - 1kΩ -->
    <line x1="520" y1="290" x2="520" y2="300" stroke="#000" stroke-width="1.5"/>
    <rect x="505" y="300" width="30" height="35" fill="#fdd" stroke="#000" stroke-width="1.5"/>
    <text x="520" y="322" text-anchor="middle" font-size="10" fill="#000">R3</text>
    <text x="520" y="332" text-anchor="middle" font-size="9" fill="#000">1kΩ</text>
    <line x1="520" y1="335" x2="520" y2="350" stroke="#000" stroke-width="1.5"/>
    <circle cx="520" cy="352" r="3" fill="#000"/>
    <!-- 接地 -->
    <line x1="520" y1="355" x2="520" y2="370" stroke="#000" stroke-width="1.5"/>
    <line x1="500" y1="370" x2="540" y2="370" stroke="#000" stroke-width="2"/>
    <line x1="510" y1="376" x2="530" y2="376" stroke="#000" stroke-width="2"/>
    <line x1="518" y1="382" x2="522" y2="382" stroke="#000" stroke-width="2"/>
    <text x="540" y="375" text-anchor="start" font-size="10" fill="#000">GND</text>
    <!-- T2 集电极到 T3 基极 -->
    <line x1="520" y1="255" x2="600" y2="255" stroke="#000" stroke-width="1.5"/>
    <line x1="600" y1="255" x2="600" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="600" y1="130" x2="620" y2="130" stroke="#000" stroke-width="1.5"/>
    <circle cx="622" cy="130" r="3" fill="#000"/>
    <!-- T3 - 上管 -->
    <text x="640" y="133" text-anchor="start" font-size="12" fill="#000">T3</text>
    <line x1="625" y1="130" x2="625" y2="145" stroke="#000" stroke-width="1.5"/>
    <!-- T3 发射极 -->
    <line x1="625" y1="145" x2="625" y2="160" stroke="#000" stroke-width="1.5"/>
    <!-- D - 二极管 -->
    <polygon points="620,160 630,160 625,172" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="625" y1="172" x2="625" y2="185" stroke="#000" stroke-width="1.5"/>
    <circle cx="625" cy="187" r="3" fill="#000"/>
    <!-- T4 - 下管 -->
    <text x="640" y="230" text-anchor="start" font-size="12" fill="#000">T4</text>
    <!-- T2 发射极到 T4 基极 -->
    <line x1="520" y1="270" x2="560" y2="270" stroke="#000" stroke-width="1.5"/>
    <line x1="560" y1="270" x2="560" y2="200" stroke="#000" stroke-width="1.5"/>
    <line x1="560" y1="200" x2="590" y2="200" stroke="#000" stroke-width="1.5"/>
    <circle cx="592" cy="200" r="3" fill="#000"/>
    <line x1="595" y1="200" x2="595" y2="215" stroke="#000" stroke-width="1.5"/>
    <!-- T4 集电极 -->
    <line x1="595" y1="215" x2="595" y2="230" stroke="#000" stroke-width="1.5"/>
    <line x1="595" y1="230" x2="625" y2="230" stroke="#000" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="625" y1="230" x2="625" y2="240" stroke="#000" stroke-width="1.5"/>
    <!-- T4 发射极 -->
    <line x1="595" y1="200" x2="595" y2="185" stroke="#000" stroke-width="1.5"/>
    <!-- 输出 -->
    <line x1="625" y1="240" x2="625" y2="275" stroke="#000" stroke-width="1.5"/>
    <line x1="625" y1="275" x2="660" y2="275" stroke="#000" stroke-width="2"/>
    <text x="665" y="279" text-anchor="start" font-size="13" font-weight="bold" fill="#000">Y = A·B</text>
    <!-- 推挽输出标注 -->
    <rect x="440" y="330" width="140" height="55" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1" stroke-dasharray="3"/>
    <text x="510" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">推挽输出级</text>
    <text x="510" y="365" text-anchor="middle" font-size="10" fill="#555">T3 导通时 Vcc→输出</text>
    <text x="510" y="378" text-anchor="middle" font-size="10" fill="#555">T4 导通时 输出→GND</text>
  </g>
</svg>