<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">半导体晶格结构（共价键示意图）</text>
    <!-- 晶格节点 - 3行4列 -->
    <circle cx="100" cy="100" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="220" cy="100" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="220" y="105" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="340" cy="100" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="340" y="105" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="460" cy="100" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="460" y="105" text-anchor="middle" font-size="12" fill="#222">Si</text>

    <circle cx="100" cy="220" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="100" y="225" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="220" cy="220" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="220" y="225" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="340" cy="220" r="18" fill="#ffe0b0" stroke="#e8913a" stroke-width="2"/>
    <text x="340" y="225" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="460" cy="220" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="460" y="225" text-anchor="middle" font-size="12" fill="#222">Si</text>

    <circle cx="100" cy="340" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="100" y="345" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="220" cy="340" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="220" y="345" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="340" cy="340" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="340" y="345" text-anchor="middle" font-size="12" fill="#222">Si</text>
    <circle cx="460" cy="340" r="18" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2"/>
    <text x="460" y="345" text-anchor="middle" font-size="12" fill="#222">Si</text>

    <!-- 共价键连线（水平） -->
    <line x1="118" y1="100" x2="202" y2="100" stroke="#666" stroke-width="2"/>
    <line x1="238" y1="100" x2="322" y2="100" stroke="#666" stroke-width="2"/>
    <line x1="358" y1="100" x2="442" y2="100" stroke="#666" stroke-width="2"/>
    <line x1="118" y1="220" x2="202" y2="220" stroke="#666" stroke-width="2"/>
    <line x1="238" y1="220" x2="322" y2="220" stroke="#666" stroke-width="2"/>
    <line x1="358" y1="220" x2="442" y2="220" stroke="#666" stroke-width="2"/>
    <line x1="118" y1="340" x2="202" y2="340" stroke="#666" stroke-width="2"/>
    <line x1="238" y1="340" x2="322" y2="340" stroke="#666" stroke-width="2"/>
    <line x1="358" y1="340" x2="442" y2="340" stroke="#666" stroke-width="2"/>

    <!-- 共价键连线（垂直） -->
    <line x1="100" y1="118" x2="100" y2="202" stroke="#666" stroke-width="2"/>
    <line x1="220" y1="118" x2="220" y2="202" stroke="#666" stroke-width="2"/>
    <line x1="340" y1="118" x2="340" y2="202" stroke="#666" stroke-width="2"/>
    <line x1="460" y1="118" x2="460" y2="202" stroke="#666" stroke-width="2"/>
    <line x1="100" y1="238" x2="100" y2="322" stroke="#666" stroke-width="2"/>
    <line x1="220" y1="238" x2="220" y2="322" stroke="#666" stroke-width="2"/>
    <line x1="340" y1="238" x2="340" y2="322" stroke="#666" stroke-width="2"/>
    <line x1="460" y1="238" x2="460" y2="322" stroke="#666" stroke-width="2"/>

    <!-- 标注 - 中间高亮的Si显示掺杂 -->
    <line x1="340" y1="238" x2="340" y2="322" stroke="#e8913a" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="320" y1="220" x2="338" y2="220" stroke="#e8913a" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="342" y1="220" x2="358" y2="220" stroke="#e8913a" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- 标注：掺杂原子 -->
    <text x="340" y="270" text-anchor="middle" font-size="10" fill="#e8913a">施主杂质</text>
    <text x="340" y="282" text-anchor="middle" font-size="10" fill="#e8913a">(五价元素)</text>

    <!-- 图例 -->
    <rect x="30" y="370" width="12" height="12" fill="#d4e8ff" stroke="#4a90d9" stroke-width="1"/>
    <text x="48" y="381" font-size="11" fill="#444">Si 原子</text>
    <line x1="90" y1="376" x2="110" y2="376" stroke="#666" stroke-width="2"/>
    <text x="115" y="381" font-size="11" fill="#444">共价键</text>
  </g>
</svg>