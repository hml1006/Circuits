<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">受控源符号图</text>
    <!-- VCVS -->
    <text x="80" y="70" font-size="14" fill="#333" font-weight="bold">VCVS (电压控制电压源)</text>
    <text x="80" y="88" font-size="12" fill="#666">u₂ = μ·u₁</text>
    <!-- 菱形 -->
    <polygon points="180,120 220,145 180,170 140,145" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="145" x2="110" y2="145" stroke="#000" stroke-width="2"/>
    <line x1="220" y1="145" x2="250" y2="145" stroke="#000" stroke-width="2"/>
    <text x="165" y="140" font-size="12" fill="#333">+</text>
    <text x="195" y="140" font-size="12" fill="#333">-</text>
    <text x="255" y="140" font-size="12" fill="#333">+</text>
    <text x="265" y="140" font-size="12" fill="#333">-</text>
    <!-- 控制线 -->
    <line x1="110" y1="145" x2="110" y2="50" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- 控制端标注 -->
    <text x="80" y="48" font-size="12" fill="#666">控制电压u₁</text>

    <!-- CCVS -->
    <text x="350" y="70" font-size="14" fill="#333" font-weight="bold">CCVS (电流控制电压源)</text>
    <text x="350" y="88" font-size="12" fill="#666">u₂ = r·i₁</text>
    <polygon points="450,120 490,145 450,170 410,145" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="145" x2="380" y2="145" stroke="#000" stroke-width="2"/>
    <line x1="490" y1="145" x2="520" y2="145" stroke="#000" stroke-width="2"/>
    <text x="435" y="140" font-size="12" fill="#333">+</text>
    <text x="465" y="140" font-size="12" fill="#333">-</text>
    <!-- 控制线 -->
    <line x1="380" y1="145" x2="380" y2="50" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- 箭头 -->
    <polygon points="380,55 376,63 384,63" fill="#000"/>
    <text x="360" y="48" font-size="12" fill="#666">控制电流i₁</text>

    <!-- VCCS -->
    <text x="80" y="220" font-size="14" fill="#333" font-weight="bold">VCCS (电压控制电流源)</text>
    <text x="80" y="238" font-size="12" fill="#666">i₂ = g·u₁</text>
    <polygon points="180,270 220,295 180,320 140,295" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="295" x2="110" y2="295" stroke="#000" stroke-width="2"/>
    <line x1="220" y1="295" x2="250" y2="295" stroke="#000" stroke-width="2"/>
    <!-- 箭头 -->
    <polygon points="185,295 181,303 189,303" fill="#000"/>
    <text x="255" y="290" font-size="12" fill="#333">+</text>
    <text x="265" y="290" font-size="12" fill="#333">-</text>
    <!-- 控制线 -->
    <line x1="110" y1="295" x2="110" y2="195" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="80" y="193" font-size="12" fill="#666">控制电压u₁</text>

    <!-- CCCS -->
    <text x="350" y="220" font-size="14" fill="#333" font-weight="bold">CCCS (电流控制电流源)</text>
    <text x="350" y="238" font-size="12" fill="#666">i₂ = β·i₁</text>
    <polygon points="450,270 490,295 450,320 410,295" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="295" x2="380" y2="295" stroke="#000" stroke-width="2"/>
    <line x1="490" y1="295" x2="520" y2="295" stroke="#000" stroke-width="2"/>
    <polygon points="455,295 451,303 459,303" fill="#000"/>
    <line x1="380" y1="295" x2="380" y2="195" stroke="#000" stroke-width="1.5" stroke-dasharray="4,2"/>
    <polygon points="380,200 376,208 384,208" fill="#000"/>
    <text x="360" y="193" font-size="12" fill="#666">控制电流i₁</text>
  </g>
</svg>