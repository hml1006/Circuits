<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">带状线结构图</text>
    
    <!-- Top ground plane -->
    <rect x="50" y="50" width="500" height="40" fill="#aaa" stroke="#000" stroke-width="2" rx="2"/>
    <text x="300" y="75" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">地平面（GND）</text>
    
    <!-- Upper dielectric -->
    <rect x="50" y="90" width="500" height="80" fill="#d0e8b0" stroke="#000" stroke-width="2" rx="3"/>
    <text x="300" y="130" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">介质基板（εᵣ）</text>
    
    <!-- Signal trace (center conductor) -->
    <rect x="200" y="120" width="200" height="40" fill="#e8b800" stroke="#c80" stroke-width="2" rx="2"/>
    <text x="300" y="145" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">导体带（信号线）</text>
    
    <!-- Lower dielectric -->
    <rect x="50" y="160" width="500" height="80" fill="#d0e8b0" stroke="#000" stroke-width="2" rx="3"/>
    <text x="300" y="200" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">介质基板（εᵣ）</text>
    
    <!-- Bottom ground plane -->
    <rect x="50" y="240" width="500" height="40" fill="#aaa" stroke="#000" stroke-width="2" rx="2"/>
    <text x="300" y="265" fill="#000" font-weight="bold" text-anchor="middle" font-size="13">地平面（GND）</text>
    
    <!-- Width annotation W -->
    <line x1="200" y1="105" x2="400" y2="105" stroke="#000" stroke-width="1.5"/>
    <polygon points="200,105 208,102 208,108" fill="#000"/>
    <polygon points="400,105 392,102 392,108" fill="#000"/>
    <text x="300" y="102" text-anchor="middle" font-size="14" fill="#000" font-style="italic">W（线宽）</text>
    
    <!-- Height annotation b -->
    <line x1="460" y1="90" x2="460" y2="280" stroke="#000" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="460,90 456,98 464,98" fill="#000"/>
    <polygon points="460,280 456,272 464,272" fill="#000"/>
    <text x="478" y="190" text-anchor="middle" font-size="14" fill="#000" font-style="italic">b（地板间距）</text>
    
    <!-- Electric field lines (confined within dielectric) -->
    <path d="M 250 160 Q 250 170 250 180" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 300 160 Q 300 175 300 190" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 350 160 Q 350 170 350 180" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Magnetic field lines -->
    <path d="M 220 160 Q 250 175 280 160" fill="none" stroke="#00c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 280 160 Q 300 175 320 160" fill="none" stroke="#00c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 320 160 Q 350 175 380 160" fill="none" stroke="#00c" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Field legend -->
    <line x1="100" y1="330" x2="130" y2="330" stroke="#c00" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="140" y="334" font-size="12" fill="#c00">电场 E</text>
    <line x1="250" y1="330" x2="280" y2="330" stroke="#00c" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="290" y="334" font-size="12" fill="#00c">磁场 H</text>
    
    <!-- Mode annotation -->
    <text x="300" y="360" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">传播模式：纯 TEM 模</text>
    <text x="300" y="380" text-anchor="middle" font-size="11" fill="#666">场完全被介质包围，无色散、无辐射损耗</text>
  </g>
</svg>