<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">T型等效电路图</text>
    <!-- 左侧：耦合电感 -->
    <text x="150" y="65" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">耦合电感</text>
    <path d="M80 100 Q87 90 94 100 Q101 110 108 100 Q115 90 122 100 Q129 110 136 100 Q143 90 150 100" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="50" y1="100" x2="80" y2="100" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="150" y1="100" x2="180" y2="100" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="75" y="90" font-size="13" fill="#d32f2f">L₁</text>
    <path d="M80 200 Q87 190 94 200 Q101 210 108 200 Q115 190 122 200 Q129 210 136 200 Q143 190 150 200" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="50" y1="200" x2="80" y2="200" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="150" y1="200" x2="180" y2="200" stroke="#1976d2" stroke-width="2.5"/>
    <text x="75" y="215" font-size="13" fill="#1976d2">L₂</text>
    <!-- 磁芯耦合 -->
    <rect x="60" y="130" width="80" height="40" rx="5" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="100" y="155" text-anchor="middle" font-size="12" fill="#666">M</text>
    <!-- 箭头 -->
    <text x="230" y="160" font-size="30" fill="#333">⇒</text>
    <!-- 右侧：T型等效 -->
    <text x="430" y="65" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">T型等效电路</text>
    <!-- 节点1 -->
    <circle cx="350" cy="160" r="5" fill="#000"/>
    <text x="340" y="150" font-size="12" fill="#333">1</text>
    <!-- 节点2 -->
    <circle cx="500" cy="160" r="5" fill="#000"/>
    <text x="505" y="150" font-size="12" fill="#333">2</text>
    <!-- 节点3 -->
    <circle cx="500" cy="280" r="5" fill="#000"/>
    <text x="505" y="295" font-size="12" fill="#333">3</text>
    <!-- 节点4 -->
    <circle cx="350" cy="280" r="5" fill="#000"/>
    <text x="340" y="295" font-size="12" fill="#333">4</text>
    <!-- 电感L_a -->
    <line x1="350" y1="160" x2="380" y2="160" stroke="#000" stroke-width="2"/>
    <path d="M380 160 Q387 150 394 160 Q401 170 408 160 Q415 150 422 160 Q429 170 436 160" fill="none" stroke="#000" stroke-width="2.5"/>
    <line x1="436" y1="160" x2="460" y2="160" stroke="#000" stroke-width="2.5"/>
    <text x="395" y="150" font-size="13" fill="#333">Lₐ</text>
    <!-- 电感L_b -->
    <line x1="460" y1="160" x2="460" y2="220" stroke="#000" stroke-width="2"/>
    <path d="M460 220 Q467 210 474 220 Q481 230 488 220 Q495 210 502 220 Q509 230 516 220" fill="none" stroke="#000" stroke-width="2.5"/>
    <line x1="516" y1="220" x2="500" y2="280" stroke="#000" stroke-width="2.5"/>
    <text x="520" y="230" font-size="13" fill="#333">L_b</text>
    <!-- 电感L_c -->
    <path d="M370 280 Q377 270 384 280 Q391 290 398 280 Q405 270 412 280 Q419 290 426 280" fill="none" stroke="#000" stroke-width="2.5"/>
    <line x1="350" y1="280" x2="370" y2="280" stroke="#000" stroke-width="2.5"/>
    <line x1="426" y1="280" x2="500" y2="280" stroke="#000" stroke-width="2.5"/>
    <text x="370" y="300" font-size="13" fill="#333">L_c</text>
    <!-- 垂直连接线 -->
    <line x1="460" y1="160" x2="500" y2="160" stroke="#000" stroke-width="2"/>
    <!-- 公式 -->
    <text x="430" y="340" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">同名端相连:</text>
    <text x="430" y="360" text-anchor="middle" font-size="13" fill="#333">Lₐ = L₁ - M, L_b = L₂ - M, L_c = M</text>
    <text x="430" y="385" text-anchor="middle" font-size="13" fill="#333">异名端相连: Lₐ = L₁ + M, L_b = L₂ + M, L_c = -M</text>
  </g>
</svg>