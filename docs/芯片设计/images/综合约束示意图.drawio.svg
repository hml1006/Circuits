<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">综合约束示意图 (SDC约束)</text>
    <!-- Clock definition -->
    <rect x="20" y="45" width="560" height="55" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="300" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e88e5">时钟约束 (Clock Constraints)</text>
    <text x="40" y="85" font-size="11" fill="#333">create_clock -name clk -period 10 [get_ports clk]</text>
    <text x="40" y="98" font-size="10" fill="#666">set_clock_uncertainty -setup 0.2 | set_clock_uncertainty -hold 0.1 | set_clock_transition 0.1</text>
    <!-- Timing path diagram -->
    <text x="300" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">时序路径约束</text>
    <!-- Launch flop -->
    <rect x="30" y="140" width="80" height="40" rx="3" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="70" y="160" text-anchor="middle" font-size="10" fill="#1e88e5">发射FF</text>
    <text x="70" y="173" text-anchor="middle" font-size="9" fill="#555">Launch</text>
    <line x1="110" y1="160" x2="140" y2="160" stroke="#333" stroke-width="2"/>
    <!-- Comb logic -->
    <rect x="145" y="140" width="120" height="40" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="205" y="160" text-anchor="middle" font-size="10" fill="#e65100">组合逻辑</text>
    <text x="205" y="173" text-anchor="middle" font-size="9" fill="#555">Tlogic</text>
    <line x1="265" y1="160" x2="295" y2="160" stroke="#333" stroke-width="2"/>
    <!-- Capture flop -->
    <rect x="300" y="140" width="80" height="40" rx="3" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="340" y="160" text-anchor="middle" font-size="10" fill="#1e88e5">捕获FF</text>
    <text x="340" y="173" text-anchor="middle" font-size="9" fill="#555">Capture</text>
    <!-- Timing formula -->
    <rect x="400" y="140" width="180" height="40" rx="3" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="490" y="158" text-anchor="middle" font-size="10" fill="#c62828">建立时间约束</text>
    <text x="490" y="173" text-anchor="middle" font-size="9" fill="#c62828">Tclk &gt; Tcq+Tlogic+Tsetup</text>
    <!-- Input delay -->
    <text x="150" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">输入/输出延迟约束</text>
    <rect x="20" y="225" width="260" height="50" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="150" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">输入延迟 (Input Delay)</text>
    <text x="40" y="262" font-size="10" fill="#333">set_input_delay -clock clk -max 2.0 [get_ports data_in]</text>
    <text x="40" y="275" font-size="10" fill="#333">set_input_delay -clock clk -min 0.5 [get_ports data_in]</text>
    <rect x="320" y="225" width="260" height="50" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="450" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">输出延迟 (Output Delay)</text>
    <text x="340" y="262" font-size="10" fill="#333">set_output_delay -clock clk -max 3.0 [get_ports data_out]</text>
    <text x="340" y="275" font-size="10" fill="#333">set_output_delay -clock clk -min 0.5 [get_ports data_out]</text>
    <!-- Area and Power constraints -->
    <rect x="20" y="290" width="260" height="50" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="150" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b1fa2">面积约束</text>
    <text x="40" y="330" font-size="10" fill="#333">set_max_area 1000</text>
    <rect x="320" y="290" width="260" height="50" rx="5" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
    <text x="450" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#00838f">功耗约束</text>
    <text x="340" y="330" font-size="10" fill="#333">set_max_dynamic_power 100.0 mW</text>
    <text x="340" y="343" font-size="10" fill="#333">set_max_leakage_power 10.0 mW</text>
    <!-- Timing exceptions -->
    <rect x="20" y="350" width="560" height="42" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="300" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">时序例外 (Timing Exceptions)</text>
    <text x="40" y="387" font-size="10" fill="#555">set_false_path | set_multicycle_path -setup 2 | set_max_delay / set_min_delay</text>
  </g>
</svg>