<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">二阶有源低通滤波器（MFB结构）</text>

    <!-- 输入 -->
    <text x="30" y="180" font-size="13" fill="#333">v</text>
    <text x="30" y="190" font-size="10" fill="#333">i</text>
    <line x1="50" y1="180" x2="90" y2="180" stroke="#333" stroke-width="2"/>

    <!-- R1 -->
    <rect x="90" y="160" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="98" y="185" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="106" y="185" text-anchor="middle" font-size="10" fill="#666">1</text>
    <line x1="106" y1="180" x2="140" y2="180" stroke="#333" stroke-width="2"/>

    <!-- R2 -->
    <rect x="140" y="160" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="148" y="185" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="156" y="185" text-anchor="middle" font-size="10" fill="#666">2</text>
    <line x1="156" y1="180" x2="190" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 运放反相输入端 -->
    <line x1="190" y1="180" x2="280" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 运放 -->
    <polygon points="280,100 280,260 400,180" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <text x="310" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
    <text x="270" y="135" text-anchor="end" font-size="11" fill="#333">−</text>
    <text x="270" y="215" text-anchor="end" font-size="11" fill="#333">+</text>

    <!-- 同相端接地 -->
    <line x1="280" y1="230" x2="310" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="230" x2="310" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="280" x2="330" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="280" x2="290" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="280" x2="330" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="285" x2="330" y2="285" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="400" y1="180" x2="470" y2="180" stroke="#333" stroke-width="2"/>
    <text x="480" y="185" font-size="13" fill="#333">v</text>
    <text x="480" y="195" font-size="10" fill="#333">o</text>

    <!-- C1 反馈电容 -->
    <line x1="400" y1="180" x2="440" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="170" x2="440" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="430" y1="170" x2="450" y2="170" stroke="#333" stroke-width="3"/>
    <line x1="430" y1="190" x2="450" y2="190" stroke="#333" stroke-width="3"/>
    <text x="460" y="185" font-size="12" fill="#333">C</text>
    <text x="468" y="185" font-size="10" fill="#666">1</text>

    <!-- C1 另一端到反相输入端 -->
    <line x1="440" y1="170" x2="440" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="140" x2="230" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="140" x2="230" y2="180" stroke="#333" stroke-width="2"/>

    <!-- C2 前馈电容 -->
    <line x1="190" y1="180" x2="190" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="110" x2="190" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="110" x2="200" y2="110" stroke="#333" stroke-width="3"/>
    <line x1="180" y1="130" x2="200" y2="130" stroke="#333" stroke-width="3"/>
    <text x="205" y="118" font-size="12" fill="#333">C</text>
    <text x="213" y="118" font-size="10" fill="#666">2</text>

    <!-- C2 另一端到地 -->
    <line x1="190" y1="130" x2="190" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="280" x2="210" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="280" x2="170" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="280" x2="210" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="285" x2="210" y2="285" stroke="#333" stroke-width="2"/>

    <!-- 公式 -->
    <text x="300" y="330" text-anchor="middle" font-size="12" fill="#666">传递函数：A(s) = A</text>
    <text x="370" y="330" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="378" y="330" text-anchor="middle" font-size="12" fill="#666"> · ω</text>
    <text x="398" y="330" text-anchor="middle" font-size="12" fill="#666">c</text>
    <text x="406" y="330" text-anchor="middle" font-size="12" fill="#666">² / (s² + ω</text>
    <text x="448" y="330" text-anchor="middle" font-size="12" fill="#666">c</text>
    <text x="456" y="330" text-anchor="middle" font-size="12" fill="#666">/Q · s + ω</text>
    <text x="490" y="330" text-anchor="middle" font-size="12" fill="#666">c</text>
    <text x="498" y="330" text-anchor="middle" font-size="12" fill="#666">²)</text>

    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">ω</text>
    <text x="312" y="350" text-anchor="middle" font-size="11" fill="#666">c</text>
    <text x="320" y="350" text-anchor="middle" font-size="11" fill="#666"> = 1/√(R</text>
    <text x="345" y="350" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="352" y="350" text-anchor="middle" font-size="11" fill="#666">R</text>
    <text x="362" y="350" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="370" y="350" text-anchor="middle" font-size="11" fill="#666">C</text>
    <text x="380" y="350" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="388" y="350" text-anchor="middle" font-size="11" fill="#666">C</text>
    <text x="398" y="350" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="406" y="350" text-anchor="middle" font-size="11" fill="#666">)</text>
  </g>
</svg>