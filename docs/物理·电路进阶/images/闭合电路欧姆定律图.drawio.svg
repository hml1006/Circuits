<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">闭合电路欧姆定律示意图</text>
    
    <!-- 外电路左侧导线 -->
    <line x1="80" y1="80" x2="80" y2="320" stroke="#333" stroke-width="2.5"/>
    
    <!-- 外电路右侧导线 -->
    <line x1="520" y1="80" x2="520" y2="320" stroke="#333" stroke-width="2.5"/>
    
    <!-- 顶部导线（左到右） -->
    <line x1="80" y1="80" x2="280" y2="80" stroke="#333" stroke-width="2.5"/>
    <line x1="320" y1="80" x2="520" y2="80" stroke="#333" stroke-width="2.5"/>
    
    <!-- 底部导线（左到右） -->
    <line x1="80" y1="320" x2="280" y2="320" stroke="#333" stroke-width="2.5"/>
    <line x1="320" y1="320" x2="520" y2="320" stroke="#333" stroke-width="2.5"/>
    
    <!-- 外电阻 R -->
    <rect x="280" y="60" width="40" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="300" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">R</text>
    
    <!-- 接线到外电阻 -->
    <line x1="280" y1="80" x2="280" y2="80" stroke="#333" stroke-width="2"/>
    
    <!-- 电流方向箭头（顶部） -->
    <polygon points="200,75 215,80 200,85" fill="#333"/>
    <text x="200" y="65" text-anchor="middle" font-size="12" fill="#333" font-style="italic">I</text>
    
    <!-- 电源（底部） -->
    <!-- 电源长线（正极） -->
    <line x1="300" y1="300" x2="300" y2="260" stroke="#333" stroke-width="2.5"/>
    <!-- 电源短线（负极） -->
    <line x1="300" y1="300" x2="300" y2="340" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电源符号 -->
    <line x1="280" y1="260" x2="320" y2="260" stroke="#333" stroke-width="2.5"/>
    <line x1="290" y1="300" x2="310" y2="300" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电源标注 -->
    <text x="300" y="250" text-anchor="middle" font-size="14" fill="#333">E, r</text>
    
    <!-- 内阻标注 -->
    <text x="340" y="295" text-anchor="start" font-size="12" fill="#666">内阻 r</text>
    
    <!-- 电流方向箭头（底部） -->
    <polygon points="400,315 415,320 400,325" fill="#333"/>
    <text x="420" y="325" text-anchor="start" font-size="12" fill="#333" font-style="italic">I</text>
    
    <!-- 路端电压标注 -->
    <line x1="520" y1="80" x2="560" y2="80" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="520" y1="320" x2="560" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="570" y="205" text-anchor="middle" font-size="13" fill="#666" transform="rotate(90,570,205)">U = E - Ir</text>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#d32f2f">I = E / (R + r)</text>
  </g>
</svg>