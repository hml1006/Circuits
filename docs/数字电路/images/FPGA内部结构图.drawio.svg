    <text x="135" y="275" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="135" y="290" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="195" y="250" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
