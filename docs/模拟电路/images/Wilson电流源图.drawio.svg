<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Wilson电流源电路图</text>

    <text x="50" y="60" font-size="12" fill="#666">+V</text>
    <text x="68" y="60" font-size="10" fill="#666">CC</text>

    <!-- 参考电阻 R -->
    <line x1="50" y1="70" x2="80" y2="70" stroke="#333" stroke-width="2"/>
    <rect x="80" y="50" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="90" y="75" text-anchor="middle" font-size="12" fill="#333">R</text>
    <line x1="100" y1="70" x2="140" y2="70" stroke="#333" stroke-width="2"/>

    <!-- Q3 集电极 -->
    <line x1="140" y1="70" x2="180" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="70" x2="180" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="100" x2="180" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="180,140 190,130 190,150" fill="#333"/>
    <line x1="180" y1="140" x2="140" y2="160" stroke="#333" stroke-width="2"/>
    <text x="195" y="105" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="203" y="105" font-size="10" fill="#666">3</text>

    <line x1="140" y1="160" x2="140" y2="200" stroke="#333" stroke-width="2"/>

    <!-- Q1 集电极 (连接到 Q3 基极) -->
    <!-- Q1 基极 (连接到 Q3 发射极) -->
    <line x1="140" y1="200" x2="140" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="230" x2="140" y2="270" stroke="#333" stroke-width="2"/>
    <polygon points="140,270 150,260 150,280" fill="#333"/>
    <line x1="140" y1="270" x2="100" y2="290" stroke="#333" stroke-width="2"/>
    <text x="155" y="235" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="163" y="235" font-size="10" fill="#666">1</text>

    <line x1="100" y1="290" x2="100" y2="330" stroke="#333" stroke-width="2"/>

    <!-- Q1 基极连接线 (到 Q3 发射极) -->
    <line x1="140" y1="200" x2="120" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="200" x2="120" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="230" x2="180" y2="230" stroke="#333" stroke-width="2"/>

    <!-- Q2 输出支路 -->
    <line x1="300" y1="70" x2="340" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="70" x2="340" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="100" x2="340" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="340,140 350,130 350,150" fill="#333"/>
    <line x1="340" y1="140" x2="300" y2="160" stroke="#333" stroke-width="2"/>
    <text x="355" y="105" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="363" y="105" font-size="10" fill="#666">2</text>

    <line x1="300" y1="160" x2="300" y2="200" stroke="#333" stroke-width="2"/>

    <!-- Q2 基极连接到 Q1 基极 -->
    <line x1="120" y1="230" x2="300" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="230" x2="300" y2="270" stroke="#333" stroke-width="2"/>
    <polygon points="300,270 310,260 310,280" fill="#333"/>
    <line x1="300" y1="270" x2="260" y2="290" stroke="#333" stroke-width="2"/>

    <line x1="260" y1="290" x2="260" y2="330" stroke="#333" stroke-width="2"/>

    <!-- IREF标注 -->
    <line x1="140" y1="70" x2="140" y2="40" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="150" y="42" font-size="11" fill="#666">I</text>
    <text x="158" y="42" font-size="9" fill="#666">REF</text>

    <!-- IOUT标注 -->
    <line x1="340" y1="70" x2="340" y2="40" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="350" y="42" font-size="11" fill="#666">I</text>
    <text x="358" y="42" font-size="9" fill="#666">OUT</text>

    <!-- 地线 -->
    <line x1="100" y1="330" x2="260" y2="330" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="330" x2="100" y2="340" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="330" x2="260" y2="340" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="340" x2="280" y2="340" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="340" x2="80" y2="345" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="340" x2="120" y2="345" stroke="#333" stroke-width="2"/>
    <line x1="240" y1="340" x2="240" y2="345" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="340" x2="280" y2="345" stroke="#333" stroke-width="2"/>

    <!-- 负载 RL -->
    <rect x="400" y="50" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="410" y="75" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="418" y="75" text-anchor="middle" font-size="10" fill="#666">L</text>
    <line x1="340" y1="70" x2="400" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="420" y1="70" x2="460" y2="70" stroke="#333" stroke-width="2"/>
    <text x="470" y="75" font-size="11" fill="#666">+V</text>
    <text x="478" y="75" font-size="9" fill="#666">CC</text>

    <!-- 公式 -->
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">I</text>
    <text x="308" y="370" text-anchor="middle" font-size="12" fill="#666">OUT</text>
    <text x="325" y="370" text-anchor="middle" font-size="12" fill="#666"> = I</text>
    <text x="340" y="370" text-anchor="middle" font-size="12" fill="#666">REF</text>
    <text x="355" y="370" text-anchor="middle" font-size="12" fill="#666"> · 1/(1 + 2/β²)</text>
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">输出阻抗：r</text>
    <text x="330" y="390" text-anchor="middle" font-size="11" fill="#666">out</text>
    <text x="345" y="390" text-anchor="middle" font-size="11" fill="#666"> ≈ β·r</text>
    <text x="365" y="390" text-anchor="middle" font-size="11" fill="#666">o</text>
    <text x="372" y="390" text-anchor="middle" font-size="11" fill="#666">/2 （兆欧级）</text>
  </g>
</svg>