<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电功率示意图</text>
    
    <!-- 电功率公式 -->
    <rect x="30" y="55" width="540" height="70" rx="8" ry="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="2"/>
    <text x="300" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67e22">电功率基本公式</text>
    <text x="300" y="105" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">P = UI</text>
    <text x="300" y="120" text-anchor="middle" font-size="11" fill="#666">电功率 = 电压 × 电流</text>
    
    <!-- 推导公式 -->
    <rect x="30" y="140" width="260" height="80" rx="8" ry="8" fill="#f0f8ff" stroke="#3498db" stroke-width="2"/>
    <text x="160" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">由欧姆定律推导</text>
    <text x="160" y="190" text-anchor="middle" font-size="14" fill="#333">P = I²R</text>
    <text x="160" y="210" text-anchor="middle" font-size="11" fill="#666">适用于纯电阻电路</text>
    
    <rect x="310" y="140" width="260" height="80" rx="8" ry="8" fill="#f0f8ff" stroke="#3498db" stroke-width="2"/>
    <text x="440" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">由欧姆定律推导</text>
    <text x="440" y="190" text-anchor="middle" font-size="14" fill="#333">P = U²/R</text>
    <text x="440" y="210" text-anchor="middle" font-size="11" fill="#666">适用于纯电阻电路</text>
    
    <!-- 电路示意图 -->
    <text x="300" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">电功率测量电路</text>
    
    <!-- 电源 -->
    <rect x="40" y="310" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="52" y1="310" x2="52" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="68" y1="310" x2="68" y2="300" stroke="#333" stroke-width="2"/>
    <text x="60" y="325" text-anchor="middle" font-size="9" fill="#333">+</text>
    <text x="60" y="335" text-anchor="middle" font-size="9" fill="#333">−</text>
    
    <!-- 导线 -->
    <line x1="60" y1="300" x2="60" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="285" x2="150" y2="285" stroke="#333" stroke-width="2"/>
    
    <!-- 电流表 -->
    <rect x="150" y="270" width="30" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="165" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">A</text>
    <line x1="180" y1="285" x2="220" y2="285" stroke="#333" stroke-width="2"/>
    
    <!-- 灯泡 -->
    <circle cx="260" cy="285" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="247" y1="272" x2="273" y2="298" stroke="#333" stroke-width="2"/>
    <line x1="273" y1="272" x2="247" y2="298" stroke="#333" stroke-width="2"/>
    <text x="260" y="318" text-anchor="middle" font-size="11" fill="#555">L</text>
    
    <!-- 导线 -->
    <line x1="278" y1="285" x2="330" y2="285" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="285" x2="330" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="310" x2="100" y2="310" stroke="#333" stroke-width="2"/>
    
    <!-- 电压表 -->
    <line x1="242" y1="285" x2="242" y2="355" stroke="#333" stroke-width="2"/>
    <line x1="242" y1="355" x2="205" y2="355" stroke="#333" stroke-width="2"/>
    <rect x="175" y="340" width="30" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="190" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">V</text>
    <line x1="205" y1="355" x2="278" y2="355" stroke="#333" stroke-width="2"/>
    <line x1="278" y1="355" x2="278" y2="303" stroke="#333" stroke-width="2"/>
    
    <!-- 公式标注 -->
    <text x="420" y="290" font-size="13" font-weight="bold" fill="#e74c3c">P = U × I</text>
    <text x="420" y="310" font-size="11" fill="#666">测出U和I即可计算P</text>
    
    <!-- 额定功率说明 -->
    <rect x="30" y="370" width="540" height="25" rx="4" ry="4" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="300" y="387" text-anchor="middle" font-size="12" fill="#c0392b">额定功率：用电器在额定电压下正常工作时的功率</text>
  </g>
</svg>