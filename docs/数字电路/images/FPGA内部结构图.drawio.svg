    <text x="235" y="115" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="235" y="130" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="295" y="90" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
