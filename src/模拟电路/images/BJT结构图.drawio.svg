<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">BJT结构示意图（NPN型）</text>

    <!-- NPN结构 -->
    <!-- 集电区 N -->
    <rect x="60" y="60" width="200" height="100" fill="#ccddff" stroke="#3366cc" stroke-width="2" rx="3"/>
    <text x="160" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#3366cc">N 集电区</text>
    <!-- 基区 P -->
    <rect x="60" y="160" width="200" height="60" fill="#ffcccc" stroke="#cc3333" stroke-width="2" rx="3"/>
    <text x="160" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#cc3333">P 基区</text>
    <!-- 发射区 N -->
    <rect x="60" y="220" width="200" height="100" fill="#ccddff" stroke="#3366cc" stroke-width="2" rx="3"/>
    <text x="160" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#3366cc">N 发射区</text>

    <!-- 电极引线 -->
    <line x1="260" y1="80" x2="310" y2="80" stroke="#333" stroke-width="2"/>
    <text x="320" y="85" font-size="14" font-weight="bold" fill="#333">C 集电极</text>

    <line x1="260" y1="190" x2="310" y2="190" stroke="#333" stroke-width="2"/>
    <text x="320" y="195" font-size="14" font-weight="bold" fill="#333">B 基极</text>

    <line x1="260" y1="260" x2="310" y2="260" stroke="#333" stroke-width="2"/>
    <text x="320" y="265" font-size="14" font-weight="bold" fill="#333">E 发射极</text>

    <!-- 两个PN结标注 -->
    <line x1="60" y1="160" x2="20" y2="160" stroke="#666" stroke-width="1"/>
    <line x1="60" y1="220" x2="20" y2="220" stroke="#666" stroke-width="1"/>
    <text x="15" y="155" text-anchor="end" font-size="10" fill="#666">集电结</text>
    <text x="15" y="215" text-anchor="end" font-size="10" fill="#666">发射结</text>

    <!-- NPN电路符号 -->
    <text x="420" y="100" font-size="14" font-weight="bold" fill="#222">电路符号：</text>
    <line x1="440" y1="130" x2="440" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="190" x2="440" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="130" x2="470" y2="130" stroke="#333" stroke-width="2"/>
    <text x="475" y="135" font-size="12" font-weight="bold" fill="#333">C</text>
    <!-- 基极 -->
    <line x1="420" y1="190" x2="440" y2="190" stroke="#333" stroke-width="2"/>
    <text x="415" y="195" text-anchor="end" font-size="12" font-weight="bold" fill="#333">B</text>
    <!-- 发射极箭头 -->
    <line x1="440" y1="240" x2="470" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="240" x2="450" y2="230" stroke="#333" stroke-width="2"/>
    <text x="475" y="245" font-size="12" font-weight="bold" fill="#333">E</text>
    <!-- 箭头 -->
    <polygon points="440,240 450,230 450,250" fill="#333"/>
    <text x="455" y="218" font-size="10" fill="#666">NPN</text>

    <!-- PNP符号 -->
    <text x="420" y="290" font-size="14" font-weight="bold" fill="#222">PNP型：</text>
    <line x1="440" y1="310" x2="440" y2="370" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="310" x2="470" y2="310" stroke="#333" stroke-width="2"/>
    <text x="475" y="315" font-size="12" font-weight="bold" fill="#333">C</text>
    <line x1="420" y1="340" x2="440" y2="340" stroke="#333" stroke-width="2"/>
    <text x="415" y="345" text-anchor="end" font-size="12" font-weight="bold" fill="#333">B</text>
    <line x1="440" y1="370" x2="470" y2="370" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="370" x2="450" y2="380" stroke="#333" stroke-width="2"/>
    <polygon points="440,370 450,360 450,380" fill="#333"/>
    <text x="475" y="375" font-size="12" font-weight="bold" fill="#333">E</text>
    <text x="455" y="348" font-size="10" fill="#666">PNP</text>
  </g>
</svg>