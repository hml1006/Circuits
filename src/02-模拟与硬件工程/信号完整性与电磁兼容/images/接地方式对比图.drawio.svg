<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">接地方式对比</text>
    
    <!-- ===== Single-point series (left) ===== -->
    <text x="150" y="55" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">串联单点接地</text>
    
    <!-- Circuit blocks -->
    <rect x="40" y="80" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="65" y="99" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路1</text>
    <rect x="100" y="80" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="125" y="99" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路2</text>
    <rect x="160" y="80" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="185" y="99" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路3</text>
    
    <!-- Ground bus (series) -->
    <line x1="65" y1="110" x2="65" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="125" y1="110" x2="125" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="185" y1="110" x2="185" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="65" y1="140" x2="125" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="125" y1="140" x2="185" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="185" y1="140" x2="220" y2="140" stroke="#000" stroke-width="2"/>
    
    <!-- Ground point -->
    <line x1="220" y1="140" x2="220" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="210" y1="155" x2="230" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="215" y1="160" x2="225" y2="160" stroke="#000" stroke-width="2"/>
    <line x1="218" y1="165" x2="222" y2="165" stroke="#000" stroke-width="2"/>
    
    <text x="150" y="185" text-anchor="middle" font-size="10" fill="#666">简单，但存在共阻抗耦合</text>
    <text x="150" y="198" text-anchor="middle" font-size="10" fill="#666">电路1 → 2 → 3 地电位依次升高</text>
    
    <!-- ===== Single-point parallel (middle) ===== -->
    <text x="150" y="225" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">并联单点接地</text>
    
    <rect x="40" y="250" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="65" y="269" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路1</text>
    <rect x="100" y="250" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="125" y="269" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路2</text>
    <rect x="160" y="250" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="185" y="269" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路3</text>
    
    <!-- Independent ground wires -->
    <line x1="65" y1="280" x2="65" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="125" y1="280" x2="125" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="185" y1="280" x2="185" y2="330" stroke="#000" stroke-width="2"/>
    
    <!-- Common point -->
    <line x1="40" y1="330" x2="210" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="125" y1="330" x2="125" y2="345" stroke="#000" stroke-width="2"/>
    <line x1="115" y1="345" x2="135" y2="345" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="350" x2="130" y2="350" stroke="#000" stroke-width="2"/>
    <line x1="123" y1="355" x2="127" y2="355" stroke="#000" stroke-width="2"/>
    
    <text x="150" y="370" text-anchor="middle" font-size="10" fill="#666">无共阻抗耦合，但布线复杂</text>
    <text x="150" y="383" text-anchor="middle" font-size="10" fill="#666">适用于低频（&lt; 1 MHz）</text>
    
    <!-- ===== Multi-point (right) ===== -->
    <text x="450" y="55" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">多点接地</text>
    
    <rect x="380" y="80" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="405" y="99" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路1</text>
    <rect x="440" y="80" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="465" y="99" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路2</text>
    <rect x="500" y="80" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="525" y="99" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路3</text>
    
    <!-- Ground plane -->
    <rect x="370" y="130" width="190" height="30" fill="#aaa" stroke="#000" stroke-width="1.5" rx="2"/>
    <text x="465" y="150" text-anchor="middle" font-size="11" fill="#000" font-weight="bold">地平面</text>
    
    <!-- Connections to ground plane -->
    <line x1="405" y1="110" x2="405" y2="130" stroke="#000" stroke-width="2"/>
    <line x1="465" y1="110" x2="465" y2="130" stroke="#000" stroke-width="2"/>
    <line x1="525" y1="110" x2="525" y2="130" stroke="#000" stroke-width="2"/>
    
    <text x="450" y="185" text-anchor="middle" font-size="10" fill="#666">各电路就近接入地平面</text>
    <text x="450" y="198" text-anchor="middle" font-size="10" fill="#666">低阻抗，适用于高频（&gt; 10 MHz）</text>
    
    <!-- ===== Mixed grounding (right bottom) ===== -->
    <text x="450" y="225" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">混合接地</text>
    
    <rect x="380" y="250" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="405" y="269" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路1</text>
    <rect x="440" y="250" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="465" y="269" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路2</text>
    <rect x="500" y="250" width="50" height="30" fill="#d0e0ff" stroke="#00c" stroke-width="1.5" rx="3"/>
    <text x="525" y="269" text-anchor="middle" font-size="10" fill="#00c" font-weight="bold">电路3</text>
    
    <line x1="405" y1="280" x2="405" y2="310" stroke="#000" stroke-width="2"/>
    <line x1="465" y1="280" x2="465" y2="310" stroke="#000" stroke-width="2"/>
    <line x1="525" y1="280" x2="525" y2="310" stroke="#000" stroke-width="2"/>
    
    <rect x="370" y="310" width="190" height="30" fill="#aaa" stroke="#000" stroke-width="1.5" rx="2"/>
    <text x="465" y="330" text-anchor="middle" font-size="11" fill="#000" font-weight="bold">地平面</text>
    
    <!-- Capacitor coupling -->
    <line x1="465" y1="310" x2="465" y2="295" stroke="#000" stroke-width="1"/>
    <line x1="460" y1="295" x2="470" y2="295" stroke="#000" stroke-width="1"/>
    <line x1="460" y1="290" x2="470" y2="290" stroke="#000" stroke-width="1"/>
    <text x="480" y="298" font-size="10" fill="#000">C</text>
    
    <text x="450" y="370" text-anchor="middle" font-size="10" fill="#666">低频单点 + 高频电容耦合</text>
    <text x="450" y="383" text-anchor="middle" font-size="10" fill="#666">宽频带接地，数字/模拟混合</text>
  </g>
</svg>