<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">RLC并联电路图</text>
    <!-- 电流源 -->
    <circle cx="80" cy="200" r="22" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="185" x2="80" y2="200" stroke="#000" stroke-width="2"/>
    <polygon points="80,200 76,208 84,208" fill="#000"/>
    <line x1="80" y1="215" x2="80" y2="222" stroke="#000" stroke-width="2"/>
    <text x="50" y="195" font-size="14" fill="#d32f2f">i_s</text>
    <!-- 顶部导线 -->
    <line x1="102" y1="200" x2="500" y2="200" stroke="#000" stroke-width="2"/>
    <!-- 电阻R并联 -->
    <line x1="140" y1="200" x2="140" y2="130" stroke="#000" stroke-width="2"/>
    <rect x="125" y="130" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="150" x2="140" y2="200" stroke="#000" stroke-width="2"/>
    <text x="155" y="150" font-size="14" fill="#333">R</text>
    <!-- 电感L并联 -->
    <line x1="260" y1="200" x2="260" y2="130" stroke="#000" stroke-width="2"/>
    <path d="M250 130 Q257 120 264 130 Q271 140 278 130 Q285 120 292 130 Q299 140 306 130 Q313 120 320 130" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="130" x2="320" y2="200" stroke="#000" stroke-width="2"/>
    <text x="330" y="150" font-size="14" fill="#333">L</text>
    <!-- 电容C并联 -->
    <line x1="410" y1="200" x2="410" y2="130" stroke="#000" stroke-width="2"/>
    <line x1="395" y1="130" x2="395" y2="150" stroke="#000" stroke-width="2"/>
    <line x1="425" y1="130" x2="425" y2="150" stroke="#000" stroke-width="2"/>
    <line x1="395" y1="150" x2="425" y2="150" stroke="#000" stroke-width="2"/>
    <line x1="395" y1="150" x2="395" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="425" y1="150" x2="425" y2="200" stroke="#000" stroke-width="2"/>
    <text x="435" y="150" font-size="14" fill="#333">C</text>
    <!-- 底部导线 -->
    <line x1="80" y1="280" x2="500" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="222" x2="80" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="200" x2="140" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="200" x2="260" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="200" x2="410" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="200" x2="500" y2="280" stroke="#000" stroke-width="2"/>
    <!-- 电流方向 -->
    <polygon points="140,185 148,190 140,195" fill="#d32f2f"/>
    <polygon points="260,185 268,190 260,195" fill="#d32f2f"/>
    <polygon points="410,185 418,190 410,195" fill="#d32f2f"/>
    <text x="155" y="180" font-size="12" fill="#d32f2f">i_R</text>
    <text x="275" y="180" font-size="12" fill="#d32f2f">i_L</text>
    <text x="425" y="180" font-size="12" fill="#d32f2f">i_C</text>
    <!-- 微分方程 -->
    <text x="300" y="330" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">LC·d²i_L/dt² + (L/R)·di_L/dt + i_L = i_s</text>
    <text x="300" y="360" text-anchor="middle" font-size="13" fill="#333">特征根: s₁,₂ = -1/(2RC) ± √[(1/(2RC))² - 1/(LC)]</text>
    <text x="300" y="385" text-anchor="middle" font-size="12" fill="#666">与RLC串联电路呈对偶关系</text>
  </g>
</svg>