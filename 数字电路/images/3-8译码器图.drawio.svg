<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">3线-8线译码器</text>
    <!-- 译码器主体 -->
    <rect x="180" y="60" width="140" height="280" rx="5" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="250" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">译码器</text>
    <text x="250" y="220" text-anchor="middle" font-size="12" fill="#000">74LS138</text>
    <!-- 输入 -->
    <text x="160" y="95" text-anchor="end" font-size="13" font-weight="bold" fill="#000">A₂ (MSB)</text>
    <text x="160" y="145" text-anchor="end" font-size="13" font-weight="bold" fill="#000">A₁</text>
    <text x="160" y="195" text-anchor="end" font-size="13" font-weight="bold" fill="#000">A₀ (LSB)</text>
    <line x1="170" y1="90" x2="180" y2="90" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="140" x2="180" y2="140" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="190" x2="180" y2="190" stroke="#000" stroke-width="1.5"/>
    <!-- 使能端 -->
    <text x="160" y="245" text-anchor="end" font-size="11" fill="#000">E₁</text>
    <text x="160" y="265" text-anchor="end" font-size="11" fill="#000">E₂</text>
    <text x="160" y="285" text-anchor="end" font-size="11" fill="#000">E₃</text>
    <line x1="170" y1="240" x2="180" y2="240" stroke="#000" stroke-width="1"/>
    <line x1="170" y1="260" x2="180" y2="260" stroke="#000" stroke-width="1"/>
    <line x1="170" y1="280" x2="180" y2="280" stroke="#000" stroke-width="1"/>
    <circle cx="183" cy="240" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="183" cy="260" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <!-- 输出 -->
    <text x="340" y="78" text-anchor="start" font-size="11" fill="#000">Y₀</text>
    <text x="340" y="98" text-anchor="start" font-size="11" fill="#000">Y₁</text>
    <text x="340" y="118" text-anchor="start" font-size="11" fill="#000">Y₂</text>
    <text x="340" y="138" text-anchor="start" font-size="11" fill="#000">Y₃</text>
    <text x="340" y="158" text-anchor="start" font-size="11" fill="#000">Y₄</text>
    <text x="340" y="178" text-anchor="start" font-size="11" fill="#000">Y₅</text>
    <text x="340" y="198" text-anchor="start" font-size="11" fill="#000">Y₆</text>
    <text x="340" y="218" text-anchor="start" font-size="11" fill="#000">Y₇</text>
    <line x1="320" y1="75" x2="335" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="95" x2="335" y2="95" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="115" x2="335" y2="115" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="135" x2="335" y2="135" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="155" x2="335" y2="155" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="175" x2="335" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="195" x2="335" y2="195" stroke="#000" stroke-width="1.5"/>
    <line x1="320" y1="215" x2="335" y2="215" stroke="#000" stroke-width="1.5"/>
    <!-- 输出端的圆圈（低电平有效） -->
    <circle cx="323" cy="75" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="95" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="115" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="135" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="155" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="175" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="195" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <circle cx="323" cy="215" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <!-- 真值表 -->
    <rect x="30" y="305" width="540" height="80" rx="5" fill="#f0fff0" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">真值表（使能有效时）</text>
    <line x1="60" y1="332" x2="540" y2="332" stroke="#000" stroke-width="1"/>
    <text x="100" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">A₂A₁A₀</text>
    <text x="200" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">Y₇Y₆Y₅Y₄Y₃Y₂Y₁Y₀</text>
    <text x="400" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">有效输出</text>
    <line x1="150" y1="332" x2="150" y2="385" stroke="#000" stroke-width="1"/>
    <line x1="300" y1="332" x2="300" y2="385" stroke="#000" stroke-width="1"/>
    <text x="100" y="368" text-anchor="middle" font-size="11" fill="#000">000</text>
    <text x="230" y="368" text-anchor="middle" font-size="11" fill="#000">11111110</text>
    <text x="400" y="368" text-anchor="middle" font-size="11" fill="#000">Y₀=0</text>
    <text x="100" y="385" text-anchor="middle" font-size="11" fill="#000">001</text>
    <text x="230" y="385" text-anchor="middle" font-size="11" fill="#000">11111101</text>
    <text x="400" y="385" text-anchor="middle" font-size="11" fill="#000">Y₁=0</text>
    <text x="100" y="402" text-anchor="middle" font-size="11" fill="#000">111</text>
    <text x="230" y="402" text-anchor="middle" font-size="11" fill="#000">01111111</text>
    <text x="400" y="402" text-anchor="middle" font-size="11" fill="#000">Y₇=0</text>
  </g>
</svg>