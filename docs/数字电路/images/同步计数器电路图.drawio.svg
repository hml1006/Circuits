<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">4位同步二进制计数器</text>
    <!-- 时钟线 -->
    <line x1="60" y1="80" x2="560" y2="80" stroke="#000" stroke-width="2"/>
    <text x="50" y="84" text-anchor="end" font-size="12" font-weight="bold" fill="#000">CP</text>
    <line x1="60" y1="80" x2="60" y2="320" stroke="#000" stroke-width="1" stroke-dasharray="4"/>
    <line x1="180" y1="80" x2="180" y2="320" stroke="#000" stroke-width="1" stroke-dasharray="4"/>
    <line x1="300" y1="80" x2="300" y2="320" stroke="#000" stroke-width="1" stroke-dasharray="4"/>
    <line x1="420" y1="80" x2="420" y2="320" stroke="#000" stroke-width="1" stroke-dasharray="4"/>
    <line x1="540" y1="80" x2="540" y2="320" stroke="#000" stroke-width="1" stroke-dasharray="4"/>
    <!-- FF0 -->
    <rect x="80" y="110" width="80" height="70" rx="4" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="120" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">FF₀</text>
    <text x="120" y="155" text-anchor="middle" font-size="10" fill="#000">J=K=1</text>
    <text x="120" y="170" text-anchor="middle" font-size="10" fill="#000">(T型)</text>
    <line x1="80" y1="130" x2="50" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="134" text-anchor="end" font-size="11" fill="#000">J</text>
    <line x1="80" y1="150" x2="50" y2="150" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="154" text-anchor="end" font-size="11" fill="#000">K</text>
    <line x1="80" y1="170" x2="60" y2="170" stroke="#000" stroke-width="1.5"/>
    <line x1="160" y1="130" x2="190" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="195" y="134" text-anchor="start" font-size="11" fill="#000">Q₀</text>
    <line x1="160" y1="170" x2="190" y2="170" stroke="#000" stroke-width="1.5"/>
    <text x="195" y="174" text-anchor="start" font-size="11" fill="#000">Q̄₀</text>
    <!-- FF1 -->
    <rect x="200" y="110" width="80" height="70" rx="4" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="240" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">FF₁</text>
    <text x="240" y="155" text-anchor="middle" font-size="10" fill="#000">J=K=Q₀</text>
    <line x1="200" y1="130" x2="170" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="160" y="134" text-anchor="end" font-size="11" fill="#000">J</text>
    <line x1="200" y1="150" x2="170" y2="150" stroke="#000" stroke-width="1.5"/>
    <text x="160" y="154" text-anchor="end" font-size="11" fill="#000">K</text>
    <line x1="280" y1="130" x2="310" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="315" y="134" text-anchor="start" font-size="11" fill="#000">Q₁</text>
    <line x1="280" y1="170" x2="310" y2="170" stroke="#000" stroke-width="1.5"/>
    <text x="315" y="174" text-anchor="start" font-size="11" fill="#000">Q̄₁</text>
    <!-- FF2 -->
    <rect x="320" y="110" width="80" height="70" rx="4" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="360" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">FF₂</text>
    <text x="360" y="155" text-anchor="middle" font-size="10" fill="#000">J=K=Q₀Q₁</text>
    <line x1="320" y1="130" x2="290" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="280" y="134" text-anchor="end" font-size="11" fill="#000">J</text>
    <line x1="320" y1="150" x2="290" y2="150" stroke="#000" stroke-width="1.5"/>
    <text x="280" y="154" text-anchor="end" font-size="11" fill="#000">K</text>
    <line x1="400" y1="130" x2="430" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="435" y="134" text-anchor="start" font-size="11" fill="#000">Q₂</text>
    <line x1="400" y1="170" x2="430" y2="170" stroke="#000" stroke-width="1.5"/>
    <text x="435" y="174" text-anchor="start" font-size="11" fill="#000">Q̄₂</text>
    <!-- FF3 -->
    <rect x="440" y="110" width="80" height="70" rx="4" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="480" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">FF₃</text>
    <text x="480" y="155" text-anchor="middle" font-size="10" fill="#000">J=K=Q₀Q₁Q₂</text>
    <line x1="440" y1="130" x2="410" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="400" y="134" text-anchor="end" font-size="11" fill="#000">J</text>
    <line x1="440" y1="150" x2="410" y2="150" stroke="#000" stroke-width="1.5"/>
    <text x="400" y="154" text-anchor="end" font-size="11" fill="#000">K</text>
    <line x1="520" y1="130" x2="550" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="555" y="134" text-anchor="start" font-size="11" fill="#000">Q₃</text>
    <line x1="520" y1="170" x2="550" y2="170" stroke="#000" stroke-width="1.5"/>
    <text x="555" y="174" text-anchor="start" font-size="11" fill="#000">Q̄₃</text>
    <!-- 连接线 Q0 -> FF1 -->
    <line x1="190" y1="130" x2="190" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="220" x2="170" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="150" x2="170" y2="220" stroke="#000" stroke-width="1.5"/>
    <!-- 连接线 Q0Q1 -> FF2 -->
    <line x1="310" y1="130" x2="310" y2="240" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="220" x2="190" y2="260" stroke="#000" stroke-width="1.5"/>
    <line x1="190" y1="260" x2="310" y2="260" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="260" x2="310" y2="240" stroke="#000" stroke-width="1.5"/>
    <line x1="290" y1="150" x2="290" y2="240" stroke="#000" stroke-width="1.5"/>
    <!-- 连接线 Q0Q1Q2 -> FF3 -->
    <line x1="430" y1="130" x2="430" y2="280" stroke="#000" stroke-width="1.5"/>
    <line x1="430" y1="280" x2="410" y2="280" stroke="#000" stroke-width="1.5"/>
    <line x1="410" y1="150" x2="410" y2="280" stroke="#000" stroke-width="1.5"/>
    <!-- 状态方程 -->
    <rect x="30" y="310" width="540" height="75" rx="5" fill="#f0fff0" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">状态方程</text>
    <text x="50" y="355" text-anchor="start" font-size="12" fill="#000">Q₀ⁿ⁺¹ = Q̄₀ⁿ</text>
    <text x="200" y="355" text-anchor="start" font-size="12" fill="#000">Q₁ⁿ⁺¹ = Q₀ⁿ ⊕ Q₁ⁿ</text>
    <text x="380" y="355" text-anchor="start" font-size="12" fill="#000">Q₂ⁿ⁺¹ = (Q₀ⁿ·Q₁ⁿ) ⊕ Q₂ⁿ</text>
    <text x="50" y="375" text-anchor="start" font-size="12" fill="#000">Q₃ⁿ⁺¹ = (Q₀ⁿ·Q₁ⁿ·Q₂ⁿ) ⊕ Q₃ⁿ</text>
  </g>
</svg>