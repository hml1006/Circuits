<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">电源输出功率曲线</text>
    
    <!-- 坐标轴 -->
    <line x1="80" y1="330" x2="560" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80" y1="330" x2="80" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 轴标签 -->
    <text x="560" y="350" text-anchor="end" font-size="14" fill="#333" font-style="italic">R</text>
    <text x="60" y="40" text-anchor="middle" font-size="14" fill="#333" font-style="italic">P</text>
    
    <!-- 刻度 -->
    <line x1="80" y1="330" x2="560" y2="330" stroke="#ccc" stroke-width="1"/>
    
    <!-- 曲线 P = E²R/(R+r)² -->
    <path d="M 80,328 Q 120,328 160,300 Q 200,240 240,150 Q 260,90 280,50 Q 290,32 300,30 Q 310,32 320,50 Q 340,90 360,150 Q 400,240 440,300 Q 480,328 520,328" fill="none" stroke="#d32f2f" stroke-width="3"/>
    
    <!-- 最大值点 -->
    <circle cx="300" cy="30" r="5" fill="#d32f2f"/>
    <line x1="300" y1="30" x2="300" y2="330" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="5,3"/>
    
    <!-- R=r 标注 -->
    <text x="300" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#d32f2f">R = r</text>
    
    <!-- Pmax 标注 -->
    <line x1="80" y1="30" x2="295" y2="30" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="35" text-anchor="end" font-size="12" fill="#666">Pmax</text>
    
    <!-- 公式 -->
    <text x="300" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">P<tspan font-size="10" dy="4">出</tspan><tspan dy="-4"> = E²R/(R+r)²</tspan></text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">当 R = r 时，P<tspan font-size="9" dy="3">出,max</tspan><tspan dy="-3"> = E²/(4r)</tspan></text>
  </g>
</svg>