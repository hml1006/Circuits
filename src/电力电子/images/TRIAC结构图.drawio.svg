<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">TRIAC 结构图</text>
    
    <!-- Left: Structure diagram -->
    <text x="150" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">等效结构</text>
    
    <!-- N layer -->
    <rect x="80" y="70" width="120" height="40" fill="#ccccee" stroke="#33c" stroke-width="2" rx="2"/>
    <text x="140" y="95" text-anchor="middle" font-size="13" fill="#33c" font-weight="bold">N</text>
    
    <!-- P layer -->
    <rect x="80" y="110" width="120" height="40" fill="#ffcccc" stroke="#c00" stroke-width="2" rx="2"/>
    <text x="140" y="135" text-anchor="middle" font-size="13" fill="#c00" font-weight="bold">P</text>
    
    <!-- N- layer -->
    <rect x="80" y="150" width="120" height="40" fill="#ccccee" stroke="#33c" stroke-width="2" rx="2"/>
    <text x="140" y="175" text-anchor="middle" font-size="13" fill="#33c" font-weight="bold">N⁻</text>
    
    <!-- P layer bottom -->
    <rect x="80" y="190" width="120" height="40" fill="#ffcccc" stroke="#c00" stroke-width="2" rx="2"/>
    <text x="140" y="215" text-anchor="middle" font-size="13" fill="#c00" font-weight="bold">P</text>
    
    <!-- N region on right side -->
    <rect x="200" y="110" width="40" height="80" fill="#ccccee" stroke="#33c" stroke-width="2" rx="2"/>
    <text x="220" y="155" text-anchor="middle" font-size="11" fill="#33c">N</text>
    
    <!-- Terminals -->
    <line x1="140" y1="70" x2="140" y2="50" stroke="#000" stroke-width="2"/>
    <text x="155" y="54" font-size="13" fill="#000" font-weight="bold">MT2</text>
    
    <line x1="140" y1="230" x2="140" y2="250" stroke="#000" stroke-width="2"/>
    <text x="155" y="254" font-size="13" fill="#000" font-weight="bold">MT1</text>
    
    <line x1="220" y1="150" x2="250" y2="150" stroke="#000" stroke-width="2"/>
    <text x="260" y="154" font-size="13" fill="#000" font-weight="bold">G</text>
    
    <!-- Right: Equivalent circuit (two anti-parallel SCRs) -->
    <text x="420" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">等效电路（反并联）</text>
    
    <!-- SCR1 (forward) -->
    <polygon points="380,130 380,210 340,170" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="130" x2="380" y2="210" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="170" x2="430" y2="220" stroke="#000" stroke-width="2"/>
    
    <!-- SCR2 (reverse, flipped) -->
    <polygon points="460,210 460,130 500,170" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="460" y1="130" x2="460" y2="210" stroke="#000" stroke-width="2"/>
    <line x1="460" y1="170" x2="410" y2="220" stroke="#000" stroke-width="2"/>
    
    <!-- Top connection -->
    <line x1="340" y1="130" x2="500" y2="130" stroke="#000" stroke-width="2"/>
    <text x="420" y="120" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">MT2</text>
    
    <!-- Bottom connection -->
    <line x1="340" y1="210" x2="500" y2="210" stroke="#000" stroke-width="2"/>
    <text x="420" y="225" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">MT1</text>
    
    <!-- Gate -->
    <line x1="430" y1="220" x2="470" y2="260" stroke="#000" stroke-width="2"/>
    <text x="480" y="264" font-size="13" fill="#000" font-weight="bold">G</text>
    
    <!-- Circuit symbol (right side) -->
    <text x="420" y="310" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">电路符号</text>
    
    <line x1="380" y1="320" x2="460" y2="320" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="370" x2="460" y2="370" stroke="#000" stroke-width="2"/>
    <polygon points="420,320 420,370 390,345" fill="none" stroke="#000" stroke-width="2"/>
    <polygon points="420,370 420,320 450,345" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="420" y1="345" x2="460" y2="390" stroke="#000" stroke-width="2"/>
    
    <text x="370" y="316" font-size="12" fill="#000" font-weight="bold">MT2</text>
    <text x="370" y="375" font-size="12" fill="#000" font-weight="bold">MT1</text>
    <text x="470" y="394" font-size="12" fill="#000" font-weight="bold">G</text>
    
    <text x="300" y="395" text-anchor="middle" font-size="11" fill="#666">双向导通 | 四种触发模式（I⁺, I⁻, III⁺, III⁻）</text>
  </g>
</svg>