<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">楞次定律示意图</text>
    
    <!-- 左侧：磁铁靠近 -->
    <text x="140" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">磁铁靠近（Φ↑）</text>
    
    <!-- 条形磁铁 N -->
    <rect x="40" y="120" width="80" height="30" rx="6" ry="6" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="80" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">N</text>
    
    <!-- 运动方向 -->
    <line x1="120" y1="135" x2="155" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="138" y="125" text-anchor="middle" font-size="10" fill="#333" font-style="italic">v</text>
    
    <!-- 线圈 -->
    <circle cx="210" cy="135" r="35" fill="none" stroke="#e6b800" stroke-width="2.5"/>
    <text x="210" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6b800">线圈</text>
    
    <!-- 感应电流磁场方向（向上） -->
    <line x1="210" y1="170" x2="210" y2="200" stroke="#4dabf7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="220" y="195" text-anchor="start" font-size="10" fill="#4dabf7">B<tspan font-size="8" dy="3">感</tspan><tspan dy="-3">（向上，阻碍）</tspan></tspan></text>
    
    <!-- 原磁场方向 -->
    <line x1="210" y1="100" x2="210" y2="70" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="220" y="75" text-anchor="start" font-size="10" fill="#d32f2f">B<tspan font-size="8" dy="3">原</tspan><tspan dy="-3">（向下）</tspan></tspan></text>
    
    <text x="210" y="260" text-anchor="middle" font-size="11" fill="#d32f2f">增反：B<tspan font-size="8" dy="3">感</tspan><tspan dy="-3">与B<tspan font-size="8" dy="3">原</tspan><tspan dy="-3">方向相反</tspan></tspan></tspan></text>
    
    <!-- 右侧：磁铁远离 -->
    <text x="440" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">磁铁远离（Φ↓）</text>
    
    <!-- 条形磁铁 N -->
    <rect x="470" y="120" width="80" height="30" rx="6" ry="6" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="510" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">N</text>
    
    <!-- 运动方向 -->
    <line x1="470" y1="135" x2="435" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="453" y="125" text-anchor="middle" font-size="10" fill="#333" font-style="italic">v</text>
    
    <!-- 线圈 -->
    <circle cx="390" cy="135" r="35" fill="none" stroke="#e6b800" stroke-width="2.5"/>
    <text x="390" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#e6b800">线圈</text>
    
    <!-- 感应电流磁场方向（向下） -->
    <line x1="390" y1="100" x2="390" y2="70" stroke="#4dabf7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="335" y="75" text-anchor="end" font-size="10" fill="#4dabf7">B<tspan font-size="8" dy="3">感</tspan><tspan dy="-3">（向下，阻碍）</tspan></tspan></text>
    
    <!-- 原磁场方向 -->
    <line x1="390" y1="170" x2="390" y2="200" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="335" y="195" text-anchor="end" font-size="10" fill="#d32f2f">B<tspan font-size="8" dy="3">原</tspan><tspan dy="-3">（向下）</tspan></tspan></text>
    
    <text x="390" y="260" text-anchor="middle" font-size="11" fill="#d32f2f">减同：B<tspan font-size="8" dy="3">感</tspan><tspan dy="-3">与B<tspan font-size="8" dy="3">原</tspan><tspan dy="-3">方向相同</tspan></tspan></tspan></text>
    
    <!-- 核心公式 -->
    <text x="300" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">楞次定律：增反减同</text>
    <text x="300" y="345" text-anchor="middle" font-size="13" fill="#333">感应电流的磁场总是阻碍磁通量的变化</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">本质：能量守恒定律在电磁感应中的体现</text>
  </g>
</svg>