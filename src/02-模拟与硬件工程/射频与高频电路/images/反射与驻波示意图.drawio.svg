<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">反射与驻波示意图</text>
    
    <!-- Transmission line diagram -->
    <rect x="50" y="50" width="500" height="50" fill="#f0f8ff" stroke="#000" stroke-width="1.5" rx="3"/>
    <text x="300" y="80" text-anchor="middle" font-size="13" fill="#000">传输线</text>
    
    <!-- Source -->
    <rect x="20" y="48" width="30" height="54" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="3"/>
    <text x="35" y="80" text-anchor="middle" font-size="11" fill="#c00">源</text>
    
    <!-- Load -->
    <rect x="550" y="48" width="30" height="54" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="565" y="80" text-anchor="middle" font-size="11" fill="#080">负载</text>
    
    <!-- Incident wave arrow -->
    <line x1="55" y1="60" x2="545" y2="60" stroke="#00c" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="300" y="55" text-anchor="middle" font-size="12" fill="#00c">入射波 V⁺</text>
    
    <!-- Reflected wave arrow -->
    <line x1="545" y1="95" x2="55" y2="95" stroke="#c00" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="300" y="112" text-anchor="middle" font-size="12" fill="#c00">反射波 V⁻</text>
    
    <defs>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00c"/>
      </marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c00"/>
      </marker>
    </defs>
    
    <!-- Standing wave pattern -->
    <text x="300" y="145" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">驻波模式（失配时）</text>
    
    <!-- Axes -->
    <line x1="50" y1="370" x2="550" y2="370" stroke="#000" stroke-width="1.5"/>
    <polygon points="550,370 542,366 542,374" fill="#000"/>
    <text x="555" y="374" font-size="11" fill="#000">z</text>
    
    <line x1="50" y1="180" x2="50" y2="370" stroke="#000" stroke-width="1.5"/>
    <polygon points="50,180 46,188 54,188" fill="#000"/>
    <text x="40" y="178" text-anchor="middle" font-size="11" fill="#000">|V|</text>
    
    <!-- Standing wave envelope (sinusoidal) -->
    <path d="M 50 275 C 80 275, 100 275, 130 275 C 160 275, 180 275, 210 275 C 240 275, 260 275, 290 275 C 320 275, 340 275, 370 275 C 400 275, 420 275, 450 275 C 480 275, 500 275, 530 275" fill="none" stroke="#00c" stroke-width="2"/>
    
    <path d="M 50 220 C 80 220, 100 220, 130 220 C 160 220, 180 220, 210 220 C 240 220, 260 220, 290 220 C 320 220, 340 220, 370 220 C 400 220, 420 220, 450 220 C 480 220, 500 220, 530 220" fill="none" stroke="#00c" stroke-width="2"/>
    
    <!-- Actually let me draw a proper standing wave - a sinusoidal envelope -->
    <path d="M 50 275 
             C 80 275, 90 275, 130 275
             C 160 275, 170 220, 210 220
             C 240 220, 250 275, 290 275
             C 320 275, 330 220, 370 220
             C 400 220, 410 275, 450 275
             C 480 275, 490 220, 530 220" fill="none" stroke="#00c" stroke-width="2.5"/>
    
    <path d="M 50 275 
             C 80 275, 90 320, 130 320
             C 160 320, 170 275, 210 275
             C 240 275, 250 320, 290 320
             C 320 320, 330 275, 370 275
             C 400 275, 410 320, 450 320
             C 480 320, 490 275, 530 275" fill="none" stroke="#c00" stroke-width="2.5" stroke-dasharray="5,3"/>
    
    <!-- Labels -->
    <text x="210" y="215" text-anchor="middle" font-size="11" fill="#00c">Vₘₐₓ（波腹）</text>
    <text x="290" y="290" text-anchor="middle" font-size="11" fill="#00c">Vₘᵢₙ（波节）</text>
    
    <!-- Vmax / Vmin arrows -->
    <line x1="210" y1="222" x2="210" y2="235" stroke="#00c" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="272" x2="290" y2="260" stroke="#00c" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- VSWR annotation -->
    <text x="450" y="340" text-anchor="middle" font-size="12" fill="#000">VSWR = Vₘₐₓ / Vₘᵢₙ</text>
    
    <!-- Reflection coefficient formula -->
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#666">Γ = (Z_L - Z₀)/(Z_L + Z₀) | VSWR = (1+|Γ|)/(1-|Γ|)</text>
  </g>
</svg>