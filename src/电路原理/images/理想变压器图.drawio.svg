<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">理想变压器图</text>
    <!-- 磁芯（两条竖线） -->
    <line x1="250" y1="80" x2="250" y2="320" stroke="#000" stroke-width="3"/>
    <line x1="270" y1="80" x2="270" y2="320" stroke="#000" stroke-width="3"/>
    <!-- 线圈1（左侧） -->
    <path d="M180 120 Q187 110 194 120 Q201 130 208 120 Q215 110 222 120 Q229 130 236 120" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="140" y1="120" x2="180" y2="120" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="236" y1="120" x2="250" y2="120" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="155" y="110" font-size="13" fill="#d32f2f">N₁</text>
    <text x="140" y="140" font-size="13" fill="#d32f2f">u₁</text>
    <text x="135" y="135" font-size="10" fill="#333">+</text>
    <text x="135" y="155" font-size="10" fill="#333">-</text>
    <text x="140" y="170" font-size="12" fill="#d32f2f">i₁</text>
    <polygon points="160,120 168,114 168,126" fill="#d32f2f"/>
    <line x1="140" y1="120" x2="140" y2="180" stroke="#d32f2f" stroke-width="2"/>
    <!-- 线圈1底部 -->
    <line x1="140" y1="180" x2="250" y2="180" stroke="#d32f2f" stroke-width="2"/>
    <!-- 线圈2（右侧） -->
    <path d="M290 180 Q297 170 304 180 Q311 190 318 180 Q325 170 332 180 Q339 190 346 180 Q353 170 360 180" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="270" y1="180" x2="290" y2="180" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="360" y1="180" x2="400" y2="180" stroke="#1976d2" stroke-width="2.5"/>
    <text x="375" y="170" font-size="13" fill="#1976d2">N₂</text>
    <text x="400" y="150" font-size="13" fill="#1976d2">u₂</text>
    <text x="405" y="145" font-size="10" fill="#333">+</text>
    <text x="405" y="165" font-size="10" fill="#333">-</text>
    <text x="400" y="195" font-size="12" fill="#1976d2">i₂</text>
    <polygon points="380,180 372,174 372,186" fill="#1976d2"/>
    <line x1="400" y1="180" x2="400" y2="240" stroke="#1976d2" stroke-width="2"/>
    <!-- 线圈2底部 -->
    <line x1="270" y1="240" x2="400" y2="240" stroke="#1976d2" stroke-width="2"/>
    <line x1="270" y1="180" x2="270" y2="240" stroke="#1976d2" stroke-width="2"/>
    <!-- 同名端 -->
    <circle cx="180" cy="120" r="4" fill="#000"/>
    <circle cx="290" cy="180" r="4" fill="#000"/>
    <!-- 公式 -->
    <text x="300" y="290" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">理想变压器条件：</text>
    <text x="300" y="315" text-anchor="middle" font-size="13" fill="#666">无损耗、全耦合(k=1)、磁导率无穷大</text>
    <text x="300" y="345" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u₁/u₂ = N₁/N₂ = n,  i₁/i₂ = -N₂/N₁ = -1/n</text>
    <text x="300" y="375" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Z_in = n²·Z_L  (阻抗变换)</text>
  </g>
</svg>