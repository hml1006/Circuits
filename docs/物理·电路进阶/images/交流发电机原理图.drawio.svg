<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">交流发电机原理图</text>
    
    <!-- N 极 -->
    <rect x="30" y="80" width="40" height="240" rx="8" ry="8" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="50" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" transform="rotate(-90,50,205)">N</text>
    
    <!-- S 极 -->
    <rect x="530" y="80" width="40" height="240" rx="8" ry="8" fill="#4dabf7" stroke="#1976d2" stroke-width="2"/>
    <text x="550" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" transform="rotate(90,550,205)">S</text>
    
    <!-- 磁场线 -->
    <path d="M 70,120 Q 250,100 530,120" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 70,180 Q 250,160 530,180" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 70,240 Q 250,220 530,240" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 70,280 Q 250,260 530,280" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    
    <!-- 线圈（矩形） -->
    <rect x="180" y="130" width="80" height="140" rx="5" ry="5" fill="none" stroke="#e6b800" stroke-width="3" transform="rotate(30,300,200)"/>
    <rect x="340" y="130" width="80" height="140" rx="5" ry="5" fill="none" stroke="#e6b800" stroke-width="3" transform="rotate(30,300,200)"/>
    
    <!-- 转轴 -->
    <circle cx="300" cy="200" r="8" fill="#888" stroke="#555" stroke-width="2"/>
    <line x1="300" y1="200" x2="300" y2="340" stroke="#888" stroke-width="3"/>
    
    <!-- 滑环 -->
    <circle cx="285" cy="320" r="10" fill="none" stroke="#e6b800" stroke-width="2"/>
    <circle cx="315" cy="320" r="10" fill="none" stroke="#e6b800" stroke-width="2"/>
    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">滑环</text>
    
    <!-- 电刷 -->
    <rect x="260" y="310" width="10" height="20" rx="2" ry="2" fill="#888" stroke="#555" stroke-width="1.5"/>
    <rect x="330" y="310" width="10" height="20" rx="2" ry="2" fill="#888" stroke="#555" stroke-width="1.5"/>
    
    <!-- 输出导线 -->
    <line x1="260" y1="320" x2="200" y2="370" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="320" x2="400" y2="370" stroke="#333" stroke-width="2"/>
    
    <!-- 输出正弦波 -->
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#333">交流输出 u = E<tspan font-size="9" dy="3">m</tspan><tspan dy="-3"> sin ωt</tspan></tspan></text>
    
    <!-- 线圈标注 -->
    <text x="300" y="120" text-anchor="middle" font-size="12" fill="#e6b800">线圈（在匀强磁场中匀速转动）</text>
    
    <!-- 旋转方向 -->
    <path d="M 340,100 A 150,150 0 0,1 400,150" fill="none" stroke="#333" stroke-width="1.5"/>
    <polygon points="395,148 400,158 405,148" fill="#333"/>
    <text x="380" y="100" text-anchor="middle" font-size="11" fill="#333" font-style="italic">ω</text>
    
    <!-- 公式 -->
    <text x="300" y="375" text-anchor="middle" font-size="12" fill="#666">E<tspan font-size="9" dy="3">m</tspan><tspan dy="-3"> = NBSω</tspan></tspan></text>
  </g>
</svg>