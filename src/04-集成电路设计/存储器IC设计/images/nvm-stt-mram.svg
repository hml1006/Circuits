<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <defs>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1f4e79"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .metal { fill: #c9d6e5; stroke: #333; stroke-width: 1.2; }
      .free { fill: #d6e9f8; stroke: #1f4e79; stroke-width: 1.2; }
      .fixed { fill: #d9ead3; stroke: #3d6b35; stroke-width: 1.2; }
      .barrier { fill: #f6e3a1; stroke: #8a6d1a; stroke-width: 1.1; }
      .leader { stroke: #666; stroke-width: 0.9; fill: none; stroke-dasharray: 3 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <text class="title" x="410" y="30" text-anchor="middle">STT-MRAM：磁隧道结（MTJ）</text>

  <!-- 左：平行态 -->
  <text class="lbl" x="210" y="62" text-anchor="middle">平行态（P）：低阻</text>
  <rect class="metal" x="120" y="80" width="180" height="30"/>
  <rect class="free" x="120" y="118" width="180" height="46"/>
  <rect class="barrier" x="120" y="164" width="180" height="20"/>
  <rect class="fixed" x="120" y="184" width="180" height="46"/>
  <rect class="metal" x="120" y="230" width="180" height="30"/>
  <text class="lbl" x="210" y="99" text-anchor="middle">顶电极</text>
  <text class="small" x="210" y="132" text-anchor="middle">自由层</text>
  <text class="small" x="210" y="178" text-anchor="middle">MgO</text>
  <text class="small" x="210" y="198" text-anchor="middle">固定层</text>
  <text class="lbl" x="210" y="250" text-anchor="middle">底电极</text>

  <line x1="150" y1="152" x2="270" y2="152" stroke="#1f4e79" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <line x1="150" y1="218" x2="270" y2="218" stroke="#3d6b35" stroke-width="2.2" marker-end="url(#blueArrow)"/>

  <line x1="80" y1="275" x2="80" y2="70" stroke="#c0392b" stroke-width="1.8" marker-end="url(#redArrow)"/>
  <text class="small" x="58" y="180" transform="rotate(-90 58 180)" text-anchor="middle">I_write</text>

  <text class="lbl" x="210" y="292" text-anchor="middle">R_P（低阻）</text>
  <text class="small" x="210" y="330" text-anchor="middle">两层磁化方向相同</text>

  <!-- 右：反平行态 -->
  <text class="lbl" x="610" y="62" text-anchor="middle">反平行态（AP）：高阻</text>
  <rect class="metal" x="520" y="80" width="180" height="30"/>
  <rect class="free" x="520" y="118" width="180" height="46"/>
  <rect class="barrier" x="520" y="164" width="180" height="20"/>
  <rect class="fixed" x="520" y="184" width="180" height="46"/>
  <rect class="metal" x="520" y="230" width="180" height="30"/>
  <text class="lbl" x="610" y="99" text-anchor="middle">顶电极</text>
  <text class="small" x="610" y="132" text-anchor="middle">自由层</text>
  <text class="small" x="610" y="178" text-anchor="middle">MgO</text>
  <text class="small" x="610" y="198" text-anchor="middle">固定层</text>
  <text class="lbl" x="610" y="250" text-anchor="middle">底电极</text>

  <line x1="670" y1="152" x2="550" y2="152" stroke="#1f4e79" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <line x1="550" y1="218" x2="670" y2="218" stroke="#3d6b35" stroke-width="2.2" marker-end="url(#blueArrow)"/>

  <line x1="480" y1="275" x2="480" y2="70" stroke="#c0392b" stroke-width="1.8" marker-end="url(#redArrow)"/>
  <text class="small" x="458" y="180" transform="rotate(-90 458 180)" text-anchor="middle">I_write</text>

  <text class="lbl" x="610" y="292" text-anchor="middle">R_AP（高阻）</text>
  <text class="small" x="610" y="330" text-anchor="middle">两层磁化方向相反</text>

  <text class="small" x="410" y="380" text-anchor="middle">写：自旋极化电流翻转自由层磁化方向；读：比较 R_P 与 R_AP 判断存储状态</text>
  <text class="small" x="410" y="400" text-anchor="middle">MTJ 非易失、读写速度快，但写入电流与保持力需要折中</text>
</svg>
