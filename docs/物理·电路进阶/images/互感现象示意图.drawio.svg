<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">互感现象示意图</text>
    
    <!-- 左侧线圈1 -->
    <line x1="60" y1="180" x2="100" y2="180" stroke="#333" stroke-width="2.5"/>
    <path d="M 100,120 Q 110,140 100,160 Q 110,180 100,200 Q 110,220 100,240" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="100" y1="240" x2="60" y2="240" stroke="#333" stroke-width="2.5"/>
    
    <text x="60" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#d32f2f">线圈 1</text>
    <text x="60" y="260" text-anchor="middle" font-size="12" fill="#333">N₁</text>
    
    <!-- 电源 -->
    <line x1="30" y1="180" x2="30" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="20" y1="150" x2="40" y2="150" stroke="#333" stroke-width="2"/>
    <text x="30" y="140" text-anchor="middle" font-size="12" fill="#333">E</text>
    
    <line x1="30" y1="180" x2="60" y2="180" stroke="#333" stroke-width="2.5"/>
    <line x1="30" y1="150" x2="30" y2="120" stroke="#333" stroke-width="2.5"/>
    <line x1="30" y1="120" x2="100" y2="120" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电流i1 -->
    <polygon points="130,125 145,130 130,135" fill="#d32f2f"/>
    <text x="150" y="130" text-anchor="start" font-size="13" fill="#d32f2f" font-style="italic">i₁</text>
    
    <!-- 磁通 -->
    <path d="M 150,180 Q 200,170 250,180 Q 300,170 350,180" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
    <path d="M 150,200 Q 200,190 250,200 Q 300,190 350,200" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
    <text x="250" y="215" text-anchor="middle" font-size="12" fill="#4dabf7" font-style="italic" opacity="0.7">Φ</text>
    
    <!-- 右侧线圈2 -->
    <line x1="500" y1="180" x2="460" y2="180" stroke="#333" stroke-width="2.5"/>
    <path d="M 460,120 Q 450,140 460,160 Q 450,180 460,200 Q 450,220 460,240" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="460" y1="240" x2="500" y2="240" stroke="#333" stroke-width="2.5"/>
    
    <text x="500" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1976d2">线圈 2</text>
    <text x="500" y="260" text-anchor="middle" font-size="12" fill="#333">N₂</text>
    
    <!-- 灯泡 -->
    <circle cx="530" cy="180" r="18" fill="#fff9c4" stroke="#e6b800" stroke-width="2"/>
    <text x="530" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">L</text>
    
    <line x1="500" y1="180" x2="512" y2="180" stroke="#333" stroke-width="2.5"/>
    <line x1="548" y1="180" x2="560" y2="180" stroke="#333" stroke-width="2.5"/>
    
    <!-- 线圈2上端导线 -->
    <line x1="460" y1="120" x2="530" y2="120" stroke="#333" stroke-width="2.5"/>
    <line x1="530" y1="120" x2="530" y2="162" stroke="#333" stroke-width="2.5"/>
    
    <!-- 线圈2下端导线 -->
    <line x1="460" y1="240" x2="530" y2="240" stroke="#333" stroke-width="2.5"/>
    <line x1="530" y1="240" x2="530" y2="198" stroke="#333" stroke-width="2.5"/>
    
    <!-- 互感电动势标注 -->
    <text x="250" y="320" text-anchor="middle" font-size="12" fill="#d32f2f">e₂₁ = −M·di₁/dt</text>
    <text x="250" y="340" text-anchor="middle" font-size="12" fill="#666">M = k√(L₁L₂)</text>
    
    <!-- 铁芯 -->
    <rect x="180" y="110" width="140" height="30" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <rect x="180" y="260" width="140" height="30" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <text x="250" y="130" text-anchor="middle" font-size="11" fill="#666">铁芯</text>
    <text x="250" y="280" text-anchor="middle" font-size="11" fill="#666">铁芯</text>
    
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#666">互感：一个线圈中电流变化，在另一线圈中产生感应电动势</text>
  </g>
</svg>