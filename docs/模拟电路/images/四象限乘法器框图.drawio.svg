<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">四象限模拟乘法器框图</text>

    <!-- Vx 输入 -->
    <text x="30" y="100" font-size="13" fill="#333">V</text>
    <text x="30" y="110" font-size="10" fill="#333">x</text>
    <line x1="50" y1="100" x2="80" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- VI转换器 (Vx侧) -->
    <rect x="80" y="65" width="100" height="70" fill="#e8e8ff" stroke="#3333cc" stroke-width="2" rx="5"/>
    <text x="130" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#3333cc">V/I</text>
    <text x="130" y="110" text-anchor="middle" font-size="10" fill="#3333cc">转换器</text>

    <line x1="180" y1="100" x2="220" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Vy 输入 -->
    <text x="30" y="180" font-size="13" fill="#333">V</text>
    <text x="30" y="190" font-size="10" fill="#333">y</text>
    <line x1="50" y1="180" x2="80" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- VI转换器 (Vy侧) -->
    <rect x="80" y="145" width="100" height="70" fill="#e8e8ff" stroke="#3333cc" stroke-width="2" rx="5"/>
    <text x="130" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#3333cc">V/I</text>
    <text x="130" y="190" text-anchor="middle" font-size="10" fill="#3333cc">转换器</text>

    <line x1="180" y1="180" x2="220" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Gilbert核心 -->
    <rect x="220" y="80" width="120" height="120" fill="#ffe8cc" stroke="#cc6600" stroke-width="2" rx="5"/>
    <text x="280" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc6600">Gilbert</text>
    <text x="280" y="148" text-anchor="middle" font-size="11" fill="#cc6600">乘法器核心</text>
    <text x="280" y="165" text-anchor="middle" font-size="10" fill="#cc6600">（交叉耦合）</text>

    <line x1="220" y1="100" x2="220" y2="100" stroke="#333" stroke-width="2"/>

    <!-- 输出电流 -->
    <line x1="340" y1="140" x2="390" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- I/V转换器 -->
    <rect x="390" y="105" width="100" height="70" fill="#e8ffe8" stroke="#2a7a2a" stroke-width="2" rx="5"/>
    <text x="440" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a7a2a">I/V</text>
    <text x="440" y="150" text-anchor="middle" font-size="10" fill="#2a7a2a">转换器</text>

    <line x1="490" y1="140" x2="530" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="540" y="145" font-size="13" fill="#333">V</text>
    <text x="540" y="155" font-size="10" fill="#333">o</text>

    <!-- 象限说明 -->
    <text x="300" y="260" text-anchor="middle" font-size="12" fill="#666">四象限工作特性</text>

    <rect x="140" y="270" width="320" height="40" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="160" y="285" font-size="11" fill="#666">V</text>
    <text x="160" y="295" font-size="9" fill="#666">x</text>
    <text x="175" y="290" font-size="11" fill="#666">>0, V</text>
    <text x="195" y="290" font-size="11" fill="#666">y</text>
    <text x="205" y="290" font-size="11" fill="#666">>0 → V</text>
    <text x="230" y="290" font-size="11" fill="#666">o</text>
    <text x="240" y="290" font-size="11" fill="#666">>0 (I)</text>

    <text x="270" y="285" font-size="11" fill="#666">V</text>
    <text x="270" y="295" font-size="9" fill="#666">x</text>
    <text x="285" y="290" font-size="11" fill="#666">>0, V</text>
    <text x="305" y="290" font-size="11" fill="#666">y</text>
    <text x="315" y="290" font-size="11" fill="#666">&lt;0 → V</text>
    <text x="340" y="290" font-size="11" fill="#666">o</text>
    <text x="350" y="290" font-size="11" fill="#666">&lt;0 (II)</text>

    <rect x="140" y="310" width="320" height="40" fill="#f8f8f8" stroke="#999" stroke-width="1" rx="3"/>
    <text x="160" y="325" font-size="11" fill="#666">V</text>
    <text x="160" y="335" font-size="9" fill="#666">x</text>
    <text x="175" y="330" font-size="11" fill="#666">&lt;0, V</text>
    <text x="195" y="330" font-size="11" fill="#666">y</text>
    <text x="205" y="330" font-size="11" fill="#666">>0 → V</text>
    <text x="230" y="330" font-size="11" fill="#666">o</text>
    <text x="240" y="330" font-size="11" fill="#666">&lt;0 (III)</text>

    <text x="270" y="325" font-size="11" fill="#666">V</text>
    <text x="270" y="335" font-size="9" fill="#666">x</text>
    <text x="285" y="330" font-size="11" fill="#666">&lt;0, V</text>
    <text x="305" y="330" font-size="11" fill="#666">y</text>
    <text x="315" y="330" font-size="11" fill="#666">&lt;0 → V</text>
    <text x="340" y="330" font-size="11" fill="#666">o</text>
    <text x="350" y="330" font-size="11" fill="#666">>0 (IV)</text>

    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">V</text>
    <text x="310" y="370" text-anchor="middle" font-size="11" fill="#666">o</text>
    <text x="320" y="370" text-anchor="middle" font-size="11" fill="#666"> = K · V</text>
    <text x="345" y="370" text-anchor="middle" font-size="11" fill="#666">x</text>
    <text x="352" y="370" text-anchor="middle" font-size="11" fill="#666"> · V</text>
    <text x="365" y="370" text-anchor="middle" font-size="11" fill="#666">y</text>
  </g>
</svg>