<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>

    <!-- Title -->
    <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">JTAG 边界扫描 (IEEE 1149.1)</text>

    <!-- Chip boundary -->
    <rect x="15" y="35" width="570" height="230" fill="#fafafa" stroke="#333" stroke-width="2" rx="8" stroke-dasharray="6,3"/>
    <text x="25" y="52" font-size="10" fill="#888">芯片边界</text>

    <!-- TAP Controller -->
    <rect x="30" y="65" width="130" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
    <text x="95" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">TAP 控制器</text>
    <text x="95" y="105" text-anchor="middle" font-size="10" fill="#1565c0">Test Access Port</text>
    <text x="95" y="118" text-anchor="middle" font-size="10" fill="#1565c0">16状态机</text>

    <!-- IR - Instruction Register -->
    <rect x="30" y="140" width="130" height="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="95" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">指令寄存器 (IR)</text>
    <text x="95" y="175" text-anchor="middle" font-size="9" fill="#2e7d32">EXTEST/BYPASS/SAMPLE</text>

    <!-- Bypass Register -->
    <rect x="30" y="195" width="130" height="30" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
    <text x="95" y="214" text-anchor="middle" font-size="10" fill="#e65100">旁路寄存器 (Bypass)</text>

    <!-- Core Logic -->
    <rect x="320" y="65" width="150" height="160" fill="#fce4ec" stroke="#c62828" stroke-width="2" rx="6"/>
    <text x="395" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">核心逻辑</text>
    <text x="395" y="150" text-anchor="middle" font-size="11" fill="#c62828">Core Logic</text>
    <text x="395" y="170" text-anchor="middle" font-size="10" fill="#c62828">(内部功能电路)</text>
    <text x="395" y="190" text-anchor="middle" font-size="10" fill="#c62828">正常工作时</text>
    <text x="395" y="205" text-anchor="middle" font-size="10" fill="#c62828">BSC不可见</text>

    <!-- BSC cells around the core -->
    <!-- Top BSCs -->
    <rect x="200" y="65" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="225" y="81" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="260" y="65" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="285" y="81" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>

    <!-- Left BSCs -->
    <rect x="200" y="100" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="225" y="116" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="200" y="135" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="225" y="151" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="200" y="170" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="225" y="186" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>

    <!-- Right BSCs -->
    <rect x="480" y="65" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="505" y="81" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="480" y="100" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="505" y="116" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="480" y="135" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="505" y="151" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="480" y="170" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="505" y="186" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>

    <!-- Bottom BSCs -->
    <rect x="240" y="200" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="265" y="216" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="310" y="200" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="335" y="216" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>
    <rect x="380" y="200" width="50" height="25" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5" rx="3"/>
    <text x="405" y="216" text-anchor="middle" font-size="8" fill="#00695c">BSC</text>

    <!-- Boundary Scan Chain connection -->
    <line x1="250" y1="90" x2="310" y2="90" stroke="#00695c" stroke-width="1.5"/>
    <line x1="250" y1="90" x2="250" y2="125" stroke="#00695c" stroke-width="1.5"/>
    <line x1="250" y1="125" x2="250" y2="160" stroke="#00695c" stroke-width="1.5"/>
    <line x1="250" y1="160" x2="250" y2="195" stroke="#00695c" stroke-width="1.5"/>
    <line x1="250" y1="195" x2="265" y2="200" stroke="#00695c" stroke-width="1.5"/>

    <line x1="530" y1="90" x2="470" y2="90" stroke="#00695c" stroke-width="1.5"/>
    <line x1="530" y1="90" x2="530" y2="125" stroke="#00695c" stroke-width="1.5"/>
    <line x1="530" y1="125" x2="530" y2="160" stroke="#00695c" stroke-width="1.5"/>
    <line x1="530" y1="160" x2="530" y2="195" stroke="#00695c" stroke-width="1.5"/>
    <line x1="530" y1="195" x2="430" y2="200" stroke="#00695c" stroke-width="1.5"/>

    <!-- TDI/TDO/TMS/TCK connections -->
    <text x="95" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">JTAG接口：</text>

    <rect x="20" y="255" width="80" height="22" fill="#f5f5f5" stroke="#1565c0" stroke-width="1.5" rx="3"/>
    <text x="60" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">TCK</text>

    <rect x="115" y="255" width="80" height="22" fill="#f5f5f5" stroke="#2e7d32" stroke-width="1.5" rx="3"/>
    <text x="155" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">TMS</text>

    <rect x="210" y="255" width="80" height="22" fill="#f5f5f5" stroke="#e65100" stroke-width="1.5" rx="3"/>
    <text x="250" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">TDI</text>

    <rect x="305" y="255" width="80" height="22" fill="#f5f5f5" stroke="#c62828" stroke-width="1.5" rx="3"/>
    <text x="345" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">TDO</text>

    <rect x="400" y="255" width="80" height="22" fill="#f5f5f5" stroke="#7b1fa2" stroke-width="1.5" rx="3"/>
    <text x="440" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#7b1fa2">TRST(可选)</text>

    <!-- TAP state machine -->
    <rect x="15" y="290" width="570" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="300" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">TAP 控制器状态机</text>

    <text x="30" y="330" font-size="10" fill="#555">Test-Logic-Reset → Run-Test/Idle → Select-DR-Scan → Capture-DR → Shift-DR → Exit1-DR → Update-DR</text>
    <text x="30" y="348" font-size="10" fill="#555">                                      → Select-IR-Scan → Capture-IR → Shift-IR → Exit1-IR → Update-IR</text>
    <text x="30" y="366" font-size="10" fill="#555">测试能力: 互连测试 | 器件测试 | 配置编程 | 调试</text>
    <text x="30" y="384" font-size="10" fill="#555">BSC: 边界扫描单元 (Boundary Scan Cell)，每个I/O引脚对应一个BSC</text>
  </g>
</svg>