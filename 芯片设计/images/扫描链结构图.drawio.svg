<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>

    <!-- Title -->
    <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">扫描链结构图 (Scan Chain)</text>

    <!-- Scan In -->
    <rect x="15" y="50" width="80" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
    <text x="55" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Scan In</text>
    <line x1="95" y1="67" x2="120" y2="67" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Enable -->
    <rect x="15" y="100" width="80" height="35" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
    <text x="55" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Scan En</text>
    <line x1="95" y1="117" x2="120" y2="117" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Flip-Flop 1 -->
    <rect x="125" y="45" width="80" height="100" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="165" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">SFF</text>
    <text x="165" y="85" text-anchor="middle" font-size="10" fill="#2e7d32">#1</text>
    <text x="165" y="105" text-anchor="middle" font-size="9" fill="#2e7d32">D</text>
    <text x="165" y="118" text-anchor="middle" font-size="9" fill="#2e7d32">SI</text>
    <text x="165" y="131" text-anchor="middle" font-size="9" fill="#2e7d32">SE</text>
    <text x="165" y="142" text-anchor="middle" font-size="9" fill="#2e7d32">Q</text>
    <!-- Scan FF internal: MUX + FF -->
    <rect x="132" y="95" width="66" height="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="165" y="107" text-anchor="middle" font-size="7" fill="#2e7d32">MUX</text>
    <rect x="132" y="113" width="66" height="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="165" y="125" text-anchor="middle" font-size="7" fill="#2e7d32">D-FF</text>

    <!-- Combinational Logic 1 -->
    <rect x="220" y="50" width="80" height="90" fill="#fce4ec" stroke="#c62828" stroke-width="2" rx="5"/>
    <text x="260" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">组合逻辑</text>
    <text x="260" y="115" text-anchor="middle" font-size="10" fill="#c62828">CL #1</text>

    <line x1="205" y1="95" x2="220" y2="95" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Flip-Flop 2 -->
    <rect x="315" y="45" width="80" height="100" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="355" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">SFF</text>
    <text x="355" y="85" text-anchor="middle" font-size="10" fill="#2e7d32">#2</text>
    <text x="355" y="105" text-anchor="middle" font-size="9" fill="#2e7d32">D</text>
    <text x="355" y="118" text-anchor="middle" font-size="9" fill="#2e7d32">SI</text>
    <text x="355" y="131" text-anchor="middle" font-size="9" fill="#2e7d32">SE</text>
    <text x="355" y="142" text-anchor="middle" font-size="9" fill="#2e7d32">Q</text>
    <rect x="322" y="95" width="66" height="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="355" y="107" text-anchor="middle" font-size="7" fill="#2e7d32">MUX</text>
    <rect x="322" y="113" width="66" height="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="355" y="125" text-anchor="middle" font-size="7" fill="#2e7d32">D-FF</text>

    <line x1="300" y1="95" x2="315" y2="95" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Combinational Logic 2 -->
    <rect x="410" y="50" width="80" height="90" fill="#fce4ec" stroke="#c62828" stroke-width="2" rx="5"/>
    <text x="450" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">组合逻辑</text>
    <text x="450" y="115" text-anchor="middle" font-size="10" fill="#c62828">CL #2</text>

    <line x1="395" y1="95" x2="410" y2="95" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Flip-Flop 3 -->
    <rect x="505" y="45" width="80" height="100" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="545" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">SFF</text>
    <text x="545" y="85" text-anchor="middle" font-size="10" fill="#2e7d32">#3</text>
    <text x="545" y="105" text-anchor="middle" font-size="9" fill="#2e7d32">D</text>
    <text x="545" y="118" text-anchor="middle" font-size="9" fill="#2e7d32">SI</text>
    <text x="545" y="131" text-anchor="middle" font-size="9" fill="#2e7d32">SE</text>
    <text x="545" y="142" text-anchor="middle" font-size="9" fill="#2e7d32">Q</text>
    <rect x="512" y="95" width="66" height="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="545" y="107" text-anchor="middle" font-size="7" fill="#2e7d32">MUX</text>
    <rect x="512" y="113" width="66" height="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1" rx="2"/>
    <text x="545" y="125" text-anchor="middle" font-size="7" fill="#2e7d32">D-FF</text>

    <line x1="490" y1="95" x2="505" y2="95" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan Out -->
    <rect x="505" y="160" width="80" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
    <text x="545" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Scan Out</text>
    <line x1="545" y1="145" x2="545" y2="160" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Scan chain connection (SI -> SO) -->
    <path d="M205,120 L315,120" stroke="#e65100" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
    <path d="M395,120 L505,120" stroke="#e65100" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

    <!-- SE connection -->
    <line x1="165" y1="145" x2="165" y2="160" stroke="#e65100" stroke-width="1.5"/>
    <line x1="355" y1="145" x2="355" y2="160" stroke="#e65100" stroke-width="1.5"/>
    <line x1="545" y1="145" x2="545" y2="160" stroke="#e65100" stroke-width="1.5"/>
    <line x1="165" y1="160" x2="545" y2="160" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Working modes -->
    <rect x="15" y="210" width="570" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="300" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">扫描链工作模式</text>

    <!-- Shift mode -->
    <rect x="30" y="240" width="250" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="4"/>
    <text x="155" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">移位模式 (SE=1)</text>
    <text x="155" y="278" text-anchor="middle" font-size="10" fill="#1565c0">触发器级联成移位寄存器</text>
    <text x="155" y="290" text-anchor="middle" font-size="10" fill="#1565c0">测试向量从SI串行输入</text>

    <!-- Capture mode -->
    <rect x="320" y="240" width="250" height="50" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" rx="4"/>
    <text x="445" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">捕获模式 (SE=0)</text>
    <text x="445" y="278" text-anchor="middle" font-size="10" fill="#e65100">触发器正常工作</text>
    <text x="445" y="290" text-anchor="middle" font-size="10" fill="#e65100">组合逻辑响应被捕获</text>

    <!-- Key concepts -->
    <rect x="15" y="310" width="570" height="80" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="300" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">关键概念</text>
    <text x="30" y="350" font-size="10" fill="#555">扫描触发器 (SFF): 普通D-FF + 输入MUX (D/SI选择)</text>
    <text x="30" y="365" font-size="10" fill="#555">扫描压缩: XOR压缩 | MISR | EDT — 减少测试数据量</text>
    <text x="30" y="380" font-size="10" fill="#555">链长平衡: 各扫描链长度尽量相等，优化测试时间</text>
  </g>
</svg>