<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">磁滞回线（B-H 曲线）</text>
    
    <!-- 坐标轴 -->
    <line x1="300" y1="40" x2="300" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80" y1="195" x2="560" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 轴标签 -->
    <text x="560" y="215" text-anchor="end" font-size="14" fill="#333" font-style="italic">H</text>
    <text x="300" y="35" text-anchor="middle" font-size="14" fill="#333" font-style="italic">B</text>
    
    <!-- 原点 -->
    <text x="290" y="210" text-anchor="end" font-size="11" fill="#666">O</text>
    
    <!-- 磁滞回线 -->
    <path d="M 80,195 Q 100,195 150,195 Q 200,195 250,140 Q 280,90 300,60 Q 320,90 350,140 Q 400,195 450,195 Q 500,195 520,195" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    
    <!-- 回线下半部分 -->
    <path d="M 520,195 Q 500,195 450,195 Q 400,195 350,250 Q 320,300 300,330 Q 280,300 250,250 Q 200,195 150,195 Q 100,195 80,195" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    
    <!-- 饱和点标注 -->
    <text x="250" y="135" text-anchor="end" font-size="11" fill="#d32f2f">B<tspan font-size="8" dy="3">s</tspan></tspan>
    <text x="350" y="135" text-anchor="start" font-size="11" fill="#d32f2f">B<tspan font-size="8" dy="3">s</tspan></tspan>
    
    <!-- 剩磁 Br -->
    <line x1="300" y1="60" x2="80" y2="60" stroke="#1976d2" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="65" text-anchor="end" font-size="11" fill="#1976d2">B<tspan font-size="8" dy="3">r</tspan></tspan>
    
    <line x1="300" y1="330" x2="80" y2="330" stroke="#1976d2" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="335" text-anchor="end" font-size="11" fill="#1976d2">−B<tspan font-size="8" dy="3">r</tspan></tspan>
    
    <!-- 矫顽力 Hc -->
    <line x1="250" y1="195" x2="250" y2="350" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="250" y="360" text-anchor="middle" font-size="11" fill="#2e7d32">−H<tspan font-size="8" dy="3">c</tspan></tspan>
    
    <line x1="350" y1="195" x2="350" y2="350" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="350" y="360" text-anchor="middle" font-size="11" fill="#2e7d32">H<tspan font-size="8" dy="3">c</tspan></tspan>
    
    <!-- 标注 -->
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">B<tspan font-size="8" dy="3">s</tspan><tspan dy="-3">：饱和磁感应强度  B<tspan font-size="8" dy="3">r</tspan><tspan dy="-3">：剩磁  H<tspan font-size="8" dy="3">c</tspan><tspan dy="-3">：矫顽力</tspan></tspan></tspan></tspan></tspan></text>
    
    <!-- 面积标注 -->
    <text x="300" y="375" text-anchor="middle" font-size="11" fill="#ff9800">回线面积 ∝ 磁滞损耗</text>
  </g>
</svg>