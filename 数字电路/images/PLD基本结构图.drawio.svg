<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">PLD 基本结构</text>
    <!-- 输入缓冲 -->
    <rect x="30" y="60" width="80" height="160" rx="5" fill="#d4e6f1" stroke="#000" stroke-width="2"/>
    <text x="70" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">输入</text>
    <text x="70" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">缓冲器</text>
    <text x="70" y="170" text-anchor="middle" font-size="10" fill="#555">互补输出</text>
    <line x1="10" y1="80" x2="30" y2="80" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="110" x2="30" y2="110" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="140" x2="30" y2="140" stroke="#000" stroke-width="1.5"/>
    <text x="5" y="84" text-anchor="end" font-size="11" fill="#000">A</text>
    <text x="5" y="114" text-anchor="end" font-size="11" fill="#000">B</text>
    <text x="5" y="144" text-anchor="end" font-size="11" fill="#000">C</text>
    <!-- 与阵列 -->
    <rect x="130" y="60" width="180" height="160" rx="5" fill="#fff5ee" stroke="#000" stroke-width="2"/>
    <text x="220" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">与阵列</text>
    <text x="220" y="150" text-anchor="middle" font-size="12" fill="#555">(AND Array)</text>
    <text x="220" y="170" text-anchor="middle" font-size="11" fill="#555">可编程</text>
    <!-- 连接点 -->
    <circle cx="155" cy="85" r="3" fill="#000"/>
    <circle cx="185" cy="85" r="3" fill="#000"/>
    <circle cx="215" cy="85" r="3" fill="#000"/>
    <circle cx="185" cy="115" r="3" fill="#000"/>
    <circle cx="245" cy="115" r="3" fill="#000"/>
    <circle cx="155" cy="145" r="3" fill="#000"/>
    <circle cx="215" cy="145" r="3" fill="#000"/>
    <circle cx="275" cy="145" r="3" fill="#000"/>
    <circle cx="185" cy="175" r="3" fill="#000"/>
    <circle cx="245" cy="175" r="3" fill="#000"/>
    <circle cx="275" cy="175" r="3" fill="#000"/>
    <!-- 水平线 -->
    <line x1="130" y1="85" x2="310" y2="85" stroke="#aaa" stroke-width="1"/>
    <line x1="130" y1="115" x2="310" y2="115" stroke="#aaa" stroke-width="1"/>
    <line x1="130" y1="145" x2="310" y2="145" stroke="#aaa" stroke-width="1"/>
    <line x1="130" y1="175" x2="310" y2="175" stroke="#aaa" stroke-width="1"/>
    <line x1="130" y1="205" x2="310" y2="205" stroke="#aaa" stroke-width="1"/>
    <!-- 垂直线 -->
    <line x1="155" y1="60" x2="155" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="185" y1="60" x2="185" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="215" y1="60" x2="215" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="245" y1="60" x2="245" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="275" y1="60" x2="275" y2="220" stroke="#aaa" stroke-width="1"/>
    <!-- 或阵列 -->
    <rect x="330" y="60" width="180" height="160" rx="5" fill="#e8f8e8" stroke="#000" stroke-width="2"/>
    <text x="420" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">或阵列</text>
    <text x="420" y="150" text-anchor="middle" font-size="12" fill="#555">(OR Array)</text>
    <text x="420" y="170" text-anchor="middle" font-size="11" fill="#555">可编程/固定</text>
    <!-- 连接点 -->
    <circle cx="355" cy="85" r="3" fill="#000"/>
    <circle cx="385" cy="85" r="3" fill="#000"/>
    <circle cx="415" cy="85" r="3" fill="#000"/>
    <circle cx="385" cy="115" r="3" fill="#000"/>
    <circle cx="445" cy="115" r="3" fill="#000"/>
    <circle cx="355" cy="145" r="3" fill="#000"/>
    <circle cx="415" cy="145" r="3" fill="#000"/>
    <circle cx="475" cy="145" r="3" fill="#000"/>
    <!-- 水平线 -->
    <line x1="330" y1="85" x2="510" y2="85" stroke="#aaa" stroke-width="1"/>
    <line x1="330" y1="115" x2="510" y2="115" stroke="#aaa" stroke-width="1"/>
    <line x1="330" y1="145" x2="510" y2="145" stroke="#aaa" stroke-width="1"/>
    <line x1="330" y1="175" x2="510" y2="175" stroke="#aaa" stroke-width="1"/>
    <!-- 垂直线 -->
    <line x1="355" y1="60" x2="355" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="385" y1="60" x2="385" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="415" y1="60" x2="415" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="445" y1="60" x2="445" y2="220" stroke="#aaa" stroke-width="1"/>
    <line x1="475" y1="60" x2="475" y2="220" stroke="#aaa" stroke-width="1"/>
    <!-- 输出 -->
    <rect x="530" y="100" width="50" height="80" rx="5" fill="#fdebd0" stroke="#000" stroke-width="2"/>
    <text x="555" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#000">输出</text>
    <text x="555" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#000">缓冲</text>
    <line x1="510" y1="130" x2="530" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="510" y1="160" x2="530" y2="160" stroke="#000" stroke-width="1.5"/>
    <line x1="580" y1="130" x2="600" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="580" y1="160" x2="600" y2="160" stroke="#000" stroke-width="1.5"/>
    <text x="605" y="134" text-anchor="start" font-size="11" fill="#000">Y₀</text>
    <text x="605" y="164" text-anchor="start" font-size="11" fill="#000">Y₁</text>
    <!-- 说明 -->
    <rect x="30" y="250" width="540" height="135" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">PLD 结构说明</text>
    <text x="50" y="295" text-anchor="start" font-size="12" fill="#000">• PLD = 与阵列 + 或阵列，实现"与或"逻辑表达式</text>
    <text x="50" y="315" text-anchor="start" font-size="12" fill="#000">• 输入缓冲器产生互补输入（A 和 Ā）</text>
    <text x="50" y="335" text-anchor="start" font-size="12" fill="#000">• 与阵列产生乘积项，或阵列将乘积项相加</text>
    <text x="50" y="355" text-anchor="start" font-size="12" fill="#000">• 按可编程方式分类：PLA（与/或均可编程）、PAL（与可编程/或固定）</text>
    <text x="50" y="375" text-anchor="start" font-size="12" fill="#000">• 连接点 ● 表示可编程连接，× 表示固定连接</text>
  </g>
</svg>