<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">s域模型电路图</text>
    <!-- 电阻的s域模型 -->
    <text x="100" y="65" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">电阻 R</text>
    <text x="60" y="85" font-size="12" fill="#666">时域: u=Ri</text>
    <text x="60" y="105" font-size="12" fill="#666">s域: U(s)=RI(s)</text>
    <rect x="60" y="115" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="30" y1="125" x2="60" y2="125" stroke="#000" stroke-width="2"/>
    <line x1="90" y1="125" x2="120" y2="125" stroke="#000" stroke-width="2"/>
    <text x="120" y="130" font-size="12" fill="#333">R</text>

    <!-- 电容的s域模型 -->
    <text x="300" y="65" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">电容 C</text>
    <text x="250" y="85" font-size="12" fill="#666">时域: i=C·du/dt</text>
    <text x="250" y="105" font-size="12" fill="#666">s域: I(s)=sCU(s)-Cu(0⁻)</text>
    <line x1="250" y1="115" x2="250" y2="125" stroke="#000" stroke-width="2"/>
    <line x1="220" y1="125" x2="280" y2="125" stroke="#000" stroke-width="2"/>
    <line x1="220" y1="145" x2="280" y2="145" stroke="#000" stroke-width="2"/>
    <line x1="280" y1="125" x2="280" y2="145" stroke="#000" stroke-width="2"/>
    <line x1="280" y1="145" x2="280" y2="155" stroke="#000" stroke-width="2"/>
    <text x="290" y="140" font-size="12" fill="#333">1/(sC)</text>

    <!-- 电感的s域模型 -->
    <text x="500" y="65" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">电感 L</text>
    <text x="450" y="85" font-size="12" fill="#666">时域: u=L·di/dt</text>
    <text x="450" y="105" font-size="12" fill="#666">s域: U(s)=sLI(s)-Li(0⁻)</text>
    <line x1="450" y1="115" x2="470" y2="115" stroke="#000" stroke-width="2"/>
    <path d="M470 115 Q477 105 484 115 Q491 125 498 115 Q505 105 512 115 Q519 125 526 115 Q533 105 540 115" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="540" y1="115" x2="555" y2="115" stroke="#000" stroke-width="2"/>
    <text x="555" y="120" font-size="12" fill="#333">sL</text>

    <!-- 完整s域电路 -->
    <text x="300" y="200" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">RLC串联电路的s域模型</text>

    <!-- 电压源s域 -->
    <circle cx="80" cy="260" r="18" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="242" x2="80" y2="248" stroke="#000" stroke-width="2"/>
    <line x1="68" y1="260" x2="92" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="272" x2="80" y2="278" stroke="#000" stroke-width="2"/>
    <text x="60" y="255" font-size="10" fill="#333">+</text>
    <text x="95" y="255" font-size="10" fill="#333">-</text>
    <text x="50" y="240" font-size="12" fill="#d32f2f">U_s(s)</text>

    <line x1="98" y1="260" x2="150" y2="260" stroke="#000" stroke-width="2"/>

    <!-- 电阻s域 -->
    <rect x="150" y="250" width="25" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="175" y1="260" x2="230" y2="260" stroke="#000" stroke-width="2"/>
    <text x="160" y="245" font-size="12" fill="#333">R</text>

    <!-- 电感s域 -->
    <line x1="230" y1="260" x2="250" y2="260" stroke="#000" stroke-width="2"/>
    <path d="M250 260 Q257 250 264 260 Q271 270 278 260 Q285 250 292 260 Q299 270 306 260 Q313 250 320 260" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="260" x2="340" y2="260" stroke="#000" stroke-width="2"/>
    <text x="285" y="245" font-size="12" fill="#333">sL</text>

    <!-- 电容s域 -->
    <line x1="340" y1="260" x2="380" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="245" x2="410" y2="245" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="275" x2="410" y2="275" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="245" x2="410" y2="275" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="260" x2="450" y2="260" stroke="#000" stroke-width="2"/>
    <text x="395" y="240" font-size="12" fill="#333">1/(sC)</text>

    <!-- 底部 -->
    <line x1="80" y1="320" x2="450" y2="320" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="278" x2="80" y2="320" stroke="#000" stroke-width="2"/>
    <line x1="450" y1="260" x2="450" y2="320" stroke="#000" stroke-width="2"/>

    <!-- 初始条件源 -->
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#666">电容初始电压: u(0⁻)/s  电感初始电流: Li(0⁻)</text>
    <text x="300" y="385" text-anchor="middle" font-size="12" fill="#666">KCL和KVL在s域形式与直流电路相同</text>
  </g>
</svg>