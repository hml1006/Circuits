<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"
     font-family="'Microsoft YaHei','SimHei','PingFang SC',sans-serif">
  <!-- 背景 -->
  <rect width="1000" height="560" fill="#ffffff"/>

  <defs>
    <!-- 电阻丝（线圈）纹理 -->
    <pattern id="coil" width="6" height="80" patternUnits="userSpaceOnUse">
      <path d="M3 0 Q6.5 40 3 80" stroke="#555" stroke-width="1.4" fill="none"/>
    </pattern>
    <!-- 符号斜箭头 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- 中间分隔线：左=结构图，右=符号图（同一画布） -->
  <line x1="640" y1="20" x2="640" y2="520" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===================== 左：结构图 ===================== -->
  <text x="40" y="42" font-size="22" font-weight="bold">滑动变阻器结构图</text>

  <!-- 支架 -->
  <rect x="100" y="160" width="14" height="220" fill="#b0bec5" stroke="#333"/>
  <rect x="500" y="160" width="14" height="220" fill="#b0bec5" stroke="#333"/>
  <rect x="75"  y="375" width="64" height="14"  fill="#b0bec5" stroke="#333"/>
  <rect x="475" y="375" width="64" height="14"  fill="#b0bec5" stroke="#333"/>

  <!-- 瓷筒 -->
  <rect x="135" y="250" width="344" height="90" fill="#efe2c8" stroke="#8d6e63"/>
  <ellipse cx="135" cy="295" rx="10" ry="45" fill="#e3d2ad" stroke="#8d6e63"/>
  <ellipse cx="479" cy="295" rx="10" ry="45" fill="#e3d2ad" stroke="#8d6e63"/>

  <!-- 电阻丝 -->
  <rect x="150" y="255" width="314" height="80" fill="url(#coil)" stroke="#444"/>

  <!-- 金属杆 -->
  <rect x="95" y="171" width="424" height="8" fill="#cfd8dc" stroke="#333"/>
  <circle cx="95"  cy="175" r="9" fill="#cfd8dc" stroke="#333"/>
  <circle cx="519" cy="175" r="9" fill="#cfd8dc" stroke="#333"/>

  <!-- 滑片 P -->
  <rect x="294" y="163" width="36" height="26" fill="#90a4ae" stroke="#333"/>
  <polygon points="294,189 330,189 312,250" fill="#90a4ae" stroke="#333"/>

  <!-- 接线柱：上 C/D（金属杆两端），下 A/B（电阻丝两端） -->
  <circle cx="95"  cy="175" r="6" fill="#d4a017" stroke="#333"/>
  <circle cx="519" cy="175" r="6" fill="#d4a017" stroke="#333"/>
  <rect x="156" y="332" width="8" height="22" fill="#d4a017" stroke="#333"/>
  <circle cx="160" cy="352" r="6" fill="#d4a017" stroke="#333"/>
  <rect x="460" y="332" width="8" height="22" fill="#d4a017" stroke="#333"/>
  <circle cx="464" cy="352" r="6" fill="#d4a017" stroke="#333"/>

  <!-- 标注引线 -->
  <g stroke="#333" stroke-width="1">
    <line x1="66"  y1="112" x2="95"  y2="166"/>
    <line x1="278" y1="112" x2="312" y2="161"/>
    <line x1="397" y1="142" x2="430" y2="171"/>
    <line x1="506" y1="112" x2="519" y2="166"/>
    <line x1="91"  y1="462" x2="160" y2="358"/>
    <line x1="227" y1="462" x2="250" y2="335"/>
    <line x1="372" y1="462" x2="479" y2="300"/>
    <line x1="506" y1="462" x2="464" y2="358"/>
  </g>
  <!-- 标注文字 -->
  <g font-size="18" fill="#000">
    <text x="30"  y="108">接线柱C</text>
    <text x="250" y="108">滑片P</text>
    <text x="370" y="138">金属杆</text>
    <text x="470" y="108">接线柱D</text>
    <text x="55"  y="478">接线柱A</text>
    <text x="200" y="478">电阻丝</text>
    <text x="345" y="478">瓷筒</text>
    <text x="470" y="478">接线柱B</text>
  </g>

  <!-- ===================== 右：电路符号 ===================== -->
  <text x="680" y="42" font-size="22" font-weight="bold">电路符号（滑动变阻器）</text>

  <line x1="680" y1="290" x2="740" y2="290" stroke="#000" stroke-width="2"/>
  <line x1="880" y1="290" x2="940" y2="290" stroke="#000" stroke-width="2"/>
  <rect x="740" y="265" width="140" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="760" y1="340" x2="862" y2="228" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="740" y="400" font-size="18">滑动变阻器符号</text>
</svg>