<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电荷间的相互作用</text>
    
    <!-- 左侧：同种电荷相互排斥 -->
    <rect x="30" y="60" width="260" height="310" rx="10" ry="10" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
    <text x="160" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">同种电荷 → 相互排斥</text>
    
    <!-- 悬线 -->
    <line x1="100" y1="110" x2="100" y2="170" stroke="#888" stroke-width="1.5"/>
    <line x1="220" y1="110" x2="220" y2="170" stroke="#888" stroke-width="1.5"/>
    <rect x="60" y="105" width="200" height="8" rx="4" ry="4" fill="#aaa"/>
    
    <!-- 两个正电荷小球 - 排斥分开 -->
    <circle cx="100" cy="180" r="22" fill="#ff6b6b" stroke="#e74c3c" stroke-width="2"/>
    <text x="100" y="186" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">+</text>
    
    <circle cx="220" cy="180" r="22" fill="#ff6b6b" stroke="#e74c3c" stroke-width="2"/>
    <text x="220" y="186" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">+</text>
    
    <!-- 排斥力箭头 -->
    <path d="M 130 180 L 95 180" fill="none" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <path d="M 190 180 L 225 180" fill="none" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="160" y="170" text-anchor="middle" font-size="11" fill="#e74c3c">排斥力</text>
    
    <!-- 电荷分布示意 -->
    <text x="160" y="230" text-anchor="middle" font-size="12" fill="#666">两个带正电的小球</text>
    <text x="160" y="250" text-anchor="middle" font-size="12" fill="#666">相互排斥而分开</text>
    
    <!-- 下方：两个负电荷 -->
    <circle cx="100" cy="290" r="22" fill="#74b9ff" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="296" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">−</text>
    
    <circle cx="220" cy="290" r="22" fill="#74b9ff" stroke="#3498db" stroke-width="2"/>
    <text x="220" y="296" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">−</text>
    
    <path d="M 130 290 L 95 290" fill="none" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <path d="M 190 290 L 225 290" fill="none" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="160" y="340" text-anchor="middle" font-size="12" fill="#666">两个带负电的小球</text>
    <text x="160" y="360" text-anchor="middle" font-size="12" fill="#666">相互排斥而分开</text>
    
    <!-- 右侧：异种电荷相互吸引 -->
    <rect x="310" y="60" width="260" height="310" rx="10" ry="10" fill="#f0fff0" stroke="#27ae60" stroke-width="2"/>
    <text x="440" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">异种电荷 → 相互吸引</text>
    
    <!-- 悬线 -->
    <line x1="380" y1="110" x2="380" y2="200" stroke="#888" stroke-width="1.5"/>
    <line x1="500" y1="110" x2="500" y2="200" stroke="#888" stroke-width="1.5"/>
    <rect x="340" y="105" width="200" height="8" rx="4" ry="4" fill="#aaa"/>
    
    <!-- 正负电荷小球 - 吸引靠近 -->
    <circle cx="380" cy="210" r="22" fill="#ff6b6b" stroke="#e74c3c" stroke-width="2"/>
    <text x="380" y="216" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">+</text>
    
    <circle cx="500" cy="210" r="22" fill="#74b9ff" stroke="#3498db" stroke-width="2"/>
    <text x="500" y="216" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">−</text>
    
    <!-- 吸引力箭头 -->
    <path d="M 405 210 L 435 210" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <path d="M 475 210 L 445 210" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="440" y="200" text-anchor="middle" font-size="11" fill="#27ae60">吸引力</text>
    
    <text x="440" y="260" text-anchor="middle" font-size="12" fill="#666">正电荷和负电荷</text>
    <text x="440" y="280" text-anchor="middle" font-size="12" fill="#666">相互吸引而靠近</text>
    
    <!-- 下方：正负电荷示意 -->
    <circle cx="380" cy="320" r="22" fill="#ff6b6b" stroke="#e74c3c" stroke-width="2"/>
    <text x="380" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">+</text>
    
    <circle cx="500" cy="320" r="22" fill="#74b9ff" stroke="#3498db" stroke-width="2"/>
    <text x="500" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">−</text>
    
    <path d="M 405 320 L 435 320" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <path d="M 475 320 L 445 320" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    
    <text x="440" y="370" text-anchor="middle" font-size="11" fill="#888">异种电荷互相吸引</text>
    
    <defs>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 10 0 L 0 5 L 10 10" fill="#e74c3c"/>
      </marker>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 10 0 L 0 5 L 10 10" fill="#3498db"/>
      </marker>
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#27ae60"/>
      </marker>
    </defs>
  </g>
</svg>