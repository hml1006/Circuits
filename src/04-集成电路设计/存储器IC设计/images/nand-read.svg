<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620">
  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .wire { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
      .cell { fill: #eef2f7; stroke: #1f4e79; stroke-width: 1.4; }
      .sel { fill: #f7d7c4; stroke: #b35c1e; stroke-width: 1.6; }
      .dev { fill: #dce6f1; stroke: #333; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="620" fill="#ffffff"/>

  <text class="title" x="230" y="32" text-anchor="middle">NAND 页读取偏置</text>

  <!-- BL 与灵敏放大器 -->
  <text class="small" x="300" y="56" text-anchor="middle">BL 预充 ≈ 1 V</text>
  <line class="wire" x1="300" y1="64" x2="300" y2="120"/>
  <rect class="dev" x="345" y="66" width="120" height="54" rx="3"/>
  <text class="small" x="405" y="89" text-anchor="middle">Sense Amp</text>
  <text class="small" x="405" y="106" text-anchor="middle">与参考电流比较</text>
  <line class="wire" x1="300" y1="93" x2="345" y2="93"/>

  <!-- SSL -->
  <rect class="dev" x="270" y="120" width="60" height="36"/>
  <text class="lbl" x="300" y="143" text-anchor="middle">SSL</text>
  <line class="wire" x1="270" y1="138" x2="130" y2="138"/>
  <text class="small" x="80" y="143">SSL = Von</text>

  <!-- 存储单元 -->
  <rect class="cell" x="270" y="190" width="60" height="44"/>
  <text class="lbl" x="300" y="217" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="212" x2="130" y2="212"/>
  <text class="small" x="82" y="217">WL0 = Vpass</text>

  <rect class="sel" x="270" y="260" width="60" height="44"/>
  <text class="lbl" x="300" y="287" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="282" x2="130" y2="282"/>
  <text class="small" x="58" y="287">WL1 = Vref（选中）</text>

  <rect class="cell" x="270" y="330" width="60" height="44"/>
  <text class="lbl" x="300" y="357" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="352" x2="130" y2="352"/>
  <text class="small" x="82" y="357">WL2 = Vpass</text>

  <rect class="cell" x="270" y="400" width="60" height="44"/>
  <text class="lbl" x="300" y="427" text-anchor="middle">FG cell</text>
  <line class="wire" x1="270" y1="422" x2="130" y2="422"/>
  <text class="small" x="82" y="427">WL3 = Vpass</text>

  <!-- GSL -->
  <rect class="dev" x="270" y="470" width="60" height="36"/>
  <text class="lbl" x="300" y="493" text-anchor="middle">GSL</text>
  <line class="wire" x1="270" y1="488" x2="130" y2="488"/>
  <text class="small" x="80" y="493">GSL = Von</text>

  <!-- 串内连接 -->
  <line class="wire" x1="300" y1="156" x2="300" y2="190"/>
  <line class="wire" x1="300" y1="234" x2="300" y2="260"/>
  <line class="wire" x1="300" y1="304" x2="300" y2="330"/>
  <line class="wire" x1="300" y1="374" x2="300" y2="400"/>
  <line class="wire" x1="300" y1="444" x2="300" y2="470"/>
  <line class="wire" x1="300" y1="506" x2="300" y2="545"/>

  <!-- SL -->
  <line class="wire" x1="250" y1="545" x2="520" y2="545"/>
  <text class="lbl" x="530" y="550">SL = 0 V</text>

  <!-- 电流路径 -->
  <line x1="330" y1="500" x2="330" y2="520" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#blueArrow)"/>
  <line x1="330" y1="430" x2="330" y2="450" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#blueArrow)"/>
  <line x1="330" y1="360" x2="330" y2="380" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#blueArrow)"/>
  <line x1="330" y1="290" x2="330" y2="310" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#blueArrow)"/>
  <line x1="330" y1="220" x2="330" y2="240" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#blueArrow)"/>
  <line x1="330" y1="150" x2="330" y2="170" stroke="#1f4e79" stroke-width="1.8" marker-end="url(#blueArrow)"/>
  <text class="small" x="340" y="540">读取电流</text>

  <!-- 读取判决说明 -->
  <rect x="500" y="188" width="250" height="92" rx="4" fill="#f4f8fc" stroke="#9fb8d1" stroke-width="1"/>
  <text class="lbl" x="510" y="210">擦除态：Vth &lt; Vref</text>
  <text class="small" x="510" y="230">选中单元导通，BL 放电 → 读 1</text>
  <text class="lbl" x="510" y="254">编程态：Vth &gt; Vref</text>
  <text class="small" x="510" y="274">选中单元截止，BL 保持 → 读 0</text>

  <text class="small" x="390" y="590" text-anchor="middle">未选 WL 必须加 Vpass，使整条串中其余单元充分导通</text>
</svg>
