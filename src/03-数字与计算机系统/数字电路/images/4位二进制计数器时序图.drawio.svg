<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">4位二进制计数器时序图</text>
    <!-- 时间轴 -->
    <line x1="50" y1="48" x2="570" y2="48" stroke="#000" stroke-width="1"/>
    <text x="45" y="52" text-anchor="end" font-size="11" fill="#000">t</text>
    <!-- CP -->
    <text x="40" y="80" text-anchor="end" font-size="12" font-weight="bold" fill="#000">CP</text>
    <line x1="50" y1="75" x2="80" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="75" x2="80" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="63" x2="110" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="63" x2="110" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="75" x2="140" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="75" x2="140" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="63" x2="170" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="170" y1="63" x2="170" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="170" y1="75" x2="200" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="75" x2="200" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="63" x2="230" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="230" y1="63" x2="230" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="230" y1="75" x2="260" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="75" x2="260" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="63" x2="290" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="63" x2="290" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="75" x2="320" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="75" x2="320" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="63" x2="350" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="350" y1="63" x2="350" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="350" y1="75" x2="380" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="75" x2="380" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="63" x2="410" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="63" x2="410" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="75" x2="440" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="75" x2="440" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="63" x2="470" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="63" x2="470" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="75" x2="500" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="75" x2="500" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="63" x2="530" y2="63" stroke="#000" stroke-width="2"/>
    <line x1="530" y1="63" x2="530" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="530" y1="75" x2="570" y2="75" stroke="#000" stroke-width="2"/>
    <!-- Q0 -->
    <text x="40" y="115" text-anchor="end" font-size="12" font-weight="bold" fill="#000">Q₀</text>
    <line x1="50" y1="110" x2="80" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="80" y1="110" x2="80" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="80" y1="95" x2="140" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="140" y1="95" x2="140" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="140" y1="110" x2="200" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="200" y1="110" x2="200" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="200" y1="95" x2="260" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="95" x2="260" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="110" x2="320" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="320" y1="110" x2="320" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="320" y1="95" x2="380" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="380" y1="95" x2="380" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="380" y1="110" x2="440" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="440" y1="110" x2="440" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="440" y1="95" x2="500" y2="95" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="95" x2="500" y2="110" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="110" x2="570" y2="110" stroke="#00a" stroke-width="2"/>
    <!-- Q1 -->
    <text x="40" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#000">Q₁</text>
    <line x1="50" y1="145" x2="140" y2="145" stroke="#00a" stroke-width="2"/>
    <line x1="140" y1="145" x2="140" y2="130" stroke="#00a" stroke-width="2"/>
    <line x1="140" y1="130" x2="260" y2="130" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="130" x2="260" y2="145" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="145" x2="380" y2="145" stroke="#00a" stroke-width="2"/>
    <line x1="380" y1="145" x2="380" y2="130" stroke="#00a" stroke-width="2"/>
    <line x1="380" y1="130" x2="500" y2="130" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="130" x2="500" y2="145" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="145" x2="570" y2="145" stroke="#00a" stroke-width="2"/>
    <!-- Q2 -->
    <text x="40" y="185" text-anchor="end" font-size="12" font-weight="bold" fill="#000">Q₂</text>
    <line x1="50" y1="180" x2="260" y2="180" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="180" x2="260" y2="165" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="165" x2="500" y2="165" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="165" x2="500" y2="180" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="180" x2="570" y2="180" stroke="#00a" stroke-width="2"/>
    <!-- Q3 -->
    <text x="40" y="220" text-anchor="end" font-size="12" font-weight="bold" fill="#000">Q₃</text>
    <line x1="50" y1="215" x2="500" y2="215" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="215" x2="500" y2="200" stroke="#00a" stroke-width="2"/>
    <line x1="500" y1="200" x2="570" y2="200" stroke="#00a" stroke-width="2"/>
    <!-- 计数值标注 -->
    <text x="65" y="240" text-anchor="middle" font-size="10" fill="#555">0</text>
    <text x="125" y="240" text-anchor="middle" font-size="10" fill="#555">1</text>
    <text x="185" y="240" text-anchor="middle" font-size="10" fill="#555">2</text>
    <text x="245" y="240" text-anchor="middle" font-size="10" fill="#555">3</text>
    <text x="305" y="240" text-anchor="middle" font-size="10" fill="#555">4</text>
    <text x="365" y="240" text-anchor="middle" font-size="10" fill="#555">5</text>
    <text x="425" y="240" text-anchor="middle" font-size="10" fill="#555">6</text>
    <text x="485" y="240" text-anchor="middle" font-size="10" fill="#555">7</text>
    <text x="545" y="240" text-anchor="middle" font-size="10" fill="#555">8</text>
    <!-- 说明 -->
    <rect x="30" y="265" width="540" height="120" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">4位二进制加法计数器</text>
    <text x="50" y="310" text-anchor="start" font-size="12" fill="#000">• 计数范围：0000 ~ 1111（0 ~ 15）</text>
    <text x="50" y="330" text-anchor="start" font-size="12" fill="#000">• 每来一个 CP 上升沿，计数值加 1</text>
    <text x="50" y="350" text-anchor="start" font-size="12" fill="#000">• Q₀ 在 CP 下降沿翻转（模 2）</text>
    <text x="50" y="370" text-anchor="start" font-size="12" fill="#000">• Q₁ 在 Q₀ 下降沿翻转（模 4），以此类推</text>
    <text x="50" y="390" text-anchor="start" font-size="12" fill="#000">• 计满 1111 后自动归零（溢出）</text>
  </g>
</svg>