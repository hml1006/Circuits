<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">H 桥电机驱动电路</text>
    
    <!-- DC supply -->
    <text x="30" y="90" font-size="13" fill="#000" font-weight="bold">Vdc</text>
    <line x1="30" y1="70" x2="70" y2="70" stroke="#000" stroke-width="2"/>
    <line x1="30" y1="110" x2="70" y2="110" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="70" x2="50" y2="50" stroke="#000" stroke-width="2"/>
    <line x1="40" y1="50" x2="60" y2="50" stroke="#000" stroke-width="2"/>
    <line x1="40" y1="110" x2="60" y2="110" stroke="#000" stroke-width="2"/>
    
    <!-- Top rail -->
    <line x1="70" y1="70" x2="550" y2="70" stroke="#000" stroke-width="2"/>
    <!-- Bottom rail -->
    <line x1="70" y1="330" x2="550" y2="330" stroke="#000" stroke-width="2"/>
    
    <!-- S1 (top-left) -->
    <rect x="130" y="50" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="160" y="75" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₁</text>
    <polygon points="160,90 160,110 148,100" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="148" y1="100" x2="172" y2="100" stroke="#c00" stroke-width="1.5"/>
    
    <!-- S3 (bottom-left) -->
    <rect x="130" y="310" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="160" y="335" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₃</text>
    <polygon points="160,290 160,270 148,280" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="148" y1="280" x2="172" y2="280" stroke="#c00" stroke-width="1.5"/>
    
    <!-- S2 (top-right) -->
    <rect x="410" y="50" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="440" y="75" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₂</text>
    <polygon points="440,90 440,110 428,100" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="428" y1="100" x2="452" y2="100" stroke="#c00" stroke-width="1.5"/>
    
    <!-- S4 (bottom-right) -->
    <rect x="410" y="310" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="440" y="335" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₄</text>
    <polygon points="440,290 440,270 428,280" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="428" y1="280" x2="452" y2="280" stroke="#c00" stroke-width="1.5"/>
    
    <!-- Vertical connections -->
    <line x1="160" y1="70" x2="160" y2="90" stroke="#000" stroke-width="2"/>
    <line x1="160" y1="110" x2="160" y2="310" stroke="#000" stroke-width="2"/>
    <line x1="160" y1="350" x2="160" y2="330" stroke="#000" stroke-width="2"/>
    
    <line x1="440" y1="70" x2="440" y2="90" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="110" x2="440" y2="310" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="350" x2="440" y2="330" stroke="#000" stroke-width="2"/>
    
    <!-- Motor (M) between the legs -->
    <line x1="160" y1="180" x2="220" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="180" x2="380" y2="180" stroke="#000" stroke-width="2"/>
    
    <circle cx="300" cy="180" r="35" fill="none" stroke="#000" stroke-width="2"/>
    <text x="300" y="178" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">M</text>
    <text x="300" y="195" text-anchor="middle" font-size="11" fill="#666">电机</text>
    
    <!-- Current flow arrow (example: forward) -->
    <path d="M 220 180 Q 260 160 280 180" fill="none" stroke="#00c" stroke-width="2" marker-end="url(#arrowBlue)"/>
    
    <defs>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00c"/>
      </marker>
    </defs>
    
    <!-- Operation modes table -->
    <text x="300" y="250" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">四种工作模式</text>
    
    <line x1="70" y1="260" x2="530" y2="260" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="280" x2="530" y2="280" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="300" x2="530" y2="300" stroke="#000" stroke-width="1"/>
    <line x1="70" y1="320" x2="530" y2="320" stroke="#000" stroke-width="1"/>
    
    <text x="90" y="273" font-size="10" fill="#000" font-weight="bold">模式</text>
    <text x="170" y="273" font-size="10" fill="#000" font-weight="bold">S₁</text>
    <text x="230" y="273" font-size="10" fill="#000" font-weight="bold">S₂</text>
    <text x="290" y="273" font-size="10" fill="#000" font-weight="bold">S₃</text>
    <text x="350" y="273" font-size="10" fill="#000" font-weight="bold">S₄</text>
    <text x="440" y="273" font-size="10" fill="#000" font-weight="bold">电机状态</text>
    
    <text x="90" y="293" font-size="10" fill="#000">正转</text>
    <text x="170" y="293" font-size="10" fill="#000">PWM</text>
    <text x="230" y="293" font-size="10" fill="#000">OFF</text>
    <text x="290" y="293" font-size="10" fill="#000">OFF</text>
    <text x="350" y="293" font-size="10" fill="#000">ON</text>
    <text x="440" y="293" font-size="10" fill="#000">正向旋转</text>
    
    <text x="90" y="313" font-size="10" fill="#000">反转</text>
    <text x="170" y="313" font-size="10" fill="#000">OFF</text>
    <text x="230" y="313" font-size="10" fill="#000">ON</text>
    <text x="290" y="313" font-size="10" fill="#000">PWM</text>
    <text x="350" y="313" font-size="10" fill="#000">OFF</text>
    <text x="440" y="313" font-size="10" fill="#000">反向旋转</text>
    
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">PWM 调速：V_avg = D · Vdc（单极性）或 (2D-1) · Vdc（双极性）</text>
  </g>
</svg>