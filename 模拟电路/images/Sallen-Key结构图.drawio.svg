<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Sallen-Key二阶低通滤波器</text>

    <!-- 输入 -->
    <text x="30" y="130" font-size="13" fill="#333">v</text>
    <text x="30" y="140" font-size="10" fill="#333">i</text>
    <line x1="50" y1="130" x2="90" y2="130" stroke="#333" stroke-width="2"/>

    <!-- R1 -->
    <rect x="90" y="110" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="100" y="135" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="108" y="135" text-anchor="middle" font-size="10" fill="#666">1</text>
    <line x1="110" y1="130" x2="150" y2="130" stroke="#333" stroke-width="2"/>

    <!-- R2 -->
    <rect x="150" y="110" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="160" y="135" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="168" y="135" text-anchor="middle" font-size="10" fill="#666">2</text>
    <line x1="170" y1="130" x2="210" y2="130" stroke="#333" stroke-width="2"/>

    <!-- 运放同相输入端 -->
    <line x1="210" y1="130" x2="280" y2="220" stroke="#333" stroke-width="2"/>

    <!-- 运放 -->
    <polygon points="280,100 280,260 400,180" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <text x="310" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
    <text x="270" y="135" text-anchor="end" font-size="11" fill="#333">−</text>
    <text x="270" y="215" text-anchor="end" font-size="11" fill="#333">+</text>

    <!-- 输出 -->
    <line x1="400" y1="180" x2="470" y2="180" stroke="#333" stroke-width="2"/>
    <text x="480" y="185" font-size="13" fill="#333">v</text>
    <text x="480" y="195" font-size="10" fill="#333">o</text>

    <!-- C1 反馈 -->
    <line x1="400" y1="180" x2="440" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="170" x2="440" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="430" y1="170" x2="450" y2="170" stroke="#333" stroke-width="3"/>
    <line x1="430" y1="190" x2="450" y2="190" stroke="#333" stroke-width="3"/>
    <text x="460" y="185" font-size="12" fill="#333">C</text>
    <text x="468" y="185" font-size="10" fill="#666">1</text>

    <!-- C1 另一端到R1-R2节点 -->
    <line x1="440" y1="170" x2="440" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="100" x2="130" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="130" y1="100" x2="130" y2="130" stroke="#333" stroke-width="2"/>

    <!-- C2 从R2输出到地 -->
    <line x1="170" y1="130" x2="170" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="80" x2="180" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="70" x2="180" y2="70" stroke="#333" stroke-width="3"/>
    <line x1="160" y1="90" x2="180" y2="90" stroke="#333" stroke-width="3"/>
    <text x="190" y="78" font-size="12" fill="#333">C</text>
    <text x="198" y="78" font-size="10" fill="#666">2</text>
    <line x1="170" y1="90" x2="170" y2="60" stroke="#333" stroke-width="2"/>

    <!-- 反馈电阻分压网络 -->
    <!-- Rf -->
    <line x1="400" y1="180" x2="400" y2="260" stroke="#333" stroke-width="2"/>
    <rect x="390" y="260" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="400" y="285" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="408" y="285" text-anchor="middle" font-size="10" fill="#666">f</text>
    <line x1="390" y1="300" x2="370" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="300" x2="370" y2="340" stroke="#333" stroke-width="2"/>

    <!-- Rg -->
    <rect x="350" y="340" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="360" y="365" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="368" y="365" text-anchor="middle" font-size="10" fill="#666">g</text>
    <line x1="350" y1="360" x2="310" y2="360" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="360" x2="310" y2="390" stroke="#333" stroke-width="2"/>

    <!-- 反相输入端 -->
    <line x1="280" y1="130" x2="370" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="130" x2="370" y2="300" stroke="#333" stroke-width="2"/>

    <!-- 地线 -->
    <line x1="290" y1="390" x2="330" y2="390" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="390" x2="290" y2="395" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="390" x2="330" y2="395" stroke="#333" stroke-width="2"/>

    <line x1="150" y1="60" x2="190" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="60" x2="150" y2="55" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="60" x2="190" y2="55" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="55" x2="190" y2="55" stroke="#333" stroke-width="2"/>

    <!-- 公式 -->
    <text x="300" y="50" text-anchor="middle" font-size="12" fill="#666">ω</text>
    <text x="312" y="50" text-anchor="middle" font-size="12" fill="#666">c</text>
    <text x="320" y="50" text-anchor="middle" font-size="12" fill="#666"> = 1/√(R</text>
    <text x="348" y="50" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="356" y="50" text-anchor="middle" font-size="12" fill="#666">R</text>
    <text x="366" y="50" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="374" y="50" text-anchor="middle" font-size="12" fill="#666">C</text>
    <text x="384" y="50" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="392" y="50" text-anchor="middle" font-size="12" fill="#666">C</text>
    <text x="402" y="50" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="410" y="50" text-anchor="middle" font-size="12" fill="#666">)</text>
    <text x="300" y="65" text-anchor="middle" font-size="11" fill="#666">A</text>
    <text x="310" y="65" text-anchor="middle" font-size="11" fill="#666">0</text>
    <text x="320" y="65" text-anchor="middle" font-size="11" fill="#666"> = 1 + R</text>
    <text x="345" y="65" text-anchor="middle" font-size="11" fill="#666">f</text>
    <text x="352" y="65" text-anchor="middle" font-size="11" fill="#666">/R</text>
    <text x="368" y="65" text-anchor="middle" font-size="11" fill="#666">g</text>
  </g>
</svg>