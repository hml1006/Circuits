<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电磁铁结构图</text>
    
    <!-- 电磁铁主体 -->
    <!-- 铁芯（U形或条形） -->
    <rect x="200" y="130" width="200" height="30" rx="5" ry="5" fill="#a0a0a0" stroke="#666" stroke-width="2"/>
    <text x="300" y="150" text-anchor="middle" font-size="11" fill="#fff">铁芯（软铁）</text>
    
    <!-- 线圈绕线（左侧） -->
    <path d="M 210 100 Q 225 95 225 130 Q 225 165 240 160" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <path d="M 240 160 Q 255 155 255 190 Q 255 225 270 220" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <path d="M 270 220 Q 285 215 285 230" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    
    <!-- 线圈绕线（右侧） -->
    <path d="M 390 100 Q 375 95 375 130 Q 375 165 360 160" fill="none" stroke="#2980b9" stroke-width="2.5"/>
    <path d="M 360 160 Q 345 155 345 190 Q 345 225 330 220" fill="none" stroke="#2980b9" stroke-width="2.5"/>
    <path d="M 330 220 Q 315 215 315 230" fill="none" stroke="#2980b9" stroke-width="2.5"/>
    
    <!-- 电流方向标注 -->
    <text x="215" y="95" font-size="10" fill="#c0392b">I</text>
    <path d="M 220 98 L 220 92" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#smallUp)"/>
    
    <text x="385" y="95" font-size="10" fill="#2980b9">I</text>
    <path d="M 380 98 L 380 92" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#smallUp)"/>
    
    <!-- N 极 -->
    <rect x="165" y="130" width="40" height="30" rx="5" ry="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="185" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">N</text>
    
    <!-- S 极 -->
    <rect x="395" y="130" width="40" height="30" rx="5" ry="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="415" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">S</text>
    
    <!-- 电源和开关 -->
    <rect x="250" y="260" width="50" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="262" y1="260" x2="262" y2="250" stroke="#333" stroke-width="2"/>
    <line x1="288" y1="260" x2="288" y2="250" stroke="#333" stroke-width="2"/>
    <text x="275" y="278" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="275" y="288" text-anchor="middle" font-size="10" fill="#333">−</text>
    <text x="275" y="305" text-anchor="middle" font-size="10" fill="#555">电源</text>
    
    <!-- 开关 -->
    <line x1="300" y1="250" x2="330" y2="250" stroke="#333" stroke-width="2"/>
    <circle cx="330" cy="250" r="3" fill="#333"/>
    <line x1="330" y1="250" x2="345" y2="235" stroke="#333" stroke-width="2"/>
    <circle cx="345" cy="235" r="3" fill="#333"/>
    <line x1="345" y1="235" x2="360" y2="235" stroke="#333" stroke-width="2"/>
    <text x="340" y="225" text-anchor="middle" font-size="11" fill="#555">S</text>
    
    <!-- 导线连接 -->
    <line x1="250" y1="250" x2="250" y2="235" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="235" x2="285" y2="235" stroke="#333" stroke-width="2"/>
    
    <line x1="360" y1="235" x2="380" y2="235" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="235" x2="380" y2="250" stroke="#333" stroke-width="2"/>
    
    <line x1="285" y1="230" x2="285" y2="220" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="250" x2="380" y2="260" stroke="#333" stroke-width="2"/>
    
    <line x1="285" y1="220" x2="285" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="260" x2="380" y2="160" stroke="#333" stroke-width="2"/>
    
    <!-- 特点说明 -->
    <rect x="30" y="310" width="540" height="80" rx="8" ry="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="300" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">电磁铁特点</text>
    
    <text x="50" y="358" font-size="12" fill="#555">① 磁性可控：通断电可控制磁性的有无</text>
    <text x="50" y="378" font-size="12" fill="#555">② 强弱可调：改变电流大小或线圈匝数调节磁性强弱</text>
    <text x="50" y="398" font-size="12" fill="#555">③ 极性可换：改变电流方向可改变 N、S 极</text>
    
    <defs>
      <marker id="smallUp" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M 0 10 L 5 0 L 10 10" fill="#333"/>
      </marker>
    </defs>
  </g>
</svg>