<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">右手螺旋定则示意图（安培定则一）</text>
    
    <!-- 直导线（竖直） -->
    <line x1="300" y1="60" x2="300" y2="370" stroke="#333" stroke-width="4"/>
    
    <!-- 电流方向标注（向上） -->
    <path d="M 300 370 L 300 340" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M 300 310 L 300 280" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M 300 250 L 300 220" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M 300 190 L 300 160" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M 300 130 L 300 100" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    
    <!-- 电流方向大箭头 -->
    <path d="M 300 370 L 300 80" fill="none" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowUpRed)"/>
    <text x="320" y="370" font-size="14" font-weight="bold" fill="#e74c3c">电流方向 I</text>
    <text x="320" y="350" font-size="11" fill="#666">（大拇指指向）</text>
    
    <!-- 磁感线（同心圆） -->
    <circle cx="300" cy="200" r="40" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
    <circle cx="300" cy="200" r="70" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
    <circle cx="300" cy="200" r="100" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
    <circle cx="300" cy="200" r="130" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,3"/>
    
    <!-- 磁感线方向箭头（逆时针，从上方看电流向上时） -->
    <!-- 外圈 -->
    <path d="M 400 70 A 130 130 0 0 1 430 200" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 430 200 A 130 130 0 0 1 400 330" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 200 70 A 130 130 0 0 0 170 200" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 170 200 A 130 130 0 0 0 200 330" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowBlue)"/>
    
    <text x="440" y="205" font-size="12" fill="#3498db">磁场方向</text>
    <text x="440" y="222" font-size="11" fill="#666">（四指弯曲方向）</text>
    
    <!-- 右手示意（简化的手形） -->
    <rect x="80" y="240" width="140" height="140" rx="10" ry="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="150" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67e22">右手示意</text>
    
    <!-- 简化的右手 -->
    <path d="M 120 370 L 120 300 Q 120 280 140 280 L 160 280 Q 180 280 180 300 L 180 370" fill="none" stroke="#e67e22" stroke-width="3"/>
    <!-- 大拇指（向上） -->
    <path d="M 150 280 L 150 260 L 160 260" fill="none" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
    <text x="165" y="265" font-size="10" fill="#e67e22">拇指→电流</text>
    
    <!-- 四指（弯曲示意） -->
    <path d="M 120 300 Q 110 320 120 340" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M 180 300 Q 190 320 180 340" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="165" y="360" font-size="10" fill="#e67e22">四指→磁场</text>
    
    <!-- 说明 -->
    <rect x="30" y="80" width="220" height="90" rx="8" ry="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
    <text x="140" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a085">右手螺旋定则</text>
    <text x="140" y="125" text-anchor="middle" font-size="11" fill="#555">用右手握住直导线</text>
    <text x="140" y="145" text-anchor="middle" font-size="11" fill="#555">大拇指指向电流方向</text>
    <text x="140" y="165" text-anchor="middle" font-size="11" fill="#555">四指弯曲方向即为磁场方向</text>
    
    <defs>
      <marker id="arrowUpRed" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 10 L 5 0 L 10 10" fill="#e74c3c"/>
      </marker>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#3498db"/>
      </marker>
    </defs>
  </g>
</svg>