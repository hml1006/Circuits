<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">传输线等效电路模型（分布参数）</text>
    
    <!-- Top horizontal wire -->
    <line x1="40" y1="80" x2="560" y2="80" stroke="#000" stroke-width="2"/>
    <!-- Bottom horizontal wire -->
    <line x1="40" y1="320" x2="560" y2="320" stroke="#000" stroke-width="2"/>
    
    <!-- Vertical dashed lines between segments -->
    <line x1="100" y1="60" x2="100" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="220" y1="60" x2="220" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="340" y1="60" x2="340" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="460" y1="60" x2="460" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Segment 1: R -->
    <rect x="115" y="65" width="40" height="30" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="135" y="84" text-anchor="middle" font-size="14" fill="#000" font-style="italic">R</text>
    <!-- Segment 1: L -->
    <path d="M 140 80 L 155 65 L 175 95 L 190 80" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="135" y="58" text-anchor="middle" font-size="12" fill="#000" font-style="italic">L</text>
    
    <!-- Segment 1 labels -->
    <text x="160" y="50" text-anchor="middle" font-size="11" fill="#666">RΔz</text>
    <text x="160" y="112" text-anchor="middle" font-size="11" fill="#666">LΔz</text>
    
    <!-- Segment 2: G -->
    <path d="M 250 80 L 250 120" stroke="#000" stroke-width="1.5"/>
    <path d="M 250 120 L 250 160" stroke="#000" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Arrow for G -->
    <polygon points="250,130 245,140 255,140" fill="#000"/>
    <text x="262" y="138" font-size="14" fill="#000" font-style="italic">G</text>
    <!-- Segment 2: C -->
    <line x1="240" y1="175" x2="260" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="240" y1="195" x2="260" y2="195" stroke="#000" stroke-width="1.5"/>
    <text x="262" y="190" font-size="14" fill="#000" font-style="italic">C</text>
    
    <!-- Segment 2 labels -->
    <text x="310" y="138" text-anchor="middle" font-size="11" fill="#666">GΔz</text>
    <text x="310" y="190" text-anchor="middle" font-size="11" fill="#666">CΔz</text>
    
    <!-- Segment 3: R -->
    <rect x="355" y="65" width="40" height="30" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="375" y="84" text-anchor="middle" font-size="14" fill="#000" font-style="italic">R</text>
    <path d="M 380 80 L 395 65 L 415 95 L 430 80" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="375" y="58" text-anchor="middle" font-size="12" fill="#000" font-style="italic">L</text>
    
    <!-- Segment 3: G -->
    <path d="M 490 80 L 490 120" stroke="#000" stroke-width="1.5"/>
    <path d="M 490 120 L 490 160" stroke="#000" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="490,130 485,140 495,140" fill="#000"/>
    <text x="502" y="138" font-size="14" fill="#000" font-style="italic">G</text>
    <line x1="480" y1="175" x2="500" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="480" y1="195" x2="500" y2="195" stroke="#000" stroke-width="1.5"/>
    <text x="502" y="190" font-size="14" fill="#000" font-style="italic">C</text>
    
    <!-- Ellipsis in middle -->
    <text x="280" y="90" text-anchor="middle" font-size="20" fill="#888">…</text>
    <text x="280" y="170" text-anchor="middle" font-size="20" fill="#888">…</text>
    
    <!-- Δz annotation -->
    <line x1="100" y1="350" x2="220" y2="350" stroke="#000" stroke-width="1.5"/>
    <polygon points="100,350 110,347 110,353" fill="#000"/>
    <polygon points="220,350 210,347 210,353" fill="#000"/>
    <text x="160" y="365" text-anchor="middle" font-size="13" fill="#000" font-style="italic">Δz</text>
    
    <!-- Input label -->
    <text x="25" y="84" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">v(z)</text>
    <text x="25" y="316" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">v(z+Δz)</text>
    
    <!-- Arrow labels for voltage -->
    <line x1="15" y1="80" x2="15" y2="320" stroke="#000" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="15,80 12,90 18,90" fill="#000"/>
    <polygon points="15,320 12,310 18,310" fill="#000"/>
    
    <!-- Bottom legend -->
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#666">R: 单位长度电阻 | L: 单位长度电感 | G: 单位长度电导 | C: 单位长度电容</text>
  </g>
</svg>