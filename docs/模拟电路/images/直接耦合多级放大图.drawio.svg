<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">直接耦合多级放大电路</text>

    <!-- VCC -->
    <line x1="100" y1="60" x2="560" y2="60" stroke="#333" stroke-width="2"/>
    <text x="570" y="65" font-size="14" font-weight="bold" fill="#cc3333">+V</text>
    <text x="585" y="65" font-size="11" fill="#cc3333">CC</text>

    <!-- 第一级 -->
    <rect x="80" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="87" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="87" y="113" text-anchor="middle" font-size="7" fill="#666">B1</text>
    <line x1="100" y1="60" x2="87" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="87" y1="60" x2="87" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="87" y1="115" x2="87" y2="130" stroke="#333" stroke-width="2"/>

    <rect x="160" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="167" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="167" y="113" text-anchor="middle" font-size="7" fill="#666">C1</text>
    <line x1="160" y1="60" x2="167" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="60" x2="167" y2="80" stroke="#333" stroke-width="2"/>

    <!-- Q1 -->
    <line x1="167" y1="115" x2="167" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="130" x2="167" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="130" x2="145" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="180" x2="190" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="180" x2="175" y2="172" stroke="#333" stroke-width="2"/>
    <polygon points="167,180 175,172 175,188" fill="#333"/>
    <text x="178" y="135" font-size="10" font-weight="bold" fill="#333">Q1</text>

    <!-- 直接连接（无电容） -->
    <line x1="167" y1="80" x2="250" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="180" x2="250" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 第二级 -->
    <rect x="250" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="257" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="257" y="113" text-anchor="middle" font-size="7" fill="#666">B2</text>
    <line x1="250" y1="60" x2="257" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="257" y1="60" x2="257" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="257" y1="115" x2="257" y2="130" stroke="#333" stroke-width="2"/>

    <rect x="340" y="80" width="14" height="35" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="347" y="103" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="347" y="113" text-anchor="middle" font-size="7" fill="#666">C2</text>
    <line x1="340" y1="60" x2="347" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="347" y1="60" x2="347" y2="80" stroke="#333" stroke-width="2"/>

    <!-- Q2 -->
    <line x1="347" y1="115" x2="347" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="347" y1="130" x2="347" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="347" y1="130" x2="325" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="347" y1="180" x2="370" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="347" y1="180" x2="355" y2="172" stroke="#333" stroke-width="2"/>
    <polygon points="347,180 355,172 355,188" fill="#333"/>
    <text x="358" y="135" font-size="10" font-weight="bold" fill="#333">Q2</text>

    <!-- 级间直接耦合线 -->
    <line x1="250" y1="80" x2="340" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="130" x2="325" y2="130" stroke="#333" stroke-width="2"/>

    <!-- 接地 -->
    <line x1="87" y1="210" x2="87" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="167" y1="180" x2="167" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="257" y1="210" x2="257" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="347" y1="180" x2="347" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="87" y1="280" x2="347" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="280" x2="200" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="290" x2="210" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="195" y1="295" x2="205" y2="295" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="347" y1="80" x2="420" y2="80" stroke="#333" stroke-width="2"/>
    <rect x="420" y="65" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="427" y="85" text-anchor="middle" font-size="10" fill="#333">C</text>
    <line x1="434" y1="80" x2="480" y2="80" stroke="#333" stroke-width="2"/>
    <text x="490" y="85" font-size="12" fill="#333">v</text>
    <text x="500" y="85" font-size="11" fill="#666">o</text>

    <!-- 输入 -->
    <text x="50" y="185" font-size="12" fill="#333">v</text>
    <text x="60" y="185" font-size="11" fill="#666">i</text>
    <line x1="70" y1="180" x2="87" y2="180" stroke="#333" stroke-width="2"/>
    <rect x="70" y="165" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="77" y="185" text-anchor="middle" font-size="10" fill="#333">C</text>

    <!-- 标注无电容耦合 -->
    <text x="205" y="200" text-anchor="middle" font-size="10" fill="#cc3333">直接耦合</text>
    <text x="205" y="212" text-anchor="middle" font-size="9" fill="#666">（无隔直电容）</text>
  </g>
</svg>