<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">L 型匹配网络</text>
    
    <!-- ===== Low-pass L-type (left side) ===== -->
    <text x="150" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">低通 L 型（R_L &lt; R_S）</text>
    
    <!-- Source -->
    <rect x="20" y="75" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="3"/>
    <text x="40" y="93" text-anchor="middle" font-size="11" fill="#c00">Z_S</text>
    
    <!-- Top wire -->
    <line x1="60" y1="90" x2="260" y2="90" stroke="#000" stroke-width="2"/>
    
    <!-- Series inductor L -->
    <path d="M 100 90 L 110 75 L 130 105 L 150 75 L 170 105 L 190 75 L 200 90" fill="none" stroke="#000" stroke-width="2"/>
    <text x="150" y="118" text-anchor="middle" font-size="12" fill="#000" font-style="italic">L</text>
    
    <!-- Shunt capacitor C -->
    <line x1="220" y1="90" x2="220" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="210" y1="140" x2="230" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="210" y1="155" x2="230" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="220" y1="155" x2="220" y2="200" stroke="#000" stroke-width="2"/>
    <text x="235" y="150" text-anchor="middle" font-size="12" fill="#000" font-style="italic">C</text>
    
    <!-- Ground -->
    <line x1="210" y1="200" x2="230" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="215" y1="205" x2="225" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="218" y1="210" x2="222" y2="210" stroke="#000" stroke-width="2"/>
    
    <!-- Bottom wire -->
    <line x1="60" y1="200" x2="260" y2="200" stroke="#000" stroke-width="2"/>
    
    <!-- Load -->
    <rect x="260" y="75" width="40" height="30" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="280" y="93" text-anchor="middle" font-size="11" fill="#080">Z_L</text>
    
    <!-- ===== High-pass L-type (right side) ===== -->
    <text x="450" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">高通 L 型（R_L &gt; R_S）</text>
    
    <!-- Source -->
    <rect x="320" y="75" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="3"/>
    <text x="340" y="93" text-anchor="middle" font-size="11" fill="#c00">Z_S</text>
    
    <!-- Top wire -->
    <line x1="360" y1="90" x2="560" y2="90" stroke="#000" stroke-width="2"/>
    
    <!-- Series capacitor C -->
    <line x1="410" y1="75" x2="410" y2="105" stroke="#000" stroke-width="2"/>
    <line x1="400" y1="75" x2="420" y2="75" stroke="#000" stroke-width="2"/>
    <line x1="400" y1="105" x2="420" y2="105" stroke="#000" stroke-width="2"/>
    <text x="410" y="120" text-anchor="middle" font-size="12" fill="#000" font-style="italic">C</text>
    
    <!-- Shunt inductor L -->
    <line x1="470" y1="90" x2="470" y2="130" stroke="#000" stroke-width="2"/>
    <path d="M 460 130 L 460 145 L 480 145 L 480 130" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M 460 145 L 460 160 L 480 160 L 480 145" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="160" x2="470" y2="200" stroke="#000" stroke-width="2"/>
    <text x="490" y="150" text-anchor="middle" font-size="12" fill="#000" font-style="italic">L</text>
    
    <!-- Ground -->
    <line x1="460" y1="200" x2="480" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="465" y1="205" x2="475" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="468" y1="210" x2="472" y2="210" stroke="#000" stroke-width="2"/>
    
    <!-- Bottom wire -->
    <line x1="360" y1="200" x2="560" y2="200" stroke="#000" stroke-width="2"/>
    
    <!-- Load -->
    <rect x="560" y="75" width="40" height="30" fill="#e0ffe0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="580" y="93" text-anchor="middle" font-size="11" fill="#080">Z_L</text>
    
    <!-- ===== Design formulas ===== -->
    <text x="300" y="245" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">设计公式</text>
    
    <text x="150" y="275" text-anchor="middle" font-size="12" fill="#000">低通：X_s = √(R_L(R_S-R_L))</text>
    <text x="150" y="295" text-anchor="middle" font-size="12" fill="#000">X_p = R_S·R_L/X_s</text>
    <text x="150" y="315" text-anchor="middle" font-size="12" fill="#000">L = X_s/ω, C = 1/(ωX_p)</text>
    
    <text x="450" y="275" text-anchor="middle" font-size="12" fill="#000">高通：X_p = √(R_S(R_L-R_S))</text>
    <text x="450" y="295" text-anchor="middle" font-size="12" fill="#000">X_s = R_S·R_L/X_p</text>
    <text x="450" y="315" text-anchor="middle" font-size="12" fill="#000">C = 1/(ωX_s), L = X_p/ω</text>
    
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#666">品质因数：Q = √(R_max/R_min - 1)</text>
    
    <!-- Bracket annotations -->
    <text x="150" y="370" text-anchor="middle" font-size="11" fill="#666">串联 L + 并联 C → 低通特性</text>
    <text x="450" y="370" text-anchor="middle" font-size="11" fill="#666">串联 C + 并联 L → 高通特性</text>
  </g>
</svg>