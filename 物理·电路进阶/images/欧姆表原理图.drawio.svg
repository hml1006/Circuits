<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">欧姆表原理图</text>
    
    <!-- 闭合回路 -->
    <line x1="120" y1="80" x2="120" y2="320" stroke="#333" stroke-width="2.5"/>
    <line x1="120" y1="80" x2="480" y2="80" stroke="#333" stroke-width="2.5"/>
    <line x1="480" y1="80" x2="480" y2="320" stroke="#333" stroke-width="2.5"/>
    <line x1="120" y1="320" x2="480" y2="320" stroke="#333" stroke-width="2.5"/>
    
    <!-- 表头 G -->
    <circle cx="200" cy="80" r="30" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    <text x="200" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">G</text>
    <text x="200" y="98" text-anchor="middle" font-size="10" fill="#666">R<tspan font-size="8" dy="3">g</tspan></tspan>
    
    <!-- 调零电阻 R0 -->
    <rect x="280" y="60" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="305" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">R<tspan font-size="9" dy="3">0</tspan></tspan>
    
    <!-- 电源 E -->
    <line x1="380" y1="70" x2="380" y2="90" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="90" x2="390" y2="90" stroke="#333" stroke-width="2"/>
    <line x1="375" y1="100" x2="385" y2="100" stroke="#333" stroke-width="2"/>
    <text x="380" y="115" text-anchor="middle" font-size="13" fill="#333">E, r</text>
    
    <!-- 底部导线连接 -->
    <line x1="200" y1="110" x2="200" y2="320" stroke="#333" stroke-width="2.5"/>
    <line x1="380" y1="110" x2="380" y2="320" stroke="#333" stroke-width="2.5"/>
    
    <!-- 红黑表笔 -->
    <line x1="480" y1="200" x2="540" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 红表笔 -->
    <circle cx="550" cy="200" r="12" fill="#ff4444" stroke="#cc0000" stroke-width="2"/>
    <text x="550" y="204" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">红</text>
    
    <!-- 黑表笔 -->
    <circle cx="550" cy="260" r="12" fill="#333" stroke="#000" stroke-width="2"/>
    <text x="550" y="264" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">黑</text>
    
    <!-- 待测电阻 Rx -->
    <rect x="280" y="300" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="305" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R<tspan font-size="10" dy="3">x</tspan></tspan>
    
    <!-- 虚线框标注欧姆表内部 -->
    <rect x="100" y="45" width="400" height="300" rx="10" ry="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="110" y="65" text-anchor="start" font-size="12" fill="#999">欧姆表内部电路</text>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="14" fill="#333">I = E / (R<tspan font-size="10" dy="3">Ω</tspan><tspan dy="-3"> + R<tspan font-size="10" dy="3">x</tspan><tspan dy="-3">)</tspan></tspan></text>
    <text x="300" y="365" text-anchor="middle" font-size="11" fill="#666">R<tspan font-size="9" dy="3">Ω</tspan><tspan dy="-3"> = R<tspan font-size="9" dy="3">g</tspan><tspan dy="-3"> + R<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> + r</tspan></tspan></tspan></tspan></text>
  </g>
</svg>