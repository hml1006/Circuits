<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">自感现象示意图</text>
    
    <!-- 电路 -->
    <line x1="80" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2.5"/>
    <line x1="200" y1="100" x2="200" y2="80" stroke="#333" stroke-width="2.5"/>
    <line x1="200" y1="80" x2="250" y2="80" stroke="#333" stroke-width="2.5"/>
    
    <!-- 灯泡 -->
    <circle cx="280" cy="80" r="20" fill="#fff9c4" stroke="#e6b800" stroke-width="2"/>
    <text x="280" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">L</text>
    
    <line x1="300" y1="80" x2="350" y2="80" stroke="#333" stroke-width="2.5"/>
    
    <!-- 开关 S -->
    <line x1="350" y1="80" x2="380" y2="80" stroke="#333" stroke-width="2.5"/>
    <line x1="380" y1="80" x2="400" y2="60" stroke="#333" stroke-width="2.5"/>
    <text x="370" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">S</text>
    
    <line x1="400" y1="60" x2="400" y2="100" stroke="#333" stroke-width="2.5"/>
    <line x1="400" y1="100" x2="520" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电源 E -->
    <line x1="520" y1="85" x2="520" y2="115" stroke="#333" stroke-width="2"/>
    <line x1="510" y1="115" x2="530" y2="115" stroke="#333" stroke-width="2"/>
    <text x="520" y="130" text-anchor="middle" font-size="13" fill="#333">E</text>
    
    <!-- 底部导线 -->
    <line x1="80" y1="100" x2="80" y2="300" stroke="#333" stroke-width="2.5"/>
    <line x1="80" y1="300" x2="520" y2="300" stroke="#333" stroke-width="2.5"/>
    <line x1="520" y1="115" x2="520" y2="300" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电感线圈 -->
    <path d="M 200,100 Q 210,130 200,160 Q 210,190 200,220 Q 210,250 200,280" fill="none" stroke="#333" stroke-width="2.5"/>
    <line x1="200" y1="280" x2="200" y2="300" stroke="#333" stroke-width="2.5"/>
    <text x="230" y="200" text-anchor="start" font-size="14" font-weight="bold" fill="#333" font-style="italic">L</text>
    
    <!-- 电流方向 -->
    <polygon points="140,95 155,100 140,105" fill="#333"/>
    <text x="140" y="85" text-anchor="middle" font-size="12" fill="#333" font-style="italic">I</text>
    
    <!-- 自感电动势标注 -->
    <text x="160" y="320" text-anchor="middle" font-size="12" fill="#d32f2f">e<tspan font-size="9" dy="3">L</tspan><tspan dy="-3"> = −L·dI/dt</tspan></tspan></text>
    
    <!-- 说明文字 -->
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#666">开关闭合时：灯泡逐渐变亮（电流不能突变）</text>
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#666">开关断开时：灯泡可能闪亮一下再熄灭</text>
  </g>
</svg>