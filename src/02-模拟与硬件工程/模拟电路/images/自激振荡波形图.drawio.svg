<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">自激振荡波形</text>

    <!-- 输入信号 -->
    <text x="30" y="70" font-size="12" fill="#666">输入信号 v</text>
    <text x="85" y="70" font-size="11" fill="#666">i</text>
    <line x1="60" y1="100" x2="540" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- 正弦波 稳定 -->
    <path d="M 60 100 Q 90 70 120 100 Q 150 130 180 100 Q 210 70 240 100 Q 270 130 300 100 Q 330 70 360 100 Q 390 130 420 100 Q 450 70 480 100 Q 510 130 540 100" fill="none" stroke="#3366cc" stroke-width="2"/>
    <text x="550" y="105" font-size="11" fill="#666">t</text>

    <!-- 输出信号 开始自激 -->
    <text x="30" y="170" font-size="12" fill="#666">输出信号 v</text>
    <text x="85" y="170" font-size="11" fill="#666">o</text>
    <line x1="60" y1="200" x2="540" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="250" x2="540" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="60" y1="300" x2="540" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- 正常放大 -->
    <path d="M 60 250 Q 80 230 100 250 Q 120 270 140 250 Q 160 230 180 250" fill="none" stroke="#cc3333" stroke-width="2"/>
    <!-- 开始振荡 -->
    <path d="M 180 250 Q 200 220 220 250 Q 240 280 260 280 Q 280 280 300 260 Q 320 240 340 230 Q 360 220 380 230 Q 400 240 420 260 Q 440 280 460 290 Q 480 300 500 300 Q 520 300 540 300" fill="none" stroke="#cc3333" stroke-width="2"/>
    <!-- 振幅增长标注 -->
    <text x="220" y="215" font-size="9" fill="#cc3333">振幅增长</text>
    <text x="380" y="315" font-size="9" fill="#cc3333">等幅振荡</text>

    <!-- 标注区域 -->
    <line x1="180" y1="200" x2="180" y2="315" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="120" y="320" text-anchor="middle" font-size="10" fill="#666">正常放大</text>
    <text x="360" y="320" text-anchor="middle" font-size="10" fill="#666">自激振荡</text>

    <!-- 振荡条件 -->
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#666">振幅条件：|AF| = 1 &#160;&#160; 相位条件：φ</text>
    <text x="405" y="360" text-anchor="middle" font-size="12" fill="#666">AF</text>
    <text x="420" y="360" text-anchor="middle" font-size="12" fill="#666"> = ±(2n+1)π</text>
  </g>
</svg>