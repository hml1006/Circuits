<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">CMOS 反相器电路</text>
    <!-- VDD -->
    <text x="300" y="60" text-anchor="middle" font-size="13" fill="#000">VDD</text>
    <line x1="300" y1="65" x2="300" y2="80" stroke="#000" stroke-width="1.5"/>
    <circle cx="300" cy="82" r="3" fill="#000"/>
    <!-- PMOS 上管 -->
    <rect x="275" y="85" width="50" height="60" rx="4" fill="#e8f8e8" stroke="#000" stroke-width="2"/>
    <circle cx="270" cy="100" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="105" text-anchor="middle" font-size="11" fill="#000">PMOS</text>
    <text x="300" y="120" text-anchor="middle" font-size="11" fill="#000">T₁</text>
    <line x1="300" y1="82" x2="300" y2="85" stroke="#000" stroke-width="1.5"/>
    <!-- 栅极连接 -->
    <line x1="270" y1="100" x2="200" y2="100" stroke="#000" stroke-width="1.5"/>
    <line x1="200" y1="100" x2="200" y2="200" stroke="#000" stroke-width="1.5"/>
    <!-- 输入 -->
    <line x1="160" y1="200" x2="200" y2="200" stroke="#000" stroke-width="1.5"/>
    <line x1="160" y1="200" x2="160" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="160" y1="150" x2="270" y2="150" stroke="#000" stroke-width="1.5"/>
    <circle cx="270" cy="150" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="150" y="204" text-anchor="end" font-size="14" font-weight="bold" fill="#000">VIN</text>
    <!-- 漏极连接 -->
    <line x1="300" y1="145" x2="300" y2="170" stroke="#000" stroke-width="1.5"/>
    <!-- NMOS 下管 -->
    <rect x="275" y="175" width="50" height="60" rx="4" fill="#ffe8e8" stroke="#000" stroke-width="2"/>
    <text x="300" y="195" text-anchor="middle" font-size="11" fill="#000">NMOS</text>
    <text x="300" y="210" text-anchor="middle" font-size="11" fill="#000">T₂</text>
    <line x1="300" y1="170" x2="300" y2="175" stroke="#000" stroke-width="1.5"/>
    <!-- 源极到GND -->
    <line x1="300" y1="235" x2="300" y2="260" stroke="#000" stroke-width="1.5"/>
    <circle cx="300" cy="262" r="3" fill="#000"/>
    <line x1="300" y1="265" x2="300" y2="280" stroke="#000" stroke-width="1.5"/>
    <line x1="280" y1="280" x2="320" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="288" y1="286" x2="312" y2="286" stroke="#000" stroke-width="2"/>
    <line x1="296" y1="292" x2="304" y2="292" stroke="#000" stroke-width="2"/>
    <text x="325" y="284" text-anchor="start" font-size="11" fill="#000">GND</text>
    <!-- 输出 -->
    <line x1="300" y1="170" x2="430" y2="170" stroke="#000" stroke-width="2"/>
    <text x="440" y="174" text-anchor="start" font-size="14" font-weight="bold" fill="#000">VOUT</text>
    <!-- 真值表 -->
    <rect x="30" y="310" width="240" height="75" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="150" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">真值表</text>
    <line x1="50" y1="340" x2="250" y2="340" stroke="#000" stroke-width="1"/>
    <text x="80" y="358" text-anchor="middle" font-size="12" fill="#000">VIN</text>
    <text x="200" y="358" text-anchor="middle" font-size="12" fill="#000">VOUT</text>
    <line x1="150" y1="340" x2="150" y2="385" stroke="#000" stroke-width="1"/>
    <text x="80" y="378" text-anchor="middle" font-size="12" fill="#000">0 (低)</text>
    <text x="200" y="378" text-anchor="middle" font-size="12" fill="#000">1 (高)</text>
    <text x="80" y="395" text-anchor="middle" font-size="12" fill="#000">1 (高)</text>
    <text x="200" y="395" text-anchor="middle" font-size="12" fill="#000">0 (低)</text>
    <!-- 说明 -->
    <text x="420" y="340" text-anchor="start" font-size="12" fill="#555">VIN=0: PMOS导通, NMOS截止</text>
    <text x="420" y="360" text-anchor="start" font-size="12" fill="#555">VOUT=VDD</text>
    <text x="420" y="385" text-anchor="start" font-size="12" fill="#555">VIN=1: PMOS截止, NMOS导通</text>
    <text x="420" y="405" text-anchor="start" font-size="12" fill="#555">VOUT=GND</text>
  </g>
</svg>