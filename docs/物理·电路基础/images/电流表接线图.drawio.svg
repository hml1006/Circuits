<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电流表接线图</text>
    
    <!-- 电路图 -->
    <!-- 电源 -->
    <rect x="40" y="180" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="55" y1="180" x2="55" y2="165" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="180" x2="75" y2="165" stroke="#333" stroke-width="2"/>
    <text x="65" y="195" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="65" y="210" text-anchor="middle" font-size="10" fill="#333">−</text>
    <text x="65" y="235" text-anchor="middle" font-size="12" fill="#555">电源</text>
    
    <!-- 导线：电源正极 → 上方 -->
    <line x1="65" y1="165" x2="65" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="100" x2="170" y2="100" stroke="#333" stroke-width="2"/>
    
    <!-- 开关 -->
    <line x1="170" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2"/>
    <circle cx="200" cy="100" r="3" fill="#333"/>
    <line x1="200" y1="100" x2="220" y2="85" stroke="#333" stroke-width="2"/>
    <circle cx="220" cy="85" r="3" fill="#333"/>
    <line x1="220" y1="85" x2="250" y2="85" stroke="#333" stroke-width="2"/>
    <text x="210" y="75" text-anchor="middle" font-size="11" fill="#555">S</text>
    
    <!-- 导线：开关 → 电流表 -->
    <line x1="250" y1="85" x2="300" y2="85" stroke="#333" stroke-width="2"/>
    
    <!-- 电流表 -->
    <rect x="300" y="70" width="60" height="50" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="330" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
    <text x="330" y="110" text-anchor="middle" font-size="9" fill="#555">电流表</text>
    
    <!-- 电流表接线柱 -->
    <line x1="300" y1="80" x2="285" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="110" x2="285" y2="110" stroke="#333" stroke-width="2"/>
    <text x="278" y="84" text-anchor="end" font-size="9" fill="#e74c3c">+</text>
    <text x="278" y="114" text-anchor="end" font-size="9" fill="#333">−</text>
    
    <!-- 电流表 → 用电器 -->
    <line x1="360" y1="85" x2="400" y2="85" stroke="#333" stroke-width="2"/>
    
    <!-- 用电器（灯泡） -->
    <circle cx="430" cy="85" r="20" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="415" y1="70" x2="445" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="445" y1="70" x2="415" y2="100" stroke="#333" stroke-width="2"/>
    <text x="430" y="125" text-anchor="middle" font-size="11" fill="#555">灯泡 L</text>
    
    <!-- 导线：灯泡 → 电源负极 -->
    <line x1="450" y1="85" x2="535" y2="85" stroke="#333" stroke-width="2"/>
    <line x1="535" y1="85" x2="535" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="535" y1="180" x2="90" y2="180" stroke="#333" stroke-width="2"/>
    
    <!-- 注意事项 -->
    <rect x="30" y="270" width="540" height="110" rx="8" ry="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="2"/>
    <text x="300" y="295" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67e22">电流表使用规则</text>
    
    <text x="50" y="320" font-size="12" fill="#555">① 电流表必须与被测用电器</text>
    <text x="240" y="320" font-size="12" font-weight="bold" fill="#e74c3c">串联</text>
    
    <text x="50" y="340" font-size="12" fill="#555">② 电流从"</text>
    <text x="105" y="340" font-size="12" font-weight="bold" fill="#e74c3c">+</text>
    <text x="115" y="340" font-size="12" fill="#555">"接线柱流入，从"</text>
    <text x="210" y="340" font-size="12" font-weight="bold" fill="#333">−</text>
    <text x="220" y="340" font-size="12" fill="#555">"接线柱流出（正进负出）</text>
    
    <text x="50" y="360" font-size="12" fill="#555">③ 被测电流不得超过电流表的</text>
    <text x="250" y="360" font-size="12" font-weight="bold" fill="#e67e22">量程</text>
    
    <text x="50" y="380" font-size="12" fill="#555">④ 绝对不允许将电流表直接接在</text>
    <text x="250" y="380" font-size="12" font-weight="bold" fill="#e74c3c">电源两端</text>
    <text x="320" y="380" font-size="12" fill="#555">（相当于短路）</text>
  </g>
</svg>