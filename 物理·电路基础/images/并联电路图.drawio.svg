<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">并联电路图</text>
    
    <!-- 电路图 -->
    <!-- 电源 -->
    <rect x="40" y="190" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="55" y1="190" x2="55" y2="175" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="190" x2="75" y2="175" stroke="#333" stroke-width="2"/>
    <text x="65" y="205" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="65" y="220" text-anchor="middle" font-size="10" fill="#333">−</text>
    <text x="65" y="245" text-anchor="middle" font-size="12" fill="#555">电源</text>
    
    <!-- 干路导线：电源正极 → 上方 -->
    <line x1="65" y1="175" x2="65" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="60" x2="280" y2="60" stroke="#333" stroke-width="2"/>
    
    <!-- 开关（干路） -->
    <line x1="280" y1="60" x2="310" y2="60" stroke="#333" stroke-width="2"/>
    <circle cx="310" cy="60" r="3" fill="#333"/>
    <line x1="310" y1="60" x2="330" y2="45" stroke="#333" stroke-width="2"/>
    <circle cx="330" cy="45" r="3" fill="#333"/>
    <line x1="330" y1="45" x2="360" y2="45" stroke="#333" stroke-width="2"/>
    <text x="320" y="35" text-anchor="middle" font-size="11" fill="#555">S</text>
    
    <line x1="360" y1="45" x2="480" y2="45" stroke="#333" stroke-width="2"/>
    
    <!-- 分支点 -->
    <circle cx="480" cy="45" r="3" fill="#333"/>
    
    <!-- 支路1：L1 -->
    <line x1="480" y1="45" x2="480" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="480" y1="80" x2="350" y2="80" stroke="#333" stroke-width="2"/>
    
    <circle cx="320" cy="80" r="22" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="303" y1="63" x2="337" y2="97" stroke="#333" stroke-width="2"/>
    <line x1="337" y1="63" x2="303" y2="97" stroke="#333" stroke-width="2"/>
    <text x="320" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">L₁</text>
    
    <line x1="298" y1="80" x2="250" y2="80" stroke="#333" stroke-width="2"/>
    
    <!-- 支路1开关 S1 -->
    <line x1="250" y1="80" x2="230" y2="80" stroke="#333" stroke-width="2"/>
    <circle cx="230" cy="80" r="3" fill="#333"/>
    <line x1="230" y1="80" x2="215" y2="68" stroke="#333" stroke-width="2"/>
    <circle cx="215" cy="68" r="3" fill="#333"/>
    <line x1="215" y1="68" x2="200" y2="68" stroke="#333" stroke-width="2"/>
    <text x="220" y="60" text-anchor="middle" font-size="9" fill="#555">S₁</text>
    
    <!-- 支路2：L2 -->
    <line x1="480" y1="45" x2="480" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="480" y1="130" x2="350" y2="130" stroke="#333" stroke-width="2"/>
    
    <circle cx="320" cy="130" r="22" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="303" y1="113" x2="337" y2="147" stroke="#333" stroke-width="2"/>
    <line x1="337" y1="113" x2="303" y2="147" stroke="#333" stroke-width="2"/>
    <text x="320" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">L₂</text>
    
    <line x1="298" y1="130" x2="250" y2="130" stroke="#333" stroke-width="2"/>
    
    <!-- 支路2开关 S2 -->
    <line x1="250" y1="130" x2="230" y2="130" stroke="#333" stroke-width="2"/>
    <circle cx="230" cy="130" r="3" fill="#333"/>
    <line x1="230" y1="130" x2="215" y2="118" stroke="#333" stroke-width="2"/>
    <circle cx="215" cy="118" r="3" fill="#333"/>
    <line x1="215" y1="118" x2="200" y2="118" stroke="#333" stroke-width="2"/>
    <text x="220" y="110" text-anchor="middle" font-size="9" fill="#555">S₂</text>
    
    <!-- 汇合点 -->
    <circle cx="200" cy="80" r="3" fill="#333"/>
    <line x1="200" y1="68" x2="200" y2="118" stroke="#333" stroke-width="2"/>
    
    <!-- 干路导线 → 电源负极 -->
    <line x1="200" y1="95" x2="200" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="190" x2="90" y2="190" stroke="#333" stroke-width="2"/>
    
    <!-- 电流方向箭头 -->
    <path d="M 80 60 L 140 60" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M 480 55 L 480 65" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M 480 55 L 480 115" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    
    <!-- 分支点标注 -->
    <text x="490" y="42" font-size="10" fill="#e74c3c">分支点</text>
    <text x="190" y="102" font-size="10" fill="#e74c3c">汇合点</text>
    
    <!-- 并联电路特点 -->
    <rect x="30" y="270" width="540" height="115" rx="8" ry="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="300" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">并联电路特点</text>
    
    <text x="50" y="320" font-size="12" fill="#555">① 各支路电压相等：</text>
    <text x="170" y="320" font-size="12" font-weight="bold" fill="#27ae60">U = U₁ = U₂</text>
    
    <text x="50" y="340" font-size="12" fill="#555">② 干路电流等于各支路电流之和：</text>
    <text x="290" y="340" font-size="12" font-weight="bold" fill="#27ae60">I = I₁ + I₂</text>
    
    <text x="50" y="360" font-size="12" fill="#555">③ 总电阻倒数等于各支路电阻倒数之和：</text>
    <text x="330" y="360" font-size="12" font-weight="bold" fill="#27ae60">1/R总 = 1/R₁ + 1/R₂</text>
    
    <text x="50" y="380" font-size="12" fill="#555">④ 各支路独立工作，互不影响</text>
    
    <defs>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#e74c3c"/>
      </marker>
    </defs>
  </g>
</svg>