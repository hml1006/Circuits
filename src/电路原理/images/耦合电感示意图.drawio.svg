<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">耦合电感示意图</text>
    <!-- 磁芯 -->
    <rect x="200" y="100" width="200" height="200" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
    <!-- 线圈1（左侧） -->
    <line x1="80" y1="150" x2="120" y2="150" stroke="#000" stroke-width="2"/>
    <path d="M120 150 Q127 140 134 150 Q141 160 148 150 Q155 140 162 150 Q169 160 176 150 Q183 140 190 150 Q197 160 204 150" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="204" y1="150" x2="220" y2="150" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="130" y="135" font-size="14" fill="#d32f2f">L₁</text>
    <text x="80" y="135" font-size="12" fill="#d32f2f">i₁</text>
    <polygon points="100,150 108,144 108,156" fill="#d32f2f"/>
    <!-- 线圈1底部 -->
    <line x1="220" y1="150" x2="240" y2="150" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="240" y1="150" x2="240" y2="280" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="80" y1="280" x2="240" y2="280" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="80" y1="150" x2="80" y2="280" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="80" y="175" font-size="11" fill="#d32f2f">u₁</text>
    <text x="75" y="170" font-size="10" fill="#333">+</text>
    <text x="75" y="195" font-size="10" fill="#333">-</text>

    <!-- 线圈2（右侧） -->
    <line x1="380" y1="150" x2="400" y2="150" stroke="#1976d2" stroke-width="2.5"/>
    <path d="M400 150 Q407 140 414 150 Q421 160 428 150 Q435 140 442 150 Q449 160 456 150 Q463 140 470 150 Q477 160 484 150" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="484" y1="150" x2="520" y2="150" stroke="#1976d2" stroke-width="2.5"/>
    <text x="490" y="135" font-size="14" fill="#1976d2">L₂</text>
    <text x="520" y="135" font-size="12" fill="#1976d2">i₂</text>
    <polygon points="510,150 502,144 502,156" fill="#1976d2"/>
    <!-- 线圈2底部 -->
    <line x1="380" y1="150" x2="380" y2="280" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="380" y1="280" x2="520" y2="280" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="520" y1="150" x2="520" y2="280" stroke="#1976d2" stroke-width="2.5"/>
    <text x="520" y="175" font-size="11" fill="#1976d2">u₂</text>
    <text x="525" y="170" font-size="10" fill="#333">+</text>
    <text x="525" y="195" font-size="10" fill="#333">-</text>

    <!-- 互感M标注 -->
    <text x="300" y="120" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">M = k√(L₁L₂)</text>
    <text x="300" y="320" text-anchor="middle" font-size="13" fill="#666">k: 耦合系数, 0 ≤ k ≤ 1</text>
    <!-- 互感电压公式 -->
    <text x="300" y="360" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">u₁ = L₁·di₁/dt ± M·di₂/dt</text>
    <text x="300" y="385" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">u₂ = ± M·di₁/dt + L₂·di₂/dt</text>
  </g>
</svg>