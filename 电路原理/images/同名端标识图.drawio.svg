<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">同名端标识图</text>
    <!-- 两个耦合电感线圈 -->
    <text x="300" y="60" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">同名端标识与互感电压极性</text>
    <!-- 线圈1 -->
    <path d="M100 100 Q107 90 114 100 Q121 110 128 100 Q135 90 142 100 Q149 110 156 100 Q163 90 170 100 Q177 110 184 100" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="60" y1="100" x2="100" y2="100" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="184" y1="100" x2="220" y2="100" stroke="#d32f2f" stroke-width="2.5"/>
    <!-- 同名端标记（圆点） -->
    <circle cx="100" cy="100" r="5" fill="#000"/>
    <text x="95" y="95" font-size="12" fill="#333" font-weight="bold">•</text>
    <text x="60" y="90" font-size="13" fill="#d32f2f">i₁</text>
    <polygon points="80,100 88,94 88,106" fill="#d32f2f"/>
    <text x="130" y="85" font-size="13" fill="#d32f2f">L₁</text>
    <text x="60" y="130" font-size="11" fill="#333">+</text>
    <text x="60" y="145" font-size="11" fill="#333">-</text>
    <text x="50" y="140" font-size="11" fill="#d32f2f">u₁</text>
    <line x1="60" y1="100" x2="60" y2="150" stroke="#d32f2f" stroke-width="2"/>
    <line x1="60" y1="150" x2="220" y2="150" stroke="#d32f2f" stroke-width="2"/>
    <line x1="220" y1="100" x2="220" y2="150" stroke="#d32f2f" stroke-width="2"/>

    <!-- 线圈2 -->
    <path d="M380 100 Q387 90 394 100 Q401 110 408 100 Q415 90 422 100 Q429 110 436 100 Q443 90 450 100 Q457 110 464 100" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="340" y1="100" x2="380" y2="100" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="464" y1="100" x2="500" y2="100" stroke="#1976d2" stroke-width="2.5"/>
    <!-- 同名端标记 -->
    <circle cx="380" cy="100" r="5" fill="#000"/>
    <text x="375" y="95" font-size="12" fill="#333" font-weight="bold">•</text>
    <text x="500" y="90" font-size="13" fill="#1976d2">i₂</text>
    <polygon points="480,100 472,94 472,106" fill="#1976d2"/>
    <text x="410" y="85" font-size="13" fill="#1976d2">L₂</text>
    <text x="500" y="130" font-size="11" fill="#333">+</text>
    <text x="500" y="145" font-size="11" fill="#333">-</text>
    <text x="510" y="140" font-size="11" fill="#1976d2">u₂</text>
    <line x1="340" y1="100" x2="340" y2="150" stroke="#1976d2" stroke-width="2"/>
    <line x1="340" y1="150" x2="500" y2="150" stroke="#1976d2" stroke-width="2"/>
    <line x1="500" y1="100" x2="500" y2="150" stroke="#1976d2" stroke-width="2"/>

    <!-- 说明 -->
    <text x="300" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">同名端规则：</text>
    <text x="300" y="225" text-anchor="middle" font-size="13" fill="#333">当电流从同名端流入时，互感电压在另一线圈的</text>
    <text x="300" y="245" text-anchor="middle" font-size="13" fill="#333">同名端产生正极性</text>
    <!-- 符号规则 -->
    <text x="300" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">符号规则：</text>
    <text x="300" y="305" text-anchor="middle" font-size="13" fill="#666">电流均从同名端流入 → 互感项取正号</text>
    <text x="300" y="325" text-anchor="middle" font-size="13" fill="#666">电流从异名端流入 → 互感项取负号</text>
    <!-- T型等效 -->
    <text x="300" y="365" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">同名端相连: Lₐ=L₁-M, L_b=L₂-M, L_c=M</text>
    <text x="300" y="390" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">异名端相连: Lₐ=L₁+M, L_b=L₂+M, L_c=-M</text>
  </g>
</svg>