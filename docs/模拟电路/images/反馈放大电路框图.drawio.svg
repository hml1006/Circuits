<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">反馈放大电路框图</text>

    <!-- 输入信号 -->
    <text x="40" y="180" font-size="12" fill="#333">X</text>
    <text x="50" y="180" font-size="11" fill="#666">s</text>
    <line x1="60" y1="180" x2="100" y2="180" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 求和节点 -->
    <circle cx="120" cy="180" r="15" fill="none" stroke="#333" stroke-width="2"/>
    <text x="120" y="185" text-anchor="middle" font-size="14" fill="#333">+</text>
    <text x="120" y="168" text-anchor="middle" font-size="12" fill="#333">+</text>
    <text x="145" y="175" font-size="10" fill="#666">X</text>
    <text x="152" y="175" font-size="10" fill="#666">i</text>

    <!-- 基本放大电路 -->
    <rect x="160" y="140" width="120" height="80" fill="#d4e8ff" stroke="#4a90d9" stroke-width="2" rx="5"/>
    <text x="220" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">基本放大</text>
    <text x="220" y="195" text-anchor="middle" font-size="11" fill="#4a90d9">电路 A</text>

    <!-- 输出信号 -->
    <line x1="280" y1="180" x2="340" y2="180" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <text x="350" y="185" font-size="12" fill="#333">X</text>
    <text x="360" y="185" font-size="11" fill="#666">o</text>

    <!-- 反馈网络 -->
    <rect x="240" y="280" width="120" height="60" fill="#ffe0b0" stroke="#e8913a" stroke-width="2" rx="5"/>
    <text x="300" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#e8913a">反馈网络</text>
    <text x="300" y="325" text-anchor="middle" font-size="11" fill="#e8913a">F</text>

    <!-- 反馈路径 -->
    <line x1="300" y1="220" x2="300" y2="280" stroke="#e8913a" stroke-width="2" marker-end="url(#arF)"/>

    <!-- 反馈信号 -->
    <line x1="240" y1="310" x2="160" y2="310" stroke="#e8913a" stroke-width="2"/>
    <line x1="160" y1="310" x2="160" y2="195" stroke="#e8913a" stroke-width="2" marker-end="url(#arF)"/>
    <text x="170" y="305" font-size="10" fill="#e8913a">X</text>
    <text x="178" y="305" font-size="10" fill="#e8913a">f</text>

    <defs>
      <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#333"/>
      </marker>
      <marker id="arF" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#e8913a"/>
      </marker>
    </defs>

    <!-- 公式 -->
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">闭环增益：A</text>
    <text x="335" y="370" text-anchor="middle" font-size="12" fill="#666">f</text>
    <text x="348" y="370" text-anchor="middle" font-size="12" fill="#666"> = A / (1 + AF)</text>
  </g>
</svg>