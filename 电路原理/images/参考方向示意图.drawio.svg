<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">参考方向示意图</text>
    <!-- 关联参考方向 -->
    <text x="300" y="65" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">关联参考方向</text>
    <!-- 电路元件 -->
    <rect x="230" y="90" width="140" height="50" fill="#e8f4f8" stroke="#000" stroke-width="2"/>
    <text x="300" y="120" text-anchor="middle" font-size="14" fill="#333">元件</text>
    <!-- 导线 -->
    <line x1="100" y1="115" x2="230" y2="115" stroke="#000" stroke-width="2"/>
    <line x1="370" y1="115" x2="500" y2="115" stroke="#000" stroke-width="2"/>
    <!-- 电流方向箭头 -->
    <polygon points="180,115 190,108 190,122" fill="#d32f2f"/>
    <text x="170" y="105" text-anchor="middle" font-size="13" fill="#d32f2f">i</text>
    <polygon points="420,115 410,108 410,122" fill="#d32f2f"/>
    <text x="430" y="105" text-anchor="middle" font-size="13" fill="#d32f2f">i</text>
    <!-- 电压极性 -->
    <text x="275" y="85" font-size="13" fill="#1976d2">+</text>
    <text x="325" y="85" font-size="13" fill="#1976d2">-</text>
    <text x="300" y="155" text-anchor="middle" font-size="12" fill="#666">u = Ri, P = ui &gt; 0 (吸收功率)</text>

    <!-- 非关联参考方向 -->
    <text x="300" y="195" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">非关联参考方向</text>
    <rect x="230" y="220" width="140" height="50" fill="#fce4ec" stroke="#000" stroke-width="2"/>
    <text x="300" y="250" text-anchor="middle" font-size="14" fill="#333">元件</text>
    <line x1="100" y1="245" x2="230" y2="245" stroke="#000" stroke-width="2"/>
    <line x1="370" y1="245" x2="500" y2="245" stroke="#000" stroke-width="2"/>
    <!-- 电流方向箭头 -->
    <polygon points="420,245 410,238 410,252" fill="#d32f2f"/>
    <text x="430" y="235" text-anchor="middle" font-size="13" fill="#d32f2f">i</text>
    <!-- 电压极性 -->
    <text x="275" y="215" font-size="13" fill="#1976d2">+</text>
    <text x="325" y="215" font-size="13" fill="#1976d2">-</text>
    <text x="300" y="285" text-anchor="middle" font-size="12" fill="#666">P = -ui (注意符号变化)</text>

    <!-- 元件符号说明 -->
    <text x="300" y="330" text-anchor="middle" font-size="13" fill="#666">电流 i 从电压"+"端流入为关联参考方向</text>
    <text x="300" y="350" text-anchor="middle" font-size="13" fill="#666">电流 i 从电压"-"端流入为非关联参考方向</text>
  </g>
</svg>