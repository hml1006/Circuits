<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">电流表改装原理图</text>
    
    <!-- 主电路导线 -->
    <line x1="60" y1="200" x2="540" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 输入端标注 -->
    <text x="50" y="195" text-anchor="end" font-size="14" font-weight="bold" fill="#333">+</text>
    <text x="50" y="215" text-anchor="end" font-size="14" fill="#333">−</text>
    
    <!-- 总电流标注 -->
    <text x="60" y="170" text-anchor="start" font-size="13" fill="#666" font-style="italic">I</text>
    
    <!-- 表头支路 -->
    <line x1="180" y1="200" x2="180" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="130" x2="380" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="130" x2="380" y2="200" stroke="#333" stroke-width="2"/>
    
    <!-- 表头 G -->
    <circle cx="280" cy="130" r="30" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    <text x="280" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">G</text>
    <text x="280" y="148" text-anchor="middle" font-size="10" fill="#666">I<tspan font-size="8" dy="3">g</tspan><tspan dy="-3">, R<tspan font-size="8" dy="3">g</tspan></tspan></text>
    
    <!-- 分流电阻 R -->
    <rect x="280" y="180" width="60" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="310" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R</text>
    
    <!-- 分流支路 -->
    <line x1="180" y1="200" x2="280" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="200" x2="380" y2="200" stroke="#333" stroke-width="2"/>
    
    <!-- 分流标注 -->
    <text x="310" y="170" text-anchor="middle" font-size="11" fill="#d32f2f">分流电阻</text>
    
    <!-- 电流标注 -->
    <text x="230" y="115" text-anchor="middle" font-size="11" fill="#666" font-style="italic">I<tspan font-size="9" dy="3">g</tspan></tspan>
    <text x="310" y="225" text-anchor="middle" font-size="11" fill="#666" font-style="italic">I − I<tspan font-size="9" dy="3">g</tspan></tspan>
    
    <!-- 电流表整体标注 -->
    <rect x="140" y="280" width="260" height="50" rx="8" ry="8" fill="#fff9c4" stroke="#e6b800" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="270" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">改装后电流表</text>
    <text x="270" y="318" text-anchor="middle" font-size="11" fill="#666">内阻 R<tspan font-size="9" dy="3">A</tspan><tspan dy="-3"> = R<tspan font-size="9" dy="3">g</tspan><tspan dy="-3">·R / (R<tspan font-size="9" dy="3">g</tspan><tspan dy="-3">+R)</tspan></tspan></tspan></tspan></text>
    
    <!-- 公式 -->
    <text x="300" y="370" text-anchor="middle" font-size="14" fill="#333">R = I<tspan font-size="10" dy="3">g</tspan><tspan dy="-3">R<tspan font-size="10" dy="3">g</tspan><tspan dy="-3"> / (I − I<tspan font-size="10" dy="3">g</tspan><tspan dy="-3">)</tspan></tspan></tspan></tspan></text>
  </g>
</svg>