<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">BLDC 六步换相驱动图</text>
    
    <!-- Three-phase inverter -->
    <text x="300" y="50" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">三相逆变桥</text>
    
    <!-- DC bus -->
    <line x1="50" y1="70" x2="550" y2="70" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="340" x2="550" y2="340" stroke="#000" stroke-width="2"/>
    
    <!-- Phase A leg -->
    <rect x="80" y="50" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="100" y="70" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">S₁</text>
    <rect x="80" y="330" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="100" y="350" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">S₄</text>
    <line x1="100" y1="80" x2="100" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="200" x2="160" y2="200" stroke="#000" stroke-width="2"/>
    <text x="130" y="195" font-size="12" fill="#000" font-weight="bold">A</text>
    
    <!-- Phase B leg -->
    <rect x="240" y="50" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="260" y="70" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">S₃</text>
    <rect x="240" y="330" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="260" y="350" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">S₆</text>
    <line x1="260" y1="80" x2="260" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="200" x2="220" y2="200" stroke="#000" stroke-width="2"/>
    <text x="230" y="195" font-size="12" fill="#000" font-weight="bold">B</text>
    
    <!-- Phase C leg -->
    <rect x="400" y="50" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="420" y="70" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">S₅</text>
    <rect x="400" y="330" width="40" height="30" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="420" y="350" text-anchor="middle" font-size="11" fill="#c00" font-weight="bold">S₂</text>
    <line x1="420" y1="80" x2="420" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="420" y1="200" x2="380" y2="200" stroke="#000" stroke-width="2"/>
    <text x="390" y="195" font-size="12" fill="#000" font-weight="bold">C</text>
    
    <!-- BLDC motor -->
    <circle cx="300" cy="200" r="30" fill="#f0f0f0" stroke="#000" stroke-width="2"/>
    <text x="300" y="198" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">BLDC</text>
    <text x="300" y="213" text-anchor="middle" font-size="10" fill="#666">电机</text>
    
    <!-- Hall sensors -->
    <rect x="300" y="250" width="80" height="25" fill="#d0ffd0" stroke="#080" stroke-width="1.5" rx="3"/>
    <text x="340" y="267" text-anchor="middle" font-size="10" fill="#080" font-weight="bold">霍尔传感器</text>
    
    <line x1="300" y1="230" x2="300" y2="250" stroke="#080" stroke-width="1.5"/>
    
    <!-- Commutation table -->
    <text x="300" y="295" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">换相顺序（六步）</text>
    
    <line x1="80" y1="305" x2="520" y2="305" stroke="#000" stroke-width="1"/>
    <line x1="80" y1="325" x2="520" y2="325" stroke="#000" stroke-width="1"/>
    <line x1="80" y1="345" x2="520" y2="345" stroke="#000" stroke-width="1"/>
    <line x1="80" y1="365" x2="520" y2="365" stroke="#000" stroke-width="1"/>
    <line x1="80" y1="385" x2="520" y2="385" stroke="#000" stroke-width="1"/>
    
    <text x="100" y="318" font-size="9" fill="#000" font-weight="bold">步</text>
    <text x="160" y="318" font-size="9" fill="#000" font-weight="bold">A相</text>
    <text x="220" y="318" font-size="9" fill="#000" font-weight="bold">B相</text>
    <text x="280" y="318" font-size="9" fill="#000" font-weight="bold">C相</text>
    <text x="360" y="318" font-size="9" fill="#000" font-weight="bold">上桥</text>
    <text x="420" y="318" font-size="9" fill="#000" font-weight="bold">下桥</text>
    
    <text x="100" y="338" font-size="9" fill="#000">1</text>
    <text x="160" y="338" font-size="9" fill="#000">+</text>
    <text x="220" y="338" font-size="9" fill="#000">OFF</text>
    <text x="280" y="338" font-size="9" fill="#000">−</text>
    <text x="360" y="338" font-size="9" fill="#000">S₁</text>
    <text x="420" y="338" font-size="9" fill="#000">S₆</text>
    
    <text x="100" y="358" font-size="9" fill="#000">2</text>
    <text x="160" y="358" font-size="9" fill="#000">+</text>
    <text x="220" y="358" font-size="9" fill="#000">−</text>
    <text x="280" y="358" font-size="9" fill="#000">OFF</text>
    <text x="360" y="358" font-size="9" fill="#000">S₁</text>
    <text x="420" y="358" font-size="9" fill="#000">S₂</text>
    
    <text x="100" y="378" font-size="9" fill="#000">3</text>
    <text x="160" y="378" font-size="9" fill="#000">OFF</text>
    <text x="220" y="378" font-size="9" fill="#000">+</text>
    <text x="280" y="378" font-size="9" fill="#000">−</text>
    <text x="360" y="378" font-size="9" fill="#000">S₃</text>
    <text x="420" y="378" font-size="9" fill="#000">S₂</text>
    
    <text x="300" y="398" text-anchor="middle" font-size="9" fill="#666">每 60° 电角度换相一次，每个电周期 6 步</text>
  </g>
</svg>