<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MOSFET I-V特性曲线</text>
    <!-- Axes -->
    <line x1="80" y1="320" x2="80" y2="50" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)"/>
    <line x1="80" y1="320" x2="560" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)"/>
    <!-- Axis labels -->
    <text x="300" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">VDS (V) →</text>
    <text x="40" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" transform="rotate(-90,40,190)">IDS (mA) →</text>
    <!-- I-V Curves for different Vgs values -->
    <!-- Vgs1 = 1V -->
    <path d="M 80 310 Q 200 310 220 305" fill="none" stroke="#e53935" stroke-width="2.5"/>
    <text x="225" y="305" font-size="11" fill="#e53935">Vgs=1V</text>
    <!-- Vgs2 = 1.5V -->
    <path d="M 80 310 Q 150 310 180 290 L 320 230" fill="none" stroke="#1e88e5" stroke-width="2.5"/>
    <text x="325" y="230" font-size="11" fill="#1e88e5">Vgs=1.5V</text>
    <!-- Vgs3 = 2V -->
    <path d="M 80 310 Q 130 310 160 270 L 350 170" fill="none" stroke="#43a047" stroke-width="2.5"/>
    <text x="355" y="170" font-size="11" fill="#43a047">Vgs=2V</text>
    <!-- Vgs4 = 2.5V -->
    <path d="M 80 310 Q 110 310 140 245 L 380 100" fill="none" stroke="#fb8c00" stroke-width="2.5"/>
    <text x="385" y="100" font-size="11" fill="#fb8c00">Vgs=2.5V</text>
    <!-- Saturation region label -->
    <rect x="380" y="55" width="100" height="20" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="430" y="69" text-anchor="middle" font-size="10" fill="#e65100">饱和区</text>
    <!-- Linear region label -->
    <rect x="100" y="330" width="100" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="150" y="344" text-anchor="middle" font-size="10" fill="#2e7d32">线性区</text>
    <!-- Cutoff region label -->
    <rect x="100" y="280" width="80" height="18" rx="3" fill="#fce4ec" stroke="#c62828" stroke-width="1"/>
    <text x="140" y="293" text-anchor="middle" font-size="10" fill="#c62828">截止区</text>
    <!-- Vth point -->
    <line x1="80" y1="270" x2="190" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="195" y="274" font-size="10" fill="#999">Vgs=Vth</text>
    <!-- Knee points curve -->
    <path d="M 80 310 Q 80 310 140 245 Q 200 175 300 170" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="250" y="165" font-size="10" fill="#999">Vdsat = Vgs - Vth</text>
    <!-- Subthreshold region -->
    <rect x="80" y="105" width="60" height="20" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
    <text x="110" y="119" text-anchor="middle" font-size="10" fill="#7b1fa2">亚阈值区</text>
    <!-- Formula -->
    <rect x="50" y="365" width="500" height="30" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="60" y="383" font-size="11" fill="#555">线性区: IDS = μCox(W/L)[(VGS-VTH)VDS - VDS²/2] | 饱和区: IDS = ½μCox(W/L)(VGS-VTH)²(1+λVDS)</text>
  </g>
</svg>