<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">半加器逻辑图</text>
    <!-- 输入 -->
    <text x="80" y="135" text-anchor="end" font-size="14" font-weight="bold" fill="#000">A</text>
    <text x="80" y="215" text-anchor="end" font-size="14" font-weight="bold" fill="#000">B</text>
    <!-- 输入线 -->
    <line x1="90" y1="130" x2="130" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="90" y1="210" x2="130" y2="210" stroke="#000" stroke-width="1.5"/>
    <!-- 分支 -->
    <line x1="130" y1="130" x2="130" y2="100" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="100" x2="200" y2="100" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="210" x2="130" y2="240" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="240" x2="200" y2="240" stroke="#000" stroke-width="1.5"/>
    <!-- 交叉线到异或门 -->
    <line x1="130" y1="130" x2="200" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="210" x2="200" y2="210" stroke="#000" stroke-width="1.5"/>
    <!-- 异或门 (XOR) - 求和 -->
    <path d="M200 110 L200 150 L220 130 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M200 100 Q230 130 200 160" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M200 100 Q190 130 200 160" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M185 100 Q180 110 185 120 Q180 130 185 140 Q180 150 185 160" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="185" y1="110" x2="200" y2="110" stroke="#000" stroke-width="1.5"/>
    <line x1="185" y1="150" x2="200" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="230" y1="130" x2="280" y2="130" stroke="#000" stroke-width="1.5"/>
    <text x="255" y="125" text-anchor="middle" font-size="12" fill="#000">S = A⊕B</text>
    <!-- 与门 - 进位 -->
    <rect x="200" y="220" width="50" height="40" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
    <path d="M250 220 Q275 240 250 260" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="230" x2="170" y2="230" stroke="#000" stroke-width="1.5"/>
    <line x1="200" y1="250" x2="170" y2="250" stroke="#000" stroke-width="1.5"/>
    <line x1="275" y1="240" x2="320" y2="240" stroke="#000" stroke-width="1.5"/>
    <text x="295" y="235" text-anchor="middle" font-size="12" fill="#000">C = A·B</text>
    <!-- 输出 -->
    <line x1="280" y1="130" x2="350" y2="130" stroke="#000" stroke-width="2"/>
    <text x="360" y="134" text-anchor="start" font-size="14" font-weight="bold" fill="#000">S（和）</text>
    <line x1="320" y1="240" x2="350" y2="240" stroke="#000" stroke-width="2"/>
    <text x="360" y="244" text-anchor="start" font-size="14" font-weight="bold" fill="#000">C（进位）</text>
    <!-- 真值表 -->
    <rect x="50" y="290" width="500" height="95" rx="6" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">半加器真值表</text>
    <line x1="120" y1="320" x2="480" y2="320" stroke="#000" stroke-width="1"/>
    <text x="160" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">A</text>
    <text x="260" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
    <text x="360" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">S (和)</text>
    <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">C (进位)</text>
    <line x1="210" y1="320" x2="210" y2="385" stroke="#000" stroke-width="1"/>
    <line x1="310" y1="320" x2="310" y2="385" stroke="#000" stroke-width="1"/>
    <line x1="410" y1="320" x2="410" y2="385" stroke="#000" stroke-width="1"/>
    <text x="160" y="360" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="260" y="360" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="360" y="360" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="450" y="360" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="160" y="380" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="260" y="380" text-anchor="middle" font-size="12" fill="#000">1</text>
    <text x="360" y="380" text-anchor="middle" font-size="12" fill="#000">1</text>
    <text x="450" y="380" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="160" y="400" text-anchor="middle" font-size="12" fill="#000">1</text>
    <text x="260" y="400" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="360" y="400" text-anchor="middle" font-size="12" fill="#000">1</text>
    <text x="450" y="400" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="160" y="420" text-anchor="middle" font-size="12" fill="#000">1</text>
    <text x="260" y="420" text-anchor="middle" font-size="12" fill="#000">1</text>
    <text x="360" y="420" text-anchor="middle" font-size="12" fill="#000">0</text>
    <text x="450" y="420" text-anchor="middle" font-size="12" fill="#000">1</text>
  </g>
</svg>