<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">BJT基本镜像电流源</text>

    <!-- 参考电流支路 (左侧) -->
    <text x="50" y="60" font-size="12" fill="#666">+V</text>
    <text x="68" y="60" font-size="10" fill="#666">CC</text>

    <!-- 参考电阻 R -->
    <line x1="50" y1="70" x2="80" y2="70" stroke="#333" stroke-width="2"/>
    <rect x="80" y="50" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="90" y="75" text-anchor="middle" font-size="12" fill="#333">R</text>
    <line x1="100" y1="70" x2="130" y2="70" stroke="#333" stroke-width="2"/>

    <!-- Q1 二极管连接 -->
    <line x1="130" y1="70" x2="160" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="100" x2="160" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="160,140 170,130 170,150" fill="#333"/>
    <line x1="160" y1="140" x2="120" y2="160" stroke="#333" stroke-width="2"/>
    <text x="175" y="105" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="183" y="105" font-size="10" fill="#666">1</text>

    <!-- Q1 发射极 -->
    <line x1="120" y1="160" x2="120" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="200" x2="120" y2="300" stroke="#333" stroke-width="2"/>

    <!-- IREF标注 -->
    <line x1="130" y1="70" x2="130" y2="40" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="140" y="42" font-size="11" fill="#666">I</text>
    <text x="148" y="42" font-size="9" fill="#666">REF</text>

    <!-- 输出支路 (右侧) -->
    <line x1="300" y1="70" x2="330" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="70" x2="330" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="100" x2="330" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="330,140 340,130 340,150" fill="#333"/>
    <line x1="330" y1="140" x2="290" y2="160" stroke="#333" stroke-width="2"/>
    <text x="345" y="105" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="353" y="105" font-size="10" fill="#666">2</text>

    <line x1="290" y1="160" x2="290" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="200" x2="290" y2="300" stroke="#333" stroke-width="2"/>

    <!-- IOUT标注 -->
    <line x1="330" y1="70" x2="330" y2="40" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="340" y="42" font-size="11" fill="#666">I</text>
    <text x="348" y="42" font-size="9" fill="#666">OUT</text>

    <!-- 基极互连线 -->
    <line x1="160" y1="100" x2="330" y2="100" stroke="#333" stroke-width="2"/>

    <!-- 地线 -->
    <line x1="120" y1="300" x2="290" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="300" x2="120" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="290" y1="300" x2="290" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="310" x2="310" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="310" x2="100" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="310" x2="140" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="270" y1="310" x2="270" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="310" x2="310" y2="315" stroke="#333" stroke-width="2"/>

    <!-- 负载 RL -->
    <rect x="400" y="50" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="410" y="75" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="418" y="75" text-anchor="middle" font-size="10" fill="#666">L</text>
    <line x1="330" y1="70" x2="400" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="420" y1="70" x2="460" y2="70" stroke="#333" stroke-width="2"/>
    <text x="470" y="75" font-size="11" fill="#666">+V</text>
    <text x="478" y="75" font-size="9" fill="#666">CC</text>

    <!-- 公式 -->
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#666">I</text>
    <text x="308" y="350" text-anchor="middle" font-size="12" fill="#666">OUT</text>
    <text x="325" y="350" text-anchor="middle" font-size="12" fill="#666"> ≈ I</text>
    <text x="340" y="350" text-anchor="middle" font-size="12" fill="#666">REF</text>
    <text x="355" y="350" text-anchor="middle" font-size="12" fill="#666"> = (V</text>
    <text x="372" y="350" text-anchor="middle" font-size="12" fill="#666">CC</text>
    <text x="382" y="350" text-anchor="middle" font-size="12" fill="#666"> − V</text>
    <text x="398" y="350" text-anchor="middle" font-size="12" fill="#666">BE</text>
    <text x="408" y="350" text-anchor="middle" font-size="12" fill="#666">)/R</text>

    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">精确：I</text>
    <text x="315" y="370" text-anchor="middle" font-size="11" fill="#666">OUT</text>
    <text x="328" y="370" text-anchor="middle" font-size="11" fill="#666"> = I</text>
    <text x="340" y="370" text-anchor="middle" font-size="11" fill="#666">REF</text>
    <text x="352" y="370" text-anchor="middle" font-size="11" fill="#666"> / (1 + 2/β)</text>
  </g>
</svg>