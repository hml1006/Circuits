<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">法拉第电磁感应实验图</text>
    
    <!-- 条形磁铁 -->
    <rect x="60" y="120" width="120" height="40" rx="8" ry="8" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="120" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">N</text>
    <rect x="180" y="120" width="40" height="40" rx="8" ry="8" fill="#4dabf7" stroke="#1976d2" stroke-width="2"/>
    <text x="200" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">S</text>
    
    <!-- 运动方向箭头 -->
    <line x1="120" y1="100" x2="120" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="95" text-anchor="start" font-size="11" fill="#333" font-style="italic">v</text>
    
    <!-- 线圈 -->
    <circle cx="340" cy="140" r="50" fill="none" stroke="#e6b800" stroke-width="3"/>
    <circle cx="340" cy="140" r="45" fill="none" stroke="#e6b800" stroke-width="2"/>
    <circle cx="340" cy="140" r="40" fill="none" stroke="#e6b800" stroke-width="1.5"/>
    
    <text x="340" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6b800">线圈</text>
    
    <!-- 导线连接 -->
    <line x1="290" y1="175" x2="240" y2="280" stroke="#333" stroke-width="2.5"/>
    <line x1="390" y1="175" x2="440" y2="280" stroke="#333" stroke-width="2.5"/>
    
    <!-- 灵敏电流计 -->
    <circle cx="340" cy="310" r="35" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    <text x="340" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">G</text>
    <text x="340" y="325" text-anchor="middle" font-size="10" fill="#666">灵敏电流计</text>
    
    <line x1="240" y1="280" x2="310" y2="310" stroke="#333" stroke-width="2.5"/>
    <line x1="440" y1="280" x2="370" y2="310" stroke="#333" stroke-width="2.5"/>
    
    <!-- 磁感线 -->
    <path d="M 120,170 Q 340,220 340,190" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
    <path d="M 120,180 Q 340,240 340,190" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
    <path d="M 120,190 Q 300,260 340,190" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
    
    <!-- 说明文字 -->
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">当磁铁插入或拔出线圈时，穿过线圈的磁通量发生变化</text>
    <text x="300" y="388" text-anchor="middle" font-size="12" fill="#666">灵敏电流计指针偏转，表明产生了感应电流</text>
  </g>
</svg>