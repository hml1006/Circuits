<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">三相交流电波形图</text>
    
    <!-- 坐标轴 -->
    <line x1="50" y1="200" x2="580" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="50" y1="200" x2="50" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 轴标签 -->
    <text x="580" y="220" text-anchor="end" font-size="14" fill="#333" font-style="italic">ωt</text>
    <text x="35" y="40" text-anchor="middle" font-size="14" fill="#333">e</text>
    
    <!-- A 相（红色） -->
    <path d="M 50,200 Q 70,200 80,200 Q 95,100 110,50 Q 130,10 140,50 Q 155,100 170,200 Q 185,300 200,350 Q 215,390 230,350 Q 245,300 260,200 Q 275,100 290,50 Q 305,10 320,50 Q 335,100 350,200 Q 365,300 380,350 Q 395,390 410,350 Q 425,300 440,200 Q 455,100 470,50 Q 485,10 500,50 Q 515,100 530,200 Q 540,200 560,200" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    
    <!-- B 相（蓝色，滞后 120°） -->
    <path d="M 50,200 Q 70,200 90,200 Q 110,280 140,340 Q 160,380 180,350 Q 200,300 220,210 Q 240,120 260,65 Q 280,20 300,40 Q 320,80 340,160 Q 360,240 380,310 Q 400,370 420,355 Q 440,320 460,230 Q 480,140 500,80 Q 520,30 540,50 Q 560,200 560,200" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    
    <!-- C 相（绿色，超前 120°） -->
    <path d="M 50,200 Q 70,200 90,200 Q 110,120 140,60 Q 160,20 180,50 Q 200,100 220,190 Q 240,280 260,335 Q 280,380 300,360 Q 320,320 340,240 Q 360,160 380,90 Q 400,30 420,45 Q 440,80 460,170 Q 480,260 500,320 Q 520,370 540,350 Q 560,200 560,200" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
    
    <!-- 120° 标注 -->
    <line x1="170" y1="40" x2="170" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="290" y1="40" x2="290" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="410" y1="40" x2="410" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    
    <text x="110" y="185" text-anchor="middle" font-size="10" fill="#666">0°</text>
    <text x="230" y="185" text-anchor="middle" font-size="10" fill="#666">120°</text>
    <text x="350" y="185" text-anchor="middle" font-size="10" fill="#666">240°</text>
    <text x="470" y="185" text-anchor="middle" font-size="10" fill="#666">360°</text>
    
    <!-- 图例 -->
    <rect x="420" y="50" width="110" height="85" rx="5" ry="5" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
    <line x1="425" y1="65" x2="445" y2="65" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="450" y="69" font-size="11" fill="#333">A 相</text>
    <line x1="425" y1="80" x2="445" y2="80" stroke="#1976d2" stroke-width="2.5"/>
    <text x="450" y="84" font-size="11" fill="#333">B 相</text>
    <line x1="425" y1="95" x2="445" y2="95" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="450" y="99" font-size="11" fill="#333">C 相</text>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#333">e<tspan font-size="9" dy="3">A</tspan><tspan dy="-3"> = E<tspan font-size="9" dy="3">m</tspan><tspan dy="-3"> sin ωt</tspan></tspan></tspan></text>
    <text x="300" y="365" text-anchor="middle" font-size="12" fill="#333">e<tspan font-size="9" dy="3">B</tspan><tspan dy="-3"> = E<tspan font-size="9" dy="3">m</tspan><tspan dy="-3"> sin(ωt − 120°)</tspan></tspan></tspan></text>
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#333">e<tspan font-size="9" dy="3">C</tspan><tspan dy="-3"> = E<tspan font-size="9" dy="3">m</tspan><tspan dy="-3"> sin(ωt + 120°)</tspan></tspan></tspan></text>
  </g>
</svg>