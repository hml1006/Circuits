<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">零极点分布图</text>
    <!-- s平面坐标轴 -->
    <line x1="300" y1="350" x2="300" y2="50" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="200" x2="520" y2="200" stroke="#000" stroke-width="2"/>
    <polygon points="300,50 295,60 305,60" fill="#000"/>
    <polygon points="520,200 510,195 510,205" fill="#000"/>
    <text x="310" y="55" font-size="14" fill="#333">jω</text>
    <text x="520" y="195" font-size="14" fill="#333">σ</text>
    <text x="290" y="215" font-size="12" fill="#333">O</text>
    <!-- 左半平面标注 -->
    <text x="180" y="180" font-size="12" fill="#666">左半平面</text>
    <text x="180" y="195" font-size="12" fill="#666">(稳定区域)</text>
    <text x="400" y="180" font-size="12" fill="#666">右半平面</text>
    <text x="400" y="195" font-size="12" fill="#666">(不稳定区域)</text>
    <!-- 极点(左半平面) -->
    <circle cx="160" cy="140" r="6" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="155" y="125" font-size="13" fill="#d32f2f" font-weight="bold">×</text>
    <text x="140" y="120" font-size="12" fill="#d32f2f">p₁</text>
    <circle cx="160" cy="260" r="6" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="155" y="275" font-size="13" fill="#d32f2f" font-weight="bold">×</text>
    <text x="140" y="285" font-size="12" fill="#d32f2f">p₂</text>
    <!-- 共轭极点连线 -->
    <line x1="160" y1="140" x2="160" y2="260" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,2"/>
    <!-- 零点 -->
    <circle cx="240" cy="160" r="5" fill="none" stroke="#1976d2" stroke-width="2.5"/>
    <text x="245" y="155" font-size="14" fill="#1976d2">○</text>
    <text x="255" y="155" font-size="12" fill="#1976d2">z₁</text>
    <!-- 极点(实轴) -->
    <circle cx="200" cy="200" r="6" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="195" y="195" font-size="13" fill="#d32f2f" font-weight="bold">×</text>
    <text x="210" y="195" font-size="12" fill="#d32f2f">p₃</text>
    <!-- 极点(右半平面) - 不稳定 -->
    <circle cx="400" cy="160" r="6" fill="none" stroke="#e65100" stroke-width="2.5"/>
    <text x="395" y="155" font-size="13" fill="#e65100" font-weight="bold">×</text>
    <text x="405" y="145" font-size="12" fill="#e65100">p₄</text>
    <!-- 公式 -->
    <text x="300" y="330" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">网络函数 H(s) = N(s)/D(s)</text>
    <text x="300" y="355" text-anchor="middle" font-size="13" fill="#333">零点: N(s)=0 → z₁, z₂, ...</text>
    <text x="300" y="375" text-anchor="middle" font-size="13" fill="#333">极点: D(s)=0 → p₁, p₂, ...</text>
    <text x="300" y="395" text-anchor="middle" font-size="13" fill="#333">稳定性: 所有极点位于左半平面 ↔ Re(p_i) &lt; 0</text>
  </g>
</svg>