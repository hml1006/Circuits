<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">戴维南等效定理</text>
    
    <!-- 左侧：原始电路 -->
    <text x="150" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">原始有源二端网络</text>
    
    <rect x="40" y="70" width="220" height="220" rx="8" ry="8" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    
    <!-- 内部电路 -->
    <line x1="60" y1="100" x2="100" y2="100" stroke="#333" stroke-width="2"/>
    <rect x="100" y="85" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="120" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">R₁</text>
    
    <line x1="140" y1="100" x2="180" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="85" x2="180" y2="115" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="115" x2="190" y2="115" stroke="#333" stroke-width="2"/>
    <text x="180" y="130" text-anchor="middle" font-size="10" fill="#333">E₁</text>
    
    <line x1="180" y1="115" x2="180" y2="160" stroke="#333" stroke-width="2"/>
    <rect x="100" y="150" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="120" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">R₂</text>
    <line x1="60" y1="165" x2="100" y2="165" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="165" x2="180" y2="165" stroke="#333" stroke-width="2"/>
    
    <line x1="60" y1="100" x2="60" y2="165" stroke="#333" stroke-width="2"/>
    
    <!-- 输出端口 -->
    <line x1="150" y1="70" x2="150" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="290" x2="150" y2="280" stroke="#333" stroke-width="2"/>
    <text x="160" y="65" text-anchor="start" font-size="11" fill="#d32f2f">+</text>
    <text x="160" y="295" text-anchor="start" font-size="11" fill="#d32f2f">−</text>
    
    <!-- 负载 -->
    <rect x="130" y="250" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="150" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">L</tspan></text>
    <line x1="150" y1="250" x2="150" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="60" x2="150" y2="85" stroke="#333" stroke-width="2"/>
    
    <!-- 箭头 -->
    <text x="300" y="180" text-anchor="middle" font-size="24" fill="#999">→</text>
    <text x="300" y="200" text-anchor="middle" font-size="12" fill="#999">等效变换</text>
    
    <!-- 右侧：戴维南等效电路 -->
    <text x="450" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">戴维南等效电路</text>
    
    <rect x="340" y="70" width="220" height="220" rx="8" ry="8" fill="#fff9c4" stroke="#e6b800" stroke-width="2"/>
    
    <line x1="360" y1="100" x2="410" y2="100" stroke="#333" stroke-width="2"/>
    <rect x="410" y="85" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="430" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">th</tspan></text>
    <line x1="450" y1="100" x2="490" y2="100" stroke="#333" stroke-width="2"/>
    
    <line x1="490" y1="85" x2="490" y2="115" stroke="#333" stroke-width="2"/>
    <line x1="480" y1="115" x2="500" y2="115" stroke="#333" stroke-width="2"/>
    <text x="490" y="130" text-anchor="middle" font-size="10" fill="#333">U<tspan font-size="8" dy="3">th</tspan></text>
    
    <line x1="490" y1="115" x2="490" y2="165" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="165" x2="490" y2="165" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="100" x2="360" y2="165" stroke="#333" stroke-width="2"/>
    
    <!-- 输出端口 -->
    <line x1="450" y1="70" x2="450" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="290" x2="450" y2="280" stroke="#333" stroke-width="2"/>
    <text x="460" y="65" text-anchor="start" font-size="11" fill="#d32f2f">+</text>
    <text x="460" y="295" text-anchor="start" font-size="11" fill="#d32f2f">−</text>
    
    <!-- 负载 -->
    <rect x="430" y="250" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="450" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">R<tspan font-size="8" dy="3">L</tspan></text>
    <line x1="450" y1="250" x2="450" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="60" x2="450" y2="85" stroke="#333" stroke-width="2"/>
    
    <!-- 公式 -->
    <text x="300" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Uth = Uoc, Rth = Req</text>
  </g>
</svg>