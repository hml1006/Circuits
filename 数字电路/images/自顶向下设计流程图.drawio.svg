<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">自顶向下设计流程（Top-Down Design）</text>

    <!-- Level 1: 系统需求分析 -->
    <rect x="150" y="50" width="300" height="40" rx="8" ry="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="300" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">系统需求分析</text>
    <text x="300" y="100" text-anchor="middle" font-size="11" fill="#666">功能定义 · 性能指标 · 约束条件</text>

    <!-- Arrow 1 -->
    <line x1="300" y1="105" x2="300" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Level 2: 系统级设计 -->
    <rect x="150" y="130" width="300" height="40" rx="8" ry="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="300" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">系统级设计</text>
    <text x="300" y="180" text-anchor="middle" font-size="11" fill="#666">模块划分 · 接口定义 · 体系结构</text>

    <!-- Arrow 2 -->
    <line x1="300" y1="185" x2="300" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Level 3: 模块级设计 -->
    <rect x="150" y="210" width="300" height="40" rx="8" ry="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="300" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">模块级设计</text>
    <text x="300" y="260" text-anchor="middle" font-size="11" fill="#666">功能细化 · 接口协议 · 时序要求</text>

    <!-- Arrow 3 -->
    <line x1="300" y1="265" x2="300" y2="285" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Level 4: 逻辑级设计 -->
    <rect x="150" y="290" width="300" height="40" rx="8" ry="8" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
    <text x="300" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A1B9A">逻辑级设计（RTL）</text>
    <text x="300" y="340" text-anchor="middle" font-size="11" fill="#666">HDL 描述 · 逻辑综合 · 功能验证</text>

    <!-- Arrow 4 -->
    <line x1="300" y1="345" x2="300" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Level 5: 物理级设计 -->
    <rect x="150" y="365" width="300" height="30" rx="8" ry="8" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
    <text x="300" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">物理级设计（版图/布局布线）</text>

    <!-- Right side: 层次标注 -->
    <line x1="470" y1="70" x2="510" y2="70" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="520" y="74" font-size="11" fill="#999">抽象层</text>
    <line x1="470" y1="150" x2="510" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="470" y1="230" x2="510" y2="230" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="470" y1="310" x2="510" y2="310" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="470" y1="380" x2="510" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Left side: 说明 -->
    <text x="80" y="200" text-anchor="middle" font-size="12" fill="#999" transform="rotate(-90,80,200)">逐步细化（逐层分解）</text>
  </g>
</svg>