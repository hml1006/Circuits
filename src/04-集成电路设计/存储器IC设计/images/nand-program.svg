<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .ox { fill: #f6d365; stroke: #8a6d1a; stroke-width: 1; }
      .poly { fill: #d0d0d0; stroke: #333; stroke-width: 1; }
      .si { fill: #e8eef5; stroke: #333; stroke-width: 1; }
      .nplus { fill: #b9c9dc; stroke: #333; stroke-width: 1; }
      .wire { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
      .axis { stroke: #333; stroke-width: 1.3; fill: none; }
      .pulse { stroke: #1f4e79; stroke-width: 1.8; fill: none; }
      .ref { stroke: #b03a2e; stroke-width: 1.1; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <!-- 左：编程偏置 -->
  <text class="title" x="235" y="32" text-anchor="middle">编程偏置：FN 隧穿</text>

  <rect class="poly" x="100" y="165" width="270" height="40" rx="2"/>
  <text class="lbl" x="235" y="190" text-anchor="middle">控制栅 CG = Vpgm（15–20 V）</text>

  <rect class="ox" x="110" y="205" width="250" height="10"/>
  <rect class="poly" x="115" y="215" width="240" height="47" rx="2"/>
  <text class="lbl" x="235" y="243" text-anchor="middle">浮栅 FG</text>

  <rect class="ox" x="105" y="262" width="260" height="8"/>
  <rect class="si" x="40" y="270" width="380" height="60"/>
  <rect class="nplus" x="70" y="270" width="50" height="24"/>
  <rect class="nplus" x="340" y="270" width="50" height="24"/>
  <text class="small" x="95" y="286" text-anchor="middle">n+ 源</text>
  <text class="small" x="365" y="286" text-anchor="middle">n+ 漏</text>
  <text class="lbl" x="230" y="320" text-anchor="middle">沟道 = 0 V（经 BL 接地）</text>

  <circle cx="140" cy="228" r="4" fill="#c0392b"/>
  <circle cx="170" cy="240" r="4" fill="#c0392b"/>
  <circle cx="300" cy="228" r="4" fill="#c0392b"/>
  <circle cx="330" cy="240" r="4" fill="#c0392b"/>

  <line x1="150" y1="262" x2="150" y2="249" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="215" y1="262" x2="215" y2="249" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="280" y1="262" x2="280" y2="249" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <text class="small" x="365" y="255">FN 隧穿</text>

  <line class="wire" x1="365" y1="294" x2="365" y2="350"/>
  <text class="small" x="365" y="366" text-anchor="middle">BL = 0 V</text>
  <line class="wire" x1="95" y1="294" x2="95" y2="350"/>
  <text class="small" x="95" y="366" text-anchor="middle">SL = 0 V</text>

  <!-- 右：ISPP 波形 -->
  <text class="title" x="625" y="32" text-anchor="middle">ISPP：脉冲 + 校验</text>
  <line class="axis" x1="500" y1="80" x2="500" y2="330"/>
  <line class="axis" x1="500" y1="330" x2="790" y2="330"/>
  <text class="small" x="482" y="90" text-anchor="middle">Vpgm</text>
  <text class="small" x="780" y="348" text-anchor="end">时间</text>

  <path class="pulse" d="M530,330 L530,262 L562,262 L562,330"/>
  <path class="pulse" d="M585,330 L585,242 L617,242 L617,330"/>
  <path class="pulse" d="M640,330 L640,222 L672,222 L672,330"/>
  <path class="pulse" d="M695,330 L695,202 L727,202 L727,330"/>
  <path class="pulse" d="M750,330 L750,182 L782,182 L782,330"/>

  <line class="ref" x1="525" y1="292" x2="775" y2="162"/>
  <text class="small" x="690" y="145">校验后的 Vth</text>
  <line class="ref" x1="520" y1="180" x2="785" y2="180"/>
  <text class="small" x="700" y="172" text-anchor="middle">目标 Vth</text>

  <text class="small" x="500" y="378">每一步：施加脉冲 → 读取校验 → 未达标则提高 Vpgm</text>
</svg>
