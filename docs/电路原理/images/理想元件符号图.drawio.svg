<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">理想元件符号图</text>
    <!-- 电阻 -->
    <text x="50" y="70" font-size="14" fill="#333">电阻 R</text>
    <rect x="80" y="80" width="50" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="90" x2="80" y2="90" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="90" x2="160" y2="90" stroke="#000" stroke-width="2"/>
    <!-- 电容 -->
    <text x="50" y="150" font-size="14" fill="#333">电容 C</text>
    <line x1="80" y1="160" x2="80" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="160" x2="130" y2="160" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="190" x2="130" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="160" x2="130" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="175" x2="80" y2="175" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="175" x2="160" y2="175" stroke="#000" stroke-width="2"/>
    <!-- 电感 -->
    <text x="50" y="240" font-size="14" fill="#333">电感 L</text>
    <line x1="50" y1="255" x2="75" y2="255" stroke="#000" stroke-width="2"/>
    <path d="M75 255 Q82 245 89 255 Q96 265 103 255 Q110 245 117 255 Q124 265 131 255 Q138 245 145 255" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="145" y1="255" x2="160" y2="255" stroke="#000" stroke-width="2"/>
    <!-- 电压源 -->
    <text x="250" y="70" font-size="14" fill="#333">电压源</text>
    <circle cx="320" cy="100" r="25" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="85" x2="320" y2="115" stroke="#000" stroke-width="2"/>
    <line x1="310" y1="100" x2="330" y2="100" stroke="#000" stroke-width="2"/>
    <text x="300" y="145" text-anchor="middle" font-size="12" fill="#333">+</text>
    <text x="340" y="145" text-anchor="middle" font-size="12" fill="#333">-</text>
    <line x1="295" y1="100" x2="270" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="345" y1="100" x2="370" y2="100" stroke="#000" stroke-width="2"/>
    <!-- 电流源 -->
    <text x="250" y="190" font-size="14" fill="#333">电流源</text>
    <circle cx="320" cy="215" r="25" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="200" x2="320" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="315" y1="215" x2="325" y2="215" stroke="#000" stroke-width="2"/>
    <polygon points="320,215 316,225 324,225" fill="#000"/>
    <line x1="320" y1="240" x2="320" y2="230" stroke="#000" stroke-width="2"/>
    <line x1="295" y1="215" x2="270" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="345" y1="215" x2="370" y2="215" stroke="#000" stroke-width="2"/>
    <!-- 受控源VCVS -->
    <text x="430" y="70" font-size="14" fill="#333">VCVS（受控电压源）</text>
    <line x1="440" y1="90" x2="450" y2="90" stroke="#000" stroke-width="2"/>
    <path d="M450 80 L450 100 L465 100 L465 80 Z" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="465" y1="90" x2="475" y2="90" stroke="#000" stroke-width="2"/>
    <text x="455" y="115" text-anchor="middle" font-size="12" fill="#333">+</text>
    <text x="450" y="115" text-anchor="middle" font-size="12" fill="#333">-</text>
    <!-- 控制端 -->
    <line x1="440" y1="80" x2="440" y2="60" stroke="#000" stroke-width="1.5"/>
    <line x1="440" y1="60" x2="480" y2="60" stroke="#000" stroke-width="1.5"/>
    <line x1="480" y1="60" x2="480" y2="80" stroke="#000" stroke-width="1.5"/>
    <text x="460" y="55" text-anchor="middle" font-size="10" fill="#666">控制端</text>
    <!-- 受控源CCCS -->
    <text x="430" y="160" font-size="14" fill="#333">CCCS（受控电流源）</text>
    <line x1="440" y1="180" x2="450" y2="180" stroke="#000" stroke-width="2"/>
    <path d="M450 170 L450 190 L465 190 L465 170 Z" fill="none" stroke="#000" stroke-width="2"/>
    <polygon points="458,180 454,188 462,188" fill="#000"/>
    <line x1="465" y1="180" x2="475" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="170" x2="440" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="440" y1="150" x2="480" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="480" y1="150" x2="480" y2="170" stroke="#000" stroke-width="1.5"/>
    <text x="460" y="145" text-anchor="middle" font-size="10" fill="#666">控制端</text>
  </g>
</svg>