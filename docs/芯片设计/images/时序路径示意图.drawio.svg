<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">时序路径示意图</text>
    <!-- Path 1: Input to Register -->
    <text x="30" y="55" font-size="12" font-weight="bold" fill="#1e88e5">① 输入到寄存器 (Input-to-Register)</text>
    <rect x="30" y="65" width="60" height="30" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="60" y="84" text-anchor="middle" font-size="10" fill="#1e88e5">输入</text>
    <line x1="90" y1="80" x2="115" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="65" width="80" height="30" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="160" y="84" text-anchor="middle" font-size="10" fill="#e65100">组合逻辑</text>
    <line x1="200" y1="80" x2="225" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="230" y="65" width="60" height="30" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="260" y="84" text-anchor="middle" font-size="10" fill="#2e7d32">FF</text>
    <text x="300" y="84" font-size="9" fill="#666">Tinput_delay + Tlogic + Tsetup ≤ Tclk</text>
    <!-- Path 2: Register to Register -->
    <text x="30" y="120" font-size="12" font-weight="bold" fill="#e65100">② 寄存器到寄存器 (Register-to-Register)</text>
    <rect x="30" y="130" width="60" height="30" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="60" y="149" text-anchor="middle" font-size="10" fill="#2e7d32">发射FF</text>
    <line x1="90" y1="145" x2="115" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="130" width="80" height="30" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="160" y="149" text-anchor="middle" font-size="10" fill="#e65100">组合逻辑</text>
    <line x1="200" y1="145" x2="225" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="230" y="130" width="60" height="30" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="260" y="149" text-anchor="middle" font-size="10" fill="#2e7d32">捕获FF</text>
    <text x="300" y="149" font-size="9" fill="#666">Tcq + Tlogic + Tsetup ≤ Tclk</text>
    <!-- Path 3: Register to Output -->
    <text x="30" y="185" font-size="12" font-weight="bold" fill="#7b1fa2">③ 寄存器到输出 (Register-to-Output)</text>
    <rect x="30" y="195" width="60" height="30" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="60" y="214" text-anchor="middle" font-size="10" fill="#2e7d32">FF</text>
    <line x1="90" y1="210" x2="115" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="195" width="80" height="30" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="160" y="214" text-anchor="middle" font-size="10" fill="#e65100">组合逻辑</text>
    <line x1="200" y1="210" x2="225" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="230" y="195" width="60" height="30" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="260" y="214" text-anchor="middle" font-size="10" fill="#1e88e5">输出</text>
    <text x="300" y="214" font-size="9" fill="#666">Tcq + Tlogic + Toutput_delay ≤ Tclk</text>
    <!-- Path 4: Input to Output -->
    <text x="30" y="250" font-size="12" font-weight="bold" fill="#c62828">④ 输入到输出 (Input-to-Output)</text>
    <rect x="30" y="260" width="60" height="30" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="60" y="279" text-anchor="middle" font-size="10" fill="#1e88e5">输入</text>
    <line x1="90" y1="275" x2="115" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="260" width="80" height="30" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="160" y="279" text-anchor="middle" font-size="10" fill="#e65100">组合逻辑</text>
    <line x1="200" y1="275" x2="225" y2="275" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="230" y="260" width="60" height="30" rx="3" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="260" y="279" text-anchor="middle" font-size="10" fill="#1e88e5">输出</text>
    <text x="300" y="279" font-size="9" fill="#666">Tinput_delay + Tlogic + Toutput_delay ≤ Tconstraint</text>
    <!-- Clock path -->
    <text x="30" y="320" font-size="12" font-weight="bold" fill="#333">时钟路径</text>
    <rect x="30" y="330" width="60" height="30" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="60" y="349" text-anchor="middle" font-size="10" fill="#7b1fa2">时钟源</text>
    <line x1="90" y1="345" x2="115" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="330" width="80" height="30" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="160" y="349" text-anchor="middle" font-size="10" fill="#7b1fa2">时钟树</text>
    <line x1="200" y1="345" x2="225" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="230" y="330" width="60" height="30" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="260" y="349" text-anchor="middle" font-size="10" fill="#2e7d32">FF CK</text>
    <text x="300" y="349" font-size="9" fill="#666">Tlaunch / Tcapture — 时钟路径延迟</text>
    <!-- Slack formula -->
    <rect x="30" y="370" width="540" height="25" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="300" y="387" text-anchor="middle" font-size="11" fill="#555">时序裕量: Slack = Trequired - Tarrival | 正Slack: 满足约束 | 负Slack: 违反约束</text>
  </g>
</svg>