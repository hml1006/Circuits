<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">RLC 串联交流电路</text>
    
    <!-- 左侧导线 -->
    <line x1="60" y1="100" x2="120" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电阻 R -->
    <rect x="120" y="80" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="145" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R</text>
    
    <line x1="170" y1="100" x2="230" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电感 L -->
    <path d="M 230,80 Q 240,95 230,110 Q 240,125 230,140 Q 240,155 230,170 Q 240,185 230,200 Q 240,215 230,230" fill="none" stroke="#333" stroke-width="2.5"/>
    <line x1="230" y1="230" x2="230" y2="240" stroke="#333" stroke-width="2.5"/>
    <line x1="230" y1="80" x2="230" y2="70" stroke="#333" stroke-width="2.5"/>
    <line x1="230" y1="70" x2="300" y2="70" stroke="#333" stroke-width="2.5"/>
    <line x1="300" y1="70" x2="300" y2="100" stroke="#333" stroke-width="2.5"/>
    <text x="260" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" font-style="italic">L</text>
    
    <line x1="300" y1="100" x2="370" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电容 C -->
    <line x1="370" y1="80" x2="370" y2="100" stroke="#333" stroke-width="2.5"/>
    <line x1="360" y1="100" x2="380" y2="100" stroke="#333" stroke-width="2.5"/>
    <line x1="360" y1="140" x2="380" y2="140" stroke="#333" stroke-width="2.5"/>
    <line x1="370" y1="140" x2="370" y2="160" stroke="#333" stroke-width="2.5"/>
    <text x="370" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">C</text>
    
    <line x1="370" y1="160" x2="430" y2="160" stroke="#333" stroke-width="2.5"/>
    <line x1="430" y1="100" x2="430" y2="160" stroke="#333" stroke-width="2.5"/>
    
    <!-- 右侧导线到电源 -->
    <line x1="430" y1="100" x2="520" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 交流电源符号 -->
    <circle cx="540" cy="100" r="20" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="540" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">~</text>
    
    <line x1="520" y1="100" x2="520" y2="100" stroke="#333" stroke-width="2.5"/>
    
    <!-- 底部导线 -->
    <line x1="60" y1="100" x2="60" y2="300" stroke="#333" stroke-width="2.5"/>
    <line x1="60" y1="300" x2="540" y2="300" stroke="#333" stroke-width="2.5"/>
    <line x1="540" y1="120" x2="540" y2="300" stroke="#333" stroke-width="2.5"/>
    
    <!-- 电流方向 -->
    <polygon points="90,95 105,100 90,105" fill="#333"/>
    <text x="90" y="85" text-anchor="middle" font-size="12" fill="#333" font-style="italic">I</text>
    
    <!-- 相量图标注 -->
    <text x="300" y="350" text-anchor="middle" font-size="13" fill="#333">阻抗: |Z| = √(R² + (X<tspan font-size="9" dy="3">L</tspan><tspan dy="-3"> − X<tspan font-size="9" dy="3">C</tspan><tspan dy="-3">)²)</tspan></tspan></tspan></text>
    <text x="300" y="370" text-anchor="middle" font-size="13" fill="#333">X<tspan font-size="9" dy="3">L</tspan><tspan dy="-3"> = ωL, X<tspan font-size="9" dy="3">C</tspan><tspan dy="-3"> = 1/(ωC)</tspan></tspan></tspan></text>
    <text x="300" y="390" text-anchor="middle" font-size="12" fill="#666">φ = arctan((X<tspan font-size="8" dy="3">L</tspan><tspan dy="-3">−X<tspan font-size="8" dy="3">C</tspan><tspan dy="-3">)/R)</tspan></tspan></tspan></text>
  </g>
</svg>