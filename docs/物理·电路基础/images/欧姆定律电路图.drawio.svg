<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">欧姆定律电路图</text>
    <text x="300" y="50" text-anchor="middle" font-size="14" fill="#e74c3c">I = U / R</text>
    
    <!-- 电路图 -->
    <!-- 电源 -->
    <rect x="40" y="200" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="55" y1="200" x2="55" y2="185" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="200" x2="75" y2="185" stroke="#333" stroke-width="2"/>
    <text x="65" y="215" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="65" y="230" text-anchor="middle" font-size="10" fill="#333">−</text>
    <text x="65" y="255" text-anchor="middle" font-size="12" fill="#555">电源</text>
    
    <!-- 导线：电源正极 → 上方 -->
    <line x1="65" y1="185" x2="65" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2"/>
    
    <!-- 开关 -->
    <line x1="200" y1="100" x2="230" y2="100" stroke="#333" stroke-width="2"/>
    <circle cx="230" cy="100" r="3" fill="#333"/>
    <line x1="230" y1="100" x2="250" y2="85" stroke="#333" stroke-width="2"/>
    <circle cx="250" cy="85" r="3" fill="#333"/>
    <line x1="250" y1="85" x2="280" y2="85" stroke="#333" stroke-width="2"/>
    <text x="240" y="75" text-anchor="middle" font-size="11" fill="#555">S</text>
    
    <!-- 导线：开关 → 电阻 -->
    <line x1="280" y1="85" x2="350" y2="85" stroke="#333" stroke-width="2"/>
    
    <!-- 电阻 R -->
    <rect x="350" y="70" width="60" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="380" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R</text>
    <text x="380" y="120" text-anchor="middle" font-size="11" fill="#555">定值电阻</text>
    
    <!-- 导线：电阻 → 电源负极 -->
    <line x1="410" y1="85" x2="480" y2="85" stroke="#333" stroke-width="2"/>
    <line x1="480" y1="85" x2="480" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="480" y1="200" x2="90" y2="200" stroke="#333" stroke-width="2"/>
    
    <!-- 电流表（串联在电路中） -->
    <line x1="120" y1="100" x2="155" y2="100" stroke="#333" stroke-width="2"/>
    <rect x="155" y="85" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="175" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">A</text>
    <line x1="195" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2"/>
    <text x="175" y="75" text-anchor="middle" font-size="10" fill="#555">测电流 I</text>
    
    <!-- 电压表（并联在电阻两端） -->
    <line x1="365" y1="70" x2="365" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="365" y1="160" x2="310" y2="160" stroke="#333" stroke-width="2"/>
    <rect x="270" y="145" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="290" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">V</text>
    <line x1="310" y1="160" x2="395" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="395" y1="160" x2="395" y2="100" stroke="#333" stroke-width="2"/>
    <text x="290" y="140" text-anchor="middle" font-size="10" fill="#555">测电压 U</text>
    
    <!-- 公式标注 -->
    <rect x="150" y="280" width="300" height="100" rx="8" ry="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="2"/>
    <text x="300" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67e22">欧姆定律</text>
    <text x="300" y="330" text-anchor="middle" font-size="14" fill="#333">I = U / R</text>
    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">导体中的电流与电压成正比</text>
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">与电阻成反比</text>
  </g>
</svg>