<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">变压器结构图</text>
    
    <!-- 铁芯（口字形） -->
    <!-- 左柱 -->
    <rect x="160" y="80" width="40" height="240" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="2"/>
    <!-- 右柱 -->
    <rect x="400" y="80" width="40" height="240" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="2"/>
    <!-- 上横梁 -->
    <rect x="160" y="80" width="280" height="40" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="2"/>
    <!-- 下横梁 -->
    <rect x="160" y="280" width="280" height="40" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="2"/>
    
    <text x="300" y="105" text-anchor="middle" font-size="12" fill="#666">铁芯（硅钢片叠压）</text>
    
    <!-- 原线圈（左侧绕组） -->
    <path d="M 180,130 Q 190,145 180,160 Q 190,175 180,190 Q 190,205 180,220 Q 190,235 180,250" fill="none" stroke="#d32f2f" stroke-width="3"/>
    <text x="170" y="195" text-anchor="end" font-size="13" font-weight="bold" fill="#d32f2f">N₁</text>
    
    <!-- 原线圈输入导线 -->
    <line x1="180" y1="130" x2="80" y2="130" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="180" y1="250" x2="80" y2="250" stroke="#d32f2f" stroke-width="2.5"/>
    
    <text x="60" y="125" text-anchor="end" font-size="12" fill="#d32f2f">交流输入</text>
    <text x="60" y="145" text-anchor="end" font-size="12" fill="#d32f2f">u₁</text>
    
    <!-- 副线圈（右侧绕组） -->
    <path d="M 420,130 Q 410,145 420,160 Q 410,175 420,190 Q 410,205 420,220 Q 410,235 420,250" fill="none" stroke="#1976d2" stroke-width="3"/>
    <text x="435" y="195" text-anchor="start" font-size="13" font-weight="bold" fill="#1976d2">N₂</text>
    
    <!-- 副线圈输出导线 -->
    <line x1="420" y1="130" x2="520" y2="130" stroke="#1976d2" stroke-width="2.5"/>
    <line x1="420" y1="250" x2="520" y2="250" stroke="#1976d2" stroke-width="2.5"/>
    
    <text x="540" y="125" text-anchor="start" font-size="12" fill="#1976d2">交流输出</text>
    <text x="540" y="145" text-anchor="start" font-size="12" fill="#1976d2">u₂</text>
    
    <!-- 磁通 -->
    <path d="M 200,130 Q 300,125 400,130" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
    <path d="M 200,150 Q 300,145 400,150" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
    <path d="M 200,250 Q 300,255 400,250" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
    <path d="M 200,270 Q 300,275 400,270" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
    
    <text x="300" y="165" text-anchor="middle" font-size="12" fill="#4dabf7" font-style="italic">Φ（交变磁通）</text>
    
    <!-- 公式 -->
    <text x="300" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">U₁/U₂ = N₁/N₂</text>
    <text x="300" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">I₁/I₂ = N₂/N₁</text>
  </g>
</svg>