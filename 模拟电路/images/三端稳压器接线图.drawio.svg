<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">三端集成稳压器78XX典型接线图</text>

    <!-- 输入电容 -->
    <text x="50" y="100" font-size="12" fill="#666">V</text>
    <text x="50" y="112" font-size="10" fill="#666">I</text>
    <text x="50" y="125" font-size="10" fill="#666">(未稳)</text>
    <line x1="70" y1="100" x2="120" y2="100" stroke="#333" stroke-width="2"/>

    <!-- 输入电容 Ci -->
    <line x1="120" y1="90" x2="120" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="110" y1="90" x2="130" y2="90" stroke="#333" stroke-width="3"/>
    <line x1="110" y1="110" x2="130" y2="110" stroke="#333" stroke-width="3"/>
    <text x="140" y="105" font-size="11" fill="#333">C</text>
    <text x="148" y="105" font-size="9" fill="#666">i</text>
    <line x1="120" y1="110" x2="120" y2="160" stroke="#333" stroke-width="2"/>

    <line x1="120" y1="100" x2="180" y2="100" stroke="#333" stroke-width="2"/>

    <!-- 78XX 稳压器 -->
    <rect x="180" y="70" width="160" height="60" fill="#e8e8e8" stroke="#333" stroke-width="2" rx="5"/>
    <text x="260" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">78XX</text>
    <text x="260" y="112" text-anchor="middle" font-size="10" fill="#666">三端稳压器</text>

    <!-- 引脚 -->
    <line x1="180" y1="100" x2="160" y2="100" stroke="#333" stroke-width="2"/>
    <text x="155" y="105" text-anchor="end" font-size="10" fill="#333">IN</text>

    <line x1="340" y1="100" x2="370" y2="100" stroke="#333" stroke-width="2"/>
    <text x="380" y="105" font-size="10" fill="#333">OUT</text>

    <line x1="260" y1="130" x2="260" y2="160" stroke="#333" stroke-width="2"/>
    <text x="260" y="175" text-anchor="middle" font-size="10" fill="#333">GND</text>

    <!-- 输出电容 Co -->
    <line x1="370" y1="100" x2="420" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="420" y1="90" x2="420" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="410" y1="90" x2="430" y2="90" stroke="#333" stroke-width="3"/>
    <line x1="410" y1="110" x2="430" y2="110" stroke="#333" stroke-width="3"/>
    <text x="440" y="105" font-size="11" fill="#333">C</text>
    <text x="448" y="105" font-size="9" fill="#666">o</text>
    <line x1="420" y1="110" x2="420" y2="160" stroke="#333" stroke-width="2"/>

    <line x1="420" y1="100" x2="470" y2="100" stroke="#333" stroke-width="2"/>
    <text x="480" y="105" font-size="12" fill="#666">V</text>
    <text x="480" y="117" font-size="10" fill="#666">O</text>
    <text x="480" y="130" font-size="10" fill="#666">(稳定)</text>

    <!-- 地线连接 -->
    <line x1="260" y1="160" x2="260" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="160" x2="420" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="160" x2="120" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="420" y1="160" x2="420" y2="200" stroke="#333" stroke-width="2"/>

    <!-- 地线符号 -->
    <line x1="100" y1="200" x2="140" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="200" x2="100" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="200" x2="140" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="205" x2="140" y2="205" stroke="#333" stroke-width="2"/>

    <line x1="240" y1="200" x2="280" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="240" y1="200" x2="240" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="200" x2="280" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="240" y1="205" x2="280" y2="205" stroke="#333" stroke-width="2"/>

    <line x1="400" y1="200" x2="440" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="400" y1="200" x2="400" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="200" x2="440" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="400" y1="205" x2="440" y2="205" stroke="#333" stroke-width="2"/>

    <!-- 说明 -->
    <text x="300" y="250" text-anchor="middle" font-size="11" fill="#666">典型参数（7805）：</text>
    <text x="300" y="270" text-anchor="middle" font-size="10" fill="#666">• 输出电压：+5V（78XX系列）</text>
    <text x="300" y="288" text-anchor="middle" font-size="10" fill="#666">• 最大输出电流：78LXX 100mA / 78MXX 500mA / 78XX 1.5A</text>
    <text x="300" y="306" text-anchor="middle" font-size="10" fill="#666">• 最小压差（Dropout）：约 2V</text>
    <text x="300" y="324" text-anchor="middle" font-size="10" fill="#666">• 纹波抑制比：60~80dB</text>

    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">79XX系列为负电压输出，引脚定义不同</text>
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">C</text>
    <text x="308" y="370" text-anchor="middle" font-size="11" fill="#666">i</text>
    <text x="316" y="370" text-anchor="middle" font-size="11" fill="#666"> 抑制高频噪声，C</text>
    <text x="360" y="370" text-anchor="middle" font-size="11" fill="#666">o</text>
    <text x="368" y="370" text-anchor="middle" font-size="11" fill="#666"> 改善瞬态响应</text>
  </g>
</svg>