<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">全桥逆变器（H 桥）电路图</text>
    
    <!-- DC source -->
    <text x="50" y="100" font-size="13" fill="#000" font-weight="bold">Vdc</text>
    <line x1="50" y1="80" x2="90" y2="80" stroke="#000" stroke-width="2"/>
    <line x1="50" y1="120" x2="90" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="70" y1="80" x2="70" y2="60" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="60" x2="80" y2="60" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="120" x2="80" y2="120" stroke="#000" stroke-width="2"/>
    
    <!-- DC bus positive -->
    <line x1="90" y1="80" x2="540" y2="80" stroke="#000" stroke-width="2"/>
    <!-- DC bus negative -->
    <line x1="90" y1="320" x2="540" y2="320" stroke="#000" stroke-width="2"/>
    
    <!-- DC bus capacitor -->
    <line x1="110" y1="80" x2="110" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="120" x2="120" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="100" y1="140" x2="120" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="140" x2="110" y2="320" stroke="#000" stroke-width="2"/>
    <text x="125" y="135" font-size="11" fill="#000" font-style="italic">C</text>
    
    <!-- S1 (top-left) -->
    <rect x="160" y="60" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="190" y="85" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₁</text>
    <!-- Freewheeling diode D1 -->
    <polygon points="190,100 190,120 178,110" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="178" y1="110" x2="202" y2="110" stroke="#c00" stroke-width="1.5"/>
    <text x="210" y="114" font-size="10" fill="#c00">D₁</text>
    
    <!-- S3 (bottom-left) -->
    <rect x="160" y="300" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="190" y="325" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₃</text>
    <!-- Freewheeling diode D3 -->
    <polygon points="190,280 190,260 178,270" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="178" y1="270" x2="202" y2="270" stroke="#c00" stroke-width="1.5"/>
    <text x="210" y="288" font-size="10" fill="#c00">D₃</text>
    
    <!-- S2 (top-right) -->
    <rect x="380" y="60" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="410" y="85" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₂</text>
    <!-- Freewheeling diode D2 -->
    <polygon points="410,100 410,120 398,110" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="398" y1="110" x2="422" y2="110" stroke="#c00" stroke-width="1.5"/>
    <text x="430" y="114" font-size="10" fill="#c00">D₂</text>
    
    <!-- S4 (bottom-right) -->
    <rect x="380" y="300" width="60" height="40" fill="#ffe0e0" stroke="#c00" stroke-width="2" rx="3"/>
    <text x="410" y="325" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">S₄</text>
    <!-- Freewheeling diode D4 -->
    <polygon points="410,280 410,260 398,270" fill="none" stroke="#c00" stroke-width="1.5"/>
    <line x1="398" y1="270" x2="422" y2="270" stroke="#c00" stroke-width="1.5"/>
    <text x="430" y="288" font-size="10" fill="#c00">D₄</text>
    
    <!-- Left leg connections -->
    <line x1="190" y1="80" x2="190" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="190" y1="120" x2="190" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="190" y1="340" x2="190" y2="320" stroke="#000" stroke-width="2"/>
    
    <!-- Right leg connections -->
    <line x1="410" y1="80" x2="410" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="120" x2="410" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="340" x2="410" y2="320" stroke="#000" stroke-width="2"/>
    
    <!-- Load between legs -->
    <line x1="190" y1="200" x2="260" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="200" x2="340" y2="200" stroke="#000" stroke-width="2"/>
    
    <!-- Load resistor -->
    <rect x="260" y="185" width="80" height="30" fill="none" stroke="#000" stroke-width="2"/>
    <text x="300" y="205" text-anchor="middle" font-size="14" fill="#000" font-style="italic">R_L</text>
    
    <!-- Output voltage notation -->
    <text x="300" y="175" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">Vₒ</text>
    
    <!-- PWM control annotations -->
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">双极性 PWM：</text>
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">S₁/S₄ 同时导通 → Vₒ = +Vdc | S₂/S₃ 同时导通 → Vₒ = -Vdc</text>
  </g>
</svg>