<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">微带线结构图</text>
    
    <!-- Cross-section view -->
    
    <!-- Top layer: Air -->
    <rect x="50" y="50" width="500" height="80" fill="#e8f0ff" stroke="none" rx="3"/>
    <text x="300" y="95" text-anchor="middle" font-size="14" fill="#669" font-weight="bold">空气（ε₀）</text>
    
    <!-- Signal trace (top conductor) -->
    <rect x="200" y="60" width="200" height="40" fill="#e8b800" stroke="#c80" stroke-width="2" rx="2"/>
    <text x="300" y="85" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">导体带（信号线）</text>
    
    <!-- Width annotation W -->
    <line x1="200" y1="45" x2="400" y2="45" stroke="#000" stroke-width="1.5"/>
    <polygon points="200,45 208,42 208,48" fill="#000"/>
    <polygon points="400,45 392,42 392,48" fill="#000"/>
    <text x="300" y="42" text-anchor="middle" font-size="14" fill="#000" font-style="italic">W（线宽）</text>
    
    <!-- Dielectric substrate -->
    <rect x="50" y="130" width="500" height="120" fill="#d0e8b0" stroke="#000" stroke-width="2" rx="3"/>
    <text x="300" y="185" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">介质基板（εᵣ）</text>
    <text x="300" y="205" text-anchor="middle" font-size="12" fill="#666">FR-4 / 陶瓷 / 罗杰斯</text>
    
    <!-- Height annotation h -->
    <line x1="460" y1="130" x2="460" y2="250" stroke="#000" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="460,130 456,138 464,138" fill="#000"/>
    <polygon points="460,250 456,242 464,242" fill="#000"/>
    <text x="475" y="194" text-anchor="middle" font-size="14" fill="#000" font-style="italic">h（厚度）</text>
    
    <!-- Ground plane (bottom) -->
    <rect x="50" y="250" width="500" height="40" fill="#aaa" stroke="#000" stroke-width="2" rx="2"/>
    <text x="300" y="275" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">地平面（GND）</text>
    
    <!-- Electric field lines -->
    <path d="M 250 100 Q 250 130 250 160" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 300 100 Q 300 150 300 200" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 350 100 Q 350 130 350 160" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Magnetic field lines -->
    <path d="M 220 100 Q 250 120 280 100" fill="none" stroke="#00c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 280 100 Q 300 120 320 100" fill="none" stroke="#00c" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 320 100 Q 350 120 380 100" fill="none" stroke="#00c" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Field legend -->
    <line x1="100" y1="340" x2="130" y2="340" stroke="#c00" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="140" y="344" font-size="12" fill="#c00">电场 E</text>
    <line x1="250" y1="340" x2="280" y2="340" stroke="#00c" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="290" y="344" font-size="12" fill="#00c">磁场 H</text>
    
    <!-- Key parameters -->
    <text x="300" y="375" text-anchor="middle" font-size="12" fill="#666">关键参数：W（线宽）| h（介质厚度）| εᵣ（相对介电常数）| t（导体厚度）</text>
    
    <!-- Thickness t annotation -->
    <line x1="420" y1="60" x2="420" y2="100" stroke="#000" stroke-width="1"/>
    <polygon points="420,60 416,68 424,68" fill="#000"/>
    <polygon points="420,100 416,92 424,92" fill="#000"/>
    <text x="435" y="84" font-size="12" fill="#000" font-style="italic">t</text>
  </g>
</svg>