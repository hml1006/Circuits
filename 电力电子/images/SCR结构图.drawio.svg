<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">SCR 结构图（四层 PNPN 结构）</text>
    
    <!-- Left: PNPN structure cross-section -->
    <text x="150" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">物理结构</text>
    
    <!-- P+ layer (Anode) -->
    <rect x="80" y="70" width="140" height="50" fill="#ffcccc" stroke="#c00" stroke-width="2" rx="2"/>
    <text x="150" y="98" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">P⁺（阳极区）</text>
    
    <!-- N layer -->
    <rect x="80" y="120" width="140" height="50" fill="#ccccee" stroke="#33c" stroke-width="2" rx="2"/>
    <text x="150" y="148" text-anchor="middle" font-size="14" fill="#33c" font-weight="bold">N（基区）</text>
    
    <!-- P layer (Gate) -->
    <rect x="80" y="170" width="140" height="50" fill="#ffcccc" stroke="#c00" stroke-width="2" rx="2"/>
    <text x="150" y="198" text-anchor="middle" font-size="14" fill="#c00" font-weight="bold">P（基区/门极区）</text>
    
    <!-- N+ layer (Cathode) -->
    <rect x="80" y="220" width="140" height="50" fill="#ccccee" stroke="#33c" stroke-width="2" rx="2"/>
    <text x="150" y="248" text-anchor="middle" font-size="14" fill="#33c" font-weight="bold">N⁺（阴极区）</text>
    
    <!-- PN Junction labels -->
    <text x="230" y="108" font-size="11" fill="#c00">J₁</text>
    <text x="230" y="158" font-size="11" fill="#c00">J₂</text>
    <text x="230" y="208" font-size="11" fill="#c00">J₃</text>
    
    <!-- Terminal labels -->
    <line x1="150" y1="70" x2="150" y2="55" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="55" x2="160" y2="55" stroke="#000" stroke-width="2"/>
    <text x="170" y="58" font-size="13" fill="#000" font-weight="bold">A（阳极）</text>
    
    <line x1="220" y1="195" x2="250" y2="195" stroke="#000" stroke-width="2"/>
    <text x="260" y="199" font-size="13" fill="#000" font-weight="bold">G（门极）</text>
    
    <line x1="150" y1="270" x2="150" y2="285" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="285" x2="160" y2="285" stroke="#000" stroke-width="2"/>
    <text x="170" y="288" font-size="13" fill="#000" font-weight="bold">K（阴极）</text>
    
    <!-- Right: Circuit symbol -->
    <text x="420" y="55" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">电路符号</text>
    
    <!-- SCR diode symbol -->
    <line x1="380" y1="100" x2="420" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="420" y1="100" x2="420" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="140" x2="460" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="420" y1="140" x2="420" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="180" x2="420" y2="180" stroke="#000" stroke-width="2"/>
    
    <!-- Triangle (diode) -->
    <polygon points="420,100 420,180 380,140" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Gate line -->
    <line x1="420" y1="140" x2="470" y2="200" stroke="#000" stroke-width="2"/>
    
    <!-- Terminal labels -->
    <text x="370" y="95" text-anchor="end" font-size="13" fill="#000" font-weight="bold">A</text>
    <text x="370" y="185" text-anchor="end" font-size="13" fill="#000" font-weight="bold">K</text>
    <text x="480" y="204" font-size="13" fill="#000" font-weight="bold">G</text>
    
    <!-- Right: Dual-transistor model -->
    <text x="420" y="260" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">双晶体管等效模型</text>
    
    <!-- PNP transistor -->
    <circle cx="380" cy="300" r="4" fill="#000"/>
    <line x1="380" y1="300" x2="350" y2="300" stroke="#000" stroke-width="2"/>
    <polygon points="350,300 350,285 320,285 320,315 350,315 350,300" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="285" x2="300" y2="285" stroke="#000" stroke-width="2"/>
    <line x1="335" y1="315" x2="335" y2="340" stroke="#000" stroke-width="2"/>
    <line x1="335" y1="340" x2="380" y2="340" stroke="#000" stroke-width="2"/>
    
    <!-- NPN transistor -->
    <polygon points="380,340 380,355 410,355 410,385 380,385 380,340" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="380" cy="340" r="4" fill="#000"/>
    <line x1="410" y1="355" x2="430" y2="355" stroke="#000" stroke-width="2"/>
    <line x1="395" y1="385" x2="395" y2="300" stroke="#000" stroke-width="2"/>
    
    <text x="310" y="280" font-size="11" fill="#000">Q₁ PNP</text>
    <text x="400" y="370" font-size="11" fill="#000">Q₂ NPN</text>
    
    <!-- Anode current formula -->
    <text x="300" y="395" text-anchor="middle" font-size="11" fill="#666">I_A = (α₂I_G + I_CBO₁ + I_CBO₂) / (1 - (α₁ + α₂))</text>
  </g>
</svg>