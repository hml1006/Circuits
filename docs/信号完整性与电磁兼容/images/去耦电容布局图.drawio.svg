<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="25" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">去耦电容布局图</text>
    
    <!-- PCB top view -->
    <!-- IC (chip) -->
    <rect x="230" y="60" width="120" height="120" fill="#e0e0e0" stroke="#000" stroke-width="2" rx="3"/>
    <text x="290" y="115" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">IC</text>
    <text x="290" y="135" text-anchor="middle" font-size="11" fill="#666">芯片</text>
    
    <!-- IC power pins -->
    <rect x="230" y="170" width="20" height="15" fill="#ffcccc" stroke="#c00" stroke-width="1" rx="1"/>
    <text x="240" y="181" text-anchor="middle" font-size="8" fill="#c00">Vcc</text>
    
    <rect x="330" y="170" width="20" height="15" fill="#ccccff" stroke="#00c" stroke-width="1" rx="1"/>
    <text x="340" y="181" text-anchor="middle" font-size="8" fill="#00c">GND</text>
    
    <!-- Decoupling capacitor (good placement) -->
    <text x="290" y="210" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">正确布局</text>
    
    <rect x="215" y="220" width="40" height="20" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="235" y="234" text-anchor="middle" font-size="9" fill="#c00">C₁</text>
    
    <rect x="325" y="220" width="40" height="20" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="345" y="234" text-anchor="middle" font-size="9" fill="#c00">C₂</text>
    
    <!-- Short traces from cap to IC -->
    <line x1="235" y1="220" x2="240" y2="185" stroke="#080" stroke-width="2"/>
    <line x1="255" y1="220" x2="255" y2="185" stroke="#080" stroke-width="2"/>
    
    <line x1="345" y1="220" x2="340" y2="185" stroke="#080" stroke-width="2"/>
    <line x1="365" y1="220" x2="365" y2="185" stroke="#080" stroke-width="2"/>
    
    <text x="290" y="260" text-anchor="middle" font-size="10" fill="#080">✓ 电容紧靠芯片电源引脚</text>
    <text x="290" y="275" text-anchor="middle" font-size="10" fill="#080">✓ 走线短而粗，寄生电感小</text>
    
    <!-- Wrong placement -->
    <text x="290" y="310" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">错误布局</text>
    
    <rect x="180" y="330" width="40" height="20" fill="#ffe0e0" stroke="#c00" stroke-width="1.5" rx="2"/>
    <text x="200" y="344" text-anchor="middle" font-size="9" fill="#c00">C</text>
    
    <!-- Long winding traces -->
    <path d="M 200 330 L 200 300 L 240 300 L 240 185" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 220 330 L 220 295 L 260 295 L 260 185" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <text x="290" y="365" text-anchor="middle" font-size="10" fill="#c00">✗ 电容离芯片太远</text>
    <text x="290" y="380" text-anchor="middle" font-size="10" fill="#c00">✗ 走线过长，寄生电感大</text>
    
    <!-- Via annotation -->
    <text x="450" y="330" text-anchor="middle" font-size="11" fill="#000" font-weight="bold">布局要点</text>
    <text x="450" y="350" font-size="10" fill="#666">• 电源和地过孔紧邻电容焊盘</text>
    <text x="450" y="365" font-size="10" fill="#666">• 避免电容与芯片之间有过孔</text>
    <text x="450" y="380" font-size="10" fill="#666">• 多电容并联扩展低阻抗频段</text>
  </g>
</svg>