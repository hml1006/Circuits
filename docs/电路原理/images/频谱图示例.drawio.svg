<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">频谱图示例</text>
    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#000" stroke-width="2"/>
    <line x1="60" y1="350" x2="60" y2="50" stroke="#000" stroke-width="2"/>
    <polygon points="560,350 552,345 552,355" fill="#000"/>
    <polygon points="60,50 55,58 85,58" fill="#000"/>
    <text x="300" y="378" text-anchor="middle" font-size="14" fill="#333">ω</text>
    <text x="40" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90, 40, 200)">|F(jω)|</text>
    <line x1="60" y1="350" x2="60" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="60" y="370" text-anchor="middle" font-size="11" fill="#333">0</text>
    <line x1="160" y1="350" x2="160" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="160" y="370" text-anchor="middle" font-size="11" fill="#333">ω₀</text>
    <line x1="260" y1="350" x2="260" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333">2ω₀</text>
    <line x1="360" y1="350" x2="360" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="360" y="370" text-anchor="middle" font-size="11" fill="#333">3ω₀</text>
    <line x1="460" y1="350" x2="460" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="460" y="370" text-anchor="middle" font-size="11" fill="#333">4ω₀</text>
    <line x1="560" y1="350" x2="560" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="560" y="370" text-anchor="middle" font-size="11" fill="#333">5ω₀</text>
    <!-- 频谱线（方波的离散频谱） -->
    <line x1="160" y1="350" x2="160" y2="80" stroke="#d32f2f" stroke-width="8"/>
    <text x="170" y="75" font-size="12" fill="#d32f2f">4A/π</text>
    <line x1="260" y1="350" x2="260" y2="170" stroke="#1976d2" stroke-width="8"/>
    <text x="270" y="165" font-size="12" fill="#1976d2">4A/(3π)</text>
    <line x1="360" y1="350" x2="360" y2="210" stroke="#e65100" stroke-width="8"/>
    <text x="370" y="205" font-size="12" fill="#e65100">4A/(5π)</text>
    <line x1="460" y1="350" x2="460" y2="240" stroke="#388e3c" stroke-width="8"/>
    <text x="470" y="235" font-size="12" fill="#388e3c">4A/(7π)</text>
    <line x1="560" y1="350" x2="560" y2="260" stroke="#6a1b9a" stroke-width="8"/>
    <text x="570" y="255" font-size="12" fill="#6a1b9a">4A/(9π)</text>
    <!-- 幅度谱与相位谱 -->
    <text x="300" y="395" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">幅度谱: 离散谱线, 幅值按1/n衰减 | 相位谱: 各谐波相位为0°或180°</text>
  </g>
</svg>