<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="20" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">SPWM 波形图</text>
    
    <!-- Top: Modulation and carrier -->
    <text x="60" y="50" font-size="12" fill="#000" font-weight="bold">调制波与载波比较</text>
    
    <line x1="50" y1="85" x2="550" y2="85" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="55" x2="50" y2="115" stroke="#000" stroke-width="1"/>
    
    <!-- Triangle carrier wave -->
    <path d="M 50 85 L 65 55 L 80 85 L 95 55 L 110 85 L 125 55 L 140 85 L 155 55 L 170 85 L 185 55 L 200 85 L 215 55 L 230 85 L 245 55 L 260 85 L 275 55 L 290 85 L 305 55 L 320 85 L 335 55 L 350 85 L 365 55 L 380 85 L 395 55 L 410 85 L 425 55 L 440 85 L 455 55 L 470 85 L 485 55 L 500 85 L 515 55 L 530 85 L 545 55 L 560 85" fill="none" stroke="#888" stroke-width="1.5"/>
    <text x="560" y="62" font-size="10" fill="#888">载波</text>
    
    <!-- Sine modulation wave -->
    <path d="M 50 85 C 60 85, 70 55, 80 55 C 90 55, 100 85, 110 85 C 120 85, 130 115, 140 115 C 150 115, 160 85, 170 85 C 180 85, 190 55, 200 55 C 210 55, 220 85, 230 85 C 240 85, 250 115, 260 115 C 270 115, 280 85, 290 85 C 300 85, 310 55, 320 55 C 330 55, 340 85, 350 85" fill="none" stroke="#00c" stroke-width="2"/>
    <text x="560" y="45" font-size="10" fill="#00c">调制波</text>
    
    <!-- Middle: PWM output -->
    <text x="60" y="145" font-size="12" fill="#000" font-weight="bold">PWM 输出脉冲</text>
    
    <line x1="50" y1="165" x2="550" y2="165" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="145" x2="50" y2="185" stroke="#000" stroke-width="1"/>
    
    <!-- PWM pulses (width varies with sine) -->
    <rect x="50" y="155" width="8" height="20" fill="#c00"/>
    <rect x="62" y="155" width="14" height="20" fill="#c00"/>
    <rect x="80" y="155" width="16" height="20" fill="#c00"/>
    <rect x="100" y="155" width="14" height="20" fill="#c00"/>
    <rect x="118" y="155" width="8" height="20" fill="#c00"/>
    <rect x="130" y="155" width="4" height="20" fill="#c00"/>
    <rect x="138" y="155" width="4" height="20" fill="#c00"/>
    <rect x="146" y="155" width="8" height="20" fill="#c00"/>
    <rect x="158" y="155" width="14" height="20" fill="#c00"/>
    <rect x="176" y="155" width="16" height="20" fill="#c00"/>
    <rect x="196" y="155" width="14" height="20" fill="#c00"/>
    <rect x="214" y="155" width="8" height="20" fill="#c00"/>
    <rect x="226" y="155" width="4" height="20" fill="#c00"/>
    <rect x="234" y="155" width="4" height="20" fill="#c00"/>
    <rect x="242" y="155" width="8" height="20" fill="#c00"/>
    <rect x="254" y="155" width="14" height="20" fill="#c00"/>
    <rect x="272" y="155" width="16" height="20" fill="#c00"/>
    <rect x="292" y="155" width="14" height="20" fill="#c00"/>
    <rect x="310" y="155" width="8" height="20" fill="#c00"/>
    <rect x="322" y="155" width="4" height="20" fill="#c00"/>
    <rect x="330" y="155" width="4" height="20" fill="#c00"/>
    <rect x="338" y="155" width="8" height="20" fill="#c00"/>
    <rect x="350" y="155" width="14" height="20" fill="#c00"/>
    <rect x="368" y="155" width="16" height="20" fill="#c00"/>
    <rect x="388" y="155" width="14" height="20" fill="#c00"/>
    <rect x="406" y="155" width="8" height="20" fill="#c00"/>
    <rect x="418" y="155" width="4" height="20" fill="#c00"/>
    <rect x="426" y="155" width="4" height="20" fill="#c00"/>
    <rect x="434" y="155" width="8" height="20" fill="#c00"/>
    <rect x="446" y="155" width="14" height="20" fill="#c00"/>
    <rect x="464" y="155" width="16" height="20" fill="#c00"/>
    <rect x="484" y="155" width="14" height="20" fill="#c00"/>
    <rect x="502" y="155" width="8" height="20" fill="#c00"/>
    <rect x="514" y="155" width="4" height="20" fill="#c00"/>
    <rect x="522" y="155" width="4" height="20" fill="#c00"/>
    <rect x="530" y="155" width="8" height="20" fill="#c00"/>
    <rect x="542" y="155" width="8" height="20" fill="#c00"/>
    
    <!-- Bottom: Filtered output -->
    <text x="60" y="220" font-size="12" fill="#000" font-weight="bold">滤波后输出</text>
    
    <line x1="50" y1="250" x2="550" y2="250" stroke="#000" stroke-width="1"/>
    <line x1="50" y1="220" x2="50" y2="280" stroke="#000" stroke-width="1"/>
    
    <path d="M 50 250 C 60 250, 70 200, 100 200 C 130 200, 140 250, 170 250 C 200 250, 210 300, 240 300 C 270 300, 280 250, 310 250 C 340 250, 350 200, 380 200 C 410 200, 420 250, 450 250 C 480 250, 490 300, 520 300 C 530 300, 540 250, 550 250" fill="none" stroke="#080" stroke-width="2.5"/>
    <text x="560" y="235" font-size="10" fill="#080">正弦波</text>
    
    <!-- Key parameters -->
    <text x="300" y="330" text-anchor="middle" font-size="13" fill="#000" font-weight="bold">关键参数</text>
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#000">调制比 mₐ = Vₘ/V_c（线性区 mₐ ≤ 1）</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#000">频率比 m_f = f_c/f_m（通常为奇数）</text>
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">v_m(t) > v_c(t) → 上管导通 | v_m(t) < v_c(t) → 下管导通</text>
  </g>
</svg>