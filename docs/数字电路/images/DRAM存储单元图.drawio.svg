<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">1管 DRAM 存储单元</text>
    <!-- 字线 -->
    <line x1="60" y1="120" x2="540" y2="120" stroke="#000" stroke-width="2"/>
    <text x="300" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">字线 (Word Line)</text>
    <!-- 位线 -->
    <line x1="300" y1="200" x2="300" y2="350" stroke="#000" stroke-width="2"/>
    <text x="300" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">位线 (Bit Line)</text>
    <!-- NMOS 管 -->
    <rect x="275" y="130" width="50" height="60" rx="4" fill="#ffe8e8" stroke="#000" stroke-width="2"/>
    <text x="300" y="155" text-anchor="middle" font-size="11" fill="#000">NMOS</text>
    <text x="300" y="170" text-anchor="middle" font-size="11" fill="#000">T</text>
    <!-- 栅极 -->
    <circle cx="270" cy="145" r="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="270" y1="145" x2="200" y2="145" stroke="#000" stroke-width="1.5"/>
    <line x1="200" y1="145" x2="200" y2="120" stroke="#000" stroke-width="1.5"/>
    <!-- 源极连接 -->
    <line x1="300" y1="190" x2="300" y2="200" stroke="#000" stroke-width="2"/>
    <!-- 漏极连接 -->
    <line x1="300" y1="130" x2="300" y2="110" stroke="#000" stroke-width="1.5"/>
    <line x1="300" y1="110" x2="200" y2="110" stroke="#000" stroke-width="1.5"/>
    <!-- 电容 -->
    <line x1="300" y1="235" x2="300" y2="260" stroke="#000" stroke-width="2"/>
    <rect x="280" y="260" width="40" height="55" rx="3" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <line x1="280" y1="275" x2="320" y2="275" stroke="#000" stroke-width="1.5"/>
    <line x1="280" y1="295" x2="320" y2="295" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="290" text-anchor="middle" font-size="10" fill="#000">C</text>
    <text x="300" y="305" text-anchor="middle" font-size="9" fill="#000">电容</text>
    <!-- 电容接地 -->
    <line x1="300" y1="315" x2="300" y2="330" stroke="#000" stroke-width="1.5"/>
    <line x1="285" y1="330" x2="315" y2="330" stroke="#000" stroke-width="2"/>
    <line x1="291" y1="336" x2="309" y2="336" stroke="#000" stroke-width="2"/>
    <line x1="297" y1="342" x2="303" y2="342" stroke="#000" stroke-width="2"/>
    <text x="320" y="334" text-anchor="start" font-size="10" fill="#000">GND</text>
    <!-- 电荷标注 -->
    <text x="340" y="270" text-anchor="start" font-size="11" fill="#555">充电 → 数据 1</text>
    <text x="340" y="290" text-anchor="start" font-size="11" fill="#555">放电 → 数据 0</text>
    <!-- 工作原理 -->
    <rect x="30" y="310" width="540" height="75" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">工作原理</text>
    <text x="50" y="352" text-anchor="start" font-size="12" fill="#000">读：字线高电平 → T 导通 → 电容电荷通过位线读出</text>
    <text x="50" y="372" text-anchor="start" font-size="12" fill="#000">写：字线高电平 → T 导通 → 位线电压写入电容</text>
    <text x="50" y="392" text-anchor="start" font-size="12" fill="#000">刷新：需定期（64ms）刷新，防止电容漏电导致数据丢失</text>
  </g>
</svg>