<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">555定时器内部结构框图</text>

    <!-- 芯片边框 -->
    <rect x="40" y="40" width="520" height="320" fill="#f8f8f8" stroke="#333" stroke-width="2" rx="8"/>

    <!-- 分压器 (三个5k电阻串联) -->
    <rect x="60" y="60" width="100" height="280" fill="#fff" stroke="#999" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
    <text x="110" y="80" text-anchor="middle" font-size="10" fill="#666">分压器</text>

    <line x1="80" y1="100" x2="140" y2="100" stroke="#333" stroke-width="2"/>
    <rect x="90" y="100" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="2"/>
    <text x="98" y="118" text-anchor="middle" font-size="8" fill="#333">5k</text>
    <line x1="80" y1="150" x2="140" y2="150" stroke="#333" stroke-width="2"/>
    <rect x="90" y="150" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="2"/>
    <text x="98" y="168" text-anchor="middle" font-size="8" fill="#333">5k</text>
    <line x1="80" y1="200" x2="140" y2="200" stroke="#333" stroke-width="2"/>
    <rect x="90" y="200" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="2"/>
    <text x="98" y="218" text-anchor="middle" font-size="8" fill="#333">5k</text>
    <line x1="80" y1="250" x2="140" y2="250" stroke="#333" stroke-width="2"/>

    <!-- 2/3 VCC 抽头 -->
    <line x1="140" y1="135" x2="180" y2="135" stroke="#333" stroke-width="2"/>
    <text x="155" y="128" text-anchor="middle" font-size="9" fill="#666">2/3 V</text>
    <text x="163" y="128" text-anchor="middle" font-size="8" fill="#666">CC</text>

    <!-- 1/3 VCC 抽头 -->
    <line x1="140" y1="185" x2="180" y2="185" stroke="#333" stroke-width="2"/>
    <text x="155" y="178" text-anchor="middle" font-size="9" fill="#666">1/3 V</text>
    <text x="163" y="178" text-anchor="middle" font-size="8" fill="#666">CC</text>

    <!-- 比较器 C1 (上) -->
    <polygon points="180,100 260,100 260,170 180,170" fill="#e8ffe8" stroke="#2a7a2a" stroke-width="2"/>
    <text x="220" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a7a2a">C1</text>
    <text x="220" y="145" text-anchor="middle" font-size="9" fill="#2a7a2a">比较器</text>
    <line x1="180" y1="115" x2="170" y2="115" stroke="#333" stroke-width="1"/>
    <text x="168" y="118" text-anchor="end" font-size="9" fill="#333">+</text>
    <line x1="180" y1="155" x2="170" y2="155" stroke="#333" stroke-width="1"/>
    <text x="168" y="158" text-anchor="end" font-size="9" fill="#333">−</text>

    <!-- 比较器 C2 (下) -->
    <polygon points="180,195 260,195 260,265 180,265" fill="#e8ffe8" stroke="#2a7a2a" stroke-width="2"/>
    <text x="220" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a7a2a">C2</text>
    <text x="220" y="240" text-anchor="middle" font-size="9" fill="#2a7a2a">比较器</text>
    <line x1="180" y1="210" x2="170" y2="210" stroke="#333" stroke-width="1"/>
    <text x="168" y="213" text-anchor="end" font-size="9" fill="#333">−</text>
    <line x1="180" y1="250" x2="170" y2="250" stroke="#333" stroke-width="1"/>
    <text x="168" y="253" text-anchor="end" font-size="9" fill="#333">+</text>

    <!-- C1输出到RS触发器 -->
    <line x1="260" y1="135" x2="310" y2="135" stroke="#333" stroke-width="2"/>
    <!-- C2输出到RS触发器 -->
    <line x1="260" y1="230" x2="310" y2="230" stroke="#333" stroke-width="2"/>

    <!-- RS触发器 -->
    <rect x="310" y="110" width="80" height="60" fill="#ffe8cc" stroke="#cc6600" stroke-width="2" rx="4"/>
    <text x="350" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc6600">RS</text>
    <text x="350" y="150" text-anchor="middle" font-size="9" fill="#cc6600">触发器</text>
    <text x="305" y="138" text-anchor="end" font-size="9" fill="#333">S</text>
    <text x="305" y="228" text-anchor="end" font-size="9" fill="#333">R</text>

    <!-- Q输出到放电晶体管 -->
    <line x1="390" y1="140" x2="430" y2="140" stroke="#333" stroke-width="2"/>
    <text x="420" y="133" text-anchor="middle" font-size="9" fill="#666">Q</text>

    <!-- 放电晶体管 T -->
    <polygon points="430,110 480,110 480,170 430,170" fill="#e8e8ff" stroke="#3333cc" stroke-width="2"/>
    <text x="455" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#3333cc">T</text>
    <text x="455" y="148" text-anchor="middle" font-size="9" fill="#3333cc">放电管</text>

    <!-- 放电管集电极 -->
    <line x1="455" y1="110" x2="455" y2="90" stroke="#333" stroke-width="2"/>
    <text x="465" y="88" font-size="10" fill="#333">D</text>
    <text x="465" y="98" font-size="9" fill="#666">ISC</text>

    <!-- 放电管发射极 -->
    <line x1="455" y1="170" x2="455" y2="190" stroke="#333" stroke-width="2"/>

    <!-- 输出缓冲器 -->
    <polygon points="430,200 480,200 480,260 430,260" fill="#ffe8e8" stroke="#cc3333" stroke-width="2"/>
    <text x="455" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc3333">BUF</text>
    <text x="455" y="240" text-anchor="middle" font-size="9" fill="#cc3333">输出缓冲</text>

    <line x1="390" y1="230" x2="430" y2="230" stroke="#333" stroke-width="2"/>
    <text x="420" y="223" text-anchor="middle" font-size="9" fill="#666">Q</text>

    <line x1="480" y1="230" x2="520" y2="230" stroke="#333" stroke-width="2"/>
    <text x="530" y="235" font-size="10" fill="#333">OUT</text>

    <!-- 引脚标注 -->
    <text x="60" y="320" font-size="10" fill="#666">引脚 5: 控制电压</text>
    <text x="60" y="335" font-size="10" fill="#666">引脚 6: 阈值 (TH)</text>
    <text x="60" y="350" font-size="10" fill="#666">引脚 2: 触发 (TR)</text>
    <text x="60" y="365" font-size="10" fill="#666">引脚 7: 放电 (DIS)</text>
    <text x="300" y="350" font-size="10" fill="#666">引脚 3: 输出 (OUT)</text>
    <text x="300" y="365" font-size="10" fill="#666">引脚 8: VCC, 引脚 1: GND</text>
  </g>
</svg>