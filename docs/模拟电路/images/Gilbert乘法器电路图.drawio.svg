<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Gilbert乘法器单元（Gilbert Cell）</text>

    <text x="50" y="60" font-size="11" fill="#666">+V</text>
    <text x="65" y="60" font-size="9" fill="#666">CC</text>

    <!-- 负载电阻 Rc1, Rc2 -->
    <rect x="120" y="60" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="128" y="80" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="134" y="80" text-anchor="middle" font-size="7" fill="#666">C1</text>
    <line x1="50" y1="75" x2="120" y2="75" stroke="#333" stroke-width="2"/>

    <rect x="280" y="60" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5" rx="2"/>
    <text x="288" y="80" text-anchor="middle" font-size="9" fill="#333">R</text>
    <text x="294" y="80" text-anchor="middle" font-size="7" fill="#666">C2</text>
    <line x1="280" y1="75" x2="350" y2="75" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="136" y1="75" x2="170" y2="75" stroke="#333" stroke-width="2"/>
    <text x="175" y="80" font-size="10" fill="#333">V</text>
    <text x="175" y="90" font-size="8" fill="#333">o+</text>

    <line x1="280" y1="75" x2="250" y2="75" stroke="#333" stroke-width="2"/>
    <text x="240" y="80" font-size="10" fill="#333">V</text>
    <text x="240" y="90" font-size="8" fill="#333">o−</text>

    <!-- 上交叉耦合对 Q3-Q6 -->
    <!-- Q3 -->
    <line x1="136" y1="90" x2="136" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="136" y1="110" x2="136" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="136,140 143,133 143,147" fill="#333"/>
    <line x1="136" y1="140" x2="116" y2="155" stroke="#333" stroke-width="1.5"/>
    <text x="146" y="125" font-size="9" font-weight="bold" fill="#333">Q3</text>

    <!-- Q4 -->
    <line x1="136" y1="90" x2="136" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="136" y1="110" x2="136" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="136,140 143,133 143,147" fill="#333"/>
    <line x1="136" y1="140" x2="156" y2="155" stroke="#333" stroke-width="1.5"/>

    <!-- Q5 -->
    <line x1="280" y1="90" x2="280" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="110" x2="280" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="280,140 273,133 273,147" fill="#333"/>
    <line x1="280" y1="140" x2="260" y2="155" stroke="#333" stroke-width="1.5"/>
    <text x="290" y="125" font-size="9" font-weight="bold" fill="#333">Q5</text>

    <!-- Q6 -->
    <line x1="280" y1="90" x2="280" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="110" x2="280" y2="140" stroke="#333" stroke-width="2"/>
    <polygon points="280,140 273,133 273,147" fill="#333"/>
    <line x1="280" y1="140" x2="300" y2="155" stroke="#333" stroke-width="1.5"/>

    <!-- Vy 输入 -->
    <line x1="136" y1="110" x2="100" y2="110" stroke="#333" stroke-width="1.5"/>
    <line x1="100" y1="110" x2="84" y2="110" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="105" font-size="9" fill="#666">V</text>
    <text x="90" y="115" font-size="7" fill="#666">y</text>

    <line x1="280" y1="110" x2="320" y2="110" stroke="#333" stroke-width="1.5"/>
    <line x1="320" y1="110" x2="350" y2="110" stroke="#333" stroke-width="1.5"/>

    <!-- 交叉连线 -->
    <line x1="156" y1="155" x2="156" y2="180" stroke="#333" stroke-width="1.5"/>
    <line x1="260" y1="155" x2="260" y2="180" stroke="#333" stroke-width="1.5"/>
    <line x1="116" y1="155" x2="116" y2="180" stroke="#333" stroke-width="1.5"/>
    <line x1="300" y1="155" x2="300" y2="180" stroke="#333" stroke-width="1.5"/>

    <line x1="116" y1="180" x2="300" y2="180" stroke="#333" stroke-width="1.5"/>

    <!-- 下差分对 Q1, Q2 -->
    <!-- Q1 -->
    <line x1="156" y1="180" x2="156" y2="210" stroke="#333" stroke-width="2"/>
    <line x1="156" y1="210" x2="156" y2="240" stroke="#333" stroke-width="2"/>
    <polygon points="156,240 163,233 163,247" fill="#333"/>
    <line x1="156" y1="240" x2="136" y2="255" stroke="#333" stroke-width="2"/>
    <text x="166" y="225" font-size="9" font-weight="bold" fill="#333">Q1</text>

    <!-- Q2 -->
    <line x1="260" y1="180" x2="260" y2="210" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="210" x2="260" y2="240" stroke="#333" stroke-width="2"/>
    <polygon points="260,240 267,233 267,247" fill="#333"/>
    <line x1="260" y1="240" x2="280" y2="255" stroke="#333" stroke-width="2"/>
    <text x="270" y="225" font-size="9" font-weight="bold" fill="#333">Q2</text>

    <!-- Vx 输入 -->
    <line x1="156" y1="210" x2="120" y2="210" stroke="#333" stroke-width="1.5"/>
    <line x1="120" y1="210" x2="100" y2="210" stroke="#333" stroke-width="1.5"/>
    <text x="106" y="205" font-size="9" fill="#666">V</text>
    <text x="106" y="215" font-size="7" fill="#666">x</text>

    <line x1="260" y1="210" x2="300" y2="210" stroke="#333" stroke-width="1.5"/>
    <line x1="300" y1="210" x2="350" y2="210" stroke="#333" stroke-width="1.5"/>

    <!-- 尾电流 -->
    <line x1="136" y1="255" x2="136" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="280" y1="255" x2="280" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="136" y1="280" x2="280" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="208" y1="280" x2="208" y2="310" stroke="#333" stroke-width="2"/>

    <!-- 尾电流源 -->
    <circle cx="208" cy="320" r="10" fill="none" stroke="#333" stroke-width="2"/>
    <text x="208" y="324" text-anchor="middle" font-size="10" fill="#333">I</text>
    <text x="208" y="334" text-anchor="middle" font-size="8" fill="#666">EE</text>

    <line x1="208" y1="330" x2="208" y2="360" stroke="#333" stroke-width="2"/>
    <line x1="208" y1="360" x2="208" y2="370" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="370" x2="226" y2="370" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="370" x2="190" y2="375" stroke="#333" stroke-width="2"/>
    <line x1="208" y1="370" x2="208" y2="375" stroke="#333" stroke-width="2"/>
    <line x1="226" y1="370" x2="226" y2="375" stroke="#333" stroke-width="2"/>

    <!-- 输出公式 -->
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">ΔI</text>
    <text x="315" y="390" text-anchor="middle" font-size="11" fill="#666">out</text>
    <text x="330" y="390" text-anchor="middle" font-size="11" fill="#666"> = I</text>
    <text x="342" y="390" text-anchor="middle" font-size="11" fill="#666">EE</text>
    <text x="354" y="390" text-anchor="middle" font-size="11" fill="#666"> · tanh(V</text>
    <text x="380" y="390" text-anchor="middle" font-size="11" fill="#666">x</text>
    <text x="386" y="390" text-anchor="middle" font-size="11" fill="#666">/2V</text>
    <text x="400" y="390" text-anchor="middle" font-size="11" fill="#666">T</text>
    <text x="406" y="390" text-anchor="middle" font-size="11" fill="#666">) · tanh(V</text>
    <text x="438" y="390" text-anchor="middle" font-size="11" fill="#666">y</text>
    <text x="444" y="390" text-anchor="middle" font-size="11" fill="#666">/2V</text>
    <text x="458" y="390" text-anchor="middle" font-size="11" fill="#666">T</text>
    <text x="464" y="390" text-anchor="middle" font-size="11" fill="#666">)</text>
  </g>
</svg>