<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">正负电荷示意图</text>
    
    <!-- 正电荷部分 - 左侧 -->
    <rect x="60" y="60" width="220" height="300" rx="10" ry="10" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
    <text x="170" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">正电荷 (+)</text>
    
    <!-- 丝绸摩擦玻璃棒 -->
    <rect x="100" y="110" width="140" height="16" rx="3" ry="3" fill="#87CEEB" stroke="#2980b9" stroke-width="1.5"/>
    <text x="170" y="140" text-anchor="middle" font-size="12" fill="#555">玻璃棒</text>
    
    <!-- 丝绸布 -->
    <path d="M 80 150 Q 90 170 80 190 Q 70 210 80 230" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M 260 150 Q 250 170 260 190 Q 270 210 260 230" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="75" y="150" width="190" height="12" rx="3" ry="3" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="1"/>
    <text x="170" y="175" text-anchor="middle" font-size="12" fill="#e74c3c">丝绸</text>
    
    <!-- 摩擦箭头 -->
    <path d="M 120 200 L 120 240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>
    <path d="M 220 240 L 220 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowUp)"/>
    <text x="170" y="225" text-anchor="middle" font-size="11" fill="#666">来回摩擦</text>
    
    <!-- 正电荷符号 -->
    <circle cx="130" cy="270" r="16" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <text x="130" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">+</text>
    <circle cx="170" cy="270" r="16" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <text x="170" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">+</text>
    <circle cx="210" cy="270" r="16" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <text x="210" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">+</text>
    
    <text x="170" y="310" text-anchor="middle" font-size="12" fill="#e74c3c">玻璃棒带正电荷</text>
    <text x="170" y="330" text-anchor="middle" font-size="11" fill="#888">（失去电子）</text>
    
    <!-- 负电荷部分 - 右侧 -->
    <rect x="320" y="60" width="220" height="300" rx="10" ry="10" fill="#f0f8ff" stroke="#3498db" stroke-width="2"/>
    <text x="430" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">负电荷 (−)</text>
    
    <!-- 毛皮摩擦橡胶棒 -->
    <rect x="360" y="110" width="140" height="16" rx="3" ry="3" fill="#2c3e50" stroke="#1a252f" stroke-width="1.5"/>
    <text x="430" y="140" text-anchor="middle" font-size="12" fill="#555">橡胶棒</text>
    
    <!-- 毛皮 -->
    <path d="M 340 150 Q 350 165 345 180 Q 355 195 340 210" fill="none" stroke="#8B4513" stroke-width="2"/>
    <path d="M 520 150 Q 510 165 515 180 Q 505 195 520 210" fill="none" stroke="#8B4513" stroke-width="2"/>
    <rect x="335" y="150" width="190" height="12" rx="3" ry="3" fill="#D2691E" opacity="0.3" stroke="#8B4513" stroke-width="1"/>
    <text x="430" y="175" text-anchor="middle" font-size="12" fill="#8B4513">毛皮</text>
    
    <!-- 摩擦箭头 -->
    <path d="M 380 200 L 380 240" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>
    <path d="M 480 240 L 480 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowUp)"/>
    <text x="430" y="225" text-anchor="middle" font-size="11" fill="#666">来回摩擦</text>
    
    <!-- 负电荷符号 -->
    <circle cx="390" cy="270" r="16" fill="#fff" stroke="#3498db" stroke-width="2"/>
    <text x="390" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">−</text>
    <circle cx="430" cy="270" r="16" fill="#fff" stroke="#3498db" stroke-width="2"/>
    <text x="430" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">−</text>
    <circle cx="470" cy="270" r="16" fill="#fff" stroke="#3498db" stroke-width="2"/>
    <text x="470" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">−</text>
    
    <text x="430" y="310" text-anchor="middle" font-size="12" fill="#3498db">橡胶棒带负电荷</text>
    <text x="430" y="330" text-anchor="middle" font-size="11" fill="#888">（得到电子）</text>
    
    <!-- 箭头定义 -->
    <defs>
      <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 5 10 L 10 0" fill="#333"/>
      </marker>
      <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 10 L 5 0 L 10 10" fill="#333"/>
      </marker>
    </defs>
  </g>
</svg>