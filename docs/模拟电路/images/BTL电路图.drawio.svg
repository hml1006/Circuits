<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">BTL 桥式功率放大电路</text>

    <!-- VCC -->
    <line x1="100" y1="60" x2="520" y2="60" stroke="#333" stroke-width="2"/>
    <text x="530" y="65" font-size="14" font-weight="bold" fill="#cc3333">+V</text>
    <text x="545" y="65" font-size="11" fill="#cc3333">CC</text>

    <!-- 左边功放 -->
    <!-- Q1 NPN -->
    <line x1="160" y1="80" x2="160" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="120" x2="160" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="120" x2="130" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="160" x2="190" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="160" x2="170" y2="150" stroke="#333" stroke-width="2"/>
    <polygon points="160,160 170,150 170,170" fill="#333"/>
    <text x="175" y="125" font-size="10" fill="#333">Q1</text>
    <line x1="100" y1="60" x2="160" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="60" x2="160" y2="80" stroke="#333" stroke-width="2"/>

    <!-- Q2 PNP -->
    <line x1="160" y1="160" x2="160" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="200" x2="160" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="200" x2="130" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="240" x2="190" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="240" x2="170" y2="250" stroke="#333" stroke-width="2"/>
    <polygon points="160,240 170,230 170,250" fill="#333"/>
    <text x="175" y="205" font-size="10" fill="#333">Q2</text>
    <line x1="160" y1="240" x2="160" y2="290" stroke="#333" stroke-width="2"/>

    <!-- 右边功放 -->
    <!-- Q3 NPN -->
    <line x1="380" y1="80" x2="380" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="120" x2="380" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="120" x2="410" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="160" x2="350" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="160" x2="370" y2="150" stroke="#333" stroke-width="2"/>
    <polygon points="380,160 370,150 370,170" fill="#333"/>
    <text x="395" y="125" font-size="10" fill="#333">Q3</text>
    <line x1="380" y1="60" x2="380" y2="80" stroke="#333" stroke-width="2"/>

    <!-- Q4 PNP -->
    <line x1="380" y1="160" x2="380" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="200" x2="380" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="200" x2="410" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="240" x2="350" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="240" x2="370" y2="250" stroke="#333" stroke-width="2"/>
    <polygon points="380,240 370,230 370,250" fill="#333"/>
    <text x="395" y="205" font-size="10" fill="#333">Q4</text>
    <line x1="380" y1="240" x2="380" y2="290" stroke="#333" stroke-width="2"/>

    <!-- 负载 RL -->
    <line x1="190" y1="160" x2="240" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="160" x2="300" y2="160" stroke="#333" stroke-width="2"/>
    <rect x="240" y="145" width="60" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="270" y="165" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="270" y="177" text-anchor="middle" font-size="9" fill="#666">L</text>

    <!-- 接地 -->
    <line x1="160" y1="290" x2="380" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="270" y1="290" x2="270" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="300" x2="280" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="265" y1="305" x2="275" y2="305" stroke="#333" stroke-width="2"/>

    <!-- 输入 -->
    <text x="80" y="155" font-size="12" fill="#333">v</text>
    <text x="90" y="155" font-size="11" fill="#666">i</text>
    <line x1="100" y1="160" x2="130" y2="160" stroke="#333" stroke-width="2"/>
    <text x="80" y="205" font-size="12" fill="#333">−v</text>
    <text x="95" y="205" font-size="11" fill="#666">i</text>
    <line x1="100" y1="200" x2="130" y2="200" stroke="#333" stroke-width="2"/>

    <!-- 标注 -->
    <text x="130" y="270" text-anchor="middle" font-size="10" fill="#666">功放A</text>
    <text x="410" y="270" text-anchor="middle" font-size="10" fill="#666">功放B</text>

    <text x="300" y="350" text-anchor="middle" font-size="11" fill="#666">P</text>
    <text x="308" y="350" text-anchor="middle" font-size="11" fill="#666">om</text>
    <text x="325" y="350" text-anchor="middle" font-size="11" fill="#666"> = V</text>
    <text x="340" y="350" text-anchor="middle" font-size="11" fill="#666">CC</text>
    <text x="355" y="350" text-anchor="middle" font-size="11" fill="#666">² / R</text>
    <text x="375" y="350" text-anchor="middle" font-size="11" fill="#666">L</text>
  </g>
</svg>