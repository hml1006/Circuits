<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">增强型MOSFET结构示意图</text>

    <!-- 衬底 -->
    <rect x="60" y="80" width="280" height="260" fill="#ddddbb" stroke="#999966" stroke-width="2" rx="3"/>
    <text x="200" y="360" text-anchor="middle" font-size="12" fill="#999966">P型衬底（Substrate）</text>

    <!-- 源区 N+ -->
    <rect x="80" y="130" width="60" height="120" fill="#ccddff" stroke="#3366cc" stroke-width="2" rx="3"/>
    <text x="110" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#3366cc">N+</text>
    <text x="110" y="215" text-anchor="middle" font-size="10" fill="#3366cc">源区</text>
    <!-- 漏区 N+ -->
    <rect x="260" y="130" width="60" height="120" fill="#ccddff" stroke="#3366cc" stroke-width="2" rx="3"/>
    <text x="290" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#3366cc">N+</text>
    <text x="290" y="215" text-anchor="middle" font-size="10" fill="#3366cc">漏区</text>

    <!-- 绝缘层 SiO2 -->
    <rect x="60" y="80" width="280" height="30" fill="#e0e0e0" stroke="#999" stroke-width="1.5" rx="2"/>
    <text x="200" y="100" text-anchor="middle" font-size="11" fill="#666">SiO₂ 绝缘层</text>

    <!-- 栅极 -->
    <rect x="140" y="60" width="120" height="20" fill="#bbbbbb" stroke="#666" stroke-width="2" rx="2"/>
    <text x="200" y="75" text-anchor="middle" font-size="11" fill="#333">栅极 (G)</text>

    <!-- 导电沟道（虚线） -->
    <line x1="140" y1="145" x2="260" y2="145" stroke="#3366cc" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="200" y="140" text-anchor="middle" font-size="9" fill="#3366cc">导电沟道（V</text>
    <text x="218" y="140" text-anchor="middle" font-size="7" fill="#3366cc">GS</text>
    <text x="230" y="140" text-anchor="middle" font-size="9" fill="#3366cc"> &gt; V</text>
    <text x="245" y="140" text-anchor="middle" font-size="7" fill="#3366cc">TH</text>
    <text x="252" y="140" text-anchor="middle" font-size="9" fill="#3366cc">)</text>

    <!-- 电极引线 -->
    <line x1="80" y1="130" x2="80" y2="50" stroke="#333" stroke-width="2"/>
    <text x="80" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">S 源极</text>
    <line x1="320" y1="130" x2="320" y2="50" stroke="#333" stroke-width="2"/>
    <text x="320" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">D 漏极</text>

    <!-- 衬底引线 -->
    <line x1="200" y1="330" x2="200" y2="380" stroke="#333" stroke-width="2"/>
    <text x="200" y="395" text-anchor="middle" font-size="11" fill="#333">B 衬底</text>

    <!-- 电路符号 -->
    <text x="420" y="100" font-size="14" font-weight="bold" fill="#222">电路符号：</text>
    <line x1="440" y1="130" x2="440" y2="220" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="130" x2="470" y2="130" stroke="#333" stroke-width="2"/>
    <text x="475" y="135" font-size="12" font-weight="bold" fill="#333">D</text>
    <line x1="440" y1="220" x2="470" y2="220" stroke="#333" stroke-width="2"/>
    <text x="475" y="225" font-size="12" font-weight="bold" fill="#333">S</text>
    <!-- 栅极 -->
    <line x1="420" y1="175" x2="440" y2="175" stroke="#333" stroke-width="2"/>
    <text x="415" y="180" text-anchor="end" font-size="12" font-weight="bold" fill="#333">G</text>
    <!-- 箭头 -->
    <line x1="440" y1="220" x2="440" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="430" y1="240" x2="450" y2="240" stroke="#333" stroke-width="2"/>
    <polygon points="440,240 445,235 445,245" fill="#333"/>
    <text x="455" y="245" font-size="10" fill="#666">N沟道</text>
  </g>
</svg>