<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">差动放大电路</text>

    <!-- VCC -->
    <line x1="100" y1="60" x2="520" y2="60" stroke="#333" stroke-width="2"/>
    <text x="530" y="65" font-size="14" font-weight="bold" fill="#cc3333">+V</text>
    <text x="545" y="65" font-size="11" fill="#cc3333">CC</text>

    <!-- RC1 -->
    <rect x="140" y="80" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="140" y="60" width="16" height="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="136" y="60" width="24" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="148" y="95" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="148" y="107" text-anchor="middle" font-size="9" fill="#666">C1</text>
    <line x1="148" y1="60" x2="140" y2="60" stroke="#333" stroke-width="2"/>

    <!-- RC2 -->
    <rect x="340" y="80" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="340" y="60" width="16" height="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="336" y="60" width="24" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="348" y="95" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="348" y="107" text-anchor="middle" font-size="9" fill="#666">C2</text>
    <line x1="348" y1="60" x2="340" y2="60" stroke="#333" stroke-width="2"/>

    <!-- Q1 -->
    <line x1="148" y1="120" x2="148" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="148" y1="140" x2="148" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="148" y1="140" x2="130" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="148" y1="190" x2="170" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="148" y1="190" x2="156" y2="182" stroke="#333" stroke-width="2"/>
    <polygon points="148,190 156,182 156,198" fill="#333"/>
    <text x="158" y="145" font-size="11" font-weight="bold" fill="#333">Q1</text>
    <text x="173" y="195" font-size="10" fill="#666">E</text>
    <text x="128" y="138" text-anchor="end" font-size="10" fill="#666">B</text>

    <!-- Q2 -->
    <line x1="348" y1="120" x2="348" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="140" x2="348" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="140" x2="330" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="190" x2="370" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="190" x2="356" y2="182" stroke="#333" stroke-width="2"/>
    <polygon points="348,190 356,182 356,198" fill="#333"/>
    <text x="358" y="145" font-size="11" font-weight="bold" fill="#333">Q2</text>
    <text x="373" y="195" font-size="10" fill="#666">E</text>
    <text x="328" y="138" text-anchor="end" font-size="10" fill="#666">B</text>

    <!-- RE -->
    <rect x="228" y="210" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="228" y="190" width="16" height="20" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    <rect x="224" y="190" width="24" height="60" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="236" y="225" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="236" y="237" text-anchor="middle" font-size="9" fill="#666">E</text>

    <line x1="148" y1="190" x2="148" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="148" y1="200" x2="236" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="190" x2="348" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="348" y1="200" x2="236" y2="200" stroke="#333" stroke-width="2"/>

    <!-- VEE -->
    <line x1="236" y1="250" x2="236" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="300" x2="380" y2="300" stroke="#333" stroke-width="2"/>
    <text x="90" y="305" font-size="14" font-weight="bold" fill="#3366cc">−V</text>
    <text x="105" y="305" font-size="11" fill="#3366cc">EE</text>

    <!-- 输入 -->
    <text x="90" y="185" font-size="12" fill="#333">v</text>
    <text x="100" y="185" font-size="11" fill="#666">i1</text>
    <line x1="110" y1="180" x2="128" y2="180" stroke="#333" stroke-width="2"/>
    <rect x="110" y="165" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="117" y="185" text-anchor="middle" font-size="10" fill="#333">C</text>

    <text x="90" y="145" font-size="12" fill="#333">v</text>
    <text x="100" y="145" font-size="11" fill="#666">i2</text>
    <line x1="110" y1="140" x2="128" y2="140" stroke="#333" stroke-width="2"/>
    <rect x="110" y="125" width="14" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="117" y="145" text-anchor="middle" font-size="10" fill="#333">C</text>

    <!-- 输出 -->
    <line x1="148" y1="80" x2="200" y2="80" stroke="#333" stroke-width="2"/>
    <text x="210" y="85" font-size="12" fill="#333">v</text>
    <text x="220" y="85" font-size="11" fill="#666">o1</text>

    <line x1="348" y1="80" x2="400" y2="80" stroke="#333" stroke-width="2"/>
    <text x="410" y="85" font-size="12" fill="#333">v</text>
    <text x="420" y="85" font-size="11" fill="#666">o2</text>
  </g>
</svg>