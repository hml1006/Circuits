    <text x="335" y="290" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="395" y="250" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="435" y="275" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="435" y="290" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <!-- BRAM -->
    <rect x="495" y="90" width="35" height="140" rx="3" fill="#d5f5e3" stroke="#000" stroke-width="1.5"/>
    <text x="512" y="160" text-anchor="middle" font-size="7" font-weight="bold" fill="#000" transform="rotate(-90,512,160)">BRAM</text>
