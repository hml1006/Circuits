    <text x="435" y="130" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="95" y="170" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="135" y="195" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="135" y="210" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="195" y="170" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="235" y="195" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="235" y="210" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="295" y="170" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="335" y="195" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="335" y="210" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
    <rect x="395" y="170" width="80" height="60" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="435" y="195" text-anchor="middle" font-size="9" fill="#000">CLB</text>
    <text x="435" y="210" text-anchor="middle" font-size="8" fill="#555">LUT+FF</text>
