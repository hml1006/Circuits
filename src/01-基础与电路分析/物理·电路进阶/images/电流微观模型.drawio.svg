<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">电流微观模型示意图</text>
    
    <!-- 导体主体（圆柱体） -->
    <rect x="100" y="100" width="400" height="180" rx="20" ry="20" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    
    <!-- 导体横截面标注 -->
    <text x="300" y="95" text-anchor="middle" font-size="14" fill="#4682b4">导体</text>
    
    <!-- 横截面 S 标注 -->
    <line x1="500" y1="100" x2="500" y2="280" stroke="#ff6347" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="500" y1="100" x2="530" y2="100" stroke="#ff6347" stroke-width="1.5"/>
    <line x1="500" y1="280" x2="530" y2="280" stroke="#ff6347" stroke-width="1.5"/>
    <text x="540" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#ff6347" transform="rotate(90,540,198)">S</text>
    
    <!-- 自由电子（带电粒子） -->
    <circle cx="150" cy="150" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="150" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <circle cx="200" cy="200" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="200" y="204" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <circle cx="250" cy="160" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="250" y="164" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <circle cx="300" cy="220" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="300" y="224" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <circle cx="350" cy="150" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="350" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <circle cx="400" cy="200" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="400" y="204" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <circle cx="450" cy="170" r="8" fill="#ff4500" opacity="0.8"/>
    <text x="450" y="174" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">e</text>
    
    <!-- 速度箭头 -->
    <line x1="80" y1="190" x2="60" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowLeft)"/>
    <line x1="520" y1="190" x2="540" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowRight)"/>
    
    <defs>
      <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#333"/>
      </marker>
      <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
        <polygon points="8 0, 0 3, 8 6" fill="#333"/>
      </marker>
    </defs>
    
    <!-- 运动方向标注 -->
    <text x="45" y="210" text-anchor="end" font-size="13" fill="#333" font-style="italic">v</text>
    <text x="555" y="210" text-anchor="start" font-size="13" fill="#333" font-style="italic">v</text>
    
    <!-- 公式标注 -->
    <text x="300" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">I = neSv</text>
    
    <!-- 参数说明 -->
    <text x="160" y="370" text-anchor="middle" font-size="12" fill="#666">n: 载流子浓度</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">e: 电荷量</text>
    <text x="440" y="370" text-anchor="middle" font-size="12" fill="#666">v: 定向移动速率</text>
  </g>
</svg>