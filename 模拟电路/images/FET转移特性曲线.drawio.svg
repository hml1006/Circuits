<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">FET转移特性曲线</text>

    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arV)"/>
    <text x="565" y="355" font-size="14" fill="#333" font-style="italic">V</text>
    <text x="555" y="365" font-size="11" fill="#333">GS</text>
    <line x1="60" y1="350" x2="60" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arI)"/>
    <text x="30" y="30" font-size="14" fill="#333" font-style="italic">I</text>
    <text x="22" y="45" font-size="11" fill="#333">D</text>
    <defs>
      <marker id="arV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
      <marker id="arI" markerWidth="8" markerHeight="6" refX="3" refY="0" orient="auto"><polygon points="0 6, 3 0, 6 6" fill="#333"/></marker>
    </defs>
    <text x="55" y="365" font-size="11" fill="#666">O</text>

    <!-- 增强型曲线 -->
    <path d="M 300 350 Q 320 350 340 345 Q 360 335 380 310 Q 400 270 420 220 Q 440 160 460 90" fill="none" stroke="#3366cc" stroke-width="2.5"/>
    <text x="465" y="85" font-size="11" fill="#3366cc">增强型</text>
    <text x="465" y="98" font-size="9" fill="#3366cc">(V</text>
    <text x="475" y="98" font-size="9" fill="#3366cc">GS</text>
    <text x="485" y="98" font-size="9" fill="#3366cc"> &gt; V</text>
    <text x="500" y="98" font-size="9" fill="#3366cc">TH</text>
    <text x="508" y="98" font-size="9" fill="#3366cc">)</text>

    <!-- 阈值电压标注 -->
    <line x1="300" y1="355" x2="300" y2="370" stroke="#999" stroke-width="1"/>
    <line x1="360" y1="355" x2="360" y2="370" stroke="#999" stroke-width="1"/>
    <text x="330" y="382" text-anchor="middle" font-size="10" fill="#666">V</text>
    <text x="338" y="382" text-anchor="middle" font-size="10" fill="#666">TH</text>

    <!-- 耗尽型/JFET曲线 -->
    <path d="M 60 350 Q 100 350 140 340 Q 180 320 220 280 Q 260 230 300 170 Q 340 100 380 40" fill="none" stroke="#cc3333" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="385" y="35" font-size="11" fill="#cc3333">耗尽型/JFET</text>
    <text x="385" y="48" font-size="9" fill="#cc3333">(V</text>
    <text x="395" y="48" font-size="9" fill="#cc3333">GS</text>
    <text x="405" y="48" font-size="9" fill="#cc3333"> &gt; V</text>
    <text x="420" y="48" font-size="9" fill="#cc3333">P</text>
    <text x="428" y="48" font-size="9" fill="#cc3333">)</text>

    <!-- 夹断电压标注 -->
    <line x1="140" y1="355" x2="140" y2="370" stroke="#999" stroke-width="1"/>
    <text x="140" y="382" text-anchor="middle" font-size="10" fill="#666">V</text>
    <text x="148" y="382" text-anchor="middle" font-size="10" fill="#666">P</text>

    <!-- IDSS标注 -->
    <line x1="55" y1="340" x2="40" y2="340" stroke="#999" stroke-width="1"/>
    <line x1="55" y1="260" x2="40" y2="260" stroke="#999" stroke-width="1"/>
    <text x="35" y="300" text-anchor="end" font-size="10" fill="#666">I</text>
    <text x="42" y="300" text-anchor="end" font-size="10" fill="#666">DSS</text>

    <!-- 平方律关系标注 -->
    <text x="300" y="320" text-anchor="middle" font-size="11" fill="#666">I</text>
    <text x="305" y="320" text-anchor="middle" font-size="11" fill="#666">D</text>
    <text x="315" y="320" text-anchor="middle" font-size="11" fill="#666"> = K</text>
    <text x="330" y="320" text-anchor="middle" font-size="11" fill="#666">n</text>
    <text x="338" y="320" text-anchor="middle" font-size="11" fill="#666">(V</text>
    <text x="350" y="320" text-anchor="middle" font-size="11" fill="#666">GS</text>
    <text x="362" y="320" text-anchor="middle" font-size="11" fill="#666"> - V</text>
    <text x="375" y="320" text-anchor="middle" font-size="11" fill="#666">TH</text>
    <text x="385" y="320" text-anchor="middle" font-size="11" fill="#666">)</text>
    <text x="392" y="320" text-anchor="middle" font-size="10" fill="#666">²</text>
  </g>
</svg>