<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">6管 SRAM 存储单元</text>
    <!-- VDD -->
    <text x="300" y="55" text-anchor="middle" font-size="12" fill="#000">VDD</text>
    <line x1="300" y1="58" x2="300" y2="70" stroke="#000" stroke-width="1.5"/>
    <circle cx="300" cy="72" r="3" fill="#000"/>
    <!-- 负载 PMOS T1 -->
    <rect x="260" y="75" width="40" height="40" rx="3" fill="#e8f8e8" stroke="#000" stroke-width="1.5"/>
    <circle cx="255" cy="85" r="2.5" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="280" y="98" text-anchor="middle" font-size="9" fill="#000">T1</text>
    <line x1="280" y1="72" x2="280" y2="75" stroke="#000" stroke-width="1.5"/>
    <!-- 负载 PMOS T2 -->
    <rect x="360" y="75" width="40" height="40" rx="3" fill="#e8f8e8" stroke="#000" stroke-width="1.5"/>
    <circle cx="355" cy="85" r="2.5" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="380" y="98" text-anchor="middle" font-size="9" fill="#000">T2</text>
    <line x1="380" y1="72" x2="380" y2="75" stroke="#000" stroke-width="1.5"/>
    <!-- 驱动 NMOS T3 -->
    <rect x="260" y="130" width="40" height="40" rx="3" fill="#ffe8e8" stroke="#000" stroke-width="1.5"/>
    <text x="280" y="153" text-anchor="middle" font-size="9" fill="#000">T3</text>
    <line x1="280" y1="115" x2="280" y2="130" stroke="#000" stroke-width="1.5"/>
    <!-- 驱动 NMOS T4 -->
    <rect x="360" y="130" width="40" height="40" rx="3" fill="#ffe8e8" stroke="#000" stroke-width="1.5"/>
    <text x="380" y="153" text-anchor="middle" font-size="9" fill="#000">T4</text>
    <line x1="380" y1="115" x2="380" y2="130" stroke="#000" stroke-width="1.5"/>
    <!-- 交叉耦合 -->
    <line x1="300" y1="115" x2="300" y2="120" stroke="#000" stroke-width="1.5"/>
    <line x1="300" y1="120" x2="360" y2="120" stroke="#000" stroke-width="1.5"/>
    <line x1="360" y1="120" x2="360" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="380" y1="115" x2="380" y2="122" stroke="#000" stroke-width="1.5"/>
    <line x1="380" y1="122" x2="300" y2="122" stroke="#000" stroke-width="1.5"/>
    <line x1="300" y1="122" x2="300" y2="130" stroke="#000" stroke-width="1.5"/>
    <!-- 栅极连接 -->
    <line x1="260" y1="85" x2="240" y2="85" stroke="#000" stroke-width="1.5"/>
    <line x1="240" y1="85" x2="240" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="240" y1="150" x2="260" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="400" y1="85" x2="420" y2="85" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="85" x2="420" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="420" y1="150" x2="400" y2="150" stroke="#000" stroke-width="1.5"/>
    <!-- 字线控制管 T5 -->
    <rect x="230" y="175" width="30" height="35" rx="3" fill="#ffe8e8" stroke="#000" stroke-width="1.5"/>
    <text x="245" y="196" text-anchor="middle" font-size="8" fill="#000">T5</text>
    <line x1="260" y1="170" x2="260" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="245" y1="175" x2="225" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="225" y1="175" x2="225" y2="210" stroke="#000" stroke-width="1.5"/>
    <line x1="245" y1="210" x2="245" y2="220" stroke="#000" stroke-width="1.5"/>
    <!-- 字线控制管 T6 -->
    <rect x="400" y="175" width="30" height="35" rx="3" fill="#ffe8e8" stroke="#000" stroke-width="1.5"/>
    <text x="415" y="196" text-anchor="middle" font-size="8" fill="#000">T6</text>
    <line x1="400" y1="170" x2="400" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="415" y1="175" x2="435" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="435" y1="175" x2="435" y2="210" stroke="#000" stroke-width="1.5"/>
    <line x1="415" y1="210" x2="415" y2="220" stroke="#000" stroke-width="1.5"/>
    <!-- 字线 -->
    <line x1="225" y1="175" x2="435" y2="175" stroke="#000" stroke-width="2"/>
    <text x="330" y="170" text-anchor="middle" font-size="11" fill="#000">字线 (Word Line)</text>
    <!-- 位线 -->
    <line x1="225" y1="210" x2="225" y2="260" stroke="#000" stroke-width="1.5"/>
    <text x="220" y="275" text-anchor="end" font-size="11" fill="#000">位线 (BL)</text>
    <line x1="435" y1="210" x2="435" y2="260" stroke="#000" stroke-width="1.5"/>
    <text x="440" y="275" text-anchor="start" font-size="11" fill="#000">位线 (BL̄)</text>
    <!-- GND -->
    <line x1="280" y1="170" x2="280" y2="290" stroke="#000" stroke-width="1.5"/>
    <line x1="380" y1="170" x2="380" y2="290" stroke="#000" stroke-width="1.5"/>
    <!-- 说明 -->
    <rect x="30" y="300" width="540" height="85" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">SRAM 存储单元说明</text>
    <text x="50" y="340" text-anchor="start" font-size="11" fill="#000">• T1-T4 构成交叉耦合锁存器，存储 1 位数据</text>
    <text x="50" y="358" text-anchor="start" font-size="11" fill="#000">• T5-T6 是字线控制管，用于读写控制</text>
    <text x="50" y="376" text-anchor="start" font-size="11" fill="#000">• 速度快但集成度低（6管/单元），常用于 Cache</text>
  </g>
</svg>