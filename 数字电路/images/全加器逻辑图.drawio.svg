<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">全加器逻辑图</text>
    <!-- 输入 -->
    <text x="60" y="80" text-anchor="end" font-size="13" font-weight="bold" fill="#000">A</text>
    <text x="60" y="130" text-anchor="end" font-size="13" font-weight="bold" fill="#000">B</text>
    <text x="60" y="180" text-anchor="end" font-size="13" font-weight="bold" fill="#000">Cᵢ₋₁</text>
    <line x1="70" y1="75" x2="110" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="70" y1="125" x2="110" y2="125" stroke="#000" stroke-width="1.5"/>
    <line x1="70" y1="175" x2="110" y2="175" stroke="#000" stroke-width="1.5"/>
    <!-- 第一个异或门 - XOR1 -->
    <path d="M140 55 L140 95 L160 75 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M140 45 Q170 75 140 105" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M140 45 Q130 75 140 105" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M125 45 Q120 55 125 65 Q120 75 125 85 Q120 95 125 105" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="125" y1="55" x2="140" y2="55" stroke="#000" stroke-width="1.5"/>
    <line x1="125" y1="95" x2="140" y2="95" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="75" x2="125" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="125" x2="125" y2="125" stroke="#000" stroke-width="1.5"/>
    <line x1="160" y1="75" x2="200" y2="75" stroke="#000" stroke-width="1.5"/>
    <text x="180" y="70" text-anchor="middle" font-size="10" fill="#000">XOR1</text>
    <!-- 第二个异或门 - XOR2 -->
    <path d="M230 55 L230 95 L250 75 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M230 45 Q260 75 230 105" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M230 45 Q220 75 230 105" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M215 45 Q210 55 215 65 Q210 75 215 85 Q210 95 215 105" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="215" y1="55" x2="230" y2="55" stroke="#000" stroke-width="1.5"/>
    <line x1="215" y1="95" x2="230" y2="95" stroke="#000" stroke-width="1.5"/>
    <line x1="200" y1="75" x2="215" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="175" y1="175" x2="215" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="250" y1="75" x2="290" y2="75" stroke="#000" stroke-width="1.5"/>
    <text x="270" y="70" text-anchor="middle" font-size="10" fill="#000">XOR2</text>
    <!-- 输出 S -->
    <line x1="290" y1="75" x2="340" y2="75" stroke="#000" stroke-width="2"/>
    <text x="350" y="79" text-anchor="start" font-size="13" font-weight="bold" fill="#000">S = A⊕B⊕Cᵢ₋₁</text>
    <!-- 第一个与门 - AND1 -->
    <rect x="200" y="115" width="40" height="30" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <path d="M240 115 Q255 130 240 145" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="75" x2="170" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="75" x2="170" y2="125" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="125" x2="200" y2="125" stroke="#000" stroke-width="1.5"/>
    <line x1="110" y1="125" x2="170" y2="125" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="125" x2="170" y2="135" stroke="#000" stroke-width="1.5"/>
    <line x1="170" y1="135" x2="200" y2="135" stroke="#000" stroke-width="1.5"/>
    <!-- 第二个与门 - AND2 -->
    <rect x="200" y="155" width="40" height="30" rx="3" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <path d="M240 155 Q255 170 240 185" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="200" y1="75" x2="185" y2="75" stroke="#000" stroke-width="1.5"/>
    <line x1="185" y1="75" x2="185" y2="165" stroke="#000" stroke-width="1.5"/>
    <line x1="185" y1="165" x2="200" y2="165" stroke="#000" stroke-width="1.5"/>
    <line x1="175" y1="175" x2="185" y2="175" stroke="#000" stroke-width="1.5"/>
    <line x1="185" y1="175" x2="200" y2="175" stroke="#000" stroke-width="1.5"/>
    <!-- 或门 - OR -->
    <path d="M290 140 L290 165 L310 152 Z" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M290 130 Q315 152 290 175" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M290 130 Q280 152 290 175" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="240" y1="130" x2="290" y2="130" stroke="#000" stroke-width="1.5"/>
    <line x1="240" y1="170" x2="290" y2="170" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="152" x2="340" y2="152" stroke="#000" stroke-width="2"/>
    <text x="350" y="156" text-anchor="start" font-size="13" font-weight="bold" fill="#000">Cᵢ = AB + (A⊕B)Cᵢ₋₁</text>
    <!-- 全加器符号 -->
    <rect x="50" y="230" width="500" height="80" rx="6" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">全加器符号</text>
    <text x="300" y="272" text-anchor="middle" font-size="12" fill="#000">S = A ⊕ B ⊕ Cᵢ₋₁</text>
    <text x="300" y="292" text-anchor="middle" font-size="12" fill="#000">Cᵢ = AB + (A⊕B)·Cᵢ₋₁ = AB + ACᵢ₋₁ + BCᵢ₋₁</text>
    <!-- 说明 -->
    <text x="300" y="340" text-anchor="middle" font-size="12" fill="#555">全加器由两个半加器和一个或门组成</text>
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#555">可实现带进位输入的 1 位二进制加法</text>
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#555">多个全加器级联可实现多位二进制加法器</text>
  </g>
</svg>