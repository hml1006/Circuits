<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">D 触发器波形图</text>
    <!-- 触发器符号 -->
    <rect x="30" y="40" width="120" height="70" rx="4" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="90" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">D FF</text>
    <text x="90" y="85" text-anchor="middle" font-size="11" fill="#000">上升沿触发</text>
    <text x="90" y="100" text-anchor="middle" font-size="10" fill="#555">Qₙ₊₁ = D</text>
    <line x1="10" y1="55" x2="30" y2="55" stroke="#000" stroke-width="1.5"/>
    <text x="5" y="59" text-anchor="end" font-size="11" fill="#000">D</text>
    <line x1="10" y1="75" x2="30" y2="75" stroke="#000" stroke-width="1.5"/>
    <text x="5" y="79" text-anchor="end" font-size="11" fill="#000">CP</text>
    <line x1="150" y1="55" x2="180" y2="55" stroke="#000" stroke-width="1.5"/>
    <text x="185" y="59" text-anchor="start" font-size="11" fill="#000">Q</text>
    <line x1="150" y1="75" x2="180" y2="75" stroke="#000" stroke-width="1.5"/>
    <text x="185" y="79" text-anchor="start" font-size="11" fill="#000">Q̄</text>
    <!-- 波形图区域 -->
    <rect x="30" y="130" width="540" height="255" rx="4" fill="#fafafa" stroke="#555" stroke-width="1" stroke-dasharray="3"/>
    <text x="300" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">时序波形图</text>
    <!-- 时间轴 -->
    <line x1="50" y1="158" x2="560" y2="158" stroke="#000" stroke-width="1"/>
    <text x="45" y="162" text-anchor="end" font-size="11" fill="#000">t</text>
    <!-- CP 时钟 -->
    <text x="40" y="188" text-anchor="end" font-size="12" font-weight="bold" fill="#000">CP</text>
    <line x1="50" y1="183" x2="80" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="183" x2="80" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="170" x2="110" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="170" x2="110" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="183" x2="140" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="183" x2="140" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="170" x2="170" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="170" y1="170" x2="170" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="170" y1="183" x2="200" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="183" x2="200" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="170" x2="230" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="230" y1="170" x2="230" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="230" y1="183" x2="260" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="183" x2="260" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="170" x2="290" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="170" x2="290" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="183" x2="320" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="183" x2="320" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="170" x2="350" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="350" y1="170" x2="350" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="350" y1="183" x2="380" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="183" x2="380" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="170" x2="410" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="170" x2="410" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="410" y1="183" x2="440" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="183" x2="440" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="170" x2="470" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="170" x2="470" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="183" x2="500" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="183" x2="500" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="170" x2="530" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="530" y1="170" x2="530" y2="183" stroke="#000" stroke-width="2"/>
    <line x1="530" y1="183" x2="560" y2="183" stroke="#000" stroke-width="2"/>
    <!-- 上升沿标注 -->
    <line x1="80" y1="162" x2="80" y2="193" stroke="#f00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="170" y1="162" x2="170" y2="193" stroke="#f00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="260" y1="162" x2="260" y2="193" stroke="#f00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="350" y1="162" x2="350" y2="193" stroke="#f00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="440" y1="162" x2="440" y2="193" stroke="#f00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="530" y1="162" x2="530" y2="193" stroke="#f00" stroke-width="0.5" stroke-dasharray="2"/>
    <!-- D -->
    <text x="40" y="220" text-anchor="end" font-size="12" font-weight="bold" fill="#000">D</text>
    <line x1="50" y1="215" x2="110" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="215" x2="110" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="110" y1="200" x2="200" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="200" x2="200" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="215" x2="290" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="215" x2="290" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="200" x2="380" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="200" x2="380" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="380" y1="215" x2="470" y2="215" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="215" x2="470" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="470" y1="200" x2="560" y2="200" stroke="#000" stroke-width="2"/>
    <!-- Q -->
    <text x="40" y="255" text-anchor="end" font-size="12" font-weight="bold" fill="#00a">Q</text>
    <line x1="50" y1="250" x2="80" y2="250" stroke="#00a" stroke-width="2"/>
    <line x1="80" y1="250" x2="80" y2="235" stroke="#00a" stroke-width="2"/>
    <line x1="80" y1="235" x2="170" y2="235" stroke="#00a" stroke-width="2"/>
    <line x1="170" y1="235" x2="170" y2="250" stroke="#00a" stroke-width="2"/>
    <line x1="170" y1="250" x2="260" y2="250" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="250" x2="260" y2="235" stroke="#00a" stroke-width="2"/>
    <line x1="260" y1="235" x2="350" y2="235" stroke="#00a" stroke-width="2"/>
    <line x1="350" y1="235" x2="350" y2="250" stroke="#00a" stroke-width="2"/>
    <line x1="350" y1="250" x2="440" y2="250" stroke="#00a" stroke-width="2"/>
    <line x1="440" y1="250" x2="440" y2="235" stroke="#00a" stroke-width="2"/>
    <line x1="440" y1="235" x2="530" y2="235" stroke="#00a" stroke-width="2"/>
    <line x1="530" y1="235" x2="530" y2="250" stroke="#00a" stroke-width="2"/>
    <line x1="530" y1="250" x2="560" y2="250" stroke="#00a" stroke-width="2"/>
    <!-- 说明 -->
    <rect x="30" y="280" width="540" height="90" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">D 触发器特性</text>
    <text x="50" y="320" text-anchor="start" font-size="12" fill="#000">• Qₙ₊₁ = D，在 CP 上升沿将 D 输入锁存到输出</text>
    <text x="50" y="340" text-anchor="start" font-size="12" fill="#000">• D=0 → Q=0；D=1 → Q=1</text>
    <text x="50" y="360" text-anchor="start" font-size="12" fill="#000">• 常用于数据寄存、移位寄存器、分频电路</text>
  </g>
</svg>