<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">节点分析法示例图</text>
    <!-- 电路：3个节点，R1、R2、R3、R4组成，含电流源 -->
    <!-- 节点1（左上） -->
    <circle cx="150" cy="100" r="5" fill="#1976d2" stroke="#000" stroke-width="2"/>
    <text x="130" y="90" font-size="14" fill="#1976d2">节点1</text>
    <text x="130" y="105" font-size="12" fill="#666">u₁</text>
    <!-- 节点2（右上） -->
    <circle cx="450" cy="100" r="5" fill="#1976d2" stroke="#000" stroke-width="2"/>
    <text x="455" y="90" font-size="14" fill="#1976d2">节点2</text>
    <text x="455" y="105" font-size="12" fill="#666">u₂</text>
    <!-- 参考节点（底部） -->
    <circle cx="300" cy="300" r="5" fill="#333" stroke="#000" stroke-width="2"/>
    <text x="310" y="315" font-size="14" fill="#333">参考节点</text>
    <text x="310" y="330" font-size="12" fill="#666">(u₃ = 0)</text>
    <!-- 地线符号 -->
    <line x1="300" y1="305" x2="300" y2="320" stroke="#000" stroke-width="2"/>
    <line x1="290" y1="320" x2="310" y2="320" stroke="#000" stroke-width="2"/>
    <line x1="295" y1="326" x2="305" y2="326" stroke="#000" stroke-width="2"/>
    <line x1="298" y1="332" x2="302" y2="332" stroke="#000" stroke-width="2"/>

    <!-- R1: 节点1到节点2 -->
    <line x1="150" y1="100" x2="200" y2="100" stroke="#000" stroke-width="2"/>
    <rect x="200" y="90" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="230" y1="100" x2="280" y2="100" stroke="#000" stroke-width="2"/>
    <rect x="280" y="90" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="310" y1="100" x2="360" y2="100" stroke="#000" stroke-width="2"/>
    <rect x="360" y="90" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="390" y1="100" x2="450" y2="100" stroke="#000" stroke-width="2"/>
    <text x="300" y="80" text-anchor="middle" font-size="14" fill="#333">R₁ R₂ R₃</text>

    <!-- R4: 节点2到参考节点 -->
    <line x1="450" y1="100" x2="450" y2="150" stroke="#000" stroke-width="2"/>
    <rect x="435" y="150" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="450" y1="190" x2="450" y2="240" stroke="#000" stroke-width="2"/>
    <rect x="435" y="240" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="450" y1="280" x2="450" y2="300" stroke="#000" stroke-width="2"/>
    <text x="470" y="220" font-size="14" fill="#333">R₄</text>
    <text x="470" y="260" font-size="14" fill="#333">R₅</text>

    <!-- 电流源：节点1到参考节点 -->
    <line x1="150" y1="100" x2="150" y2="150" stroke="#000" stroke-width="2"/>
    <circle cx="150" cy="180" r="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="170" x2="150" y2="180" stroke="#000" stroke-width="2"/>
    <polygon points="150,180 146,188 154,188" fill="#000"/>
    <line x1="150" y1="200" x2="150" y2="240" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="240" x2="250" y2="300" stroke="#000" stroke-width="2"/>
    <text x="110" y="185" font-size="14" fill="#d32f2f">I₁</text>

    <!-- 电流源箭头 -->
    <polygon points="150,195 146,188 154,188" fill="#000"/>

    <!-- 节点方程 -->
    <text x="300" y="370" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">节点方程: (G₁+G₂+G₃+G₄)u₁ - G₄u₂ = I₁</text>
    <text x="300" y="390" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">-G₄u₁ + (G₄+G₅)u₂ = 0</text>
  </g>
</svg>