<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">基本 RS 触发器逻辑图</text>
    <!-- 与非门 G1 -->
    <rect x="180" y="70" width="70" height="60" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
    <path d="M250 70 Q280 100 250 130" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="283" cy="100" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="215" y="108" text-anchor="middle" font-size="13" fill="#000">&amp;</text>
    <text x="215" y="140" text-anchor="middle" font-size="11" fill="#000">G1</text>
    <!-- 输入到 G1 -->
    <line x1="130" y1="80" x2="180" y2="80" stroke="#000" stroke-width="1.5"/>
    <text x="120" y="84" text-anchor="end" font-size="13" font-weight="bold" fill="#000">S</text>
    <!-- 上方圆圈 -->
    <circle cx="133" cy="80" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <!-- G1 另一输入 -->
    <line x1="180" y1="120" x2="130" y2="120" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="120" x2="130" y2="260" stroke="#000" stroke-width="1.5"/>
    <!-- 与非门 G2 -->
    <rect x="180" y="210" width="70" height="60" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
    <path d="M250 210 Q280 240 250 270" fill="none" stroke="#000" stroke-width="2"/>
    <circle cx="283" cy="240" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="215" y="248" text-anchor="middle" font-size="13" fill="#000">&amp;</text>
    <text x="215" y="280" text-anchor="middle" font-size="11" fill="#000">G2</text>
    <!-- 输入到 G2 -->
    <line x1="130" y1="260" x2="180" y2="260" stroke="#000" stroke-width="1.5"/>
    <text x="120" y="264" text-anchor="end" font-size="13" font-weight="bold" fill="#000">R</text>
    <!-- 上方圆圈 -->
    <circle cx="133" cy="260" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <!-- G2 另一输入 -->
    <line x1="180" y1="220" x2="130" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="130" y1="220" x2="130" y2="120" stroke="#000" stroke-width="1.5"/>
    <!-- 交叉耦合 -->
    <line x1="250" y1="100" x2="310" y2="100" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="100" x2="310" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="220" x2="250" y2="220" stroke="#000" stroke-width="1.5"/>
    <line x1="250" y1="240" x2="310" y2="240" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="240" x2="310" y2="120" stroke="#000" stroke-width="1.5"/>
    <line x1="310" y1="120" x2="250" y2="120" stroke="#000" stroke-width="1.5"/>
    <!-- 输出 Q -->
    <line x1="288" y1="100" x2="360" y2="100" stroke="#000" stroke-width="2"/>
    <circle cx="291" cy="100" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="370" y="104" text-anchor="start" font-size="14" font-weight="bold" fill="#000">Q</text>
    <!-- 输出 Q̄ -->
    <line x1="288" y1="240" x2="360" y2="240" stroke="#000" stroke-width="2"/>
    <circle cx="291" cy="240" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="370" y="244" text-anchor="start" font-size="14" font-weight="bold" fill="#000">Q</text>
    <!-- 上划线 -->
    <line x1="373" y1="234" x2="386" y2="234" stroke="#000" stroke-width="1.5"/>
    <!-- 特性表 -->
    <rect x="30" y="310" width="540" height="75" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">特性表（与非门构成）</text>
    <line x1="60" y1="338" x2="540" y2="338" stroke="#000" stroke-width="1"/>
    <text x="120" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">R</text>
    <text x="220" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">S</text>
    <text x="320" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">Q</text>
    <text x="420" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">Q</text>
    <text x="510" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#000">功能</text>
    <line x1="170" y1="338" x2="170" y2="385" stroke="#000" stroke-width="1"/>
    <line x1="270" y1="338" x2="270" y2="385" stroke="#000" stroke-width="1"/>
    <line x1="370" y1="338" x2="370" y2="385" stroke="#000" stroke-width="1"/>
    <line x1="460" y1="338" x2="460" y2="385" stroke="#000" stroke-width="1"/>
    <text x="120" y="375" text-anchor="middle" font-size="11" fill="#000">0</text>
    <text x="220" y="375" text-anchor="middle" font-size="11" fill="#000">0</text>
    <text x="320" y="375" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="420" y="375" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="510" y="375" text-anchor="middle" font-size="11" fill="#000">禁止</text>
    <text x="120" y="393" text-anchor="middle" font-size="11" fill="#000">0</text>
    <text x="220" y="393" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="320" y="393" text-anchor="middle" font-size="11" fill="#000">0</text>
    <text x="420" y="393" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="510" y="393" text-anchor="middle" font-size="11" fill="#000">复位</text>
    <text x="120" y="411" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="220" y="411" text-anchor="middle" font-size="11" fill="#000">0</text>
    <text x="320" y="411" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="420" y="411" text-anchor="middle" font-size="11" fill="#000">0</text>
    <text x="510" y="411" text-anchor="middle" font-size="11" fill="#000">置位</text>
    <text x="120" y="429" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="220" y="429" text-anchor="middle" font-size="11" fill="#000">1</text>
    <text x="320" y="429" text-anchor="middle" font-size="11" fill="#000">保持</text>
    <text x="420" y="429" text-anchor="middle" font-size="11" fill="#000">保持</text>
    <text x="510" y="429" text-anchor="middle" font-size="11" fill="#000">保持</text>
  </g>
</svg>