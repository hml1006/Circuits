<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">单元库表征数据图</text>
    <!-- Lookup table concept -->
    <rect x="20" y="45" width="560" height="30" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="300" y="65" text-anchor="middle" font-size="12" fill="#1e88e5">延迟 = f(输入转换时间 S_in, 输出负载电容 C_load) — 二维查找表 (LUT)</text>
    <!-- Timing LUT table -->
    <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">时序查找表 (NLDM) — 延迟 (ns)</text>
    <rect x="20" y="110" width="260" height="150" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
    <!-- Table header -->
    <rect x="20" y="110" width="60" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="50" y="127" text-anchor="middle" font-size="9" fill="#333">S_in\C_L</text>
    <rect x="80" y="110" width="40" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="100" y="127" text-anchor="middle" font-size="9" fill="#333">1fF</text>
    <rect x="120" y="110" width="40" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="140" y="127" text-anchor="middle" font-size="9" fill="#333">5fF</text>
    <rect x="160" y="110" width="40" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="180" y="127" text-anchor="middle" font-size="9" fill="#333">10fF</text>
    <rect x="200" y="110" width="40" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="220" y="127" text-anchor="middle" font-size="9" fill="#333">50fF</text>
    <rect x="240" y="110" width="40" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="260" y="127" text-anchor="middle" font-size="9" fill="#333">100fF</text>
    <!-- Table rows -->
    <rect x="20" y="135" width="60" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="50" y="152" text-anchor="middle" font-size="9" fill="#333">10ps</text>
    <rect x="80" y="135" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="100" y="152" text-anchor="middle" font-size="9" fill="#333">0.02</text>
    <rect x="120" y="135" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="152" text-anchor="middle" font-size="9" fill="#333">0.05</text>
    <rect x="160" y="135" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="180" y="152" text-anchor="middle" font-size="9" fill="#333">0.09</text>
    <rect x="200" y="135" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="220" y="152" text-anchor="middle" font-size="9" fill="#333">0.25</text>
    <rect x="240" y="135" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="260" y="152" text-anchor="middle" font-size="9" fill="#333">0.42</text>
    <rect x="20" y="160" width="60" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="50" y="177" text-anchor="middle" font-size="9" fill="#333">50ps</text>
    <rect x="80" y="160" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="100" y="177" text-anchor="middle" font-size="9" fill="#333">0.06</text>
    <rect x="120" y="160" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="177" text-anchor="middle" font-size="9" fill="#333">0.12</text>
    <rect x="160" y="160" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="180" y="177" text-anchor="middle" font-size="9" fill="#333">0.20</text>
    <rect x="200" y="160" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="220" y="177" text-anchor="middle" font-size="9" fill="#333">0.45</text>
    <rect x="240" y="160" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="260" y="177" text-anchor="middle" font-size="9" fill="#333">0.68</text>
    <rect x="20" y="185" width="60" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="50" y="202" text-anchor="middle" font-size="9" fill="#333">100ps</text>
    <rect x="80" y="185" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="100" y="202" text-anchor="middle" font-size="9" fill="#333">0.10</text>
    <rect x="120" y="185" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="202" text-anchor="middle" font-size="9" fill="#333">0.20</text>
    <rect x="160" y="185" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="180" y="202" text-anchor="middle" font-size="9" fill="#333">0.35</text>
    <rect x="200" y="185" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="220" y="202" text-anchor="middle" font-size="9" fill="#333">0.65</text>
    <rect x="240" y="185" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="260" y="202" text-anchor="middle" font-size="9" fill="#333">0.95</text>
    <rect x="20" y="210" width="60" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="50" y="227" text-anchor="middle" font-size="9" fill="#333">500ps</text>
    <rect x="80" y="210" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="100" y="227" text-anchor="middle" font-size="9" fill="#333">0.35</text>
    <rect x="120" y="210" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="227" text-anchor="middle" font-size="9" fill="#333">0.55</text>
    <rect x="160" y="210" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="180" y="227" text-anchor="middle" font-size="9" fill="#333">0.80</text>
    <rect x="200" y="210" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="220" y="227" text-anchor="middle" font-size="9" fill="#333">1.30</text>
    <rect x="240" y="210" width="40" height="25" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="260" y="227" text-anchor="middle" font-size="9" fill="#333">1.80</text>
    <!-- Power characterization table -->
    <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">功耗表征</text>
    <rect x="320" y="110" width="260" height="100" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
    <text x="450" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">内部功耗 (Internal Power)</text>
    <text x="450" y="155" text-anchor="middle" font-size="10" fill="#555">P_internal = Σ E_i · f_i</text>
    <text x="450" y="175" text-anchor="middle" font-size="10" fill="#555">E_i: 每次翻转能量</text>
    <text x="450" y="195" text-anchor="middle" font-size="10" fill="#555">f_i: 翻转频率</text>
    <!-- Leakage power -->
    <rect x="320" y="220" width="260" height="40" rx="5" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="450" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">漏电功耗 (Leakage Power)</text>
    <text x="450" y="252" text-anchor="middle" font-size="10" fill="#c62828">P_leakage = VDD · I_leakage</text>
    <!-- Liberty format -->
    <rect x="20" y="275" width="560" height="60" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="300" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Liberty (.lib) 库文件格式</text>
    <text x="40" y="315" font-size="10" fill="#555">cell (INV_X1) { area: 0.5; pin (A) { direction: input; capacitance: 0.002; } pin (Y) { direction: output; function: "(!A)"; ... } }</text>
    <!-- Multi-Vt info -->
    <rect x="20" y="345" width="560" height="45" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="300" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">多阈值电压单元库</text>
    <text x="40" y="382" font-size="10" fill="#2e7d32">HVT (高阈值, 慢速, 低漏电) | SVT (标准阈值) | LVT (低阈值, 快速, 高漏电)</text>
  </g>
</svg>