<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">同步FIFO结构图</text>
    <!-- Memory array -->
    <rect x="200" y="50" width="200" height="200" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
    <text x="300" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e88e5">双端口SRAM</text>
    <text x="300" y="95" text-anchor="middle" font-size="11" fill="#1e88e5">存储器阵列</text>
    <!-- Memory cells representation -->
    <rect x="215" y="105" width="170" height="18" fill="#fff" stroke="#1e88e5" stroke-width="1"/>
    <text x="300" y="118" text-anchor="middle" font-size="9" fill="#666">mem[0] | mem[1] | mem[2] | ...</text>
    <rect x="215" y="127" width="170" height="18" fill="#fff" stroke="#1e88e5" stroke-width="1"/>
    <text x="300" y="140" text-anchor="middle" font-size="9" fill="#666">mem[4] | mem[5] | mem[6] | ...</text>
    <rect x="215" y="149" width="170" height="18" fill="#fff" stroke="#1e88e5" stroke-width="1"/>
    <text x="300" y="162" text-anchor="middle" font-size="9" fill="#666">mem[8] | mem[9] | mem[10]| ...</text>
    <rect x="215" y="171" width="170" height="18" fill="#fff" stroke="#1e88e5" stroke-width="1"/>
    <text x="300" y="184" text-anchor="middle" font-size="9" fill="#666">mem[12]|mem[13]|mem[14]|mem[15]</text>
    <text x="300" y="210" text-anchor="middle" font-size="10" fill="#666">深度: DEPTH = 16, 数据宽度: DATA_WIDTH = 8</text>
    <!-- Write pointer -->
    <rect x="30" y="60" width="140" height="55" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">写指针</text>
    <text x="100" y="97" text-anchor="middle" font-size="10" fill="#2e7d32">wr_ptr</text>
    <text x="100" y="110" text-anchor="middle" font-size="9" fill="#555">(写使能时递增)</text>
    <line x1="170" y1="85" x2="195" y2="85" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Read pointer -->
    <rect x="30" y="140" width="140" height="55" rx="5" fill="#ffecb3" stroke="#f57f17" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57f17">读指针</text>
    <text x="100" y="177" text-anchor="middle" font-size="10" fill="#f57f17">rd_ptr</text>
    <text x="100" y="190" text-anchor="middle" font-size="9" fill="#555">(读使能时递增)</text>
    <line x1="170" y1="167" x2="195" y2="167" stroke="#f57f17" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Write data input -->
    <rect x="30" y="220" width="140" height="40" rx="5" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
    <text x="100" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#0288d1">data_in</text>
    <text x="100" y="255" text-anchor="middle" font-size="9" fill="#555">写入数据</text>
    <line x1="170" y1="240" x2="195" y2="240" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Read data output -->
    <rect x="430" y="220" width="140" height="40" rx="5" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
    <text x="500" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#0288d1">data_out</text>
    <text x="500" y="255" text-anchor="middle" font-size="9" fill="#555">读出数据</text>
    <line x1="400" y1="240" x2="425" y2="240" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Full/Empty logic -->
    <rect x="430" y="60" width="140" height="55" rx="5" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="500" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">空满判断</text>
    <text x="500" y="97" text-anchor="middle" font-size="10" fill="#c62828">full / empty</text>
    <text x="500" y="110" text-anchor="middle" font-size="9" fill="#555">(比较指针)</text>
    <line x1="400" y1="85" x2="425" y2="85" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Control signals -->
    <rect x="430" y="140" width="140" height="55" rx="5" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="500" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">控制信号</text>
    <text x="500" y="177" text-anchor="middle" font-size="10" fill="#7b1fa2">wr_en / rd_en</text>
    <text x="500" y="190" text-anchor="middle" font-size="9" fill="#555">clk / rst_n</text>
    <line x1="400" y1="167" x2="425" y2="167" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Full/empty condition text -->
    <rect x="30" y="280" width="540" height="55" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="300" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">空满判断条件</text>
    <text x="50" y="318" font-size="11" fill="#333">空: wr_ptr[ADDR_WIDTH:0] == rd_ptr[ADDR_WIDTH:0]</text>
    <text x="50" y="333" font-size="11" fill="#333">满: wr_ptr[ADDR_WIDTH] != rd_ptr[ADDR_WIDTH] &amp;&amp; wr_ptr[ADDR_WIDTH-1:0] == rd_ptr[ADDR_WIDTH-1:0]</text>
    <!-- Verilog code -->
    <rect x="30" y="345" width="540" height="45" rx="3" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <text x="40" y="362" font-size="10" fill="#333" font-family="monospace">always @(posedge clk) begin</text>
    <text x="40" y="377" font-size="10" fill="#333" font-family="monospace">  if (wr_en &amp;&amp; !full) mem[wr_ptr] &lt;= data_in; wr_ptr &lt;= wr_ptr + 1;</text>
    <text x="40" y="390" font-size="10" fill="#333" font-family="monospace">  if (rd_en &amp;&amp; !empty) data_out &lt;= mem[rd_ptr]; rd_ptr &lt;= rd_ptr + 1;</text>
  </g>
</svg>