<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .metal { fill: #c9d6e5; stroke: #333; stroke-width: 1.2; }
      .oxide { fill: #eef2f7; stroke: #333; stroke-width: 1.2; }
      .fil { stroke: #c0392b; stroke-width: 3; fill: none; }
      .gap { stroke: #9a9a9a; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text class="title" x="400" y="30" text-anchor="middle">RRAM：导电细丝的形成与断开</text>

  <!-- 左：SET -->
  <text class="lbl" x="210" y="62" text-anchor="middle">SET：细丝形成，低阻</text>
  <rect class="metal" x="120" y="80" width="180" height="32"/>
  <text class="lbl" x="210" y="102" text-anchor="middle">顶电极</text>
  <rect class="oxide" x="120" y="112" width="180" height="130"/>
  <text class="small" x="310" y="126">金属氧化物</text>
  <text class="small" x="310" y="142">HfO2 等</text>
  <line class="gap" x1="306" y1="134" x2="300" y2="134"/>
  <rect class="metal" x="120" y="242" width="180" height="32"/>
  <text class="lbl" x="210" y="264" text-anchor="middle">底电极</text>

  <path class="fil" d="M210,242 L200,225 L218,208 L202,190 L220,172 L205,154 L218,136 L210,112"/>
  <circle cx="210" cy="230" r="3" fill="#c0392b"/>
  <circle cx="210" cy="200" r="3" fill="#c0392b"/>
  <circle cx="210" cy="170" r="3" fill="#c0392b"/>
  <circle cx="210" cy="140" r="3" fill="#c0392b"/>

  <text class="small" x="80" y="90">+</text>
  <text class="small" x="80" y="270">−</text>
  <text class="small" x="210" y="305" text-anchor="middle">氧空位细丝连通上下电极</text>
  <text class="lbl" x="210" y="330" text-anchor="middle">R_low</text>

  <!-- 右：RESET -->
  <text class="lbl" x="590" y="62" text-anchor="middle">RESET：细丝断开，高阻</text>
  <rect class="metal" x="500" y="80" width="180" height="32"/>
  <text class="lbl" x="590" y="102" text-anchor="middle">顶电极</text>
  <rect class="oxide" x="500" y="112" width="180" height="130"/>
  <text class="small" x="690" y="126">金属氧化物</text>
  <text class="small" x="690" y="142">HfO2 等</text>
  <line class="gap" x1="686" y1="134" x2="680" y2="134"/>
  <rect class="metal" x="500" y="242" width="180" height="32"/>
  <text class="lbl" x="590" y="264" text-anchor="middle">底电极</text>

  <path class="fil" d="M590,242 L580,225 L598,208"/>
  <path class="fil" d="M582,172 L600,154 L590,112"/>
  <line class="gap" x1="586" y1="200" x2="596" y2="180"/>
  <circle cx="590" cy="230" r="3" fill="#c0392b"/>
  <circle cx="590" cy="140" r="3" fill="#c0392b"/>

  <text class="small" x="460" y="90">−</text>
  <text class="small" x="460" y="270">+</text>
  <text class="small" x="590" y="305" text-anchor="middle">细丝在中间断开，电阻升高</text>
  <text class="lbl" x="590" y="330" text-anchor="middle">R_high</text>

  <text class="small" x="400" y="385" text-anchor="middle">Forming 首次形成细丝；SET/RESET 可逆切换。主要挑战是细丝离散性、器件一致性与耐久性</text>
</svg>
