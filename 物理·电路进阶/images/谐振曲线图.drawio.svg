<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">RLC 串联谐振曲线</text>
    
    <!-- 坐标轴 -->
    <line x1="80" y1="330" x2="560" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="80" y1="330" x2="80" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 轴标签 -->
    <text x="560" y="350" text-anchor="end" font-size="14" fill="#333" font-style="italic">f</text>
    <text x="60" y="40" text-anchor="middle" font-size="14" fill="#333">I</text>
    
    <!-- 谐振曲线（高 Q 值） -->
    <path d="M 80,328 Q 160,328 220,300 Q 260,240 280,120 Q 285,80 290,50 Q 293,35 300,32 Q 307,35 310,50 Q 315,80 320,120 Q 340,240 380,300 Q 440,328 520,328" fill="none" stroke="#d32f2f" stroke-width="3"/>
    
    <!-- 谐振曲线（低 Q 值） -->
    <path d="M 80,328 Q 160,328 240,280 Q 270,220 290,120 Q 295,90 300,70 Q 305,90 310,120 Q 330,220 360,280 Q 440,328 520,328" fill="none" stroke="#1976d2" stroke-width="2.5" stroke-dasharray="6,3"/>
    
    <!-- 谐振频率 f0 -->
    <line x1="300" y1="32" x2="300" y2="330" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="300" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">f<tspan font-size="9" dy="3">0</tspan></tspan>
    
    <!-- 带宽标注 -->
    <line x1="260" y1="125" x2="340" y2="125" stroke="#ff9800" stroke-width="1.5"/>
    <line x1="260" y1="120" x2="260" y2="130" stroke="#ff9800" stroke-width="1.5"/>
    <line x1="340" y1="120" x2="340" y2="130" stroke="#ff9800" stroke-width="1.5"/>
    <text x="300" y="120" text-anchor="middle" font-size="11" fill="#ff9800">带宽 Δf</text>
    
    <!-- I0/√2 标注 -->
    <line x1="80" y1="125" x2="255" y2="125" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="130" text-anchor="end" font-size="11" fill="#666">I<tspan font-size="8" dy="3">0</tspan><tspan dy="-3">/√2</tspan></tspan>
    
    <!-- I0 标注 -->
    <line x1="80" y1="32" x2="295" y2="32" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="75" y="37" text-anchor="end" font-size="11" fill="#666">I<tspan font-size="8" dy="3">0</tspan></tspan>
    
    <!-- 图例 -->
    <rect x="400" y="50" width="120" height="55" rx="5" ry="5" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
    <line x1="405" y1="65" x2="425" y2="65" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="430" y="69" font-size="10" fill="#333">高 Q 值</text>
    <line x1="405" y1="85" x2="425" y2="85" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="430" y="89" font-size="10" fill="#333">低 Q 值</text>
    
    <!-- 公式 -->
    <text x="300" y="385" text-anchor="middle" font-size="13" fill="#333">f<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> = 1/(2π√LC), Q = ω<tspan font-size="9" dy="3">0</tspan><tspan dy="-3">L/R = 1/(ω<tspan font-size="9" dy="3">0</tspan><tspan dy="-3">CR)</tspan></tspan></tspan></tspan></tspan></text>
  </g>
</svg>