<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">BJT输出特性曲线</text>

    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arV)"/>
    <text x="565" y="355" font-size="14" fill="#333" font-style="italic">V</text>
    <text x="555" y="365" font-size="11" fill="#333">CE</text>
    <line x1="60" y1="350" x2="60" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arI)"/>
    <text x="30" y="30" font-size="14" fill="#333" font-style="italic">I</text>
    <text x="22" y="45" font-size="11" fill="#333">C</text>
    <defs>
      <marker id="arV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
      <marker id="arI" markerWidth="8" markerHeight="6" refX="3" refY="0" orient="auto"><polygon points="0 6, 3 0, 6 6" fill="#333"/></marker>
    </defs>
    <text x="55" y="365" font-size="11" fill="#666">O</text>

    <!-- 饱和区 -->
    <path d="M 60 340 Q 80 330 110 310 Q 140 290 170 270" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="100" y="295" font-size="11" fill="#666">饱和区</text>

    <!-- 放大区曲线族 -->
    <!-- IB=10uA -->
    <path d="M 170 270 Q 220 240 300 190 Q 380 140 460 90" fill="none" stroke="#3366cc" stroke-width="2"/>
    <text x="465" y="88" font-size="9" fill="#3366cc">10μA</text>
    <!-- IB=20uA -->
    <path d="M 200 220 Q 250 190 330 140 Q 410 90 490 40" fill="none" stroke="#3366cc" stroke-width="2"/>
    <text x="495" y="38" font-size="9" fill="#3366cc">20μA</text>
    <!-- IB=30uA -->
    <path d="M 230 170 Q 280 140 360 90 Q 420 55 500 20" fill="none" stroke="#3366cc" stroke-width="2"/>
    <text x="505" y="18" font-size="9" fill="#3366cc">30μA</text>
    <!-- IB=40uA -->
    <path d="M 260 120 Q 310 90 390 40 Q 440 15 510 0" fill="none" stroke="#3366cc" stroke-width="2"/>
    <text x="515" y="0" font-size="9" fill="#3366cc">40μA</text>

    <!-- 截止区 -->
    <text x="60" y="50" font-size="11" fill="#666">截止区</text>
    <line x1="60" y1="345" x2="170" y2="345" stroke="#3366cc" stroke-width="2"/>
    <text x="80" y="340" font-size="9" fill="#3366cc">IB=0</text>

    <!-- 放大区标注 -->
    <text x="300" y="100" text-anchor="middle" font-size="12" fill="#3366cc" font-weight="bold">放大区</text>
    <text x="300" y="115" text-anchor="middle" font-size="10" fill="#666">I</text>
    <text x="305" y="115" text-anchor="middle" font-size="10" fill="#666">C</text>
    <text x="315" y="115" text-anchor="middle" font-size="10" fill="#666"> = β·I</text>
    <text x="335" y="115" text-anchor="middle" font-size="10" fill="#666">B</text>

    <!-- 边界线 -->
    <line x1="60" y1="350" x2="170" y2="270" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="175" y="275" font-size="9" fill="#cc3333">饱和边界</text>
  </g>
</svg>