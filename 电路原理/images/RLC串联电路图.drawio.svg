<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">RLC串联电路图</text>
    <!-- 电压源 -->
    <circle cx="80" cy="100" r="22" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="78" x2="80" y2="85" stroke="#000" stroke-width="2"/>
    <line x1="65" y1="100" x2="95" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="115" x2="80" y2="122" stroke="#000" stroke-width="2"/>
    <text x="60" y="95" font-size="10" fill="#333">+</text>
    <text x="95" y="95" font-size="10" fill="#333">-</text>
    <text x="50" y="75" font-size="14" fill="#d32f2f">u_s</text>
    <!-- 顶部导线 -->
    <line x1="102" y1="100" x2="180" y2="100" stroke="#000" stroke-width="2"/>
    <!-- 电阻R -->
    <rect x="180" y="90" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="210" y1="100" x2="260" y2="100" stroke="#000" stroke-width="2"/>
    <text x="195" y="85" font-size="14" fill="#333">R</text>
    <!-- 电感L -->
    <line x1="260" y1="100" x2="280" y2="100" stroke="#000" stroke-width="2"/>
    <path d="M280 100 Q287 90 294 100 Q301 110 308 100 Q315 90 322 100 Q329 110 336 100 Q343 90 350 100" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="350" y1="100" x2="370" y2="100" stroke="#000" stroke-width="2"/>
    <text x="315" y="85" font-size="14" fill="#333">L</text>
    <!-- 电容C -->
    <line x1="370" y1="100" x2="400" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="400" y1="80" x2="430" y2="80" stroke="#000" stroke-width="2"/>
    <line x1="400" y1="120" x2="430" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="430" y1="80" x2="430" y2="120" stroke="#000" stroke-width="2"/>
    <text x="415" y="75" font-size="14" fill="#333">C</text>
    <!-- 右侧导线 -->
    <line x1="430" y1="100" x2="500" y2="100" stroke="#000" stroke-width="2"/>
    <!-- 底部导线 -->
    <line x1="80" y1="180" x2="500" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="122" x2="80" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="500" y1="100" x2="500" y2="180" stroke="#000" stroke-width="2"/>
    <!-- 电流方向 -->
    <polygon points="140,100 148,94 148,106" fill="#d32f2f"/>
    <text x="120" y="90" font-size="13" fill="#d32f2f">i</text>
    <text x="120" y="210" font-size="12" fill="#666">KVL: u_s = u_R + u_L + u_C</text>
    <!-- 微分方程 -->
    <text x="300" y="250" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">LC·d²u_C/dt² + RC·du_C/dt + u_C = u_s</text>
    <!-- 特征方程 -->
    <text x="300" y="280" text-anchor="middle" font-size="14" fill="#333">特征方程: LCs² + RCs + 1 = 0</text>
    <!-- 特征根 -->
    <text x="300" y="310" text-anchor="middle" font-size="13" fill="#333">s₁,₂ = -R/(2L) ± √[(R/(2L))² - 1/(LC)]</text>
    <!-- 三种情况 -->
    <text x="300" y="345" text-anchor="middle" font-size="13" fill="#666">过阻尼: R &gt; 2√(L/C) | 临界阻尼: R = 2√(L/C) | 欠阻尼: R &lt; 2√(L/C)</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">衰减系数 α = R/(2L), 谐振角频率 ω₀ = 1/√(LC)</text>
  </g>
</svg>