<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">串联电路图</text>
    
    <!-- 电路图 -->
    <!-- 电源 -->
    <rect x="40" y="190" width="50" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="55" y1="190" x2="55" y2="175" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="190" x2="75" y2="175" stroke="#333" stroke-width="2"/>
    <text x="65" y="205" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="65" y="220" text-anchor="middle" font-size="10" fill="#333">−</text>
    <text x="65" y="245" text-anchor="middle" font-size="12" fill="#555">电源</text>
    
    <!-- 导线：电源正极 → 上方 -->
    <line x1="65" y1="175" x2="65" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="100" x2="170" y2="100" stroke="#333" stroke-width="2"/>
    
    <!-- 开关 -->
    <line x1="170" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2"/>
    <circle cx="200" cy="100" r="3" fill="#333"/>
    <line x1="200" y1="100" x2="220" y2="85" stroke="#333" stroke-width="2"/>
    <circle cx="220" cy="85" r="3" fill="#333"/>
    <line x1="220" y1="85" x2="250" y2="85" stroke="#333" stroke-width="2"/>
    <text x="210" y="75" text-anchor="middle" font-size="11" fill="#555">S</text>
    
    <!-- 灯泡 L1 -->
    <line x1="250" y1="85" x2="310" y2="85" stroke="#333" stroke-width="2"/>
    <circle cx="340" cy="85" r="22" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="323" y1="68" x2="357" y2="102" stroke="#333" stroke-width="2"/>
    <line x1="357" y1="68" x2="323" y2="102" stroke="#333" stroke-width="2"/>
    <text x="340" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">L₁</text>
    
    <!-- 导线 L1 → L2 -->
    <line x1="362" y1="85" x2="400" y2="85" stroke="#333" stroke-width="2"/>
    
    <!-- 灯泡 L2 -->
    <circle cx="430" cy="85" r="22" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="413" y1="68" x2="447" y2="102" stroke="#333" stroke-width="2"/>
    <line x1="447" y1="68" x2="413" y2="102" stroke="#333" stroke-width="2"/>
    <text x="430" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">L₂</text>
    
    <!-- 导线 L2 → 电源负极 -->
    <line x1="452" y1="85" x2="520" y2="85" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="85" x2="520" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="190" x2="90" y2="190" stroke="#333" stroke-width="2"/>
    
    <!-- 电流方向箭头 -->
    <path d="M 80 100 L 155 100" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M 260 85 L 325 85" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M 375 85 L 415 85" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    <path d="M 465 85 L 505 85" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowRed)"/>
    
    <!-- 电流方向标注 -->
    <text x="300" y="155" text-anchor="middle" font-size="12" fill="#e74c3c">电流方向</text>
    <text x="300" y="170" text-anchor="middle" font-size="11" fill="#666">只有一条路径</text>
    
    <!-- 串联电路特点 -->
    <rect x="30" y="270" width="540" height="115" rx="8" ry="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="300" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#e67e22">串联电路特点</text>
    
    <text x="50" y="320" font-size="12" fill="#555">① 电流处处相等：</text>
    <text x="170" y="320" font-size="12" font-weight="bold" fill="#e67e22">I = I₁ = I₂</text>
    
    <text x="50" y="340" font-size="12" fill="#555">② 总电压等于各用电器电压之和：</text>
    <text x="280" y="340" font-size="12" font-weight="bold" fill="#e67e22">U = U₁ + U₂</text>
    
    <text x="50" y="360" font-size="12" fill="#555">③ 总电阻等于各电阻之和：</text>
    <text x="230" y="360" font-size="12" font-weight="bold" fill="#e67e22">R总 = R₁ + R₂</text>
    
    <text x="50" y="380" font-size="12" fill="#555">④ 开关控制所有用电器，一个坏了全都不工作</text>
    
    <defs>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#e74c3c"/>
      </marker>
    </defs>
  </g>
</svg>