<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">CPLD 内部结构</text>
    <!-- I/O 块 -->
    <rect x="10" y="60" width="60" height="280" rx="4" fill="#fdebd0" stroke="#000" stroke-width="2"/>
    <text x="40" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#000" transform="rotate(-90,40,200)">I/O 控制块</text>
    <rect x="530" y="60" width="60" height="280" rx="4" fill="#fdebd0" stroke="#000" stroke-width="2"/>
    <text x="560" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#000" transform="rotate(90,560,200)">I/O 控制块</text>
    <!-- 逻辑块阵列 -->
    <rect x="80" y="60" width="440" height="280" rx="5" fill="#f0f0ff" stroke="#000" stroke-width="2"/>
    <text x="300" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">逻辑块阵列 (Logic Block Array)</text>
    <!-- 互联矩阵 -->
    <rect x="105" y="145" width="390" height="50" rx="4" fill="#d4e6f1" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">可编程互联矩阵 (PIM)</text>
    <text x="300" y="185" text-anchor="middle" font-size="10" fill="#555">Programmable Interconnect Matrix</text>
    <!-- 逻辑块 -->
    <rect x="105" y="100" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="145" y="125" text-anchor="middle" font-size="10" fill="#000">逻辑块 0</text>
    <rect x="195" y="100" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="235" y="125" text-anchor="middle" font-size="10" fill="#000">逻辑块 1</text>
    <rect x="285" y="100" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="325" y="125" text-anchor="middle" font-size="10" fill="#000">逻辑块 2</text>
    <rect x="375" y="100" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="415" y="125" text-anchor="middle" font-size="10" fill="#000">逻辑块 3</text>
    <rect x="105" y="200" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="145" y="225" text-anchor="middle" font-size="10" fill="#000">逻辑块 4</text>
    <rect x="195" y="200" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="235" y="225" text-anchor="middle" font-size="10" fill="#000">逻辑块 5</text>
    <rect x="285" y="200" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="325" y="225" text-anchor="middle" font-size="10" fill="#000">逻辑块 6</text>
    <rect x="375" y="200" width="80" height="40" rx="3" fill="#fff5ee" stroke="#000" stroke-width="1.5"/>
    <text x="415" y="225" text-anchor="middle" font-size="10" fill="#000">逻辑块 7</text>
    <!-- 宏单元标注 -->
    <line x1="145" y1="100" x2="145" y2="90" stroke="#000" stroke-width="1" stroke-dasharray="2"/>
    <line x1="235" y1="100" x2="235" y2="90" stroke="#000" stroke-width="1" stroke-dasharray="2"/>
    <line x1="325" y1="100" x2="325" y2="90" stroke="#000" stroke-width="1" stroke-dasharray="2"/>
    <line x1="415" y1="100" x2="415" y2="90" stroke="#000" stroke-width="1" stroke-dasharray="2"/>
    <text x="300" y="95" text-anchor="middle" font-size="9" fill="#555">每个逻辑块包含多个宏单元 (MC)</text>
    <!-- 全局时钟 -->
    <rect x="105" y="255" width="390" height="30" rx="3" fill="#e8f8e8" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="275" text-anchor="middle" font-size="11" fill="#000">全局时钟网络 (Global Clock Network)</text>
    <!-- 连接线 -->
    <line x1="70" y1="150" x2="105" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="70" y1="250" x2="105" y2="250" stroke="#000" stroke-width="1.5"/>
    <line x1="495" y1="150" x2="530" y2="150" stroke="#000" stroke-width="1.5"/>
    <line x1="495" y1="250" x2="530" y2="250" stroke="#000" stroke-width="1.5"/>
    <!-- 说明 -->
    <rect x="30" y="305" width="540" height="80" rx="5" fill="#f0f8ff" stroke="#000" stroke-width="1.5"/>
    <text x="300" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">CPLD 结构特点</text>
    <text x="50" y="345" text-anchor="start" font-size="12" fill="#000">• 基于乘积项架构，逻辑块通过互联矩阵连接</text>
    <text x="50" y="365" text-anchor="start" font-size="12" fill="#000">• 时序延迟可预测（固定延迟），适合控制逻辑</text>
    <text x="50" y="385" text-anchor="start" font-size="12" fill="#000">• 非易失性（Flash 编程），逻辑密度较低</text>
  </g>
</svg>