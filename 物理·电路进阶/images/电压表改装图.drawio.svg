<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">电压表改装原理图</text>
    
    <!-- 主电路导线 -->
    <line x1="60" y1="200" x2="540" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 输入端 -->
    <text x="50" y="195" text-anchor="end" font-size="14" font-weight="bold" fill="#333">+</text>
    <text x="50" y="215" text-anchor="end" font-size="14" fill="#333">−</text>
    
    <!-- 被测电压标注 -->
    <text x="60" y="170" text-anchor="start" font-size="13" fill="#666" font-style="italic">U</text>
    
    <!-- 表头（左侧） -->
    <circle cx="180" cy="200" r="35" fill="#f0f8ff" stroke="#4682b4" stroke-width="2"/>
    <text x="180" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">G</text>
    <text x="180" y="220" text-anchor="middle" font-size="11" fill="#666">I<tspan font-size="9" dy="3">g</tspan><tspan dy="-3">, R<tspan font-size="9" dy="3">g</tspan><tspan dy="-3"></tspan></tspan></text>
    
    <!-- 串联分压电阻 R -->
    <rect x="300" y="180" width="60" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="330" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">R</text>
    
    <!-- 导线连接 -->
    <line x1="215" y1="200" x2="300" y2="200" stroke="#333" stroke-width="2.5"/>
    <line x1="360" y1="200" x2="540" y2="200" stroke="#333" stroke-width="2.5"/>
    
    <!-- 标注箭头 -->
    <path d="M 215,200 L 215,200" stroke="#333" stroke-width="1"/>
    
    <!-- 分压说明 -->
    <text x="330" y="165" text-anchor="middle" font-size="11" fill="#d32f2f">分压电阻</text>
    
    <!-- 电压表整体标注 -->
    <rect x="140" y="280" width="260" height="50" rx="8" ry="8" fill="#fff9c4" stroke="#e6b800" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="270" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">改装后电压表</text>
    <text x="270" y="318" text-anchor="middle" font-size="11" fill="#666">内阻 R<tspan font-size="9" dy="3">V</tspan><tspan dy="-3"> = R<tspan font-size="9" dy="3">g</tspan><tspan dy="-3"> + R</tspan></tspan></text>
    
    <!-- 公式 -->
    <text x="300" y="370" text-anchor="middle" font-size="14" fill="#333">R = U / I<tspan font-size="10" dy="3">g</tspan><tspan dy="-3"> − R<tspan font-size="10" dy="3">g</tspan></tspan></text>
  </g>
</svg>