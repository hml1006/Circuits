<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">KCL节点图</text>
    <!-- 中心节点 -->
    <circle cx="300" cy="200" r="6" fill="#1976d2" stroke="#000" stroke-width="2"/>
    <!-- 支路1 - 左上 -->
    <line x1="300" y1="200" x2="100" y2="80" stroke="#000" stroke-width="2"/>
    <polygon points="220,148 228,154 222,160" fill="#d32f2f"/>
    <text x="160" y="125" font-size="14" fill="#d32f2f">i₁</text>
    <text x="130" y="75" font-size="12" fill="#666">支路1</text>
    <!-- 支路2 - 右上 -->
    <line x1="300" y1="200" x2="500" y2="80" stroke="#000" stroke-width="2"/>
    <polygon points="380,148 372,154 378,160" fill="#d32f2f"/>
    <text x="420" y="125" font-size="14" fill="#d32f2f">i₂</text>
    <text x="470" y="75" font-size="12" fill="#666">支路2</text>
    <!-- 支路3 - 右 -->
    <line x1="300" y1="200" x2="550" y2="200" stroke="#000" stroke-width="2"/>
    <polygon points="460,200 450,193 450,207" fill="#d32f2f"/>
    <text x="480" y="190" font-size="14" fill="#d32f2f">i₃</text>
    <text x="530" y="215" font-size="12" fill="#666">支路3</text>
    <!-- 支路4 - 右下 -->
    <line x1="300" y1="200" x2="480" y2="340" stroke="#000" stroke-width="2"/>
    <polygon points="380,270 372,264 378,258" fill="#d32f2f"/>
    <text x="420" y="290" font-size="14" fill="#d32f2f">i₄</text>
    <text x="460" y="350" font-size="12" fill="#666">支路4</text>
    <!-- 支路5 - 左下 -->
    <line x1="300" y1="200" x2="120" y2="340" stroke="#000" stroke-width="2"/>
    <polygon points="220,270 228,264 222,258" fill="#d32f2f"/>
    <text x="160" y="290" font-size="14" fill="#d32f2f">i₅</text>
    <text x="100" y="355" font-size="12" fill="#666">支路5</text>
    <!-- 支路6 - 左 -->
    <line x1="300" y1="200" x2="50" y2="200" stroke="#000" stroke-width="2"/>
    <polygon points="140,200 150,193 150,207" fill="#d32f2f"/>
    <text x="100" y="190" font-size="14" fill="#d32f2f">i₆</text>
    <text x="30" y="215" font-size="12" fill="#666">支路6</text>
    <!-- 公式 -->
    <text x="300" y="390" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">∑i = 0, 即 i₁ + i₂ + i₃ = i₄ + i₅ + i₆</text>
  </g>
</svg>