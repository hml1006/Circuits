<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Boost升压变换器电路图</text>

    <text x="50" y="80" font-size="12" fill="#666">V</text>
    <text x="50" y="92" font-size="10" fill="#666">I</text>
    <line x1="70" y1="80" x2="100" y2="80" stroke="#333" stroke-width="2"/>

    <!-- 电感 L -->
    <path d="M 100 80 Q 115 90 100 100 Q 85 110 100 120 Q 115 130 100 140" fill="none" stroke="#333" stroke-width="2"/>
    <text x="95" y="155" font-size="12" fill="#333">L</text>

    <line x1="100" y1="140" x2="100" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 开关管 S -->
    <line x1="100" y1="180" x2="100" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="200" x2="120" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="195" x2="80" y2="205" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="195" x2="120" y2="205" stroke="#333" stroke-width="2"/>
    <text x="130" y="205" font-size="12" font-weight="bold" fill="#333">S</text>
    <text x="130" y="218" font-size="10" fill="#666">(MOSFET)</text>
    <line x1="100" y1="200" x2="100" y2="280" stroke="#333" stroke-width="2"/>

    <!-- PWM控制 -->
    <line x1="100" y1="200" x2="100" y2="220" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="110" y="222" font-size="10" fill="#666">PWM</text>

    <!-- 续流二极管 D -->
    <line x1="100" y1="180" x2="160" y2="180" stroke="#333" stroke-width="2"/>
    <polygon points="160,170 180,180 160,190" fill="none" stroke="#cc3333" stroke-width="2"/>
    <line x1="180" y1="170" x2="180" y2="190" stroke="#cc3333" stroke-width="2"/>
    <text x="190" y="185" font-size="11" fill="#cc3333">D</text>
    <text x="198" y="185" font-size="9" fill="#cc3333">1</text>
    <line x1="180" y1="180" x2="210" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 输出电容 Co -->
    <line x1="210" y1="170" x2="210" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="170" x2="220" y2="170" stroke="#333" stroke-width="3"/>
    <line x1="200" y1="190" x2="220" y2="190" stroke="#333" stroke-width="3"/>
    <text x="230" y="185" font-size="12" fill="#333">C</text>
    <text x="238" y="185" font-size="10" fill="#666">o</text>
    <line x1="210" y1="190" x2="210" y2="280" stroke="#333" stroke-width="2"/>

    <!-- 负载 RL -->
    <line x1="210" y1="180" x2="280" y2="180" stroke="#333" stroke-width="2"/>
    <rect x="280" y="160" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="290" y="185" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="298" y="185" text-anchor="middle" font-size="10" fill="#666">L</text>
    <line x1="300" y1="180" x2="350" y2="180" stroke="#333" stroke-width="2"/>
    <text x="360" y="185" font-size="12" fill="#666">V</text>
    <text x="360" y="197" font-size="10" fill="#666">O</text>

    <!-- 地线 -->
    <line x1="100" y1="280" x2="210" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="280" x2="100" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="280" x2="210" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="290" x2="230" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="290" x2="80" y2="295" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="290" x2="120" y2="295" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="290" x2="190" y2="295" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="290" x2="230" y2="295" stroke="#333" stroke-width="2"/>

    <!-- 波形 -->
    <text x="300" y="330" text-anchor="middle" font-size="12" fill="#666">开关管S导通时：L储能，电流线性上升</text>
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#666">开关管S截止时：L释放能量，D导通，向C和负载供电</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">V</text>
    <text x="310" y="370" text-anchor="middle" font-size="12" fill="#666">O</text>
    <text x="320" y="370" text-anchor="middle" font-size="12" fill="#666"> = V</text>
    <text x="338" y="370" text-anchor="middle" font-size="12" fill="#666">I</text>
    <text x="348" y="370" text-anchor="middle" font-size="12" fill="#666"> / (1 − D)（D为占空比）</text>
  </g>
</svg>