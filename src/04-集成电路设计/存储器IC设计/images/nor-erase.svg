<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="blkArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .ox { fill: #f6d365; stroke: #8a6d1a; stroke-width: 1; }
      .poly { fill: #d0d0d0; stroke: #333; stroke-width: 1; }
      .si { fill: #e8eef5; stroke: #333; stroke-width: 1; }
      .nplus { fill: #b9c9dc; stroke: #333; stroke-width: 1; }
      .wire { stroke: #333; stroke-width: 1.3; fill: none; }
      .flow { fill: #eef2f7; stroke: #1f4e79; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <text class="title" x="260" y="32" text-anchor="middle">NOR 擦除：FN 隧穿</text>

  <rect class="poly" x="105" y="145" width="270" height="40" rx="2"/>
  <text class="lbl" x="260" y="170" text-anchor="middle">控制栅 CG = 0 V（或负压）</text>

  <rect class="ox" x="115" y="185" width="250" height="10"/>
  <rect class="poly" x="120" y="195" width="240" height="47" rx="2"/>
  <text class="lbl" x="240" y="223" text-anchor="middle">浮栅 FG</text>

  <rect class="ox" x="110" y="242" width="260" height="8"/>
  <rect class="si" x="40" y="250" width="400" height="60"/>
  <rect class="nplus" x="70" y="250" width="60" height="24"/>
  <rect class="nplus" x="350" y="250" width="60" height="24"/>
  <text class="small" x="100" y="266" text-anchor="middle">n+ 源</text>
  <text class="small" x="380" y="266" text-anchor="middle">n+ 漏</text>
  <text class="lbl" x="230" y="298" text-anchor="middle">p-Si 衬底</text>

  <text class="small" x="100" y="340" text-anchor="middle">源 = Vers（10–12 V）</text>
  <text class="small" x="380" y="340" text-anchor="middle">漏 = 悬空</text>

  <line x1="160" y1="195" x2="120" y2="248" stroke="#c0392b" stroke-width="1.6" marker-end="url(#redArrow)"/>
  <line x1="190" y1="195" x2="150" y2="248" stroke="#c0392b" stroke-width="1.6" marker-end="url(#redArrow)"/>
  <text class="small" x="250" y="132" text-anchor="middle">FN 隧穿：电子抽向源极</text>

  <text class="small" x="260" y="378" text-anchor="middle">擦除以扇区 / 块为单位；擦除后必须校验，防止过擦除导致位线漏电</text>

  <!-- 右侧流程 -->
  <text class="title" x="610" y="32" text-anchor="middle">擦除校验与过擦除恢复</text>

  <rect class="flow" x="500" y="80" width="150" height="36" rx="4"/>
  <text class="small" x="575" y="103" text-anchor="middle">擦除脉冲</text>

  <rect class="flow" x="500" y="140" width="150" height="36" rx="4"/>
  <text class="small" x="575" y="163" text-anchor="middle">擦除校验</text>

  <polygon class="flow" points="575,190 660,220 575,250 490,220"/>
  <text class="small" x="575" y="224" text-anchor="middle">过擦除？</text>

  <rect class="flow" x="680" y="202" width="100" height="36" rx="4"/>
  <text class="small" x="730" y="225" text-anchor="middle">完成</text>

  <rect class="flow" x="500" y="280" width="150" height="36" rx="4"/>
  <text class="small" x="575" y="303" text-anchor="middle">软编程恢复</text>

  <line class="wire" x1="575" y1="116" x2="575" y2="140" marker-end="url(#blkArrow)"/>
  <line class="wire" x1="575" y1="176" x2="575" y2="190" marker-end="url(#blkArrow)"/>
  <line class="wire" x1="660" y1="220" x2="680" y2="220" marker-end="url(#blkArrow)"/>
  <text class="small" x="668" y="214" text-anchor="middle">否</text>
  <line class="wire" x1="575" y1="250" x2="575" y2="280" marker-end="url(#blkArrow)"/>
  <text class="small" x="586" y="268">是</text>
  <line class="wire" x1="500" y1="298" x2="452" y2="298"/>
  <line class="wire" x1="452" y1="298" x2="452" y2="158"/>
  <line class="wire" x1="452" y1="158" x2="500" y2="158" marker-end="url(#blkArrow)"/>
</svg>
