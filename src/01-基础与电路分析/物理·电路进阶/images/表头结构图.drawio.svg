<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">表头（灵敏电流计）结构图</text>
    
    <!-- 环形磁铁（外框） -->
    <rect x="100" y="60" width="400" height="280" rx="15" ry="15" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    
    <!-- N极 -->
    <rect x="110" y="70" width="60" height="260" rx="8" ry="8" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="140" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff" transform="rotate(-90,140,205)">N</text>
    
    <!-- S极 -->
    <rect x="430" y="70" width="60" height="260" rx="8" ry="8" fill="#4dabf7" stroke="#1976d2" stroke-width="2"/>
    <text x="460" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff" transform="rotate(90,460,205)">S</text>
    
    <!-- 磁场线 -->
    <path d="M 170,100 Q 250,80 430,100" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <path d="M 170,150 Q 250,130 430,150" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <path d="M 170,200 Q 250,180 430,200" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <path d="M 170,250 Q 250,230 430,250" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <path d="M 170,300 Q 250,280 430,300" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    
    <!-- 线圈（矩形框架） -->
    <rect x="220" y="100" width="160" height="200" rx="5" ry="5" fill="none" stroke="#e6b800" stroke-width="2.5"/>
    <rect x="225" y="105" width="150" height="190" rx="3" ry="3" fill="#fff9c4" stroke="#e6b800" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 线圈绕组 -->
    <line x1="220" y1="110" x2="380" y2="110" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="120" x2="380" y2="120" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="130" x2="380" y2="130" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="140" x2="380" y2="140" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="150" x2="380" y2="150" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="160" x2="380" y2="160" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="170" x2="380" y2="170" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="180" x2="380" y2="180" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="190" x2="380" y2="190" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="200" x2="380" y2="200" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="210" x2="380" y2="210" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="220" x2="380" y2="220" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="230" x2="380" y2="230" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="240" x2="380" y2="240" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="250" x2="380" y2="250" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="260" x2="380" y2="260" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="270" x2="380" y2="270" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="280" x2="380" y2="280" stroke="#e6b800" stroke-width="1.5"/>
    <line x1="220" y1="290" x2="380" y2="290" stroke="#e6b800" stroke-width="1.5"/>
    
    <!-- 铁芯 -->
    <rect x="260" y="120" width="80" height="160" rx="5" ry="5" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <text x="300" y="205" text-anchor="middle" font-size="12" fill="#666">铁芯</text>
    
    <!-- 游丝（上） -->
    <path d="M 300,100 Q 280,90 300,80 Q 320,70 300,60" fill="none" stroke="#888" stroke-width="1.5"/>
    
    <!-- 游丝（下） -->
    <path d="M 300,300 Q 280,310 300,320 Q 320,330 300,340" fill="none" stroke="#888" stroke-width="1.5"/>
    
    <!-- 指针 -->
    <line x1="300" y1="200" x2="480" y2="120" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrowPtr)"/>
    <defs>
      <marker id="arrowPtr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d32f2f"/>
      </marker>
    </defs>
    
    <!-- 刻度 -->
    <path d="M 470,100 A 200,180 0 0,1 490,140" fill="none" stroke="#333" stroke-width="1"/>
    <line x1="475" y1="100" x2="485" y2="95" stroke="#333" stroke-width="1.5"/>
    <line x1="480" y1="110" x2="490" y2="107" stroke="#333" stroke-width="1.5"/>
    <line x1="485" y1="120" x2="495" y2="117" stroke="#333" stroke-width="1.5"/>
    <line x1="488" y1="130" x2="498" y2="128" stroke="#333" stroke-width="1.5"/>
    <line x1="490" y1="140" x2="500" y2="140" stroke="#333" stroke-width="1.5"/>
    
    <!-- 标注 -->
    <text x="140" y="370" text-anchor="middle" font-size="12" fill="#666">永久磁铁（N/S极）</text>
    <text x="300" y="370" text-anchor="middle" font-size="12" fill="#666">线圈 + 游丝</text>
    <text x="460" y="370" text-anchor="middle" font-size="12" fill="#666">指针</text>
    
    <!-- 电流输入端子 -->
    <line x1="220" y1="100" x2="200" y2="60" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="100" x2="400" y2="60" stroke="#333" stroke-width="2"/>
    <text x="190" y="55" text-anchor="end" font-size="11" fill="#333">+</text>
    <text x="410" y="55" text-anchor="start" font-size="11" fill="#333">−</text>
  </g>
</svg>