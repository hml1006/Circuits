<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">双口网络级联图</text>
    <!-- 第一个双口网络 -->
    <rect x="120" y="100" width="140" height="180" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
    <text x="190" y="185" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">N₁</text>
    <text x="190" y="205" text-anchor="middle" font-size="12" fill="#666">[A₁]</text>
    <!-- 端口1（输入） -->
    <line x1="40" y1="140" x2="120" y2="140" stroke="#000" stroke-width="2"/>
    <circle cx="120" cy="140" r="4" fill="#000"/>
    <line x1="120" y1="200" x2="40" y2="200" stroke="#000" stroke-width="2"/>
    <circle cx="120" cy="200" r="4" fill="#000"/>
    <text x="20" y="135" font-size="14" fill="#d32f2f">端口1</text>
    <text x="20" y="150" font-size="12" fill="#d32f2f">(输入)</text>
    <text x="70" y="120" font-size="13" fill="#d32f2f">İ₁</text>
    <polygon points="100,140 108,134 108,146" fill="#d32f2f"/>
    <text x="70" y="215" font-size="13" fill="#d32f2f">Ů₁</text>

    <!-- 第二个双口网络 -->
    <rect x="340" y="100" width="140" height="180" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
    <text x="410" y="185" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">N₂</text>
    <text x="410" y="205" text-anchor="middle" font-size="12" fill="#666">[A₂]</text>
    <!-- 端口2（输出） -->
    <line x1="480" y1="140" x2="560" y2="140" stroke="#000" stroke-width="2"/>
    <circle cx="480" cy="140" r="4" fill="#000"/>
    <line x1="480" y1="200" x2="560" y2="200" stroke="#000" stroke-width="2"/>
    <circle cx="480" cy="200" r="4" fill="#000"/>
    <text x="565" y="135" font-size="14" fill="#1976d2">端口2</text>
    <text x="565" y="150" font-size="12" fill="#1976d2">(输出)</text>
    <text x="520" y="120" font-size="13" fill="#1976d2">İ₂</text>
    <polygon points="500,140 492,134 492,146" fill="#1976d2"/>
    <text x="520" y="215" font-size="13" fill="#1976d2">Ů₂</text>

    <!-- 级联连接线 -->
    <line x1="260" y1="140" x2="340" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="260" y1="200" x2="340" y2="200" stroke="#000" stroke-width="2"/>

    <!-- 箭头 -->
    <text x="300" y="170" font-size="24" fill="#333">→</text>

    <!-- 公式 -->
    <text x="300" y="320" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">级联: [A] = [A₁] · [A₂]</text>
    <text x="300" y="350" text-anchor="middle" font-size="14" fill="#333">[Ů₁; İ₁] = [A][Ů₂; -İ₂]</text>
    <text x="300" y="380" text-anchor="middle" font-size="13" fill="#666">串联: [Z] = [Z₁] + [Z₂]  |  并联: [Y] = [Y₁] + [Y₂]</text>
  </g>
</svg>