<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">MOSFET基本镜像电流源</text>

    <!-- 参考电流支路 (左侧) -->
    <text x="50" y="60" font-size="12" fill="#666">+V</text>
    <text x="68" y="60" font-size="10" fill="#666">DD</text>

    <!-- 参考电阻 R -->
    <line x1="50" y1="70" x2="80" y2="70" stroke="#333" stroke-width="2"/>
    <rect x="80" y="50" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="90" y="75" text-anchor="middle" font-size="12" fill="#333">R</text>
    <line x1="100" y1="70" x2="130" y2="70" stroke="#333" stroke-width="2"/>

    <!-- M1 二极管连接 (NMOS) -->
    <line x1="130" y1="70" x2="160" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="100" x2="160" y2="120" stroke="#333" stroke-width="2"/>
    <!-- 栅极连线 (短接漏极) -->
    <line x1="160" y1="100" x2="180" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="100" x2="180" y2="120" stroke="#333" stroke-width="2"/>
    <!-- MOSFET 符号 -->
    <line x1="160" y1="120" x2="160" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="120" x2="180" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="140" x2="180" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="140" x2="150" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="140" x2="190" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="150" x2="190" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="150" x2="150" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="150" x2="190" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="160" x2="190" y2="160" stroke="#333" stroke-width="2"/>
    <!-- 衬底箭头 -->
    <line x1="170" y1="150" x2="170" y2="170" stroke="#333" stroke-width="2"/>
    <polygon points="170,170 165,165 175,165" fill="#333"/>

    <!-- 源极连线 -->
    <line x1="170" y1="170" x2="170" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="200" x2="170" y2="300" stroke="#333" stroke-width="2"/>

    <text x="195" y="105" font-size="12" font-weight="bold" fill="#333">M</text>
    <text x="203" y="105" font-size="10" fill="#666">1</text>

    <!-- IREF标注 -->
    <line x1="130" y1="70" x2="130" y2="40" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="140" y="42" font-size="11" fill="#666">I</text>
    <text x="148" y="42" font-size="9" fill="#666">REF</text>

    <!-- 输出支路 (右侧 M2) -->
    <line x1="300" y1="70" x2="330" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="70" x2="330" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="100" x2="330" y2="120" stroke="#333" stroke-width="2"/>
    <!-- 栅极连线 -->
    <line x1="180" y1="100" x2="350" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="100" x2="350" y2="120" stroke="#333" stroke-width="2"/>
    <!-- MOSFET 符号 -->
    <line x1="330" y1="120" x2="330" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="120" x2="350" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="140" x2="350" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="330" y1="140" x2="320" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="140" x2="360" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="150" x2="360" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="150" x2="320" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="150" x2="360" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="160" x2="360" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="150" x2="340" y2="170" stroke="#333" stroke-width="2"/>
    <polygon points="340,170 335,165 345,165" fill="#333"/>

    <line x1="340" y1="170" x2="340" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="200" x2="340" y2="300" stroke="#333" stroke-width="2"/>

    <text x="365" y="105" font-size="12" font-weight="bold" fill="#333">M</text>
    <text x="373" y="105" font-size="10" fill="#666">2</text>

    <!-- IOUT标注 -->
    <line x1="330" y1="70" x2="330" y2="40" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="340" y="42" font-size="11" fill="#666">I</text>
    <text x="348" y="42" font-size="9" fill="#666">OUT</text>

    <!-- 地线 -->
    <line x1="170" y1="300" x2="340" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="300" x2="170" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="300" x2="340" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="310" x2="360" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="310" x2="150" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="310" x2="190" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="310" x2="320" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="310" x2="360" y2="315" stroke="#333" stroke-width="2"/>

    <!-- 负载 RL -->
    <rect x="400" y="50" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="410" y="75" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="418" y="75" text-anchor="middle" font-size="10" fill="#666">L</text>
    <line x1="330" y1="70" x2="400" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="420" y1="70" x2="460" y2="70" stroke="#333" stroke-width="2"/>
    <text x="470" y="75" font-size="11" fill="#666">+V</text>
    <text x="478" y="75" font-size="9" fill="#666">DD</text>

    <!-- 公式 -->
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#666">I</text>
    <text x="308" y="350" text-anchor="middle" font-size="12" fill="#666">OUT</text>
    <text x="325" y="350" text-anchor="middle" font-size="12" fill="#666"> = I</text>
    <text x="340" y="350" text-anchor="middle" font-size="12" fill="#666">REF</text>
    <text x="355" y="350" text-anchor="middle" font-size="12" fill="#666"> · (W/L)</text>
    <text x="380" y="350" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="388" y="350" text-anchor="middle" font-size="12" fill="#666">/(W/L)</text>
    <text x="410" y="350" text-anchor="middle" font-size="12" fill="#666">1</text>

    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">输出阻抗：r</text>
    <text x="330" y="370" text-anchor="middle" font-size="11" fill="#666">o</text>
    <text x="340" y="370" text-anchor="middle" font-size="11" fill="#666"> = 1/(λ·I</text>
    <text x="365" y="370" text-anchor="middle" font-size="11" fill="#666">D2</text>
    <text x="378" y="370" text-anchor="middle" font-size="11" fill="#666">)</text>
  </g>
</svg>