<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">KVL回路图</text>
    <!-- 回路：一个矩形回路，4个角上各有元件 -->
    <!-- 左上角 - 电压源 -->
    <line x1="150" y1="100" x2="150" y2="150" stroke="#000" stroke-width="2"/>
    <circle cx="150" cy="165" r="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="150" x2="150" y2="145" stroke="#000" stroke-width="2"/>
    <line x1="140" y1="165" x2="160" y2="165" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="185" x2="150" y2="200" stroke="#000" stroke-width="2"/>
    <text x="130" y="145" font-size="12" fill="#333">+</text>
    <text x="170" y="145" font-size="12" fill="#333">-</text>
    <text x="110" y="165" font-size="14" fill="#d32f2f">u₁</text>

    <!-- 右上角 - 电阻R1 -->
    <line x1="300" y1="100" x2="300" y2="130" stroke="#000" stroke-width="2"/>
    <rect x="285" y="130" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="300" y1="170" x2="300" y2="200" stroke="#000" stroke-width="2"/>
    <text x="315" y="165" font-size="14" fill="#d32f2f">u₂</text>

    <!-- 右下角 - 电阻R2 -->
    <line x1="300" y1="200" x2="300" y2="230" stroke="#000" stroke-width="2"/>
    <rect x="285" y="230" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="300" y1="270" x2="300" y2="300" stroke="#000" stroke-width="2"/>
    <text x="315" y="265" font-size="14" fill="#d32f2f">u₃</text>

    <!-- 左下角 - 电阻R3 -->
    <line x1="150" y1="200" x2="150" y2="230" stroke="#000" stroke-width="2"/>
    <rect x="135" y="230" width="30" height="40" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="270" x2="150" y2="300" stroke="#000" stroke-width="2"/>
    <text x="110" y="265" font-size="14" fill="#d32f2f">u₄</text>

    <!-- 顶部连接线 -->
    <line x1="150" y1="100" x2="300" y2="100" stroke="#000" stroke-width="2"/>
    <!-- 右侧连接线 -->
    <line x1="300" y1="200" x2="300" y2="200" stroke="#000" stroke-width="2"/>
    <!-- 底部连接线 -->
    <line x1="150" y1="300" x2="300" y2="300" stroke="#000" stroke-width="2"/>
    <!-- 左侧连接线 -->
    <line x1="150" y1="200" x2="150" y2="200" stroke="#000" stroke-width="2"/>

    <!-- 回路绕行方向箭头 -->
    <path d="M 225 100 Q 280 100 290 140" fill="none" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <defs>
      <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
      </marker>
    </defs>

    <!-- 回路绕行方向箭头（手动绘制） -->
    <polygon points="290,140 282,136 284,146" fill="#1976d2"/>
    <text x="310" y="115" font-size="13" fill="#1976d2">绕行方向</text>

    <!-- KVL公式 -->
    <text x="300" y="355" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">∑u = 0, 即 u₁ + u₂ - u₃ - u₄ = 0</text>
    <text x="300" y="380" text-anchor="middle" font-size="13" fill="#666">沿回路方向，电压降取正，电压升取负</text>
  </g>
</svg>