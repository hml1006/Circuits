<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>

    <!-- Title -->
    <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">电流镜匹配版图 — 共质心布局</text>

    <!-- Common centroid layout visualization -->
    <rect x="50" y="40" width="500" height="220" fill="#fafafa" stroke="#333" stroke-width="1.5" rx="5"/>
    <text x="300" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">共质心布局 (Common Centroid) — 1:4 电流镜</text>

    <!-- Gradient arrow -->
    <line x1="60" y1="80" x2="530" y2="80" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="540" y="84" font-size="10" fill="#e65100">工艺梯度方向</text>

    <!-- Row 1 -->
    <rect x="80" y="105" width="55" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="3"/>
    <text x="107" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">M</text>
    <text x="107" y="148" text-anchor="middle" font-size="10" fill="#1565c0">(1x)</text>

    <rect x="160" y="105" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="187" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">A</text>
    <text x="187" y="148" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <rect x="240" y="105" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="267" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">B</text>
    <text x="267" y="148" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <rect x="320" y="105" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="347" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">B</text>
    <text x="347" y="148" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <rect x="400" y="105" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="427" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">A</text>
    <text x="427" y="148" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <!-- Row 2 -->
    <rect x="80" y="175" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="107" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">A</text>
    <text x="107" y="218" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <rect x="160" y="175" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="187" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">B</text>
    <text x="187" y="218" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <rect x="240" y="175" width="55" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="3"/>
    <text x="267" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">M</text>
    <text x="267" y="218" text-anchor="middle" font-size="10" fill="#1565c0">(1x)</text>

    <rect x="320" y="175" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="347" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">A</text>
    <text x="347" y="218" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <rect x="400" y="175" width="55" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="3"/>
    <text x="427" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">B</text>
    <text x="427" y="218" text-anchor="middle" font-size="10" fill="#2e7d32">(1x)</text>

    <!-- Dummy devices -->
    <rect x="60" y="105" width="15" height="55" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="2"/>
    <text x="67" y="140" text-anchor="middle" font-size="8" fill="#666">D</text>
    <rect x="60" y="175" width="15" height="55" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="2"/>
    <text x="67" y="210" text-anchor="middle" font-size="8" fill="#666">D</text>
    <rect x="460" y="105" width="15" height="55" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="2"/>
    <text x="467" y="140" text-anchor="middle" font-size="8" fill="#666">D</text>
    <rect x="460" y="175" width="15" height="55" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="2"/>
    <text x="467" y="210" text-anchor="middle" font-size="8" fill="#666">D</text>

    <text x="500" y="140" font-size="9" fill="#666">D = Dummy</text>

    <!-- Legend and formula -->
    <rect x="15" y="275" width="570" height="115" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="300" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">电流镜匹配原理</text>

    <!-- Legend -->
    <rect x="30" y="305" width="20" height="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="55" y="315" font-size="10" fill="#555">M = 主器件 (Master)</text>
    <rect x="200" y="305" width="20" height="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="225" y="315" font-size="10" fill="#555">A, B = 从器件 (Slave)</text>
    <rect x="400" y="305" width="20" height="12" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
    <text x="425" y="315" font-size="10" fill="#555">D = 虚拟器件 (Dummy)</text>

    <text x="30" y="340" font-size="11" font-weight="bold" fill="#333">失配电流公式：</text>
    <text x="30" y="360" font-size="11" fill="#555">ΔI/I = Δ(W/L)/(W/L) - ΔV<sub>TH</sub>/(V<sub>GS</sub> - V<sub>TH</sub>)</text>

    <text x="30" y="380" font-size="10" fill="#555">共质心布局优势：对线性工艺梯度 (温度、应力、掺杂) 具有一阶抵消效果</text>
    <text x="30" y="393" font-size="10" fill="#555">布局规则：相同方向 | 相同环境 | 远离热源 | 添加虚拟器件</text>
  </g>
</svg>