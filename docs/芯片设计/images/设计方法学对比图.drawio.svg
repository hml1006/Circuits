<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>

    <!-- Title -->
    <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">集成电路设计方法学对比</text>

    <!-- Comparison table -->
    <!-- Table header -->
    <rect x="10" y="35" width="120" height="30" fill="#1565c0" stroke="#0d47a1" stroke-width="2" rx="0"/>
    <text x="70" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">方法学</text>

    <rect x="130" y="35" width="100" height="30" fill="#1565c0" stroke="#0d47a1" stroke-width="2" rx="0"/>
    <text x="180" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">优点</text>

    <rect x="230" y="35" width="100" height="30" fill="#1565c0" stroke="#0d47a1" stroke-width="2" rx="0"/>
    <text x="280" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">缺点</text>

    <rect x="330" y="35" width="140" height="30" fill="#1565c0" stroke="#0d47a1" stroke-width="2" rx="0"/>
    <text x="400" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">适用场景</text>

    <rect x="470" y="35" width="120" height="30" fill="#1565c0" stroke="#0d47a1" stroke-width="2" rx="0"/>
    <text x="530" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">设计周期</text>

    <!-- Row 1: Full Custom -->
    <rect x="10" y="65" width="120" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="0"/>
    <text x="70" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">全定制设计</text>
    <text x="70" y="100" text-anchor="middle" font-size="9" fill="#1565c0">Full Custom</text>
    <text x="70" y="115" text-anchor="middle" font-size="9" fill="#1565c0">⭐⭐⭐</text>

    <rect x="130" y="65" width="100" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="0"/>
    <text x="180" y="85" text-anchor="middle" font-size="10" fill="#2e7d32">面积小</text>
    <text x="180" y="100" text-anchor="middle" font-size="10" fill="#2e7d32">性能高</text>
    <text x="180" y="115" text-anchor="middle" font-size="10" fill="#2e7d32">功耗低</text>

    <rect x="230" y="65" width="100" height="55" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="0"/>
    <text x="280" y="85" text-anchor="middle" font-size="10" fill="#c62828">设计周期长</text>
    <text x="280" y="100" text-anchor="middle" font-size="10" fill="#c62828">人力成本高</text>
    <text x="280" y="115" text-anchor="middle" font-size="10" fill="#c62828">NRE费用高</text>

    <rect x="330" y="65" width="140" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="400" y="85" text-anchor="middle" font-size="10" fill="#555">模拟电路</text>
    <text x="400" y="100" text-anchor="middle" font-size="10" fill="#555">高性能数字电路</text>
    <text x="400" y="115" text-anchor="middle" font-size="10" fill="#555">存储器</text>

    <rect x="470" y="65" width="120" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="530" y="95" text-anchor="middle" font-size="11" fill="#555">6~18个月</text>

    <!-- Row 2: Semi-Custom -->
    <rect x="10" y="120" width="120" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="0"/>
    <text x="70" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">半定制设计</text>
    <text x="70" y="155" text-anchor="middle" font-size="9" fill="#1565c0">Semi-Custom</text>
    <text x="70" y="170" text-anchor="middle" font-size="9" fill="#1565c0">⭐⭐</text>

    <rect x="130" y="120" width="100" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="0"/>
    <text x="180" y="140" text-anchor="middle" font-size="10" fill="#2e7d32">设计周期短</text>
    <text x="180" y="155" text-anchor="middle" font-size="10" fill="#2e7d32">工具自动化</text>

    <rect x="230" y="120" width="100" height="55" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="0"/>
    <text x="280" y="140" text-anchor="middle" font-size="10" fill="#c62828">面积利用率低</text>
    <text x="280" y="155" text-anchor="middle" font-size="10" fill="#c62828">性能受限</text>

    <rect x="330" y="120" width="140" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="400" y="140" text-anchor="middle" font-size="10" fill="#555">ASIC</text>
    <text x="400" y="155" text-anchor="middle" font-size="10" fill="#555">数字逻辑电路</text>

    <rect x="470" y="120" width="120" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="530" y="150" text-anchor="middle" font-size="11" fill="#555">3~12个月</text>

    <!-- Row 3: Standard Cell -->
    <rect x="10" y="175" width="120" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="0"/>
    <text x="70" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">基于标准单元</text>
    <text x="70" y="210" text-anchor="middle" font-size="9" fill="#1565c0">Standard Cell</text>
    <text x="70" y="225" text-anchor="middle" font-size="9" fill="#1565c0">⭐⭐⭐</text>

    <rect x="130" y="175" width="100" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="0"/>
    <text x="180" y="195" text-anchor="middle" font-size="10" fill="#2e7d32">设计灵活</text>
    <text x="180" y="210" text-anchor="middle" font-size="10" fill="#2e7d32">自动化程度高</text>

    <rect x="230" y="175" width="100" height="55" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="0"/>
    <text x="280" y="195" text-anchor="middle" font-size="10" fill="#c62828">比全定制面积大</text>
    <text x="280" y="210" text-anchor="middle" font-size="10" fill="#c62828">功耗较高</text>

    <rect x="330" y="175" width="140" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="400" y="195" text-anchor="middle" font-size="10" fill="#555">主流数字芯片</text>
    <text x="400" y="210" text-anchor="middle" font-size="10" fill="#555">SoC设计</text>

    <rect x="470" y="175" width="120" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="530" y="205" text-anchor="middle" font-size="11" fill="#555">3~9个月</text>

    <!-- Row 4: Gate Array -->
    <rect x="10" y="230" width="120" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="0"/>
    <text x="70" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">基于门阵列</text>
    <text x="70" y="265" text-anchor="middle" font-size="9" fill="#1565c0">Gate Array</text>
    <text x="70" y="280" text-anchor="middle" font-size="9" fill="#1565c0">⭐</text>

    <rect x="130" y="230" width="100" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="0"/>
    <text x="180" y="250" text-anchor="middle" font-size="10" fill="#2e7d32">设计周期短</text>
    <text x="180" y="265" text-anchor="middle" font-size="10" fill="#2e7d32">掩模成本低</text>

    <rect x="230" y="230" width="100" height="55" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="0"/>
    <text x="280" y="250" text-anchor="middle" font-size="10" fill="#c62828">面积利用率低</text>
    <text x="280" y="265" text-anchor="middle" font-size="10" fill="#c62828">性能受限</text>

    <rect x="330" y="230" width="140" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="400" y="250" text-anchor="middle" font-size="10" fill="#555">小批量</text>
    <text x="400" y="265" text-anchor="middle" font-size="10" fill="#555">快速原型</text>

    <rect x="470" y="230" width="120" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="530" y="260" text-anchor="middle" font-size="11" fill="#555">1~3个月</text>

    <!-- Row 5: FPGA -->
    <rect x="10" y="285" width="120" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="0"/>
    <text x="70" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">FPGA</text>
    <text x="70" y="320" text-anchor="middle" font-size="10" fill="#1565c0">可重配置</text>
    <text x="70" y="335" text-anchor="middle" font-size="9" fill="#1565c0">⭐⭐</text>

    <rect x="130" y="285" width="100" height="55" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="0"/>
    <text x="180" y="305" text-anchor="middle" font-size="10" fill="#2e7d32">可重配置</text>
    <text x="180" y="320" text-anchor="middle" font-size="10" fill="#2e7d32">快速原型验证</text>

    <rect x="230" y="285" width="100" height="55" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="0"/>
    <text x="280" y="305" text-anchor="middle" font-size="10" fill="#c62828">速度慢</text>
    <text x="280" y="320" text-anchor="middle" font-size="10" fill="#c62828">功耗高</text>
    <text x="280" y="335" text-anchor="middle" font-size="10" fill="#c62828">成本高</text>

    <rect x="330" y="285" width="140" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="400" y="305" text-anchor="middle" font-size="10" fill="#555">原型验证</text>
    <text x="400" y="320" text-anchor="middle" font-size="10" fill="#555">小批量产品</text>

    <rect x="470" y="285" width="120" height="55" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="0"/>
    <text x="530" y="315" text-anchor="middle" font-size="11" fill="#555">即时</text>

    <!-- Summary -->
    <rect x="10" y="350" width="580" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="300" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">总结：</text>
    <text x="300" y="383" text-anchor="middle" font-size="10" fill="#555">全定制 → 最佳性能但成本最高 | 标准单元 → 主流选择 | FPGA → 快速原型验证</text>
  </g>
</svg>