<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">竞争冒险波形图</text>
    <!-- 逻辑电路 -->
    <rect x="30" y="40" width="120" height="40" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="90" y="65" text-anchor="middle" font-size="12" fill="#000">与非门</text>
    <line x1="10" y1="50" x2="30" y2="50" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="70" x2="30" y2="70" stroke="#000" stroke-width="1.5"/>
    <text x="5" y="54" text-anchor="end" font-size="11" fill="#000">A</text>
    <text x="5" y="74" text-anchor="end" font-size="11" fill="#000">B</text>
    <line x1="150" y1="60" x2="180" y2="60" stroke="#000" stroke-width="1.5"/>
    <text x="185" y="64" text-anchor="start" font-size="11" fill="#000">Y</text>
    <text x="90" y="95" text-anchor="middle" font-size="11" fill="#555">Y = A·B</text>
    <!-- 波形图区域 -->
    <rect x="30" y="115" width="540" height="270" rx="4" fill="#fafafa" stroke="#555" stroke-width="1" stroke-dasharray="3"/>
    <text x="300" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">波形图</text>
    <!-- 时间轴 -->
    <line x1="50" y1="148" x2="560" y2="148" stroke="#000" stroke-width="1"/>
    <text x="45" y="152" text-anchor="end" font-size="11" fill="#000">t</text>
    <!-- 信号 A -->
    <text x="40" y="175" text-anchor="end" font-size="12" font-weight="bold" fill="#000">A</text>
    <line x1="50" y1="170" x2="120" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="170" x2="120" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="155" x2="200" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="155" x2="200" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="200" y1="170" x2="280" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="280" y1="170" x2="280" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="280" y1="155" x2="360" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="360" y1="155" x2="360" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="360" y1="170" x2="440" y2="170" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="170" x2="440" y2="155" stroke="#000" stroke-width="2"/>
    <line x1="440" y1="155" x2="560" y2="155" stroke="#000" stroke-width="2"/>
    <!-- 信号 B -->
    <text x="40" y="210" text-anchor="end" font-size="12" font-weight="bold" fill="#000">B</text>
    <line x1="50" y1="205" x2="80" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="205" x2="80" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="190" x2="160" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="160" y1="190" x2="160" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="160" y1="205" x2="240" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="240" y1="205" x2="240" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="240" y1="190" x2="320" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="190" x2="320" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="320" y1="205" x2="400" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="400" y1="205" x2="400" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="400" y1="190" x2="480" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="480" y1="190" x2="480" y2="205" stroke="#000" stroke-width="2"/>
    <line x1="480" y1="205" x2="560" y2="205" stroke="#000" stroke-width="2"/>
    <!-- 信号 Y (有冒险) -->
    <text x="40" y="248" text-anchor="end" font-size="12" font-weight="bold" fill="#000">Y</text>
    <!-- 正常 Y = A·B 应为高电平，因为 A 和 B 不同时为高 -->
    <line x1="50" y1="240" x2="80" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="80" y1="240" x2="100" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="100" y1="240" x2="105" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="105" y1="240" x2="120" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="120" y1="240" x2="160" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="160" y1="240" x2="200" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="200" y1="240" x2="240" y2="240" stroke="#00a" stroke-width="2"/>
    <!-- 毛刺 -->
    <line x1="240" y1="240" x2="245" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="245" y1="240" x2="248" y2="225" stroke="#d00" stroke-width="2"/>
    <line x1="248" y1="225" x2="252" y2="240" stroke="#d00" stroke-width="2"/>
    <line x1="252" y1="240" x2="320" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="320" y1="240" x2="360" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="360" y1="240" x2="400" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="400" y1="240" x2="440" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="440" y1="240" x2="480" y2="240" stroke="#00a" stroke-width="2"/>
    <line x1="480" y1="240" x2="560" y2="240" stroke="#00a" stroke-width="2"/>
    <!-- 毛刺标注 -->
    <line x1="248" y1="220" x2="248" y2="210" stroke="#d00" stroke-width="1" stroke-dasharray="2"/>
    <text x="248" y="205" text-anchor="middle" font-size="10" fill="#d00">毛刺</text>
    <!-- 说明 -->
    <rect x="30" y="270" width="540" height="55" rx="5" fill="#fff5f5" stroke="#d00" stroke-width="1.5"/>
    <text x="300" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#d00">竞争冒险说明</text>
    <text x="50" y="310" text-anchor="start" font-size="11" fill="#555">当 A=1, B 由 0→1 时，由于非门延迟导致 B 和 B 不同时到达，产生静态 0 冒险</text>
    <text x="50" y="325" text-anchor="start" font-size="11" fill="#555">消除方法：增加冗余项、输出端加滤波电容、引入选通脉冲</text>
  </g>
</svg>