<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">串并联电阻示意图</text>
    
    <!-- 左侧：串联电阻 -->
    <rect x="20" y="55" width="280" height="155" rx="8" ry="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="160" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67e22">串联电阻</text>
    
    <line x1="40" y1="110" x2="75" y2="110" stroke="#333" stroke-width="2"/>
    <rect x="75" y="95" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="95" y="115" text-anchor="middle" font-size="12" fill="#333">R₁</text>
    <line x1="115" y1="110" x2="140" y2="110" stroke="#333" stroke-width="2"/>
    <rect x="140" y="95" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="160" y="115" text-anchor="middle" font-size="12" fill="#333">R₂</text>
    <line x1="180" y1="110" x2="205" y2="110" stroke="#333" stroke-width="2"/>
    <rect x="205" y="95" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="225" y="115" text-anchor="middle" font-size="12" fill="#333">R₃</text>
    <line x1="245" y1="110" x2="280" y2="110" stroke="#333" stroke-width="2"/>
    
    <text x="160" y="150" text-anchor="middle" font-size="11" fill="#666">R总 = R₁ + R₂ + R₃</text>
    <text x="160" y="170" text-anchor="middle" font-size="11" fill="#666">越串越大，大于任一电阻</text>
    <text x="160" y="190" text-anchor="middle" font-size="11" fill="#e67e22">串联分压：U ∝ R</text>
    
    <!-- 右侧：并联电阻 -->
    <rect x="300" y="55" width="280" height="155" rx="8" ry="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="440" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">并联电阻</text>
    
    <line x1="320" y1="100" x2="345" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="100" x2="320" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="320" y1="130" x2="345" y2="130" stroke="#333" stroke-width="2"/>
    
    <rect x="345" y="85" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="365" y="105" text-anchor="middle" font-size="12" fill="#333">R₁</text>
    <rect x="345" y="115" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="365" y="135" text-anchor="middle" font-size="12" fill="#333">R₂</text>
    
    <line x1="385" y1="100" x2="410" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="385" y1="130" x2="410" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="410" y1="100" x2="410" y2="130" stroke="#333" stroke-width="2"/>
    
    <rect x="410" y="85" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="430" y="105" text-anchor="middle" font-size="12" fill="#333">R₃</text>
    
    <line x1="450" y1="100" x2="475" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="130" x2="475" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="475" y1="100" x2="475" y2="130" stroke="#333" stroke-width="2"/>
    
    <rect x="475" y="85" width="40" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="495" y="105" text-anchor="middle" font-size="12" fill="#333">R₄</text>
    
    <line x1="515" y1="100" x2="545" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="515" y1="130" x2="545" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="545" y1="100" x2="545" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="545" y1="115" x2="560" y2="115" stroke="#333" stroke-width="2"/>
    
    <text x="440" y="150" text-anchor="middle" font-size="11" fill="#666">1/R总 = 1/R₁ + 1/R₂ + 1/R₃ + 1/R₄</text>
    <text x="440" y="170" text-anchor="middle" font-size="11" fill="#666">越并越小，小于任一电阻</text>
    <text x="440" y="190" text-anchor="middle" font-size="11" fill="#27ae60">并联分流：I ∝ 1/R</text>
    
    <!-- 对比总结 -->
    <rect x="50" y="230" width="500" height="150" rx="8" ry="8" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="300" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">串并联电阻对比总结</text>
    
    <text x="70" y="280" font-size="12" font-weight="bold" fill="#e67e22">串联</text>
    <text x="120" y="280" font-size="12" fill="#555">R总 = R₁ + R₂ + ... + Rn</text>
    <text x="120" y="300" font-size="12" fill="#555">总电阻等于各电阻之和</text>
    <text x="120" y="320" font-size="12" fill="#555">分压：U₁/U₂ = R₁/R₂</text>
    
    <line x1="300" y1="265" x2="300" y2="370" stroke="#ddd" stroke-width="1.5"/>
    
    <text x="320" y="280" font-size="12" font-weight="bold" fill="#27ae60">并联</text>
    <text x="370" y="280" font-size="12" fill="#555">1/R总 = 1/R₁ + 1/R₂ + ...</text>
    <text x="370" y="300" font-size="12" fill="#555">总电阻倒数等于各电阻倒数之和</text>
    <text x="370" y="320" font-size="12" fill="#555">分流：I₁/I₂ = R₂/R₁</text>
    
    <text x="300" y="355" text-anchor="middle" font-size="11" fill="#888">R = ρ · L / S 是电阻的决定式</text>
  </g>
</svg>