<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">IR Drop 分析图</text>
    <!-- Power grid model -->
    <text x="150" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">电源网络模型 (Power Grid)</text>
    <!-- Power grid - horizontal lines -->
    <line x1="30" y1="80" x2="300" y2="80" stroke="#e53935" stroke-width="2.5"/>
    <line x1="30" y1="110" x2="300" y2="110" stroke="#e53935" stroke-width="2.5"/>
    <line x1="30" y1="140" x2="300" y2="140" stroke="#e53935" stroke-width="2.5"/>
    <line x1="30" y1="170" x2="300" y2="170" stroke="#e53935" stroke-width="2.5"/>
    <text x="10" y="130" text-anchor="middle" font-size="10" fill="#e53935" transform="rotate(-90,10,130)">VDD Grid</text>
    <!-- Power grid - vertical lines -->
    <line x1="60" y1="70" x2="60" y2="180" stroke="#e53935" stroke-width="2"/>
    <line x1="110" y1="70" x2="110" y2="180" stroke="#e53935" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="180" stroke="#e53935" stroke-width="2"/>
    <line x1="210" y1="70" x2="210" y2="180" stroke="#e53935" stroke-width="2"/>
    <line x1="260" y1="70" x2="260" y2="180" stroke="#e53935" stroke-width="2"/>
    <!-- Current sources (representing standard cells) -->
    <rect x="70" y="85" width="30" height="20" rx="2" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
    <text x="85" y="99" text-anchor="middle" font-size="8" fill="#c62828">I₁</text>
    <rect x="120" y="115" width="30" height="20" rx="2" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
    <text x="135" y="129" text-anchor="middle" font-size="8" fill="#c62828">I₂</text>
    <rect x="170" y="85" width="30" height="20" rx="2" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
    <text x="185" y="99" text-anchor="middle" font-size="8" fill="#c62828">I₃</text>
    <rect x="220" y="145" width="30" height="20" rx="2" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
    <text x="235" y="159" text-anchor="middle" font-size="8" fill="#c62828">I₄</text>
    <!-- Voltage drop along grid -->
    <text x="150" y="200" text-anchor="middle" font-size="10" fill="#c62828">IR Drop: ΔV = I · R</text>
    <!-- Voltage drop map -->
    <text x="450" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">IR Drop 分布图</text>
    <!-- Heat map simulation -->
    <rect x="330" y="70" width="240" height="130" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <!-- Gradient regions -->
    <rect x="330" y="70" width="60" height="130" fill="#c8e6c9" stroke="#333" stroke-width="0.5"/>
    <rect x="390" y="70" width="60" height="130" fill="#fff9c4" stroke="#333" stroke-width="0.5"/>
    <rect x="450" y="70" width="60" height="130" fill="#ffcc80" stroke="#333" stroke-width="0.5"/>
    <rect x="510" y="70" width="60" height="130" fill="#fce4ec" stroke="#333" stroke-width="0.5"/>
    <text x="360" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e7d32">低</text>
    <text x="420" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#f57f17">中</text>
    <text x="480" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">高</text>
    <text x="540" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">严重</text>
    <text x="450" y="180" text-anchor="middle" font-size="10" fill="#555">IR Drop 热力图</text>
    <!-- Formulas -->
    <rect x="330" y="215" width="240" height="70" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="450" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">IR Drop 计算公式</text>
    <text x="350" y="255" font-size="10" fill="#333">静态 IR Drop: ΔVstatic = Iavg · Rgrid</text>
    <text x="350" y="275" font-size="10" fill="#333">动态 IR Drop: ΔVdynamic = L·dI/dt + Ipeak·Rgrid</text>
    <!-- Impact and mitigation -->
    <rect x="20" y="225" width="290" height="70" rx="5" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="165" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">IR Drop 影响</text>
    <text x="40" y="265" font-size="10" fill="#c62828">• 降低电路速度 (延迟增加)</text>
    <text x="40" y="282" font-size="10" fill="#c62828">• 可能导致时序违反</text>
    <text x="40" y="299" font-size="10" fill="#c62828">• 严重时导致逻辑错误</text>
    <!-- Methods -->
    <rect x="20" y="310" width="560" height="80" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="300" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">IR Drop 缓解方法</text>
    <text x="40" y="350" font-size="10" fill="#2e7d32">• 增加电源线宽度/密度 | • 增加电源焊盘 (C4 bump) 数量</text>
    <text x="40" y="368" font-size="10" fill="#2e7d32">• 添加去耦电容 (Decap) | • 降低局部电流密度 | • 分层电源网络设计</text>
    <text x="40" y="385" font-size="10" fill="#2e7d32">• 允许IR Drop通常为电源电压的3%~5%</text>
  </g>
</svg>