<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">平行板电容器结构图</text>
    
    <!-- 上极板 -->
    <rect x="120" y="100" width="360" height="30" rx="5" ry="5" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="300" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">上极板（+Q）</text>
    
    <!-- 下极板 -->
    <rect x="120" y="270" width="360" height="30" rx="5" ry="5" fill="#4dabf7" stroke="#1976d2" stroke-width="2"/>
    <text x="300" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">下极板（−Q）</text>
    
    <!-- 电介质 -->
    <rect x="140" y="150" width="320" height="100" rx="8" ry="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="300" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#388e3c">电介质（ε）</text>
    
    <!-- 极板间距 d -->
    <line x1="490" y1="115" x2="490" y2="285" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="485" y1="115" x2="495" y2="115" stroke="#ff9800" stroke-width="1.5"/>
    <line x1="485" y1="285" x2="495" y2="285" stroke="#ff9800" stroke-width="1.5"/>
    <text x="510" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#ff9800" transform="rotate(90,510,208)">d</text>
    
    <!-- 正对面积 S 标注 -->
    <line x1="120" y1="330" x2="120" y2="350" stroke="#9c27b0" stroke-width="1.5"/>
    <line x1="480" y1="330" x2="480" y2="350" stroke="#9c27b0" stroke-width="1.5"/>
    <line x1="120" y1="340" x2="480" y2="340" stroke="#9c27b0" stroke-width="2"/>
    <text x="300" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c27b0">S（正对面积）</text>
    
    <!-- 电场线 -->
    <line x1="200" y1="130" x2="200" y2="270" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="300" y1="130" x2="300" y2="270" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="400" y1="130" x2="400" y2="270" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="200,260 205,270 195,270" fill="#4dabf7" opacity="0.6"/>
    <polygon points="300,260 305,270 295,270" fill="#4dabf7" opacity="0.6"/>
    <polygon points="400,260 405,270 395,270" fill="#4dabf7" opacity="0.6"/>
    
    <!-- 公式 -->
    <text x="300" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">C = εS / (4πkd) = ε<tspan font-size="10" dy="3">r</tspan><tspan dy="-3">ε<tspan font-size="10" dy="3">0</tspan><tspan dy="-3">S / d</tspan></tspan></tspan></text>
  </g>
</svg>