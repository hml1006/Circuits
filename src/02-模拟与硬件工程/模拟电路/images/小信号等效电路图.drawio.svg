<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">BJT混合π小信号等效模型</text>

    <!-- B'节点 -->
    <circle cx="120" cy="120" r="3" fill="#333" stroke="#333" stroke-width="1"/>
    <text x="100" y="115" text-anchor="end" font-size="12" fill="#333">B'</text>
    <!-- B节点 -->
    <circle cx="120" cy="200" r="3" fill="#333" stroke="#333" stroke-width="1"/>
    <text x="100" y="205" text-anchor="end" font-size="12" fill="#333">B</text>
    <!-- E节点 -->
    <circle cx="250" cy="300" r="3" fill="#333" stroke="#333" stroke-width="1"/>
    <text x="255" y="320" text-anchor="middle" font-size="12" fill="#333">E</text>
    <!-- C节点 -->
    <circle cx="400" cy="120" r="3" fill="#333" stroke="#333" stroke-width="1"/>
    <text x="410" y="115" font-size="12" fill="#333">C</text>

    <!-- rbb' -->
    <rect x="120" y="185" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="128" y="205" text-anchor="middle" font-size="9" fill="#333">r</text>
    <text x="135" y="205" text-anchor="middle" font-size="7" fill="#666">bb'</text>
    <line x1="120" y1="200" x2="136" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="120" x2="120" y2="200" stroke="#333" stroke-width="2"/>

    <!-- rb'e -->
    <rect x="136" y="105" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="144" y="125" text-anchor="middle" font-size="9" fill="#333">r</text>
    <text x="151" y="125" text-anchor="middle" font-size="7" fill="#666">b'e</text>
    <line x1="120" y1="120" x2="136" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="152" y1="120" x2="200" y2="120" stroke="#333" stroke-width="2"/>

    <!-- Cb'e -->
    <line x1="200" y1="120" x2="220" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="220" y1="108" x2="240" y2="108" stroke="#333" stroke-width="2"/>
    <line x1="220" y1="132" x2="240" y2="132" stroke="#333" stroke-width="2"/>
    <text x="230" y="103" text-anchor="middle" font-size="9" fill="#333">C</text>
    <text x="237" y="103" text-anchor="middle" font-size="7" fill="#666">b'e</text>
    <line x1="240" y1="120" x2="260" y2="120" stroke="#333" stroke-width="2"/>

    <!-- Cb'c -->
    <line x1="200" y1="120" x2="200" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="170" x2="220" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="220" y1="158" x2="240" y2="158" stroke="#333" stroke-width="2"/>
    <line x1="220" y1="182" x2="240" y2="182" stroke="#333" stroke-width="2"/>
    <text x="230" y="153" text-anchor="middle" font-size="9" fill="#333">C</text>
    <text x="237" y="153" text-anchor="middle" font-size="7" fill="#666">b'c</text>
    <line x1="240" y1="170" x2="260" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="170" x2="260" y2="120" stroke="#333" stroke-width="2"/>

    <!-- gm Vbe 受控源 -->
    <line x1="260" y1="120" x2="300" y2="120" stroke="#333" stroke-width="2"/>
    <circle cx="320" cy="120" r="18" fill="none" stroke="#333" stroke-width="2"/>
    <text x="320" y="125" text-anchor="middle" font-size="10" fill="#333">g</text>
    <text x="325" y="125" text-anchor="middle" font-size="8" fill="#666">m</text>
    <line x1="338" y1="120" x2="370" y2="120" stroke="#333" stroke-width="2"/>
    <text x="320" y="110" text-anchor="middle" font-size="8" fill="#666">V</text>
    <text x="325" y="110" text-anchor="middle" font-size="8" fill="#666">be</text>

    <!-- rce -->
    <rect x="370" y="165" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="378" y="185" text-anchor="middle" font-size="9" fill="#333">r</text>
    <text x="385" y="185" text-anchor="middle" font-size="7" fill="#666">ce</text>
    <line x1="370" y1="120" x2="370" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="386" y1="180" x2="386" y2="300" stroke="#333" stroke-width="2"/>

    <!-- 输出 -->
    <line x1="370" y1="120" x2="400" y2="120" stroke="#333" stroke-width="2"/>

    <!-- E节点连接 -->
    <line x1="120" y1="200" x2="120" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="300" x2="250" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="386" y1="300" x2="250" y2="300" stroke="#333" stroke-width="2"/>

    <!-- 受控源箭头标注 -->
    <text x="320" y="145" text-anchor="middle" font-size="8" fill="#666">g</text>
    <text x="325" y="145" text-anchor="middle" font-size="8" fill="#666">m</text>
    <text x="333" y="145" text-anchor="middle" font-size="8" fill="#666">·V</text>
    <text x="345" y="145" text-anchor="middle" font-size="8" fill="#666">be</text>
  </g>
</svg>