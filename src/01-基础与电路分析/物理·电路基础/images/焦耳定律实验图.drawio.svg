<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">焦耳定律实验图</text>
    <text x="300" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">Q = I²Rt</text>
    
    <!-- 实验装置 -->
    <!-- 左侧烧瓶 -->
    <rect x="60" y="90" width="200" height="180" rx="10" ry="10" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
    
    <!-- 烧瓶 -->
    <path d="M 100 250 L 100 200 Q 100 160 130 160 L 190 160 Q 220 160 220 200 L 220 250 Z" fill="#fff" stroke="#333" stroke-width="2"/>
    <!-- 液体 -->
    <rect x="102" y="220" width="116" height="30" rx="2" ry="2" fill="#e74c3c" opacity="0.4"/>
    <text x="160" y="240" text-anchor="middle" font-size="10" fill="#c0392b">煤油/水</text>
    
    <!-- 电阻丝 -->
    <path d="M 120 180 L 140 180 Q 150 180 150 190 Q 150 200 160 200 Q 170 200 170 190 Q 170 180 180 180 L 200 180" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <text x="160" y="175" text-anchor="middle" font-size="10" fill="#e74c3c">R₁</text>
    
    <!-- 温度计 -->
    <rect x="155" y="100" width="10" height="60" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="157" y="105" width="6" height="15" rx="2" ry="2" fill="#e74c3c"/>
    <line x1="155" y1="120" x2="165" y2="120" stroke="#333" stroke-width="1"/>
    <line x1="155" y1="130" x2="165" y2="130" stroke="#333" stroke-width="1"/>
    <line x1="155" y1="140" x2="165" y2="140" stroke="#333" stroke-width="1"/>
    <text x="170" y="105" font-size="9" fill="#333">温度计</text>
    
    <!-- 右侧烧瓶 -->
    <rect x="340" y="90" width="200" height="180" rx="10" ry="10" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
    
    <path d="M 380 250 L 380 200 Q 380 160 410 160 L 470 190 Q 500 160 500 200 L 500 250 Z" fill="#fff" stroke="#333" stroke-width="2"/>
    <!-- 液体 -->
    <rect x="382" y="220" width="116" height="30" rx="2" ry="2" fill="#e74c3c" opacity="0.4"/>
    <text x="440" y="240" text-anchor="middle" font-size="10" fill="#c0392b">煤油/水</text>
    
    <!-- 电阻丝 -->
    <path d="M 400 180 L 410 180 Q 415 180 415 190 Q 415 200 420 200 Q 425 200 425 190 Q 425 180 430 180 L 440 180 Q 445 180 445 190 Q 445 200 450 200 Q 455 200 455 190 Q 455 180 460 180 L 480 180" fill="none" stroke="#2980b9" stroke-width="2"/>
    <text x="440" y="175" text-anchor="middle" font-size="10" fill="#2980b9">R₂</text>
    
    <!-- 温度计 -->
    <rect x="435" y="100" width="10" height="60" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect x="437" y="105" width="6" height="15" rx="2" ry="2" fill="#e74c3c"/>
    <line x1="435" y1="120" x2="445" y2="120" stroke="#333" stroke-width="1"/>
    <line x1="435" y1="130" x2="445" y2="130" stroke="#333" stroke-width="1"/>
    <line x1="435" y1="140" x2="445" y2="140" stroke="#333" stroke-width="1"/>
    <text x="450" y="105" font-size="9" fill="#333">温度计</text>
    
    <!-- 电路连接 -->
    <line x1="160" y1="270" x2="160" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="270" x2="440" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="310" x2="170" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="440" y1="310" x2="430" y2="310" stroke="#333" stroke-width="2"/>
    
    <!-- 电源 -->
    <rect x="250" y="330" width="50" height="30" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="262" y1="330" x2="262" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="288" y1="330" x2="288" y2="320" stroke="#333" stroke-width="2"/>
    <text x="275" y="348" text-anchor="middle" font-size="10" fill="#333">+</text>
    <text x="275" y="358" text-anchor="middle" font-size="10" fill="#333">−</text>
    
    <line x1="170" y1="310" x2="250" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="320" x2="250" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="430" y1="310" x2="300" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="320" x2="300" y2="310" stroke="#333" stroke-width="2"/>
    
    <!-- 开关 -->
    <line x1="300" y1="310" x2="330" y2="310" stroke="#333" stroke-width="2"/>
    <circle cx="330" cy="310" r="3" fill="#333"/>
    <line x1="330" y1="310" x2="345" y2="295" stroke="#333" stroke-width="2"/>
    <circle cx="345" cy="295" r="3" fill="#333"/>
    <line x1="345" y1="295" x2="370" y2="295" stroke="#333" stroke-width="2"/>
    <text x="340" y="285" text-anchor="middle" font-size="11" fill="#555">S</text>
    <line x1="370" y1="295" x2="400" y2="295" stroke="#333" stroke-width="2"/>
    <line x1="400" y1="295" x2="400" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="400" y1="310" x2="430" y2="310" stroke="#333" stroke-width="2"/>
    
    <!-- 实验结论 -->
    <rect x="30" y="280" width="540" height="105" rx="8" ry="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="2" opacity="0"/>
    <rect x="30" y="370" width="540" height="25" rx="4" ry="4" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="300" y="387" text-anchor="middle" font-size="12" fill="#c0392b">焦耳定律：Q = I²Rt — 电流通过导体产生的热量与电流的平方、电阻和通电时间成正比</text>
  </g>
</svg>