<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">串联负反馈稳压电路</text>

    <!-- 输入 -->
    <text x="30" y="90" font-size="12" fill="#666">V</text>
    <text x="30" y="102" font-size="10" fill="#666">I</text>
    <text x="30" y="115" font-size="10" fill="#666">(未稳)</text>
    <line x1="55" y1="90" x2="90" y2="90" stroke="#333" stroke-width="2"/>

    <!-- 调整管 Q1 -->
    <line x1="90" y1="90" x2="130" y2="90" stroke="#333" stroke-width="2"/>
    <line x1="130" y1="90" x2="130" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="130" y1="120" x2="130" y2="160" stroke="#333" stroke-width="2"/>
    <polygon points="130,160 140,150 140,170" fill="#333"/>
    <line x1="130" y1="160" x2="90" y2="180" stroke="#333" stroke-width="2"/>
    <text x="145" y="125" font-size="12" font-weight="bold" fill="#333">Q</text>
    <text x="153" y="125" font-size="10" fill="#666">1</text>
    <text x="145" y="165" font-size="10" fill="#666">调整管</text>

    <!-- 调整管集电极到输出 -->
    <line x1="130" y1="90" x2="200" y2="90" stroke="#333" stroke-width="2"/>
    <text x="210" y="95" font-size="12" fill="#666">V</text>
    <text x="210" y="107" font-size="10" fill="#666">O</text>
    <text x="210" y="120" font-size="10" fill="#666">(稳定)</text>
    <line x1="200" y1="90" x2="250" y2="90" stroke="#333" stroke-width="2"/>

    <!-- 取样电阻 R1 -->
    <rect x="250" y="70" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="258" y="95" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="266" y="95" text-anchor="middle" font-size="9" fill="#666">1</text>
    <line x1="250" y1="90" x2="240" y2="90" stroke="#333" stroke-width="2"/>

    <!-- 取样电阻 R2 -->
    <line x1="266" y1="90" x2="300" y2="90" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="90" x2="300" y2="130" stroke="#333" stroke-width="2"/>
    <rect x="290" y="130" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="300" y="155" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="308" y="155" text-anchor="middle" font-size="9" fill="#666">2</text>
    <line x1="290" y1="170" x2="250" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="170" x2="250" y2="300" stroke="#333" stroke-width="2"/>

    <!-- 比较放大器 A -->
    <polygon points="360,160 360,220 420,190" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <text x="380" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">A</text>
    <text x="350" y="178" text-anchor="end" font-size="10" fill="#333">−</text>
    <text x="350" y="205" text-anchor="end" font-size="10" fill="#333">+</text>

    <!-- 取样电压到比较器反相端 -->
    <line x1="300" y1="90" x2="360" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 基准电压 Vref -->
    <line x1="360" y1="205" x2="360" y2="240" stroke="#333" stroke-width="2"/>
    <!-- 齐纳二极管 -->
    <line x1="360" y1="240" x2="390" y2="240" stroke="#333" stroke-width="2"/>
    <polygon points="390,230 410,240 390,250" fill="none" stroke="#cc3333" stroke-width="2"/>
    <line x1="410" y1="230" x2="410" y2="250" stroke="#cc3333" stroke-width="2"/>
    <text x="400" y="265" text-anchor="middle" font-size="11" fill="#cc3333">D</text>
    <text x="408" y="265" text-anchor="middle" font-size="9" fill="#cc3333">Z</text>
    <line x1="410" y1="240" x2="440" y2="240" stroke="#333" stroke-width="2"/>
    <rect x="440" y="220" width="16" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="448" y="245" text-anchor="middle" font-size="11" fill="#333">R</text>
    <text x="456" y="245" text-anchor="middle" font-size="9" fill="#666">3</text>
    <line x1="440" y1="240" x2="420" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="456" y1="240" x2="480" y2="240" stroke="#333" stroke-width="2"/>
    <text x="490" y="245" font-size="11" fill="#666">+V</text>
    <text x="498" y="245" font-size="9" fill="#666">CC</text>

    <!-- 比较放大器输出到调整管基极 -->
    <line x1="420" y1="190" x2="450" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="190" x2="450" y2="120" stroke="#333" stroke-width="2"/>
    <line x1="450" y1="120" x2="150" y2="120" stroke="#333" stroke-width="2"/>

    <!-- 地线 -->
    <line x1="250" y1="300" x2="250" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="310" x2="270" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="310" x2="230" y2="315" stroke="#333" stroke-width="2"/>
    <line x1="270" y1="310" x2="270" y2="315" stroke="#333" stroke-width="2"/>

    <!-- 公式 -->
    <text x="300" y="350" text-anchor="middle" font-size="12" fill="#666">V</text>
    <text x="310" y="350" text-anchor="middle" font-size="12" fill="#666">O</text>
    <text x="325" y="350" text-anchor="middle" font-size="12" fill="#666"> = V</text>
    <text x="340" y="350" text-anchor="middle" font-size="12" fill="#666">Z</text>
    <text x="352" y="350" text-anchor="middle" font-size="12" fill="#666"> · (1 + R</text>
    <text x="382" y="350" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="390" y="350" text-anchor="middle" font-size="12" fill="#666">/R</text>
    <text x="406" y="350" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="414" y="350" text-anchor="middle" font-size="12" fill="#666">)</text>

    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">工作原理：V</text>
    <text x="342" y="370" text-anchor="middle" font-size="11" fill="#666">O</text>
    <text x="352" y="370" text-anchor="middle" font-size="11" fill="#666">↑ → 取样↑ → A输出↓ → Q</text>
    <text x="425" y="370" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="432" y="370" text-anchor="middle" font-size="11" fill="#666">管压降↑ → V</text>
    <text x="468" y="370" text-anchor="middle" font-size="11" fill="#666">O</text>
    <text x="476" y="370" text-anchor="middle" font-size="11" fill="#666">↓</text>
  </g>
</svg>