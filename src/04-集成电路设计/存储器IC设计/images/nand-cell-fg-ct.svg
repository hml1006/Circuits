<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 13px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 11px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 15px; font-weight: 600; fill: #1f4e79; }
      .ox { fill: #f6d365; stroke: #8a6d1a; stroke-width: 1; }
      .poly { fill: #d0d0d0; stroke: #333; stroke-width: 1; }
      .si { fill: #e8eef5; stroke: #333; stroke-width: 1; }
      .nplus { fill: #b9c9dc; stroke: #333; stroke-width: 1; }
      .trap { fill: #ead9bd; stroke: #8a6d1a; stroke-width: 1; }
      .wire { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
      .leader { stroke: #666; stroke-width: 0.9; fill: none; stroke-dasharray: 3 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <!-- 左侧：浮栅单元 -->
  <text class="title" x="210" y="34" text-anchor="middle">浮栅（FG）单元</text>

  <rect class="poly" x="105" y="148" width="210" height="40" rx="2"/>
  <text class="lbl" x="210" y="173" text-anchor="middle">控制栅 CG</text>

  <rect class="ox" x="115" y="188" width="190" height="10"/>
  <rect class="poly" x="125" y="198" width="170" height="46" rx="2"/>

  <rect class="ox" x="115" y="244" width="190" height="8"/>
  <rect class="si" x="40" y="252" width="340" height="66"/>
  <rect class="nplus" x="70" y="252" width="55" height="26"/>
  <rect class="nplus" x="295" y="252" width="55" height="26"/>
  <text class="small" x="97" y="270" text-anchor="middle">n+ 源</text>
  <text class="small" x="322" y="270" text-anchor="middle">n+ 漏</text>
  <text class="lbl" x="210" y="305" text-anchor="middle">p-Si 衬底</text>

  <circle cx="150" cy="208" r="4" fill="#c0392b"/>
  <circle cx="178" cy="220" r="4" fill="#c0392b"/>
  <circle cx="206" cy="206" r="4" fill="#c0392b"/>
  <circle cx="234" cy="220" r="4" fill="#c0392b"/>
  <circle cx="262" cy="208" r="4" fill="#c0392b"/>

  <path class="leader" d="M312,222 L274,210"/>
  <text class="small" x="316" y="226">FG 与存储电子</text>
  <path class="leader" d="M318,193 L306,193"/>
  <text class="small" x="322" y="197">控制氧化层</text>
  <path class="leader" d="M318,249 L306,248"/>
  <text class="small" x="322" y="253">隧道氧化层</text>

  <line x1="170" y1="244" x2="170" y2="231" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="210" y1="244" x2="210" y2="231" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="250" y1="244" x2="250" y2="231" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <text class="small" x="210" y="350" text-anchor="middle">编程：电子经隧道氧化层进入浮栅，Vth 升高</text>

  <!-- 分隔线 -->
  <line x1="410" y1="68" x2="410" y2="340" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- 右侧：电荷俘获单元 -->
  <text class="title" x="610" y="34" text-anchor="middle">电荷俘获（CT）单元</text>

  <rect class="poly" x="505" y="148" width="210" height="40" rx="2"/>
  <text class="lbl" x="610" y="173" text-anchor="middle">控制栅 CG</text>

  <rect class="ox" x="515" y="188" width="190" height="10"/>
  <rect class="trap" x="525" y="198" width="170" height="46" rx="2"/>

  <rect class="ox" x="515" y="244" width="190" height="8"/>
  <rect class="si" x="440" y="252" width="340" height="66"/>
  <rect class="nplus" x="470" y="252" width="55" height="26"/>
  <rect class="nplus" x="695" y="252" width="55" height="26"/>
  <text class="small" x="497" y="270" text-anchor="middle">n+ 源</text>
  <text class="small" x="722" y="270" text-anchor="middle">n+ 漏</text>
  <text class="lbl" x="610" y="305" text-anchor="middle">p-Si 衬底</text>

  <circle cx="550" cy="208" r="4" fill="#c0392b"/>
  <circle cx="584" cy="220" r="4" fill="#c0392b"/>
  <circle cx="618" cy="206" r="4" fill="#c0392b"/>
  <circle cx="652" cy="220" r="4" fill="#c0392b"/>
  <circle cx="686" cy="208" r="4" fill="#c0392b"/>

  <path class="leader" d="M736,222 L698,210"/>
  <text class="small" x="740" y="226">SiN / 陷阱</text>

  <line x1="570" y1="244" x2="570" y2="231" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="610" y1="244" x2="610" y2="231" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="650" y1="244" x2="650" y2="231" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <text class="small" x="610" y="350" text-anchor="middle">电子被分立陷阱俘获，横向迁移小，适合 3D 堆叠</text>

  <text class="small" x="410" y="382" text-anchor="middle">两种结构都通过存储层电荷改变阈值电压 Vth；擦除时电子被抽回沟道或衬底</text>
</svg>
