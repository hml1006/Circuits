<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="blkArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .cg { fill: #d0d0d0; stroke: #333; stroke-width: 1; }
      .fg { fill: #f7d7c4; stroke: #b35c1e; stroke-width: 1; }
      .pw { fill: #e8eef5; stroke: #333; stroke-width: 1; }
      .dash { stroke: #8a8a8a; stroke-width: 1.2; fill: none; stroke-dasharray: 6 5; }
      .flow { fill: #eef2f7; stroke: #1f4e79; stroke-width: 1.3; }
      .wire { stroke: #333; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#ffffff"/>

  <!-- 左：块擦除偏置 -->
  <text class="title" x="220" y="34" text-anchor="middle">块擦除偏置</text>
  <rect class="dash" x="40" y="70" width="360" height="260"/>
  <text class="small" x="220" y="60" text-anchor="middle">Block（整块擦除）</text>
  <text class="small" x="220" y="92" text-anchor="middle">所有 WL / CG = 0 V</text>

  <rect class="cg" x="80" y="110" width="110" height="24"/>
  <text class="lbl" x="135" y="127" text-anchor="middle">CG</text>
  <rect class="fg" x="220" y="110" width="110" height="24"/>
  <text class="lbl" x="275" y="127" text-anchor="middle">FG</text>

  <rect class="cg" x="80" y="170" width="110" height="24"/>
  <text class="lbl" x="135" y="187" text-anchor="middle">CG</text>
  <rect class="fg" x="220" y="170" width="110" height="24"/>
  <text class="lbl" x="275" y="187" text-anchor="middle">FG</text>

  <rect class="cg" x="80" y="230" width="110" height="24"/>
  <text class="lbl" x="135" y="247" text-anchor="middle">CG</text>
  <rect class="fg" x="220" y="230" width="110" height="24"/>
  <text class="lbl" x="275" y="247" text-anchor="middle">FG</text>

  <rect class="pw" x="60" y="300" width="320" height="42"/>
  <text class="lbl" x="220" y="326" text-anchor="middle">p-well / 衬底 = Vers（≈20 V）</text>

  <line x1="275" y1="254" x2="275" y2="298" stroke="#c0392b" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <line x1="275" y1="194" x2="275" y2="208" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <line x1="275" y1="134" x2="275" y2="148" stroke="#c0392b" stroke-width="1.4" marker-end="url(#redArrow)"/>
  <text class="small" x="300" y="285">电子抽回衬底</text>

  <!-- 右：擦除流程 -->
  <text class="title" x="620" y="34" text-anchor="middle">擦除校验与恢复</text>

  <rect class="flow" x="480" y="80" width="130" height="40" rx="4"/>
  <text class="lbl" x="545" y="105" text-anchor="middle">擦除脉冲</text>

  <rect class="flow" x="480" y="150" width="130" height="40" rx="4"/>
  <text class="lbl" x="545" y="175" text-anchor="middle">擦除校验</text>

  <polygon class="flow" points="545,220 625,255 545,290 465,255"/>
  <text class="small" x="545" y="259" text-anchor="middle">Vth 达标？</text>

  <rect class="flow" x="660" y="235" width="110" height="40" rx="4"/>
  <text class="lbl" x="715" y="260" text-anchor="middle">完成</text>

  <rect class="flow" x="650" y="150" width="130" height="40" rx="4"/>
  <text class="lbl" x="715" y="175" text-anchor="middle">软编程 / 重试</text>

  <line class="wire" x1="545" y1="120" x2="545" y2="150" marker-end="url(#blkArrow)"/>
  <line class="wire" x1="545" y1="190" x2="545" y2="220" marker-end="url(#blkArrow)"/>
  <line class="wire" x1="625" y1="255" x2="660" y2="255" marker-end="url(#blkArrow)"/>
  <text class="small" x="640" y="248" text-anchor="middle">是</text>
  <line class="wire" x1="545" y1="290" x2="545" y2="315" stroke-dasharray="4 4"/>
  <line class="wire" x1="545" y1="315" x2="715" y2="315"/>
  <line class="wire" x1="715" y1="315" x2="715" y2="190" marker-end="url(#blkArrow)"/>
  <text class="small" x="560" y="330">否</text>
  <line class="wire" x1="650" y1="170" x2="610" y2="170" marker-end="url(#blkArrow)"/>

  <text class="small" x="620" y="378" text-anchor="middle">擦除以块为单位；过擦除单元用软编程抬回目标 Vth</text>
</svg>
