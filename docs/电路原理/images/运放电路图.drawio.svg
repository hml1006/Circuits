<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">运放电路图（反相比例放大器）</text>
    <!-- 运放三角形 -->
    <polygon points="300,100 400,160 300,220" fill="#fff" stroke="#000" stroke-width="2"/>
    <!-- 运放标注 -->
    <text x="340" y="165" text-anchor="middle" font-size="12" fill="#333">A</text>
    <!-- 反相输入端 -->
    <line x1="280" y1="130" x2="300" y2="130" stroke="#000" stroke-width="2"/>
    <text x="270" y="125" font-size="12" fill="#333">-</text>
    <text x="250" y="110" font-size="14" fill="#333">u_i</text>
    <text x="250" y="125" font-size="12" fill="#666">R₁</text>
    <!-- 同相输入端 -->
    <line x1="280" y1="190" x2="300" y2="190" stroke="#000" stroke-width="2"/>
    <text x="270" y="195" font-size="12" fill="#333">+</text>
    <!-- 接地 -->
    <line x1="280" y1="190" x2="250" y2="190" stroke="#000" stroke-width="2"/>
    <line x1="250" y1="190" x2="250" y2="210" stroke="#000" stroke-width="2"/>
    <line x1="240" y1="210" x2="260" y2="210" stroke="#000" stroke-width="2"/>
    <line x1="243" y1="216" x2="257" y2="216" stroke="#000" stroke-width="2"/>
    <line x1="246" y1="222" x2="254" y2="222" stroke="#000" stroke-width="2"/>
    <!-- 输出端 -->
    <line x1="400" y1="160" x2="450" y2="160" stroke="#000" stroke-width="2"/>
    <text x="460" y="155" font-size="14" fill="#333">u_o</text>
    <!-- 反馈电阻Rf -->
    <line x1="450" y1="160" x2="480" y2="160" stroke="#000" stroke-width="2"/>
    <line x1="480" y1="160" x2="480" y2="100" stroke="#000" stroke-width="2"/>
    <rect x="465" y="100" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="480" y1="120" x2="480" y2="130" stroke="#000" stroke-width="2"/>
    <line x1="480" y1="130" x2="300" y2="130" stroke="#000" stroke-width="2"/>
    <text x="495" y="115" font-size="14" fill="#333">R_f</text>
    <!-- 输入电阻R1 -->
    <rect x="200" y="115" width="30" height="20" fill="none" stroke="#000" stroke-width="2"/>
    <text x="180" y="130" font-size="14" fill="#333">R₁</text>
    <!-- 输入电压 -->
    <circle cx="160" cy="125" r="15" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="160" y1="115" x2="160" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="150" y1="125" x2="170" y2="125" stroke="#000" stroke-width="2"/>
    <line x1="160" y1="130" x2="160" y2="140" stroke="#000" stroke-width="2"/>
    <text x="145" y="115" font-size="12" fill="#333">+</text>
    <text x="175" y="115" font-size="12" fill="#333">-</text>
    <!-- 输入到R1 -->
    <line x1="175" y1="125" x2="200" y2="125" stroke="#000" stroke-width="2"/>
    <text x="130" y="120" font-size="14" fill="#d32f2f">u_i</text>
    <!-- 输出公式 -->
    <text x="300" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">u_o = -(R_f/R₁) · u_i</text>
    <text x="300" y="310" text-anchor="middle" font-size="14" fill="#666">反相比例放大器</text>
    <!-- 同相放大器标注 -->
    <text x="300" y="350" text-anchor="middle" font-size="14" fill="#666">同相比例放大器: u_o = (1 + R_f/R₁) · u_i</text>
    <text x="300" y="375" text-anchor="middle" font-size="14" fill="#666">求和电路: u_o = -(R_f/R₁·u₁ + R_f/R₂·u₂ + R_f/R₃·u₃)</text>
  </g>
</svg>