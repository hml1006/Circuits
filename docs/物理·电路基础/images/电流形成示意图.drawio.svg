<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">电流形成示意图</text>
    
    <!-- 导线（水平长条） -->
    <rect x="50" y="130" width="500" height="60" rx="8" ry="8" fill="#e8e8e8" stroke="#999" stroke-width="2"/>
    <text x="300" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">金属导体（导线）</text>
    
    <!-- 自由电子（均匀分布 - 未通电时） -->
    <text x="300" y="165" text-anchor="middle" font-size="12" fill="#888">自由电子（无规则运动）</text>
    
    <!-- 自由电子无规则运动示意 -->
    <circle cx="100" cy="160" r="5" fill="#e74c3c"/>
    <circle cx="150" cy="155" r="5" fill="#e74c3c"/>
    <circle cx="200" cy="162" r="5" fill="#e74c3c"/>
    <circle cx="250" cy="158" r="5" fill="#e74c3c"/>
    <circle cx="300" cy="163" r="5" fill="#e74c3c"/>
    <circle cx="350" cy="157" r="5" fill="#e74c3c"/>
    <circle cx="400" cy="161" r="5" fill="#e74c3c"/>
    <circle cx="450" cy="156" r="5" fill="#e74c3c"/>
    <circle cx="500" cy="162" r="5" fill="#e74c3c"/>
    
    <!-- 无规则运动箭头 -->
    <path d="M 100 160 L 95 150" fill="none" stroke="#e74c3c" stroke-width="1" marker-end="url(#smallArrow)"/>
    <path d="M 200 162 L 208 155" fill="none" stroke="#e74c3c" stroke-width="1" marker-end="url(#smallArrow)"/>
    <path d="M 300 163 L 292 170" fill="none" stroke="#e74c3c" stroke-width="1" marker-end="url(#smallArrow)"/>
    <path d="M 400 161 L 405 168" fill="none" stroke="#e74c3c" stroke-width="1" marker-end="url(#smallArrow)"/>
    <path d="M 500 162 L 495 153" fill="none" stroke="#e74c3c" stroke-width="1" marker-end="url(#smallArrow)"/>
    
    <!-- 分隔箭头 -->
    <path d="M 300 210 L 300 240" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrowDown)"/>
    <text x="300" y="225" text-anchor="middle" font-size="12" fill="#333">通电后定向移动</text>
    
    <!-- 通电后导线 -->
    <rect x="50" y="250" width="500" height="60" rx="8" ry="8" fill="#fff3cd" stroke="#f0ad4e" stroke-width="2"/>
    
    <!-- 电源示意 -->
    <rect x="50" y="255" width="40" height="50" rx="3" ry="3" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
    <text x="70" y="285" text-anchor="middle" font-size="10" fill="#fff">+</text>
    <rect x="510" y="255" width="40" height="50" rx="3" ry="3" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
    <text x="530" y="285" text-anchor="middle" font-size="10" fill="#fff">−</text>
    
    <text x="70" y="310" text-anchor="middle" font-size="10" fill="#c0392b">正极</text>
    <text x="530" y="310" text-anchor="middle" font-size="10" fill="#2980b9">负极</text>
    
    <!-- 自由电子定向移动（从左到右，即电子从负极到正极） -->
    <text x="300" y="275" text-anchor="middle" font-size="12" fill="#c0392b">自由电子定向移动 → 形成电流</text>
    
    <!-- 定向移动电子 -->
    <circle cx="120" cy="285" r="5" fill="#e74c3c"/>
    <circle cx="180" cy="285" r="5" fill="#e74c3c"/>
    <circle cx="240" cy="285" r="5" fill="#e74c3c"/>
    <circle cx="300" cy="285" r="5" fill="#e74c3c"/>
    <circle cx="360" cy="285" r="5" fill="#e74c3c"/>
    <circle cx="420" cy="285" r="5" fill="#e74c3c"/>
    <circle cx="480" cy="285" r="5" fill="#e74c3c"/>
    
    <!-- 定向移动箭头 -->
    <path d="M 140 285 L 165 285" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#smallArrow)"/>
    <path d="M 200 285 L 225 285" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#smallArrow)"/>
    <path d="M 260 285 L 285 285" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#smallArrow)"/>
    <path d="M 320 285 L 345 285" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#smallArrow)"/>
    <path d="M 380 285 L 405 285" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#smallArrow)"/>
    <path d="M 440 285 L 465 285" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#smallArrow)"/>
    
    <!-- 电流方向标注（与电子运动方向相反）- 下方 -->
    <path d="M 120 340 L 480 340" fill="none" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="300" y="360" text-anchor="middle" font-size="12" fill="#e74c3c">电流方向（正电荷定向移动方向）</text>
    
    <defs>
      <marker id="smallArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#e74c3c"/>
      </marker>
      <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 5 10 L 10 0" fill="#333"/>
      </marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#e74c3c"/>
      </marker>
    </defs>
  </g>
</svg>