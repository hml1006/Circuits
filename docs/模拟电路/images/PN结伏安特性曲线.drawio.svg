<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">PN结伏安特性曲线</text>
    <!-- 坐标轴 -->
    <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowV)"/>
    <text x="565" y="355" font-size="14" fill="#333" font-style="italic">V</text>
    <line x1="300" y1="350" x2="300" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrowI)"/>
    <text x="310" y="30" font-size="14" fill="#333" font-style="italic">I</text>
    <defs>
      <marker id="arrowV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#333"/>
      </marker>
      <marker id="arrowI" markerWidth="8" markerHeight="6" refX="3" refY="0" orient="auto">
        <polygon points="0 6, 3 0, 6 6" fill="#333"/>
      </marker>
    </defs>
    <!-- 刻度标注 -->
    <text x="55" y="355" font-size="11" fill="#666">O</text>
    <text x="540" y="355" font-size="11" fill="#666">+</text>
    <text x="290" y="45" font-size="11" fill="#666">+</text>
    <text x="290" y="365" font-size="11" fill="#666">0</text>
    <!-- 正向特性曲线 - 指数增长 -->
    <path d="M 300 350 Q 310 350 320 340 Q 330 320 340 290 Q 350 230 360 150 Q 370 80 380 40" fill="none" stroke="#cc3333" stroke-width="2.5"/>
    <!-- 反向特性曲线 - 几乎水平 -->
    <line x1="60" y1="345" x2="290" y2="345" stroke="#cc3333" stroke-width="2.5"/>
    <!-- 击穿区域 -->
    <line x1="60" y1="345" x2="40" y2="300" stroke="#cc3333" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="50" y="290" font-size="10" fill="#cc3333">击穿</text>
    <!-- 正向导通电压标注 -->
    <line x1="300" y1="355" x2="300" y2="370" stroke="#999" stroke-width="1"/>
    <line x1="340" y1="355" x2="340" y2="370" stroke="#999" stroke-width="1"/>
    <text x="320" y="382" text-anchor="middle" font-size="10" fill="#666">Vth</text>
    <!-- 反向饱和电流标注 -->
    <line x1="55" y1="345" x2="80" y2="345" stroke="#999" stroke-width="1"/>
    <line x1="55" y1="330" x2="80" y2="330" stroke="#999" stroke-width="1"/>
    <text x="68" y="325" text-anchor="middle" font-size="10" fill="#666">−Is</text>
    <!-- 区域标注 -->
    <text x="410" y="320" font-size="12" fill="#cc3333">正向区</text>
    <text x="130" y="360" font-size="12" fill="#cc3333">反向区</text>
  </g>
</svg>