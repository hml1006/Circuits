<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380">
  <defs>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="blkArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <style type="text/css">
      .lbl { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 12px; fill: #1a1a1a; }
      .small { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 10px; fill: #444; }
      .title { font-family: "Noto Sans CJK SC","Source Han Sans SC","DejaVu Sans",sans-serif; font-size: 14px; font-weight: 600; fill: #1f4e79; }
      .ox { fill: #f6d365; stroke: #8a6d1a; stroke-width: 1; }
      .poly { fill: #d0d0d0; stroke: #333; stroke-width: 1; }
      .si { fill: #e8eef5; stroke: #333; stroke-width: 1; }
      .nplus { fill: #b9c9dc; stroke: #333; stroke-width: 1; }
      .wire { stroke: #1a1a1a; stroke-width: 1.4; fill: none; }
      .flow { fill: #eef2f7; stroke: #1f4e79; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>

  <text class="title" x="260" y="32" text-anchor="middle">NOR 编程：沟道热电子注入（CHE）</text>

  <rect class="poly" x="125" y="145" width="270" height="40" rx="2"/>
  <text class="lbl" x="260" y="170" text-anchor="middle">控制栅 CG = 10–12 V</text>

  <rect class="ox" x="135" y="185" width="250" height="10"/>
  <rect class="poly" x="140" y="195" width="240" height="47" rx="2"/>
  <text class="lbl" x="260" y="223" text-anchor="middle">浮栅 FG</text>

  <rect class="ox" x="130" y="242" width="260" height="8"/>
  <rect class="si" x="60" y="250" width="400" height="60"/>
  <rect class="nplus" x="90" y="250" width="60" height="24"/>
  <rect class="nplus" x="370" y="250" width="60" height="24"/>
  <text class="small" x="120" y="266" text-anchor="middle">n+ 源</text>
  <text class="small" x="400" y="266" text-anchor="middle">n+ 漏</text>
  <text class="lbl" x="250" y="298" text-anchor="middle">p-Si 衬底</text>

  <text class="small" x="120" y="340" text-anchor="middle">源 = 0 V</text>
  <text class="small" x="400" y="340" text-anchor="middle">漏 = 5–7 V</text>

  <!-- 沟道电子流 -->
  <line x1="160" y1="268" x2="200" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <line x1="220" y1="268" x2="260" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <line x1="280" y1="268" x2="320" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <text class="small" x="240" y="285" text-anchor="middle">沟道电子被加速</text>

  <!-- 热电子注入 -->
  <line x1="355" y1="250" x2="355" y2="232" stroke="#c0392b" stroke-width="1.6" marker-end="url(#redArrow)"/>
  <text class="small" x="365" y="228">热电子注入</text>
  <circle cx="340" cy="215" r="4" fill="#c0392b"/>
  <circle cx="325" cy="228" r="4" fill="#c0392b"/>

  <text class="small" x="260" y="368" text-anchor="middle">CHE 编程电流较大、单次写入较快，但功耗高，不适合大规模并行编程</text>

  <!-- 右侧流程 -->
  <rect class="flow" x="560" y="80" width="190" height="36" rx="4"/>
  <text class="small" x="655" y="103" text-anchor="middle">写使能</text>
  <rect class="flow" x="560" y="140" width="190" height="36" rx="4"/>
  <text class="small" x="655" y="163" text-anchor="middle">编程命令 + 地址 + 数据</text>
  <rect class="flow" x="560" y="200" width="190" height="36" rx="4"/>
  <text class="small" x="655" y="223" text-anchor="middle">编程脉冲 + 校验</text>
  <rect class="flow" x="560" y="260" width="190" height="36" rx="4"/>
  <text class="small" x="655" y="283" text-anchor="middle">未达标则继续加脉冲</text>

  <line class="wire" x1="655" y1="116" x2="655" y2="140" marker-end="url(#blkArrow)"/>
  <line class="wire" x1="655" y1="176" x2="655" y2="200" marker-end="url(#blkArrow)"/>
  <line class="wire" x1="655" y1="236" x2="655" y2="260" marker-end="url(#blkArrow)"/>
  <text class="small" x="655" y="336" text-anchor="middle">按字 / 字节编程</text>
</svg>
