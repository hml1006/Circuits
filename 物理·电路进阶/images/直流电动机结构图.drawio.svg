<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">直流电动机结构图</text>
    
    <!-- N 极（左） -->
    <rect x="30" y="80" width="50" height="240" rx="8" ry="8" fill="#ff6b6b" stroke="#cc0000" stroke-width="2"/>
    <text x="55" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff" transform="rotate(-90,55,205)">N</text>
    
    <!-- S 极（右） -->
    <rect x="520" y="80" width="50" height="240" rx="8" ry="8" fill="#4dabf7" stroke="#1976d2" stroke-width="2"/>
    <text x="545" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff" transform="rotate(90,545,205)">S</text>
    
    <!-- 磁场线 -->
    <path d="M 80,120 Q 250,100 520,120" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 80,160 Q 250,140 520,160" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 80,200 Q 250,180 520,200" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 80,240 Q 250,220 520,240" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    <path d="M 80,280 Q 250,260 520,280" fill="none" stroke="#4dabf7" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
    
    <!-- 转子（线圈） -->
    <rect x="180" y="120" width="240" height="160" rx="10" ry="10" fill="none" stroke="#e6b800" stroke-width="2.5"/>
    
    <!-- 线圈绕组 -->
    <line x1="180" y1="130" x2="420" y2="130" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="145" x2="420" y2="145" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="160" x2="420" y2="160" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="175" x2="420" y2="175" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="190" x2="420" y2="190" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="205" x2="420" y2="205" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="220" x2="420" y2="220" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="235" x2="420" y2="235" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="250" x2="420" y2="250" stroke="#e6b800" stroke-width="2"/>
    <line x1="180" y1="265" x2="420" y2="265" stroke="#e6b800" stroke-width="2"/>
    
    <text x="300" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6b800">转子（电枢绕组）</text>
    
    <!-- 换向器 -->
    <rect x="260" y="290" width="30" height="30" rx="3" ry="3" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <rect x="310" y="290" width="30" height="30" rx="3" ry="3" fill="#ddd" stroke="#999" stroke-width="1.5"/>
    <text x="300" y="335" text-anchor="middle" font-size="11" fill="#666">换向器</text>
    
    <line x1="275" y1="290" x2="275" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="325" y1="290" x2="325" y2="280" stroke="#333" stroke-width="2"/>
    
    <!-- 电刷 -->
    <rect x="240" y="300" width="12" height="20" rx="2" ry="2" fill="#888" stroke="#555" stroke-width="1.5"/>
    <rect x="348" y="300" width="12" height="20" rx="2" ry="2" fill="#888" stroke="#555" stroke-width="1.5"/>
    <text x="250" y="340" text-anchor="middle" font-size="10" fill="#666">电刷</text>
    <text x="350" y="340" text-anchor="middle" font-size="10" fill="#666">电刷</text>
    
    <!-- 电源接线 -->
    <line x1="240" y1="300" x2="200" y2="360" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="300" x2="400" y2="360" stroke="#333" stroke-width="2"/>
    
    <text x="190" y="380" text-anchor="end" font-size="11" fill="#333">+</text>
    <text x="410" y="380" text-anchor="start" font-size="11" fill="#333">−</text>
    
    <!-- 标注 -->
    <text x="300" y="380" text-anchor="middle" font-size="12" fill="#666">直流电源供电</text>
  </g>
</svg>