<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">文氏桥振荡器电路图</text>

    <!-- 运放 -->
    <polygon points="280,100 280,260 400,180" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <text x="310" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
    <text x="270" y="135" text-anchor="end" font-size="11" fill="#333">−</text>
    <text x="270" y="215" text-anchor="end" font-size="11" fill="#333">+</text>

    <!-- 输出端 -->
    <line x1="400" y1="180" x2="480" y2="180" stroke="#333" stroke-width="2"/>
    <text x="490" y="185" font-size="13" fill="#333">v</text>
    <text x="490" y="195" font-size="10" fill="#333">o</text>

    <!-- Rf 负反馈电阻 (从输出到反相输入端) -->
    <line x1="280" y1="130" x2="200" y2="130" stroke="#333" stroke-width="2"/>
    <rect x="160" y="110" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="170" y="135" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="178" y="135" text-anchor="middle" font-size="10" fill="#666">f</text>
    <line x1="160" y1="130" x2="120" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="130" x2="120" y2="180" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="180" x2="280" y2="180" stroke="#333" stroke-width="2"/>

    <!-- 同相输入端接地电阻 -->
    <line x1="280" y1="230" x2="240" y2="230" stroke="#333" stroke-width="2"/>
    <rect x="200" y="210" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="210" y="235" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="210" y="245" text-anchor="middle" font-size="10" fill="#666">s</text>
    <line x1="200" y1="230" x2="160" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="230" x2="160" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="280" x2="180" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="280" x2="140" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="280" x2="180" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="140" y1="290" x2="180" y2="290" stroke="#333" stroke-width="2"/>

    <!-- RC串并联选频网络 -->
    <!-- R1 -->
    <line x1="280" y1="230" x2="310" y2="230" stroke="#333" stroke-width="2"/>
    <rect x="310" y="210" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="320" y="235" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="328" y="235" text-anchor="middle" font-size="10" fill="#666">1</text>
    <line x1="330" y1="230" x2="370" y2="230" stroke="#333" stroke-width="2"/>

    <!-- C1 -->
    <line x1="370" y1="220" x2="370" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="220" x2="380" y2="220" stroke="#333" stroke-width="2" stroke-width="3"/>
    <line x1="360" y1="240" x2="380" y2="240" stroke="#333" stroke-width="2" stroke-width="3"/>
    <text x="390" y="235" font-size="12" fill="#333">C</text>
    <text x="398" y="235" font-size="10" fill="#666">1</text>
    <line x1="370" y1="240" x2="370" y2="280" stroke="#333" stroke-width="2"/>

    <!-- C2 -->
    <line x1="370" y1="280" x2="370" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="360" y1="300" x2="380" y2="300" stroke="#333" stroke-width="3"/>
    <line x1="360" y1="320" x2="380" y2="320" stroke="#333" stroke-width="3"/>
    <line x1="370" y1="320" x2="370" y2="340" stroke="#333" stroke-width="2"/>
    <text x="390" y="315" font-size="12" fill="#333">C</text>
    <text x="398" y="315" font-size="10" fill="#666">2</text>

    <!-- R2 -->
    <rect x="350" y="340" width="20" height="40" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="3"/>
    <text x="360" y="365" text-anchor="middle" font-size="12" fill="#333">R</text>
    <text x="368" y="365" text-anchor="middle" font-size="10" fill="#666">2</text>
    <line x1="350" y1="360" x2="310" y2="360" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="360" x2="310" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="280" x2="370" y2="280" stroke="#333" stroke-width="2"/>

    <!-- 地线 -->
    <line x1="370" y1="380" x2="370" y2="390" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="390" x2="390" y2="390" stroke="#333" stroke-width="2"/>
    <line x1="350" y1="390" x2="350" y2="395" stroke="#333" stroke-width="2"/>
    <line x1="370" y1="390" x2="370" y2="395" stroke="#333" stroke-width="2"/>
    <line x1="390" y1="390" x2="390" y2="395" stroke="#333" stroke-width="2"/>

    <!-- 公式 -->
    <text x="300" y="50" text-anchor="middle" font-size="12" fill="#666">f</text>
    <text x="310" y="50" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="320" y="50" text-anchor="middle" font-size="12" fill="#666"> = 1/(2πRC)</text>
    <text x="300" y="65" text-anchor="middle" font-size="12" fill="#666">|F| = 1/3, 要求 A ≥ 3</text>
  </g>
</svg>