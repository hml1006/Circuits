<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">光刻工艺示意图</text>
    <!-- Light source -->
    <rect x="200" y="40" width="200" height="30" rx="5" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
    <text x="300" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57f17">紫外光源 (UV Light)</text>
    <!-- Light rays -->
    <line x1="250" y1="70" x2="250" y2="110" stroke="#f9a825" stroke-width="2" stroke-dasharray="4 2"/>
    <line x1="300" y1="70" x2="300" y2="110" stroke="#f9a825" stroke-width="2" stroke-dasharray="4 2"/>
    <line x1="350" y1="70" x2="350" y2="110" stroke="#f9a825" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Mask -->
    <rect x="150" y="110" width="300" height="40" fill="#333" stroke="#222" stroke-width="2"/>
    <rect x="220" y="110" width="60" height="40" fill="#fff" stroke="#222" stroke-width="1"/>
    <rect x="320" y="110" width="60" height="40" fill="#fff" stroke="#222" stroke-width="1"/>
    <text x="300" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">掩模版 (Mask)</text>
    <text x="250" y="135" text-anchor="middle" font-size="10" fill="#333">透光区</text>
    <text x="350" y="135" text-anchor="middle" font-size="10" fill="#333">透光区</text>
    <!-- Lens -->
    <ellipse cx="300" cy="170" rx="120" ry="20" fill="none" stroke="#4fc3f7" stroke-width="3"/>
    <text x="300" y="175" text-anchor="middle" font-size="10" fill="#0288d1">透镜</text>
    <!-- Focused rays -->
    <line x1="250" y1="150" x2="250" y2="190" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="300" y1="150" x2="300" y2="190" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="350" y1="150" x2="350" y2="190" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Photoresist -->
    <rect x="170" y="195" width="260" height="35" fill="#9ccc65" stroke="#558b2f" stroke-width="2"/>
    <text x="300" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#33691e">光刻胶 (Photoresist)</text>
    <!-- Exposed regions in photoresist -->
    <rect x="220" y="195" width="60" height="35" fill="#7cb342" stroke="#558b2f" stroke-width="1"/>
    <rect x="320" y="195" width="60" height="35" fill="#7cb342" stroke="#558b2f" stroke-width="1"/>
    <!-- SiO2 layer -->
    <rect x="170" y="230" width="260" height="25" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/>
    <text x="300" y="247" text-anchor="middle" font-size="11" fill="#fff">SiO₂ 氧化层</text>
    <!-- Silicon substrate -->
    <rect x="170" y="255" width="260" height="40" fill="#bdbdbd" stroke="#333" stroke-width="2"/>
    <text x="300" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">硅衬底 (Si Substrate)</text>
    <!-- After development section -->
    <rect x="50" y="310" width="220" height="80" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="160" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">显影后 (After Development)</text>
    <rect x="70" y="340" width="180" height="20" fill="#9ccc65" stroke="#558b2f" stroke-width="1"/>
    <rect x="70" y="360" width="180" height="25" fill="#90a4ae" stroke="#546e7a" stroke-width="1"/>
    <!-- After etching -->
    <rect x="330" y="310" width="220" height="80" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <text x="440" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">刻蚀后 (After Etching)</text>
    <rect x="350" y="340" width="180" height="20" fill="#9ccc65" stroke="#558b2f" stroke-width="1"/>
    <rect x="350" y="360" width="60" height="25" fill="#90a4ae" stroke="#546e7a" stroke-width="1"/>
    <!-- Arrow between steps -->
    <line x1="270" y1="350" x2="320" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Resolution formula -->
    <text x="300" y="395" text-anchor="middle" font-size="10" fill="#666">分辨率: R = k₁·λ/NA | 焦深: DOF = k₂·λ/NA²</text>
  </g>
</svg>