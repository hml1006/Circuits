<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">噪声类型频谱图</text>

    <!-- 坐标轴 -->
    <line x1="60" y1="340" x2="560" y2="340" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="340" x2="60" y2="60" stroke="#333" stroke-width="2"/>

    <!-- 轴标签 -->
    <text x="560" y="355" text-anchor="end" font-size="12" fill="#333">频率 f (Hz, 对数坐标)</text>
    <text x="300" y="370" text-anchor="middle" font-size="11" fill="#666">f</text>
    <text x="310" y="370" text-anchor="middle" font-size="9" fill="#666">c</text>
    <text x="340" y="370" text-anchor="middle" font-size="11" fill="#666">(1/f 拐角频率)</text>

    <text x="25" y="200" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,25,200)">噪声功率谱密度 (dB)</text>

    <!-- 刻度线 -->
    <line x1="60" y1="340" x2="60" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="60" y="358" text-anchor="middle" font-size="9" fill="#666">10</text>
    <text x="68" y="358" text-anchor="middle" font-size="7" fill="#666">0</text>

    <line x1="185" y1="340" x2="185" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="185" y="358" text-anchor="middle" font-size="9" fill="#666">10</text>
    <text x="193" y="358" text-anchor="middle" font-size="7" fill="#666">1</text>

    <line x1="310" y1="340" x2="310" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="310" y="358" text-anchor="middle" font-size="9" fill="#666">10</text>
    <text x="318" y="358" text-anchor="middle" font-size="7" fill="#666">2</text>

    <line x1="435" y1="340" x2="435" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="435" y="358" text-anchor="middle" font-size="9" fill="#666">10</text>
    <text x="443" y="358" text-anchor="middle" font-size="7" fill="#666">3</text>

    <line x1="560" y1="340" x2="560" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="560" y="358" text-anchor="middle" font-size="9" fill="#666">10</text>
    <text x="568" y="358" text-anchor="middle" font-size="7" fill="#666">4</text>

    <!-- 1/f 噪声区域 (闪烁噪声) - 斜线从左上到 fc -->
    <path d="M 60 100 Q 185 130 310 170" fill="none" stroke="#cc3333" stroke-width="3"/>
    <text x="120" y="110" font-size="11" font-weight="bold" fill="#cc3333">1/f 噪声</text>
    <text x="120" y="125" font-size="10" fill="#cc3333">（闪烁噪声）</text>

    <!-- 白噪声区域 - 水平线 -->
    <line x1="310" y1="170" x2="560" y2="170" stroke="#3366cc" stroke-width="3"/>
    <text x="430" y="160" font-size="11" font-weight="bold" fill="#3366cc">白噪声</text>
    <text x="430" y="175" font-size="10" fill="#3366cc">（热噪声/散粒噪声）</text>

    <!-- 拐角频率 fc 竖直线 -->
    <line x1="310" y1="80" x2="310" y2="340" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="310" y="75" text-anchor="middle" font-size="11" fill="#666">f</text>
    <text x="318" y="75" text-anchor="middle" font-size="9" fill="#666">c</text>

    <!-- 总噪声合成曲线 -->
    <path d="M 60 100 Q 185 130 310 170 L 560 170" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="200" y="90" font-size="10" fill="#666">总噪声</text>

    <!-- 区域标注 -->
    <rect x="60" y="190" width="250" height="20" fill="#ffcccc" stroke="none" opacity="0.5"/>
    <rect x="310" y="190" width="250" height="20" fill="#ccddff" stroke="none" opacity="0.5"/>

    <text x="185" y="205" text-anchor="middle" font-size="10" fill="#cc3333">闪烁噪声主导区</text>
    <text x="435" y="205" text-anchor="middle" font-size="10" fill="#3366cc">白噪声主导区</text>

    <!-- 说明 -->
    <text x="300" y="250" text-anchor="middle" font-size="11" fill="#666">噪声类型：</text>
    <text x="300" y="268" text-anchor="middle" font-size="10" fill="#666">• 热噪声（Johnson-Nyquist）：S</text>
    <text x="365" y="268" text-anchor="middle" font-size="10" fill="#666">v</text>
    <text x="372" y="268" text-anchor="middle" font-size="10" fill="#666"> = 4kTR</text>
    <text x="300" y="286" text-anchor="middle" font-size="10" fill="#666">• 散粒噪声：S</text>
    <text x="340" y="286" text-anchor="middle" font-size="10" fill="#666">i</text>
    <text x="348" y="286" text-anchor="middle" font-size="10" fill="#666"> = 2qI</text>
    <text x="370" y="286" text-anchor="middle" font-size="10" fill="#666">DC</text>
    <text x="300" y="304" text-anchor="middle" font-size="10" fill="#666">• 闪烁噪声：S</text>
    <text x="345" y="304" text-anchor="middle" font-size="10" fill="#666">1/f</text>
    <text x="365" y="304" text-anchor="middle" font-size="10" fill="#666"> = K</text>
    <text x="380" y="304" text-anchor="middle" font-size="10" fill="#666">f</text>
    <text x="388" y="304" text-anchor="middle" font-size="10" fill="#666">/f</text>
  </g>
</svg>