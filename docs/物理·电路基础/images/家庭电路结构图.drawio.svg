<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="25" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">家庭电路结构图</text>
    
    <!-- 进户线 -->
    <rect x="40" y="50" width="160" height="40" rx="5" ry="5" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
    <text x="120" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">进户线</text>
    
    <rect x="40" y="50" width="80" height="18" rx="2" ry="2" fill="#ff6b6b" stroke="#e74c3c" stroke-width="1"/>
    <text x="80" y="63" text-anchor="middle" font-size="10" fill="#fff">火线 L（220V）</text>
    <rect x="40" y="72" width="80" height="18" rx="2" ry="2" fill="#74b9ff" stroke="#3498db" stroke-width="1"/>
    <text x="80" y="85" text-anchor="middle" font-size="10" fill="#fff">零线 N（0V）</text>
    
    <!-- 箭头 -->
    <path d="M 200 70 L 240 70" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowRight)"/>
    
    <!-- 电能表 -->
    <rect x="240" y="45" width="80" height="50" rx="5" ry="5" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="280" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">电能表</text>
    <text x="280" y="82" text-anchor="middle" font-size="9" fill="#666">kW·h</text>
    
    <path d="M 320 70 L 360 70" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowRight)"/>
    
    <!-- 总开关 -->
    <rect x="360" y="45" width="70" height="50" rx="5" ry="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
    <text x="395" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a085">总开关</text>
    <text x="395" y="82" text-anchor="middle" font-size="9" fill="#666">闸刀/空气开关</text>
    
    <path d="M 430 70 L 470 70" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowRight)"/>
    
    <!-- 保险装置 -->
    <rect x="470" y="45" width="80" height="50" rx="5" ry="5" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
    <text x="510" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#e74c3c">保险装置</text>
    <text x="510" y="82" text-anchor="middle" font-size="9" fill="#666">保险丝/漏电保护器</text>
    
    <!-- 分支电路 -->
    <line x1="510" y1="95" x2="510" y2="130" stroke="#333" stroke-width="2"/>
    
    <!-- 水平干路 -->
    <line x1="120" y1="130" x2="560" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="130" x2="120" y2="95" stroke="#333" stroke-width="2"/>
    
    <!-- 支路1：灯泡 -->
    <line x1="180" y1="130" x2="180" y2="160" stroke="#333" stroke-width="2"/>
    <circle cx="180" cy="180" r="16" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="168" y1="168" x2="192" y2="192" stroke="#333" stroke-width="2"/>
    <line x1="192" y1="168" x2="168" y2="192" stroke="#333" stroke-width="2"/>
    <text x="180" y="210" text-anchor="middle" font-size="11" fill="#555">灯泡</text>
    <line x1="180" y1="196" x2="180" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="230" x2="560" y2="230" stroke="#333" stroke-width="2"/>
    
    <!-- 支路1开关 -->
    <line x1="120" y1="130" x2="120" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="120" y1="160" x2="150" y2="160" stroke="#333" stroke-width="2"/>
    <circle cx="150" cy="160" r="3" fill="#333"/>
    <line x1="150" y1="160" x2="165" y2="148" stroke="#333" stroke-width="2"/>
    <circle cx="165" cy="148" r="3" fill="#333"/>
    <text x="150" y="145" text-anchor="middle" font-size="9" fill="#555">S₁</text>
    
    <!-- 支路2：插座 -->
    <line x1="300" y1="130" x2="300" y2="170" stroke="#333" stroke-width="2"/>
    <rect x="280" y="170" width="40" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="286" y="176" width="28" height="28" rx="2" ry="2" fill="#fff" stroke="#999" stroke-width="1"/>
    <line x1="300" y1="176" x2="300" y2="204" stroke="#999" stroke-width="1"/>
    <line x1="286" y1="190" x2="314" y2="190" stroke="#999" stroke-width="1"/>
    <text x="300" y="225" text-anchor="middle" font-size="11" fill="#555">两孔插座</text>
    <line x1="300" y1="210" x2="300" y2="230" stroke="#333" stroke-width="2"/>
    
    <!-- 支路3：三孔插座 -->
    <line x1="440" y1="130" x2="440" y2="170" stroke="#333" stroke-width="2"/>
    <rect x="420" y="170" width="40" height="40" rx="3" ry="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="426" y="176" width="28" height="28" rx="2" ry="2" fill="#fff" stroke="#999" stroke-width="1"/>
    <circle cx="446" cy="183" r="4" fill="#999"/>
    <circle cx="440" cy="195" r="4" fill="#999"/>
    <circle cx="452" cy="195" r="4" fill="#999"/>
    <text x="440" y="225" text-anchor="middle" font-size="11" fill="#555">三孔插座</text>
    <line x1="440" y1="210" x2="440" y2="230" stroke="#333" stroke-width="2"/>
    
    <!-- 地线标注 -->
    <rect x="420" y="240" width="40" height="16" rx="2" ry="2" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
    <text x="440" y="252" text-anchor="middle" font-size="8" fill="#fff">地线</text>
    
    <!-- 标注 -->
    <text x="300" y="260" text-anchor="middle" font-size="10" fill="#888">左零右火上接地</text>
    
    <!-- 组成顺序 -->
    <rect x="30" y="280" width="540" height="105" rx="8" ry="8" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="300" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">家庭电路组成顺序</text>
    
    <text x="300" y="330" text-anchor="middle" font-size="13" fill="#e74c3c">进户线 → 电能表 → 总开关 → 保险装置 → 用电器</text>
    
    <text x="50" y="355" font-size="12" fill="#555">① 所有用电器</text>
    <text x="140" y="355" font-size="12" font-weight="bold" fill="#27ae60">并联</text>
    <text x="170" y="355" font-size="12" fill="#555">在电路中</text>
    
    <text x="50" y="375" font-size="12" fill="#555">② 控制用电器的开关要连接在</text>
    <text x="250" y="375" font-size="12" font-weight="bold" fill="#e74c3c">火线</text>
    <text x="280" y="375" font-size="12" fill="#555">上</text>
    
    <defs>
      <marker id="arrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10" fill="#333"/>
      </marker>
    </defs>
  </g>
</svg>