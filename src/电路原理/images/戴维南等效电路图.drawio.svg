<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">戴维南等效电路图</text>
    <!-- 左侧：含源一端口网络 -->
    <text x="150" y="65" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">线性含源网络</text>
    <rect x="50" y="80" width="200" height="180" fill="#e8f4f8" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="150" y="150" text-anchor="middle" font-size="14" fill="#333">含源</text>
    <text x="150" y="170" text-anchor="middle" font-size="14" fill="#333">一端口</text>
    <text x="150" y="190" text-anchor="middle" font-size="14" fill="#333">网络</text>
    <text x="150" y="210" text-anchor="middle" font-size="12" fill="#666">(含独立源)</text>
    <!-- 端口A -->
    <line x1="250" y1="110" x2="290" y2="110" stroke="#000" stroke-width="2"/>
    <circle cx="290" cy="110" r="4" fill="#000"/>
    <text x="295" y="105" font-size="14" fill="#333">a</text>
    <!-- 端口B -->
    <line x1="250" y1="230" x2="290" y2="230" stroke="#000" stroke-width="2"/>
    <circle cx="290" cy="230" r="4" fill="#000"/>
    <text x="295" y="235" font-size="14" fill="#333">b</text>
    <!-- 端口标注 -->
    <text x="130" y="255" font-size="12" fill="#666">端口开路电压 = u_oc</text>
    <text x="130" y="270" font-size="12" fill="#666">等效电阻 = R_eq</text>

    <!-- 箭头 -->
    <text x="340" y="170" font-size="30" fill="#333">⇒</text>

    <!-- 右侧：戴维南等效电路 -->
    <text x="470" y="65" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">戴维南等效电路</text>
    <!-- 电压源 -->
    <circle cx="430" cy="140" r="22" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="430" y1="118" x2="430" y2="125" stroke="#000" stroke-width="2"/>
    <line x1="415" y1="140" x2="445" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="430" y1="155" x2="430" y2="162" stroke="#000" stroke-width="2"/>
    <text x="410" y="135" font-size="10" fill="#333">+</text>
    <text x="445" y="135" font-size="10" fill="#333">-</text>
    <text x="400" y="115" font-size="13" fill="#d32f2f">u_oc</text>
    <!-- 电阻 -->
    <line x1="430" y1="162" x2="430" y2="180" stroke="#000" stroke-width="2"/>
    <rect x="415" y="180" width="30" height="30" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="430" y1="210" x2="430" y2="230" stroke="#000" stroke-width="2"/>
    <text x="460" y="200" font-size="13" fill="#333">R_eq</text>
    <!-- 端口a -->
    <line x1="430" y1="110" x2="500" y2="110" stroke="#000" stroke-width="2"/>
    <circle cx="500" cy="110" r="4" fill="#000"/>
    <text x="505" y="105" font-size="14" fill="#333">a</text>
    <!-- 端口b -->
    <line x1="430" y1="230" x2="500" y2="230" stroke="#000" stroke-width="2"/>
    <circle cx="500" cy="230" r="4" fill="#000"/>
    <text x="505" y="235" font-size="14" fill="#333">b</text>
    <!-- 外部负载 -->
    <text x="470" y="280" text-anchor="middle" font-size="13" fill="#666">a-b端口接外部负载时</text>
    <text x="470" y="300" text-anchor="middle" font-size="13" fill="#666">可用此等效电路替代</text>
    <text x="470" y="330" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">u_oc = R_eq · i_sc</text>
    <text x="470" y="355" text-anchor="middle" font-size="12" fill="#666">i_sc: 端口短路电流</text>
  </g>
</svg>