<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">反相比例放大器</text>

    <!-- 运放 -->
    <polygon points="260,100 260,260 380,180" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <text x="310" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>

    <!-- - 输入端 -->
    <line x1="260" y1="130" x2="200" y2="130" stroke="#333" stroke-width="2"/>
    <text x="245" y="135" text-anchor="end" font-size="12" fill="#333">−</text>
    <!-- + 输入端 -->
    <line x1="260" y1="230" x2="200" y2="230" stroke="#333" stroke-width="2"/>
    <text x="245" y="235" text-anchor="end" font-size="12" fill="#333">+</text>
    <!-- 输出 -->
    <line x1="380" y1="180" x2="440" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arO)"/>
    <text x="450" y="185" font-size="12" fill="#333">v</text>
    <text x="460" y="185" font-size="11" fill="#666">o</text>

    <!-- 输入信号 -->
    <text x="80" y="175" font-size="12" fill="#333">v</text>
    <text x="90" y="175" font-size="11" fill="#666">i</text>
    <line x1="100" y1="180" x2="140" y2="180" stroke="#333" stroke-width="2"/>
    <!-- R1 -->
    <rect x="140" y="165" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="148" y="185" text-anchor="middle" font-size="10" fill="#333">R</text>
    <text x="148" y="195" text-anchor="middle" font-size="8" fill="#666">1</text>
    <line x1="156" y1="180" x2="200" y2="180" stroke="#333" stroke-width="2"/>

    <!-- Rf -->
    <rect x="200" y="80" width="16" height="30" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="2"/>
    <text x="208" y="100" text-anchor="middle" font-size="10" fill="#333">R</text>
    <text x="208" y="110" text-anchor="middle" font-size="8" fill="#666">f</text>
    <line x1="200" y1="130" x2="200" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="216" y1="80" x2="380" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="380" y1="80" x2="380" y2="170" stroke="#333" stroke-width="2"/>

    <!-- 接地 -->
    <line x1="200" y1="230" x2="200" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="160" y1="300" x2="240" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="200" y1="300" x2="200" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="190" y1="310" x2="210" y2="310" stroke="#333" stroke-width="2"/>
    <line x1="195" y1="315" x2="205" y2="315" stroke="#333" stroke-width="2"/>

    <defs>
      <marker id="arO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker>
    </defs>

    <!-- 公式 -->
    <text x="300" y="350" text-anchor="middle" font-size="13" fill="#666">v</text>
    <text x="308" y="350" text-anchor="middle" font-size="13" fill="#666">o</text>
    <text x="320" y="350" text-anchor="middle" font-size="13" fill="#666"> = −(R</text>
    <text x="342" y="350" text-anchor="middle" font-size="13" fill="#666">f</text>
    <text x="350" y="350" text-anchor="middle" font-size="13" fill="#666">/R</text>
    <text x="365" y="350" text-anchor="middle" font-size="13" fill="#666">1</text>
    <text x="372" y="350" text-anchor="middle" font-size="13" fill="#666">) · v</text>
    <text x="390" y="350" text-anchor="middle" font-size="13" fill="#666">i</text>
  </g>
</svg>