<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">双口网络框图</text>
    <!-- 双口网络框 -->
    <rect x="200" y="100" width="200" height="200" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
    <text x="300" y="195" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">双口</text>
    <text x="300" y="220" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">网络</text>
    <text x="300" y="245" text-anchor="middle" font-size="12" fill="#666">(二端口网络)</text>
    <!-- 端口1 -->
    <line x1="80" y1="140" x2="200" y2="140" stroke="#000" stroke-width="2"/>
    <circle cx="200" cy="140" r="4" fill="#000"/>
    <line x1="200" y1="200" x2="80" y2="200" stroke="#000" stroke-width="2"/>
    <circle cx="200" cy="200" r="4" fill="#000"/>
    <text x="60" y="135" font-size="14" fill="#d32f2f">端口1</text>
    <text x="60" y="150" font-size="12" fill="#d32f2f">(输入)</text>
    <!-- 端口1电压电流 -->
    <text x="120" y="120" font-size="14" fill="#d32f2f">İ₁</text>
    <polygon points="150,140 158,134 158,146" fill="#d32f2f"/>
    <text x="120" y="215" font-size="14" fill="#d32f2f">Ů₁</text>
    <text x="115" y="210" font-size="10" fill="#333">+</text>
    <text x="115" y="230" font-size="10" fill="#333">-</text>
    <!-- 端口2 -->
    <line x1="400" y1="140" x2="520" y2="140" stroke="#000" stroke-width="2"/>
    <circle cx="400" cy="140" r="4" fill="#000"/>
    <line x1="400" y1="200" x2="520" y2="200" stroke="#000" stroke-width="2"/>
    <circle cx="400" cy="200" r="4" fill="#000"/>
    <text x="525" y="135" font-size="14" fill="#1976d2">端口2</text>
    <text x="525" y="150" font-size="12" fill="#1976d2">(输出)</text>
    <!-- 端口2电压电流 -->
    <text x="480" y="120" font-size="14" fill="#1976d2">İ₂</text>
    <polygon points="460,140 452,134 452,146" fill="#1976d2"/>
    <text x="480" y="215" font-size="14" fill="#1976d2">Ů₂</text>
    <text x="485" y="210" font-size="10" fill="#333">+</text>
    <text x="485" y="230" font-size="10" fill="#333">-</text>
    <!-- 参数 -->
    <text x="300" y="330" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">四种参数描述:</text>
    <text x="300" y="355" text-anchor="middle" font-size="13" fill="#333">Z参数: Ů₁=Z₁₁İ₁+Z₁₂İ₂, Ů₂=Z₂₁İ₁+Z₂₂İ₂</text>
    <text x="300" y="375" text-anchor="middle" font-size="13" fill="#333">Y参数: İ₁=Y₁₁Ů₁+Y₁₂Ů₂, İ₂=Y₂₁Ů₁+Y₂₂Ů₂</text>
    <text x="300" y="395" text-anchor="middle" font-size="13" fill="#333">H参数: Ů₁=H₁₁İ₁+H₁₂Ů₂, İ₂=H₂₁İ₁+H₂₂Ů₂</text>
  </g>
</svg>