<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    
    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">测电笔结构图</text>
    
    <!-- 测电笔整体（水平放置） -->
    <!-- 笔身 -->
    <rect x="60" y="140" width="480" height="50" rx="8" ry="8" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- 笔尖金属体 -->
    <rect x="40" y="148" width="40" height="34" rx="4" ry="4" fill="#e8a87c" stroke="#c0392b" stroke-width="2"/>
    <text x="60" y="170" text-anchor="middle" font-size="9" fill="#c0392b">金属</text>
    <text x="60" y="135" text-anchor="middle" font-size="10" fill="#555">笔尖</text>
    
    <!-- 笔尖延伸 -->
    <polygon points="40,155 20,160 20,170 40,175" fill="#e8a87c" stroke="#c0392b" stroke-width="1.5"/>
    
    <!-- 电阻部分 -->
    <rect x="100" y="146" width="120" height="38" rx="3" ry="3" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
    <text x="160" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">电阻（约1MΩ）</text>
    <text x="160" y="180" text-anchor="middle" font-size="9" fill="#888">大电阻</text>
    
    <!-- 氖管 -->
    <rect x="240" y="146" width="80" height="38" rx="3" ry="3" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
    <text x="280" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">氖管</text>
    <text x="280" y="178" text-anchor="middle" font-size="9" fill="#e67e22">发光指示</text>
    
    <!-- 氖管发光示意 -->
    <circle cx="275" cy="155" r="3" fill="#ff0" opacity="0.8"/>
    <circle cx="285" cy="155" r="3" fill="#ff0" opacity="0.8"/>
    <circle cx="280" cy="148" r="2" fill="#ff0" opacity="0.6"/>
    
    <!-- 弹簧 -->
    <rect x="340" y="148" width="60" height="34" rx="3" ry="3" fill="#e8e8e8" stroke="#999" stroke-width="2"/>
    <text x="370" y="165" text-anchor="middle" font-size="11" fill="#666">弹簧</text>
    <text x="370" y="178" text-anchor="middle" font-size="9" fill="#888">导电</text>
    
    <!-- 笔尾金属体 -->
    <rect x="420" y="148" width="60" height="34" rx="4" ry="4" fill="#e8a87c" stroke="#c0392b" stroke-width="2"/>
    <text x="450" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">金属</text>
    <text x="450" y="178" text-anchor="middle" font-size="9" fill="#888">笔尾</text>
    
    <!-- 笔尾延伸 -->
    <polygon points="480,155 520,160 520,170 480,175" fill="#e8a87c" stroke="#c0392b" stroke-width="1.5"/>
    
    <!-- 标注箭头 -->
    <line x1="60" y1="130" x2="60" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="160" y1="130" x2="160" y2="146" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="280" y1="130" x2="280" y2="146" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="370" y1="130" x2="370" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="450" y1="130" x2="450" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
    
    <!-- 使用方法 -->
    <rect x="30" y="220" width="540" height="165" rx="8" ry="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="300" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">测电笔使用方法</text>
    
    <text x="50" y="270" font-size="12" fill="#555">① 手指按住笔尾金属体（金属笔卡）</text>
    <text x="50" y="290" font-size="12" fill="#555">② 笔尖接触被测导线（或插孔）</text>
    <text x="50" y="310" font-size="12" fill="#555">③ 观察氖管是否发光：</text>
    
    <rect x="50" y="320" width="230" height="25" rx="4" ry="4" fill="#ff6b6b" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="165" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">氖管发光 → 火线</text>
    
    <rect x="320" y="320" width="230" height="25" rx="4" ry="4" fill="#74b9ff" stroke="#3498db" stroke-width="1.5"/>
    <text x="435" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">氖管不发光 → 零线</text>
    
    <text x="50" y="368" font-size="11" fill="#c0392b">⚠ 安全提示：手千万不要接触笔尖金属体！</text>
    
    <!-- 原理说明 -->
    <rect x="30" y="395" width="540" height="20" rx="4" ry="4" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
    <text x="300" y="410" text-anchor="middle" font-size="11" fill="#666">原理：电流经笔尖→电阻→氖管→弹簧→人体→大地，形成回路。大电阻限制电流至安全范围（约0.2mA）</text>
  </g>
</svg>