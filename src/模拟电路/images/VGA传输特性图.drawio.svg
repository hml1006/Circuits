<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:drawio="https://www.drawio.com" width="600" height="400" viewBox="0 0 600 400">
  <defs/>
  <g transform="translate(0.5,0.5)">
    <rect x="0" y="0" width="600" height="400" fill="#ffffff" stroke="none"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">VGA增益控制传输特性</text>

    <!-- 坐标轴 -->
    <line x1="60" y1="340" x2="560" y2="340" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="340" x2="60" y2="60" stroke="#333" stroke-width="2"/>

    <!-- 轴标签 -->
    <text x="560" y="358" text-anchor="end" font-size="12" fill="#333">控制电压 V</text>
    <text x="590" y="358" text-anchor="end" font-size="10" fill="#333">c</text>
    <text x="600" y="358" text-anchor="end" font-size="12" fill="#333"> (V)</text>
    <text x="25" y="200" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90,25,200)">增益 G (dB)</text>

    <!-- 刻度 -->
    <line x1="60" y1="340" x2="60" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="60" y="358" text-anchor="middle" font-size="9" fill="#666">0</text>

    <line x1="185" y1="340" x2="185" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="185" y="358" text-anchor="middle" font-size="9" fill="#666">0.2</text>

    <line x1="310" y1="340" x2="310" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="310" y="358" text-anchor="middle" font-size="9" fill="#666">0.5</text>

    <line x1="435" y1="340" x2="435" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="435" y="358" text-anchor="middle" font-size="9" fill="#666">0.8</text>

    <line x1="560" y1="340" x2="560" y2="345" stroke="#333" stroke-width="1.5"/>
    <text x="560" y="358" text-anchor="middle" font-size="9" fill="#666">1.0</text>

    <!-- Y轴刻度 -->
    <line x1="55" y1="340" x2="60" y2="340" stroke="#333" stroke-width="1.5"/>
    <text x="52" y="344" text-anchor="end" font-size="9" fill="#666">0</text>

    <line x1="55" y1="270" x2="60" y2="270" stroke="#333" stroke-width="1.5"/>
    <text x="52" y="274" text-anchor="end" font-size="9" fill="#666">10</text>

    <line x1="55" y1="200" x2="60" y2="200" stroke="#333" stroke-width="1.5"/>
    <text x="52" y="204" text-anchor="end" font-size="9" fill="#666">20</text>

    <line x1="55" y1="130" x2="60" y2="130" stroke="#333" stroke-width="1.5"/>
    <text x="52" y="134" text-anchor="end" font-size="9" fill="#666">30</text>

    <line x1="55" y1="60" x2="60" y2="60" stroke="#333" stroke-width="1.5"/>
    <text x="52" y="64" text-anchor="end" font-size="9" fill="#666">40</text>

    <!-- 理想线性 dB 控制曲线 -->
    <!-- G(dB) = Gmax - k*Vc, 从 (60,60) 到 (560,340) 的斜线 -->
    <line x1="60" y1="60" x2="560" y2="340" stroke="#3366cc" stroke-width="3"/>
    <text x="310" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#3366cc" transform="rotate(-30,310,180)">G(dB) = G</text>
    <text x="360" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#3366cc" transform="rotate(-30,360,180)">max</text>
    <text x="385" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#3366cc" transform="rotate(-30,385,180)"> − k·V</text>
    <text x="430" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#3366cc" transform="rotate(-30,430,180)">c</text>

    <!-- 标注 -->
    <text x="60" y="50" text-anchor="middle" font-size="10" fill="#666">G</text>
    <text x="68" y="50" text-anchor="middle" font-size="8" fill="#666">max</text>

    <text x="560" y="355" text-anchor="middle" font-size="10" fill="#666">V</text>
    <text x="568" y="355" text-anchor="middle" font-size="8" fill="#666">c(max)</text>

    <!-- 说明 -->
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">线性-dB 控制：增益分贝值与控制电压成线性关系，斜率 k (dB/V) 为常数</text>
  </g>
</svg>